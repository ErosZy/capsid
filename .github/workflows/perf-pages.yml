name: Performance site

on:
  push:
    branches: [dev/v0.3.0]
    paths:
      - 'perf-site/**'
      - 'bench/results/**'
      - 'bench/collect-perf-point.py'
      - 'bench/perf_evidence.py'
      - 'bench/prepare-perf-site.py'
      - 'bench/perf_archive.py'
      - 'docs/current-status.json'
      - 'docs/data/**'
      - 'tools/refresh-documentation-data.py'
      - '.github/workflows/perf-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check generated documentation and site status
        run: python3 tools/refresh-documentation-data.py --check
      - name: Test bounded archive transport controls
        run: python3 tests/test_perf_archive.py
      - name: Validate and stage performance evidence
        run: >-
          python3 -B bench/prepare-perf-site.py --repo .
          --output "${{ runner.temp }}/capsid-perf-site"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/capsid-perf-site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

name: Formatting

on:
  push:
    branches: [dev/v0.3.1]
  pull_request:
    branches: [dev/v0.3.1]

permissions:
  contents: read

concurrency:
  group: formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned formatters without runtime lifecycle scripts
        run: |
          python -m venv .venv-format
          .venv-format/bin/python -m pip install --only-binary=:all: -r tools/format-requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check maintained source formatting
        run: .venv-format/bin/python tools/format.py --check
      - name: Test source selection and preservation guards
        run: |
          .venv-format/bin/python -B tests/test_formatting_tools.py
          node --test tests/test_formatting_ast.mjs
      - name: Require the checkout to remain clean
        run: |
          status="$(git status --porcelain)"
          if [ -n "${status}" ]; then
            printf '%s\n' "${status}"
            exit 1
          fi

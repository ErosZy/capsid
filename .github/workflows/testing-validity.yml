name: Qualify lossless binding argument sample construction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-binding-argument-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out unchanged frozen base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fab182f17cbce7bdc85e66e6f31ddfb2897362a3
      - name: Set up exact test Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Validate every original counterexample in the original CTest budget
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import base64, hashlib, json, os, re, shutil, subprocess, time, traceback, xml.etree.ElementTree as ET
          root=Path.cwd();out=root/'binding-argument-lossless-copy';out.mkdir()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')=='fab182f17cbce7bdc85e66e6f31ddfb2897362a3'
          assert git('rev-parse','HEAD^{tree}')=='c6b13ee33695f9cc4970e198f11c921447a8ed80'
          changed='tests/test_binding_fetch_arguments_contract.mjs'
          paths=[root/p for p in git('ls-files','tools','tests/fixtures','tests/test_binding_fetch_arguments_contract.mjs','cmake/build_tests.cmake').splitlines()]
          inputs={p.relative_to(root).as_posix():sha(p) for p in paths if p.is_file()}
          cmake=(root/'cmake/build_tests.cmake').read_text('utf-8')
          marker='set_tests_properties(binding_fetch_arguments_contract_controls'
          assert cmake.count(marker)==1
          assert re.search(r'TIMEOUT\s+30(?:\s|$)',cmake.split(marker,1)[1].split(')',1)[0])
          (out/'original-test.mjs').write_bytes((root/changed).read_bytes())
          proposed=base64.b64decode('')
          assert hashlib.sha256(proposed).hexdigest()=='8cd3dd36840029202aabc5e8f4897cf414d3b2ea735db25005c53a812f15c34c'
          before=(root/changed).read_text('utf-8')
          original_body=before[before.index('let rejected = 0;'):before.index("test('serialized immutable samples")]
          after=proposed.decode('utf-8')
          assert original_body==after[after.index('let rejected = 0;'):after.index("test('lossless immutable samples")]
          assert "after(() => {assert.equal(rejected, 19189);" in after
          (root/changed).write_bytes(proposed)
          (out/'proposed-test.mjs').write_bytes(proposed)
          (out/'source-inputs-before.json').write_text(json.dumps(inputs,indent=2)+'\n')
          node=Path(shutil.which('node')).resolve()
          testdir=out/'ctest';testdir.mkdir()
          quoted=lambda p:'"'+str(p).replace('\\','/')+'"'
          (testdir/'CTestTestfile.cmake').write_text('add_test(binding_fetch_arguments_contract_controls '+quoted(node)+' "--test" '+quoted(root/changed)+')\nset_tests_properties(binding_fetch_arguments_contract_controls PROPERTIES TIMEOUT 30 RUN_SERIAL TRUE LABELS "worker;binding;fetch;compatibility;lifecycle")\n')
          record=dict(complete=False,createdUTC=datetime.now(timezone.utc).isoformat(),baseCommit=git('rev-parse','HEAD'),baseTree=git('rev-parse','HEAD^{tree}'),platform=os.name,node=subprocess.check_output([str(node),'--version'],text=True).strip(),originalBudgetSeconds=30,proposedTestSHA256=sha(root/changed),productionSourceChanged=False,completeCounterexampleBodyByteIdentical=True,formalCombinedAcceptanceClaimed=False,rounds=[])
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          try:
              for ordinal in range(1,4):
                  log=out/('round-'+str(ordinal)+'.log');junit=out/('round-'+str(ordinal)+'.xml')
                  started=time.monotonic()
                  with log.open('wb') as stream:
                      completed=subprocess.run(['ctest','--test-dir',str(testdir),'--parallel','1','--no-tests=error','--verbose','--output-junit',str(junit)],stdout=stream,stderr=subprocess.STDOUT,timeout=45)
                  suite=ET.parse(junit).getroot();cases=list(suite.iter('testcase'))
                  elapsed=time.monotonic()-started
                  row=dict(round=ordinal,exitCode=completed.returncode,elapsedSeconds=elapsed,junit=cases[0].attrib if len(cases)==1 else None)
                  record['rounds'].append(row);save()
                  assert completed.returncode==0 and len(cases)==1 and cases[0].find('failure') is None and cases[0].find('skipped') is None
                  text=log.read_text('utf-8')
                  assert '"uniqueArgumentInputs":10920,"rejectedMutations":19189' in text
                  assert re.search(r'(?:# )?tests 14',text),text[-800:]
                  assert re.search(r'(?:# )?pass 14',text)
                  assert re.search(r'(?:# )?fail 0',text)
                  assert re.search(r'(?:# )?skipped 0',text)
              assert all(sha(root/p)==value for p,value in inputs.items() if p!=changed)
              assert git('diff','--name-only')==changed
              record.update(complete=True,status='three-original-budget-rounds-passed',all19189OriginalMutationsRejectedEveryRound=True,all10920InputCasesPreserved=True,unrelatedSourceAndPrimaryCapturesUnchanged=True)
          except BaseException:
              record.update(status='error',error=traceback.format_exc());raise
          finally:
              record['finishedUTC']=datetime.now(timezone.utc).isoformat();save()
      - name: Preserve original and proposed sources and complete results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binding-argument-lossless-copy-${{ matrix.os }}
          path: binding-argument-lossless-copy
          if-no-files-found: error

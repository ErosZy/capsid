name: Verify exact dependency-source audit and fault controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5dcbe8d6b848c79c865e6cb7eb3c432e6bcd203b
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Check original workflow and all source fault controls with LF and CRLF
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          node tests/audit-testing-validity-workflow.mjs > evidence/audit.stdout 2> evidence/audit.stderr
          CAPSID_WORKFLOW_CONTROL_EOL=lf timeout 30s node --test tests/test_testing_validity_workflow.mjs > evidence/controls-lf.tap 2>&1
          CAPSID_WORKFLOW_CONTROL_EOL=crlf timeout 30s node --test tests/test_testing_validity_workflow.mjs > evidence/controls-crlf.tap 2>&1
      - name: Save original audit transcripts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: exact-source-workflow-audit
          if-no-files-found: error
          path: evidence/

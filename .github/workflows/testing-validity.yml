name: Native recovery complete macOS and original fuzz qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  posix-host-library:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7402d3c36dfe7e10f6e37d615c280aa4d808202f
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      # Keep the POSIX gate honest for the complete M1D Admin surface.  The
      # transport and long-lived service are intentionally conditional on
      # Boost, so relying on the runner image could silently skip their
      # compilation (and miss Linux-only APIs in otherwise POSIX sources).
      - name: Install macOS Host dependencies
        run: brew install boost c-ares openssl@3.5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Configure distinct loopback peers for redirect contracts
        run: |
          set -euo pipefail
          sudo ifconfig lo0 alias 127.0.0.2 netmask 255.255.255.255
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import net from 'node:net';
          import {once} from 'node:events';
          const servers=[];
          try {
            let port=0;
            for(const host of ['127.0.0.1','127.0.0.2']) {
              const server=net.createServer(socket=>socket.end(host));servers.push(server);
              server.listen({host,port});await once(server,'listening');
              assert.equal(server.address().address,host);port=server.address().port;
            }
            for(const host of ['127.0.0.1','127.0.0.2']) {
              const client=net.createConnection({host,port});let body='';
              for await(const bytes of client)body+=bytes.toString();
              assert.equal(body,host,'distinct loopback peer receives the actual connection');
            }
            console.log(JSON.stringify({complete:true,loopbackPeers:2,samePort:true,actualRoundTrips:2}));
          } finally {await Promise.all(servers.map(server=>new Promise(resolve=>server.close(resolve))));}
          JS

      - name: Set up the locked Python WebSocket runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: '3.12.3'

      - name: Install locked independent WebSocket clients
        run: |
          set -euo pipefail
          python3 tools/setup-ws-interop-python.py "${RUNNER_TEMP}/capsid-ws-python"
          printf 'CAPSID_WS_INTEROP_PYTHON=%s\n' "${RUNNER_TEMP}/capsid-ws-python/bin/python" >> "${GITHUB_ENV}"
          printf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\n' "${RUNNER_TEMP}/capsid-ws-python/node-ws" >> "${GITHUB_ENV}"

      - name: Install and verify locked workerd reference
        run: |
          set -euo pipefail
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"

      # The worker bootstrap bundles via esbuild from the locked txiki.js
      # node_modules; without this the macOS configure fails with
      # "esbuild is missing".
      - name: Install locked JavaScript dependencies
        run: |
          set -euo pipefail
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          # The vendor audit's expected tag must match cmake/build_tests.cmake
          # (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.
          git -C vendor/txiki.js fetch --depth=1 origin \
            refs/tags/v26.6.0:refs/tags/v26.6.0

      # §12.5 macOS row: Host units plus the non-strict worker contracts.
      # Linux-only strict-sandbox and managed-suite tests are not registered
      # on macOS (they SKIP by absence, never FAIL), and the §12.3 fresh
      # second build is excluded here to keep the job inside its time budget
      # (the Release job runs it on Linux).
      - name: Configure macOS host library and worker contracts
        run: |
          set -euo pipefail
          node_binary=$(node -p 'process.execPath')
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3.5);$(brew --prefix boost)" \
            -DCAPSID_BUILD_HOST=ON \
            -DCAPSID_BUILD_WORKER=ON \
            -DCAPSID_ENABLE_LTO=ON \
            -DCAPSID_HOST_TEST_NODE="${node_binary}" \
            -DCAPSID_NODE_EXECUTABLE="${node_binary}"

      - name: Build macOS Host, Admin transport, and unit gates
        run: |
          cmake --build build-macos --parallel 2
          # Named targets make a missing/quietly skipped Boost-backed Admin
          # surface an explicit configuration failure.
          cmake --build build-macos --parallel 2 --target \
            capsid-host \
            test-host-admin-api \
            test-host-admin-http \
            test-host-admin-service

      - name: Record complete original ordinary registration
        run: |
          ctest --test-dir build-macos --show-only=json-v1 -E '^(wpt_conformance_not_configured|worker_package_reproducibility)$' > build-macos/selected-registration.json

      - name: Verify directly affected native contracts without changing their budgets
        continue-on-error: true
        env:
          CAPSID_WS_REPORT_DIR: ${{ runner.temp }}/capsid-affected-driver-reports
        run: |
          set +e
          ctest --test-dir build-macos --no-tests=error --output-on-failure             --output-junit affected-junit.xml             -R '^(spawn_failure_recovery|native_fetch_large_gzip|native_fetch_abort_prefix|native_fetch_abort_prefix_contract_controls|benchmark_density_control|worker_outbound_websocket|worker_outbound_result_ack_pressure|websocket_fetch_(boundaries|transitions)_(single-worker|static-pool))$'
          result=$?
          cp build-macos/Testing/Temporary/LastTest.log build-macos/affected-LastTest.log
          printf '%s\n' "${result}" > build-macos/affected-exit-code.txt
          exit "${result}"

      - name: Run POSIX host-side matrix
        env:
          CAPSID_WS_REPORT_DIR: ${{ runner.temp }}/capsid-full-driver-reports
        run: |
          ctest --test-dir build-macos \
            --no-tests=error \
            --output-on-failure \
            --output-junit macos-junit.xml \
            -E '^(wpt_conformance_not_configured|worker_package_reproducibility)$'

      - name: Archive raw native driver directories preserving native filenames
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,tarfile
          parent=Path(os.environ['RUNNER_TEMP'])
          for name in ['capsid-affected-driver-reports','capsid-full-driver-reports']:
              folder=parent/name
              if folder.is_dir():
                  with tarfile.open(parent/(name+'.tar.gz'),'w:gz') as archive:
                      archive.add(folder,arcname=name)
          PY

      - name: Save macOS evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-host-library-evidence
          if-no-files-found: error
          path: |
            build-macos/macos-junit.xml
            build-macos/Testing/Temporary/LastTest.log
            build-macos/CMakeCache.txt
            build-macos/selected-registration.json
            build-macos/affected-junit.xml
            build-macos/affected-LastTest.log
            build-macos/affected-exit-code.txt
            ${{ runner.temp }}/capsid-affected-driver-reports.tar.gz
            ${{ runner.temp }}/capsid-full-driver-reports.tar.gz

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7402d3c36dfe7e10f6e37d615c280aa4d808202f
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Install Clang and Ninja
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev

      - name: Configure fuzz harnesses
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCAPSID_BUILD_WORKER=OFF \
            -DCAPSID_BUILD_FUZZERS=ON \
            -DCAPSID_USE_MIMALLOC=OFF

      - name: Build fuzz harnesses
        run: cmake --build build-fuzz --parallel 2

      - name: Run bounded corpus gates
        run: |
          ctest --test-dir build-fuzz \
            --no-tests=error \
            --output-on-failure \
            --output-junit fuzz-junit.xml \
            -L fuzz

      - name: Save fuzz evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-hosted-evidence
          if-no-files-found: error
          path: build-fuzz/fuzz-junit.xml

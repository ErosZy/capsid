{
  "name": "Historical frame wire-only reference allocation original-budget diagnostic ABBA",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "frame-original-seed-replay": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "6a9ee0e62b978aeb977526f984ddaead7f4fd552",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Install Clang and Ninja",
          "run": "sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\nsudo apt-get \"${apt_network[@]}\" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev\n"
        },
        {
          "name": "Configure fuzz harnesses",
          "env": {
            "CC": "clang",
            "CXX": "clang++"
          },
          "run": "cmake -S . -B build-fuzz -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -DCAPSID_BUILD_WORKER=OFF \\\n  -DCAPSID_BUILD_FUZZERS=ON \\\n  -DCAPSID_USE_MIMALLOC=OFF\n"
        },
        {
          "name": "Build fuzz harnesses",
          "run": "cmake --build build-fuzz --parallel 2"
        },
        {
          "name": "Preserve complete fuzz build and registration identities",
          "run": "ninja -C build-fuzz -t commands > build-fuzz/full-build-commands.txt\nctest --test-dir build-fuzz --show-only=json-v1 -L fuzz > build-fuzz/full-registration.json\n"
        },
        {
          "name": "Retain original fuzz binaries and immutable starting corpus",
          "if": "always()",
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,tarfile\nbuild=Path('build-fuzz');registration=json.loads((build/'full-registration.json').read_text())\nfiles=[Path('tests/fuzz/fuzz_websocket_frames.cc'),build/'fuzz/corpus']\nfiles += sorted({Path(test['command'][0]) for test in registration['tests'] if Path(test['command'][0]).is_file() and Path(test['command'][0]).resolve().is_relative_to(Path.cwd())})\ntarget=build/'fuzz-replay-before.tar.gz'\nwith tarfile.open(target,'w:gz',dereference=False) as tar:\n    for path in files:\n        if path.exists():tar.add(path,arcname=str(path.resolve().relative_to(Path.cwd())),recursive=True)\ntarget.with_name(target.name+'.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\\n')\nPY\n"
        },
        {
          "name": "Collect original seed4191328252 versus current seed1131436511 with fresh exact corpus and original60/512 budgets",
          "run": "mkdir -p build-frame-controller\ncat > build-frame-controller/replay.py <<'PY'\nfrom pathlib import Path,PurePosixPath\nfrom datetime import datetime,timezone\nimport base64,hashlib,json,os,re,resource,subprocess,sys,tarfile,time,traceback\nroot=Path.cwd();out=root/'build-frame-wire-only-proposal';out.mkdir(exist_ok=False);sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\ncommit='6a9ee0e62b978aeb977526f984ddaead7f4fd552';assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==commit\nassert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='ad3c4b432337d20480ccb16f0df59759800462f9'\nregistration=json.loads((root/'build-fuzz/full-registration.json').read_text());test=next(t for t in registration['tests'] if t['name']=='fuzz-websocket-frames_smoke');props={p['name']:p['value'] for p in test['properties']};assert props['TIMEOUT']==60\nargs=test['command'];assert set(args[2:])=={'-runs=10000','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1'}\narchive=root/'build-fuzz/fuzz-replay-before.tar.gz';assert sha(archive)==archive.with_name(archive.name+'.sha256').read_text().split()[0]\nassert sha(root/'build-fuzz/fuzz-websocket-frames')=='6f5ce576afee67f823c4ad165ba1f673772772334a335c65e244352e8d070e78'\navailable=sorted(os.sched_getaffinity(0));assert len(available)>=4;os.sched_setaffinity(0,available[:4])\n\nframeFile=root/'tests/fuzz/fuzz_websocket_frames.cc';frameBinary=root/'build-fuzz/fuzz-websocket-frames'\noriginalSource=frameFile.read_bytes();originalBinary=frameBinary.read_bytes()\nproposalSource=base64.b64decode('')\nmodel=out/'wire-equivalence.cc';model.write_bytes(base64.b64decode(''))\n(out/'original-source.cc').write_bytes(originalSource);(out/'proposed-source.cc').write_bytes(proposalSource)\nwith (out/'wire-model-build.log').open('xb') as log:\n p=subprocess.run(['clang++','-std=c++17','-O2','-fsanitize=address,undefined','-fno-sanitize-recover=all',str(model),'-o',str(out/'wire-equivalence')],stdout=log,stderr=log,timeout=60);assert p.returncode==0\nwith (out/'wire-equivalence.log').open('xb') as log:\n p=subprocess.run([str(out/'wire-equivalence')],stdout=log,stderr=log,timeout=30);assert p.returncode==0\nruntimeInputs={p:sha(root/p) for p in ['src/host/ws_codec.cc','src/host/ws_codec.h','src/host/ws_stream.cc','src/host/ws_stream.h']}\ntry:\n frameFile.write_bytes(proposalSource)\n with (out/'proposal-build.log').open('xb') as log:\n  p=subprocess.run(['cmake','--build','build-fuzz','--target','fuzz-websocket-frames','--parallel','2'],stdout=log,stderr=log,timeout=300);assert p.returncode==0\n proposalBinary=frameBinary.read_bytes();assert proposalBinary!=originalBinary\n (out/'proposal-fuzz-websocket-frames').write_bytes(proposalBinary)\nfinally:\n frameFile.write_bytes(originalSource);frameBinary.write_bytes(originalBinary)\nassert all(sha(root/p)==h for p,h in runtimeInputs.items())\nassert not subprocess.check_output(['git','status','--porcelain']).strip()\n\nr=dict(complete=False,productCheckout=commit,historicalFailedRun=43417908994,historicalSeed=4191328252,privateWireAllocationOnlyPrototype=True,productionCodecAndStreamSourcesUnchanged=True,proposalBinarySHA256=hashlib.sha256(proposalBinary).hexdigest(),proposalSourceSHA256=hashlib.sha256(proposalSource).hexdigest(),runtimeInputs=runtimeInputs,coverageGuidedMutationPathMayDifferAfterHarnessCompile=True,binarySHA256=sha(root/'build-fuzz/fuzz-websocket-frames'),startingArchiveSHA256=sha(archive),cpuSet=available[:4],attempts=[],originalDeadlineSeconds=60,originalInputMaxBytes=65536,originalRssLimitMiB=512,originalRuns=10000,notQualification=True,formalPerformancePoints=0,fullV030GoalComplete=False)\ndef save():(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\ndef cpu():return [int(v) for v in Path('/proc/stat').read_text().splitlines()[0].split()[1:9]]\ntry:\n for index,variant in enumerate(['original-A','wire-only-B','wire-only-B','original-A'],1):\n  seed=4191328252\n  directory=out/('attempt-'+str(index));directory.mkdir();manifest={}\n  with tarfile.open(archive,'r:gz') as tar:\n   for m in tar.getmembers():\n    p=PurePosixPath(m.name);assert not p.is_absolute() and '..' not in p.parts and not m.issym() and not m.islnk()\n    if m.isfile():\n     file=directory.joinpath(*p.parts);file.parent.mkdir(parents=True,exist_ok=True);file.write_bytes(tar.extractfile(m).read());file.chmod(m.mode&0o777);manifest[p.as_posix()]=sha(file)\n  if index==1:r['exactStartingFiles']=manifest\n  else:assert manifest==r['exactStartingFiles']\n  if variant=='wire-only-B':\n   (directory/'build-fuzz/fuzz-websocket-frames').write_bytes(proposalBinary)\n   (directory/'tests/fuzz/fuzz_websocket_frames.cc').write_bytes(proposalSource)\n  expectedBinary=hashlib.sha256(proposalBinary if variant=='wire-only-B' else originalBinary).hexdigest()\n  before=cpu();quietStart=time.monotonic();time.sleep(30);after=cpu();total=sum(after)-sum(before);idle=(after[3]+after[4])-(before[3]+before[4]);busy=1-idle/total;steal=(after[7]-before[7])/total\n  command=[str(directory/'build-fuzz/fuzz-websocket-frames'),str(directory/'build-fuzz/fuzz/corpus/websocket_frames'),*args[2:],'-seed='+str(seed)]\n  assert sha(command[0])==expectedBinary;usage=resource.getrusage(resource.RUSAGE_CHILDREN);start=time.monotonic();timed=False\n  with (directory/'stdout.log').open('xb') as so,(directory/'stderr.log').open('xb') as se:\n   try:p=subprocess.run(command,cwd=directory/'build-fuzz',stdout=so,stderr=se,timeout=60);exit=p.returncode\n   except subprocess.TimeoutExpired:timed=True;exit=None\n  seconds=time.monotonic()-start;used=resource.getrusage(resource.RUSAGE_CHILDREN);stderr=(directory/'stderr.log').read_text(errors='strict');units=re.findall(r'stat::number_of_executed_units:\\s*(\\d+)',stderr);progress=[int(v) for v in re.findall(r'^#(\\d+)\\s',stderr,re.M)]\n  row=dict(index=index,seed=seed,variant=variant,actualFrameBinarySHA256=expectedBinary,command=command,seconds=seconds,timedOut=timed,exitCode=exit,completeOriginalRuns=(exit==0 and units==['10000']),executedUnits=int(units[-1]) if units else None,observedProgressUnitsLowerBound=max(progress,default=0),userCpuSeconds=used.ru_utime-usage.ru_utime,systemCpuSeconds=used.ru_stime-usage.ru_stime,cumulativeChildPeakRssKiB=used.ru_maxrss,\n   quietObservation=dict(seconds=30,before=before,after=after,busyFraction=busy,stealFraction=steal,observedQuiet=busy<=.05 and steal<=.01,physicalHostIsolationNotClaimed=True),stderrSHA256=sha(directory/'stderr.log'))\n  r['attempts'].append(row);save();print(json.dumps({k:row[k] for k in ['index','variant','seed','seconds','timedOut','exitCode','completeOriginalRuns','executedUnits','observedProgressUnitsLowerBound','userCpuSeconds']}),flush=True)\n assert sha(root/'build-fuzz/fuzz-websocket-frames')==r['binarySHA256'];r.update(complete=True,allOriginalBudgetsAndFreshStartingBytesRetained=True,historicalFailureNotErasedAndCausalClosureNotAssumed=True);save()\nexcept BaseException:r['controllerFailure']=traceback.format_exc();save();raise\nfinally:\n target=root/'build-frame-wire-only-proposal-evidence.tar.gz'\n with tarfile.open(target,'x:gz',dereference=False) as tar:\n  if (out/'result.json').exists():tar.add(out/'result.json',arcname='result.json')\n  for file in [*out.glob('*.log'),out/'original-source.cc',out/'proposed-source.cc',out/'wire-equivalence.cc',out/'proposal-fuzz-websocket-frames']:\n   if file.is_file():tar.add(file,arcname=file.name)\n  for d in sorted(out.glob('attempt-*')):\n   for log in d.glob('*.log'):tar.add(log,arcname=d.name+'/'+log.name)\n   corpus=d/'build-fuzz/fuzz/corpus/websocket_frames'\n   if corpus.exists():tar.add(corpus,arcname=d.name+'/mutated-corpus')\n   for pattern in ('crash-*','timeout-*','oom-*','leak-*'):\n    for file in (d/'build-fuzz').glob(pattern):\n     if file.is_file():tar.add(file,arcname=d.name+'/crash-inputs/'+file.name)\n target.with_name(target.name+'.sha256').write_text(sha(target)+'  '+target.name+'\\n')\n\nPY\npython3 -B build-frame-controller/replay.py\n"
        },
        {
          "name": "Retain every original-deadline failure, raw log, binary/corpus identity and crash input",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "if": "always()",
          "with": {
            "name": "frame-wire-only-proposal-evidence",
            "path": "build-frame-wire-only-proposal-evidence.tar.gz\nbuild-frame-wire-only-proposal-evidence.tar.gz.sha256\nbuild-frame-controller/replay.py\nbuild-fuzz/fuzz-replay-before.tar.gz\nbuild-fuzz/fuzz-replay-before.tar.gz.sha256\nbuild-fuzz/compile_commands.json\nbuild-fuzz/full-registration.json\nbuild-fuzz/generated/build-info.txt",
            "if-no-files-found": "error"
          }
        }
      ],
      "name": "Historical frame seed wire-only reference allocation ABBA, not qualification"
    }
  }
}

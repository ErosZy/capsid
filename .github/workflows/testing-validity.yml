{
  "name": "Independent exact-original-binary frame CPU sampling, never a formal performance prerequisite",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "exact-frame-cpu-profile": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "77c8c7aa853dafaaf4689c54e4d4219764ae64f9",
            "submodules": false,
            "fetch-tags": true,
            "persist-credentials": false
          }
        },
        {
          "name": "Install actual Linux software sampling tools without changing kernel parameters",
          "run": "sudo apt-get update\nsudo apt-get install -y linux-tools-generic\n"
        },
        {
          "name": "Read the exact preserved historical binary and fresh starting archive without recompilation",
          "uses": "actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53",
          "with": {
            "name": "frame-original-seed-replay-evidence",
            "run-id": 43578717747,
            "github-token": "${{ secrets.GITHUB_TOKEN }}",
            "path": "profile-inputs"
          }
        },
        {
          "name": "Observe exact binary original60second512MiB10000run unprofiled-profiled-profiled-unprofiled attempts",
          "run": "cat > frame-profile-controller.py <<'PY'\nfrom pathlib import Path,PurePosixPath\nfrom datetime import datetime,timezone\nimport hashlib,json,os,re,resource,signal,subprocess,tarfile,time,traceback\nroot=Path.cwd();inputs=root/'profile-inputs';out=root/'build-exact-frame-cpu-profile';out.mkdir(exist_ok=False);sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\narchive=inputs/'build-fuzz/fuzz-replay-before.tar.gz';assert sha(archive)=='c20e6aac472c1cd7c3fb1dc186a92e68f50ed6c73b87861abc4d274ddfde5627'\nregistration=json.loads((inputs/'build-fuzz/full-registration.json').read_text());test=next(t for t in registration['tests'] if t['name']=='fuzz-websocket-frames_smoke');assert next(p['value'] for p in test['properties'] if p['name']=='TIMEOUT')==60\nargs=test['command'][2:];assert set(args)=={'-runs=10000','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1'}\navailable=sorted(os.sched_getaffinity(0));assert len(available)>=4;os.sched_setaffinity(0,available[:4])\nperf=None\nfor candidate in sorted(Path('/usr/lib/linux-tools').glob('*/perf')):\n if candidate.is_file() and os.access(candidate,os.X_OK):\n  p=subprocess.run(['sudo','-n',str(candidate),'stat','-e','cpu-clock','true'],capture_output=True,timeout=15)\n  if p.returncode==0:perf=candidate;break\nassert perf,'a real installed perf with root read-only software-event access is required; no kernel parameters are changed'\nr=dict(complete=False,classification='independent-exact-binary-profiler-not-qualification-and-not-a-performance-prerequisite',productCheckout=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),binarySHA256='6f5ce576afee67f823c4ad165ba1f673772772334a335c65e244352e8d070e78',startingArchiveSHA256=sha(archive),perf=dict(path=str(perf),sha256=sha(perf)),originalDeadlineSeconds=60,originalRssMiB=512,originalRuns=10000,seed=4191328252,attempts=[],formalPerformancePoints=0,fullV030GoalComplete=False,networkAndPerfKernelParametersNotWritten=True)\ndef save():(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\ndef cpu():return [int(v) for v in Path('/proc/stat').read_text().splitlines()[0].split()[1:9]]\ntry:\n for index,profile in enumerate([False,True,True,False],1):\n  directory=out/('attempt-'+str(index));directory.mkdir();manifest={}\n  with tarfile.open(archive,'r:gz') as tar:\n   for member in tar.getmembers():\n    p=PurePosixPath(member.name);assert not p.is_absolute() and '..' not in p.parts and not member.issym() and not member.islnk()\n    if member.isfile():\n     file=directory.joinpath(*p.parts);file.parent.mkdir(parents=True,exist_ok=True);file.write_bytes(tar.extractfile(member).read());file.chmod(member.mode&0o777);manifest[p.as_posix()]=sha(file)\n  if index==1:r['exactStartingFiles']=manifest\n  else:assert manifest==r['exactStartingFiles']\n  binary=directory/'build-fuzz/fuzz-websocket-frames';assert sha(binary)==r['binarySHA256']\n  before=cpu();quiet_start=time.monotonic();time.sleep(30);after=cpu();quiet_seconds=time.monotonic()-quiet_start;total=sum(after)-sum(before);busy=1-((after[3]+after[4])-(before[3]+before[4]))/total;steal=(after[7]-before[7])/total\n  command=[str(binary),str(directory/'build-fuzz/fuzz/corpus/websocket_frames'),*args,'-seed=4191328252'];sampler=None;sampler_files=[];timed=False;sampler_code=None\n  with (directory/'stdout.log').open('xb') as so,(directory/'stderr.log').open('xb') as se:\n   usage=resource.getrusage(resource.RUSAGE_CHILDREN);start=time.monotonic();process=subprocess.Popen(command,cwd=directory/'build-fuzz',stdout=so,stderr=se)\n   try:\n    if profile:\n     sampler_files=[(directory/'perf.stdout.log').open('xb'),(directory/'perf.stderr.log').open('xb')]\n     sampler=subprocess.Popen(['sudo','-n',str(perf),'record','-e','cpu-clock:u','-F','49','--call-graph','fp','-p',str(process.pid),'-o',str(directory/'perf.data')],stdout=sampler_files[0],stderr=sampler_files[1],start_new_session=True)\n     sampler_start=Path('/proc/'+str(sampler.pid)+'/stat').read_text().rsplit(')',1)[1].split()[19]\n    try:code=process.wait(timeout=max(.001,start+60-time.monotonic()))\n    except subprocess.TimeoutExpired:timed=True;process.kill();code=process.wait(timeout=10)\n    elapsed=time.monotonic()-start;used=resource.getrusage(resource.RUSAGE_CHILDREN)\n   finally:\n    if process.poll() is None:process.kill();process.wait(timeout=10)\n    if sampler is not None:\n     if sampler.poll() is None:\n      assert Path('/proc/'+str(sampler.pid)+'/stat').read_text().rsplit(')',1)[1].split()[19]==sampler_start and os.getpgid(sampler.pid)==sampler.pid\n      subprocess.run(['sudo','-n','kill','-INT','--','-'+str(sampler.pid)],check=True,capture_output=True,timeout=10)\n     sampler_code=sampler.wait(timeout=20)\n    for stream in sampler_files:stream.close()\n  stderr=(directory/'stderr.log').read_text();units=re.findall(r'stat::number_of_executed_units:\\s*(\\d+)',stderr);progress=[int(v) for v in re.findall(r'^#(\\d+)\\s',stderr,re.M)]\n  row=dict(index=index,profiled=profile,command=command,seconds=elapsed,timedOut=timed,exitCode=code,completeOriginalRuns=not timed and code==0 and units==['10000'],executedUnits=int(units[-1]) if units else None,observedProgressUnitsLowerBound=max(progress,default=0),userCpuSeconds=used.ru_utime-usage.ru_utime,systemCpuSeconds=used.ru_stime-usage.ru_stime,stderrSHA256=sha(directory/'stderr.log'),quietObservation=dict(seconds=quiet_seconds,busyFraction=busy,stealFraction=steal,observedQuiet=busy<=.05 and steal<=.01,physicalHostIsolationNotClaimed=True),samplerExitCode=sampler_code)\n  r['attempts'].append(row);save()\n  if profile:\n   assert sampler_code in (0,130) and (directory/'perf.data').stat().st_size>0\n   data=directory/'perf.data';assert data.is_relative_to(out) and data.is_file() and not data.is_symlink()\n   subprocess.run(['sudo','-n','chown',str(os.getuid())+':'+str(os.getgid()),str(data)],check=True,capture_output=True,timeout=10)\n   report=subprocess.run(['sudo','-n',str(perf),'report','--stdio','--no-children','--sort','comm,dso,symbol','-i',directory/'perf.data'],capture_output=True,timeout=30)\n   (directory/'perf-report.stdout.log').write_bytes(report.stdout);(directory/'perf-report.stderr.log').write_bytes(report.stderr);assert report.returncode==0\n  print(json.dumps({k:row[k] for k in ['index','profiled','seconds','timedOut','exitCode','executedUnits','observedProgressUnitsLowerBound']}),flush=True)\n r.update(complete=True,allOriginalInputsAndBudgetsRetained=True,profilerOverheadIsAnExplicitSeparateFactor=True,collectionSuccessDoesNotMeanEveryAttemptPassed=True);save()\nexcept BaseException:r['controllerFailure']=traceback.format_exc();save();raise\nfinally:\n target=root/'exact-frame-cpu-profile-evidence.tar.gz'\n with tarfile.open(target,'x:gz',dereference=False) as tar:\n  for file in sorted(out.rglob('*')):\n   if file.is_file() and (file.suffix in ('.json','.log','.data') or file.name=='perf.data' or file.name.startswith(('crash-','timeout-','oom-','leak-'))):tar.add(file,arcname=file.relative_to(out).as_posix())\n target.with_name(target.name+'.sha256').write_text(sha(target)+'  '+target.name+'\\n')\n\nPY\npython3 -B frame-profile-controller.py\n"
        },
        {
          "name": "Retain all successes, original-deadline failures and real CPU samples; not qualification",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "if": "always()",
          "with": {
            "name": "exact-frame-cpu-profile-evidence",
            "path": "exact-frame-cpu-profile-evidence.tar.gz\nexact-frame-cpu-profile-evidence.tar.gz.sha256\nframe-profile-controller.py",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

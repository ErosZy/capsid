name: Verify all remaining child-owned reference listeners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remaining-reference-listeners:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 05136e23208011c3d920f207af522bc4d02f937d
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install and verify original locked workerd
        run: |
          set -euo pipefail
          mkdir -p evidence/reports
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"
      - name: Execute all original affected reference cases and contract controls
        env:
          CAPSID_WS_REPORT_DIR: ${{ github.workspace }}/evidence/reports
          CAPSID_WS_RUN_ID: remaining-reference-listeners-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          source=Path.cwd();directory=source/'evidence'
          plans=json.loads('[{"name":"native_retired_ownership_contract_controls","args":["--test","--test-reporter=tap","SOURCE_ROOT/tests/test_native_retired_ownership_contract.mjs"],"timeout":30.0,"role":"control"},{"name":"workerd_owner_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_owner_contract.mjs"],"timeout":10.0,"role":"control"},{"name":"workerd_async_callback_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_async_callback_contract.mjs"],"timeout":10.0,"role":"control"},{"name":"workerd_cross_context_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_cross_context_contract.mjs"],"timeout":10.0,"role":"control"},{"name":"workerd_fetch_resource_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_fetch_resource_contract.mjs"],"timeout":10.0,"role":"control"},{"name":"workerd_ordinary_fetch_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_ordinary_fetch_contract.mjs"],"timeout":120.0,"role":"control"},{"name":"workerd_http_codec_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_http_codec_contract.mjs"],"timeout":120.0,"role":"control"},{"name":"workerd_fetch_upgrade_lifetime_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_fetch_upgrade_lifetime_contract.mjs"],"timeout":15.0,"role":"control"},{"name":"workerd_fetch_proxy_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_fetch_proxy_contract.mjs"],"timeout":30.0,"role":"control"},{"name":"workerd_fetch_boundary_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_fetch_boundary_contract.mjs"],"timeout":30.0,"role":"control"},{"name":"workerd_fetch_transition_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_fetch_transition_contract.mjs"],"timeout":30.0,"role":"control"},{"name":"workerd_fetch_arguments_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_fetch_arguments_contract.mjs"],"timeout":60.0,"role":"control"},{"name":"workerd_fetch_reader_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_fetch_reader_contract.mjs"],"timeout":60.0,"role":"control"},{"name":"workerd_reader_intrinsic_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_reader_intrinsic_contract.mjs"],"timeout":30.0,"role":"control"},{"name":"workerd_native_reader_lifecycle_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_native_reader_lifecycle_contract.mjs"],"timeout":30.0,"role":"control"},{"name":"workerd_reader_scope_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_reader_scope_contract.mjs"],"timeout":60.0,"role":"control"},{"name":"workerd_standard_reader_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_standard_reader_contract.mjs"],"timeout":30.0,"role":"control"},{"name":"workerd_crypto_contract_controls","args":["--test","SOURCE_ROOT/tests/test_workerd_crypto_contract.mjs"],"timeout":10.0,"role":"control"},{"name":"websocket_async_callbacks_reference","args":["SOURCE_ROOT/tests/test_websocket_async_callbacks.mjs","--reference-from-env","1"],"timeout":120.0,"role":"reference"},{"name":"websocket_cross_context_reference","args":["SOURCE_ROOT/tests/test_websocket_cross_context.mjs","--reference-from-env","1"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_resources_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_resources.mjs","--reference-from-env","1"],"timeout":120.0,"role":"reference"},{"name":"websocket_ordinary_fetch_core_reference","args":["SOURCE_ROOT/tests/test_websocket_ordinary_fetch.mjs","--reference-from-env","1","--shard","core"],"timeout":120.0,"role":"reference"},{"name":"websocket_ordinary_fetch_pipelines_reference","args":["SOURCE_ROOT/tests/test_websocket_ordinary_fetch.mjs","--reference-from-env","1","--shard","pipelines"],"timeout":120.0,"role":"reference"},{"name":"websocket_ordinary_fetch_gated_reference","args":["SOURCE_ROOT/tests/test_websocket_ordinary_fetch.mjs","--reference-from-env","1","--shard","gated"],"timeout":120.0,"role":"reference"},{"name":"websocket_ordinary_fetch_views_reference","args":["SOURCE_ROOT/tests/test_websocket_ordinary_fetch.mjs","--reference-from-env","1","--shard","views"],"timeout":120.0,"role":"reference"},{"name":"websocket_ordinary_fetch_bodies_reference","args":["SOURCE_ROOT/tests/test_websocket_ordinary_fetch.mjs","--reference-from-env","1","--shard","bodies"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_upgrade_lifetime_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_upgrade_lifetime.mjs","--reference-from-env","1"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_proxy_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_proxy.mjs","--reference-from-env","1"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_boundaries_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_boundaries.mjs","--reference-from-env","1","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_transitions_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_transitions.mjs","--reference-from-env","1","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_arguments_getReader_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_arguments.mjs","--reference-from-env","1","--shard","getReader","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_arguments_direct_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_arguments.mjs","--reference-from-env","1","--shard","direct","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_arguments_prototype_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_arguments.mjs","--reference-from-env","1","--shard","prototype","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_arguments_subclass_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_arguments.mjs","--reference-from-env","1","--shard","subclass","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_arguments_reflect_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_arguments.mjs","--reference-from-env","1","--shard","reflect","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_fetch_readers_reference","args":["SOURCE_ROOT/tests/test_websocket_fetch_readers.mjs","--reference-from-env","1","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_reader_intrinsics_reference","args":["SOURCE_ROOT/tests/test_websocket_reader_intrinsics.mjs","--reference-from-env","1"],"timeout":60.0,"role":"reference"},{"name":"websocket_native_reader_lifecycle_reference","args":["SOURCE_ROOT/tests/test_websocket_native_reader_lifecycle.mjs","--reference-from-env","1","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_reader_scope_reference","args":["SOURCE_ROOT/tests/test_websocket_reader_scope.mjs","--reference-from-env","1","--openssl","/usr/bin/openssl"],"timeout":120.0,"role":"reference"},{"name":"websocket_crypto_reference","args":["SOURCE_ROOT/tests/test_websocket_crypto.mjs","--reference-from-env","1"],"timeout":120.0,"role":"reference"},{"name":"websocket_owner_lifecycle_reference","args":["SOURCE_ROOT/tests/test_websocket_owner_lifecycle.mjs","--reference-from-env","1"],"timeout":120.0,"role":"reference"}]')
          commands=[]
          for plan in plans:
              args=['node',*[a.replace('SOURCE_ROOT/',str(source)+'/') for a in plan['args']]]
              commands.append('add_test('+json.dumps(plan['name'])+' '+' '.join(map(json.dumps,args))+')')
              commands.append('set_tests_properties('+json.dumps(plan['name'])+' PROPERTIES TIMEOUT '+str(plan['timeout'])+')')
          (directory/'selected-original-registration.json').write_text(json.dumps(plans,indent=2)+'\n')
          (directory/'CTestTestfile.cmake').write_text('\n'.join(commands)+'\n')
          subprocess.run(['ctest','--test-dir',str(directory),'--no-tests=error','--parallel','2','--output-on-failure','--output-junit',str(directory/'junit.xml')],check=True)
          PY
      - name: Save all original results and child transcripts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: remaining-reference-child-listeners
          if-no-files-found: error
          path: evidence/

name: Actual current Alpine static package recipe and native consumers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  musl-package:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 27edca96069d88386950b4dd54c22db0bd0df52e
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install pinned node modules
        shell: bash
        run: |
          set -euo pipefail
          # --ignore-scripts: pure JS, no native bindings, so the musl
          # container reuses these trees verbatim. All five trees are
          # required: the configure gate checks the example dependencies.
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done

      - name: Build and package in Alpine (musl, fully static)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          if ! docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            alpine:3.24 sh -eux -c '
              echo "== apk add"
              apk add --no-cache build-base cmake ninja linux-headers \
                nodejs npm git perl boost-dev boost1.84-static c-ares-dev
              # The mounted workspace is owned by the runner user; as root,
              # git refuses it and the overlay-key / identity gates then
              # cannot resolve vendor HEADs. Covers every nested submodule
              # gitdir in the ephemeral container.
              git config --global --add safe.directory "*"
              echo "== openssl fetch"
              cd /tmp
              echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" > openssl.sha256
              wget -q https://www.openssl.org/source/openssl-3.5.7.tar.gz
              sha256sum -c openssl.sha256
              tar xzf openssl-3.5.7.tar.gz
              cd openssl-3.5.7
              echo "== openssl config"
              ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests
              echo "== openssl make"
              make -j2
              make install_sw
              echo "== reuse node_modules"
              cd /src
              test -d vendor/txiki.js/node_modules
              echo "== cmake configure"
              if ! cmake -S . -B build-musl -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCAPSID_BUILD_HOST=ON \
                  -DCMAKE_EXE_LINKER_FLAGS="-static" \
                  -DCMAKE_PREFIX_PATH=/opt/openssl35 \
                  > /tmp/configure.log 2>&1; then
                echo "== CONFIGURE FAILED"
                tail -8 /tmp/configure.log
                exit 1
              fi
              echo "== cmake build"
              cmake --build build-musl --parallel 2
              echo "== package"
              cmake --build build-musl --target package
              echo "== registered original native and package controls"
              ctest --test-dir build-musl --show-only=json-v1 \
                -R "^(worker_package_contents|worker_package_smoke|worker_package_consumer_controls|worker_spawn_rollback|worker_forced_reap|spawn_failure_recovery|worker_writer_gate_contract_controls|worker_outbound_websocket|worker_outbound_result_ack_pressure)$" \
                > build-musl/static-package-registration.json
              echo "== actual unchanged-budget native and package controls"
              ctest --test-dir build-musl --parallel 1 --no-tests=error --output-on-failure \
                --output-junit static-package-junit.xml \
                -R "^(worker_package_contents|worker_package_smoke|worker_package_consumer_controls|worker_spawn_rollback|worker_forced_reap|spawn_failure_recovery|worker_writer_gate_contract_controls|worker_outbound_websocket|worker_outbound_result_ack_pressure)$"
            ' 2>&1 | tee /tmp/musl-build.log; then
            tail -8 /tmp/musl-build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          if ! pkg=$(ls build-musl/capsid-*.tar.gz 2>/dev/null); then
            echo "::error::no TGZ in build-musl; dir listing:"
            ls -la build-musl/ | tail -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Verify actual static executables and original package consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,subprocess,tarfile,xml.etree.ElementTree as X
          root=Path.cwd();out=root/'build-current-musl-evidence';out.mkdir(exist_ok=True)
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(root/'.github/workflows/release.yml')=='b4d58b0715bab3752f81e67113d2e243e185052737e17f9d685798810edd5089'
          registration=json.loads((root/'build-musl/static-package-registration.json').read_text())
          cases=list(X.parse(root/'build-musl/static-package-junit.xml').iter('testcase'))
          expected={'worker_package_contents','worker_package_smoke','worker_package_consumer_controls','worker_spawn_rollback','worker_forced_reap',
           'spawn_failure_recovery','worker_writer_gate_contract_controls','worker_outbound_websocket','worker_outbound_result_ack_pressure'}
          assert len(cases)==9 and {c.get('name') for c in cases}==expected=={t['name'] for t in registration['tests']}
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          properties={t['name']:{p['name']:p['value'] for p in t['properties']} for t in registration['tests']}
          assert properties['worker_spawn_rollback']['TIMEOUT']==15 and properties['worker_forced_reap']['TIMEOUT']==15
          assert properties['worker_writer_gate_contract_controls']['TIMEOUT']==10
          assert properties['worker_outbound_websocket']['TIMEOUT']==properties['worker_outbound_result_ack_pressure']['TIMEOUT']==30
          assert properties['spawn_failure_recovery']['TIMEOUT']==60
          full=(root/'build-musl/Testing/Temporary/LastTest.log').read_text()
          rows=[dict(p.split('=',1) for p in line.split()[1:]) for line in full.splitlines() if line.startswith('SPAWN_ROLLBACK ')]
          assert len(rows)==9 and all(all(row[k]=='1' for k in ['injected','error','completed_before_fixture_cleanup','exact','descriptors_restored']) for row in rows)
          for name in ['worker_outbound_websocket','worker_outbound_result_ack_pressure']:
           start=full.index(' Test: '+name+'\n');start=full.index('Output:\n',start);end=full.index('<end of output>',start);body=full[start:end]
           assert 'pre-ACCEPT delay=0 ms PASS' in body and 'pre-ACCEPT delay=350 ms PASS' in body
           assert body.count('WRITER_BARRIER pid=')==2 and body.count('"queuePeak":4096')==2 and '"invalid":true' not in body
           assert body.count('OUTBOUND_PRESSURE_EXIT clean=1 shutdown=0 flush=0 event=0 closed=1 reaped=1 status=0 wait=0 forced=0 errors=0')==2
          image=json.loads(subprocess.check_output(['docker','image','inspect','alpine:3.24'],text=True))
          (out/'actual-image-inspect.json').write_text(json.dumps(image,indent=2)+'\n')
          programs={}
          for name in ['capsid-host','capsid-worker','capsid-bytecode-compile']:
           file=root/'build-musl'/name
           headers=subprocess.check_output(['readelf','-lW',str(file)],text=True)
           dynamic=subprocess.check_output(['readelf','-dW',str(file)],text=True)
           assert 'INTERP' not in headers and '(NEEDED)' not in dynamic
           (out/(name+'-elf.txt')).write_text(headers+dynamic)
           programs[name]=dict(sha256=sha(file),noProgramInterpreter=True,noNeededLibraries=True)
          packages=sorted((root/'build-musl').glob('capsid-*.tar.gz'));assert len(packages)==1
          package=packages[0];members=[]
          with tarfile.open(package,'r:gz') as archive:
           for entry in archive.getmembers():
            assert not entry.name.startswith('/') and '..' not in Path(entry.name).parts
            if not entry.isfile():continue
            data=archive.extractfile(entry).read()
            digest=hashlib.sha256(data).hexdigest();members.append(dict(name=entry.name,bytes=len(data),sha256=digest))
            if entry.name.startswith('capsid-0.3.0-linux-musl/bin/') and Path(entry.name).name in programs:
             name=Path(entry.name).name;dest=out/('packaged-'+name);dest.write_bytes(data)
             headers=subprocess.check_output(['readelf','-lW',str(dest)],text=True)
             dynamic=subprocess.check_output(['readelf','-dW',str(dest)],text=True)
             assert 'INTERP' not in headers and '(NEEDED)' not in dynamic
             programs[name]['packagedSHA256']=digest
          assert all('packagedSHA256' in program for program in programs.values())
          (out/'actual-package-members.json').write_text(json.dumps(members,indent=2)+'\n')
          record=dict(complete=True,status='actual-current-musl-container-recipe-static-native-and-package-consumers-qualified',
           createdUTC=datetime.now(timezone.utc).isoformat(),sourceSnapshot='63a3cc1a1ed222c6639be01c8fb41e48c29c6479',checkoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           actualDockerImageId=image[0]['Id'],actualDockerRepoDigests=image[0].get('RepoDigests'),
           sourceReleaseWorkflowSHA256='b4d58b0715bab3752f81e67113d2e243e185052737e17f9d685798810edd5089',originalLinuxRecipeSHA256='85437af87df2045c057e12e1f3fd4442dc0569b460fa67880e9dab646207a1ef',
           originalRecipeDependencyCompilerAndLinkOptionsUnchanged=True,onlyAppendedOriginalRegisteredTests=True,
           actualOriginalCTestCasesPassed=9,actualStartupRollbackSubcases=9,actualPressureSubcases=4,skipped=0,
           programIdentities=programs,package=dict(name=package.name,sha256=sha(package)),
           originalRegisteredPerTestBudgetsRetained=True,wholeUnfilteredMuslOrWorkerdReferenceNotClaimed=True,
           publicationPerformed=False,mainBranchUpdated=False,tagCreated=False,fullV030GoalComplete=False)
          (out/'run.json').write_text(json.dumps(record,indent=2)+'\n');print(json.dumps(record,indent=2))
          PY
      - name: Retain complete original recipe and CTest evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build-current-musl-evidence
          if test -f /tmp/musl-build.log; then cp /tmp/musl-build.log build-current-musl-evidence/; fi
          if test -d build-musl; then
            tar -czf build-current-musl-evidence/raw-package-reports.tar.gz \
              --ignore-failed-read build-musl/Testing build-musl/package-contents-work \
              build-musl/package-smoke-work build-musl/package-consumer-controls-work
          fi
      - name: Save current musl package evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: current-musl-package-evidence
          if-no-files-found: error
          path: |
            build-current-musl-evidence/
            build-musl/static-package-registration.json
            build-musl/static-package-junit.xml
            build-musl/Testing/Temporary/LastTest.log
            build-musl/CMakeCache.txt
            build-musl/compile_commands.json
            build-musl/capsid-*.tar.gz

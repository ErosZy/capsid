{
  "name": "Read retained exact-binary CPU samples without repeating fuzzer tests",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "exact-frame-cpu-recovery": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "77c8c7aa853dafaaf4689c54e4d4219764ae64f9",
            "submodules": false,
            "fetch-tags": true,
            "persist-credentials": false
          }
        },
        {
          "name": "Install actual Linux software sampling tools without changing kernel parameters",
          "run": "sudo apt-get update\nsudo apt-get install -y linux-tools-generic\n"
        },
        {
          "name": "Read the exact preserved historical binary and fresh starting archive without recompilation",
          "uses": "actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53",
          "with": {
            "name": "frame-original-seed-replay-evidence",
            "run-id": 43578717747,
            "github-token": "${{ secrets.GITHUB_TOKEN }}",
            "path": "profile-recovery-inputs/original"
          }
        },
        {
          "name": "Recover the already-recorded CPU data without rerunning tests",
          "uses": "actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53",
          "with": {
            "name": "exact-frame-cpu-profile-evidence",
            "run-id": 43603561020,
            "github-token": "${{ secrets.GITHUB_TOKEN }}",
            "path": "profile-recovery-inputs/profile"
          }
        },
        {
          "name": "Read existing samples using the restored exact unmodified binary as the current file owner",
          "run": "cat > frame-profile-recovery.py <<'PY'\nfrom pathlib import Path,PurePosixPath\nimport hashlib,json,os,subprocess,tarfile\nroot=Path.cwd();out=root/'build-exact-frame-cpu-recovery';out.mkdir(exist_ok=False);sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\nprofile=root/'profile-recovery-inputs/profile/exact-frame-cpu-profile-evidence.tar.gz';assert sha(profile)==profile.with_name(profile.name+'.sha256').read_text().split()[0]\noriginal=root/'profile-recovery-inputs/original/build-fuzz/fuzz-replay-before.tar.gz';assert sha(original)=='c20e6aac472c1cd7c3fb1dc186a92e68f50ed6c73b87861abc4d274ddfde5627'\nwith tarfile.open(profile,'r:gz') as tar:\n result=json.load(tar.extractfile('result.json'));assert not result['complete'] and len(result['attempts'])==2 and result['attempts'][1]['samplerExitCode']==0\n data=tar.extractfile('attempt-2/perf.data').read();(out/'perf.data').write_bytes(data);(out/'original-collection-result.json').write_text(json.dumps(result,indent=2)+'\\n')\nwith tarfile.open(original,'r:gz') as tar:\n member=tar.getmember('build-fuzz/fuzz-websocket-frames');assert member.isfile() and not member.issym() and not member.islnk()\n binary=root/'build-exact-frame-cpu-profile/attempt-2/build-fuzz/fuzz-websocket-frames';binary.parent.mkdir(parents=True,exist_ok=False);binary.write_bytes(tar.extractfile(member).read());binary.chmod(0o755)\nassert sha(binary)=='6f5ce576afee67f823c4ad165ba1f673772772334a335c65e244352e8d070e78'\nperf=next(p for p in sorted(Path('/usr/lib/linux-tools').glob('*/perf')) if p.is_file() and os.access(p,os.X_OK))\ncommands=[('symbols',['report','--stdio','--no-children','--sort','comm,dso,symbol','-i',out/'perf.data']),('header',['report','--header-only','--stdio','-i',out/'perf.data']),('buildids',['buildid-list','-i',out/'perf.data'])]\nfor label,args in commands:\n p=subprocess.run(list(map(str,[perf,*args])),capture_output=True,timeout=30);(out/(label+'.stdout.log')).write_bytes(p.stdout);(out/(label+'.stderr.log')).write_bytes(p.stderr);assert p.returncode==0,(label,p.returncode)\nr=dict(complete=True,originalCollectionRun=43603561020,originalCollectionFailurePreserved=True,actualExisting1888SamplesReadWithoutRepeatingFuzzerOrTests=True,originalUnmodifiedBinarySHA256=sha(binary),perfDataSHA256=sha(out/'perf.data'),noOwnershipCheckBypassAndNoKernelChanges=True,sourceFormalPerformance10NotDependent=True,formalPerformancePoints=0,fullV030GoalComplete=False);(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\ntarget=root/'exact-frame-cpu-profile-recovery.tar.gz'\nwith tarfile.open(target,'x:gz') as tar:tar.add(out,arcname=out.name)\ntarget.with_name(target.name+'.sha256').write_text(sha(target)+'  '+target.name+'\\n');print(json.dumps(r))\n\nPY\npython3 -B frame-profile-recovery.py\n"
        },
        {
          "name": "Retain all successes, original-deadline failures and real CPU samples; not qualification",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "if": "always()",
          "with": {
            "name": "exact-frame-cpu-profile-recovery-evidence",
            "path": "exact-frame-cpu-profile-recovery.tar.gz\nexact-frame-cpu-profile-recovery.tar.gz.sha256\nframe-profile-recovery.py",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

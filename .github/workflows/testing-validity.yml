name: Diagnose exact Windows binding argument controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-argument-controls-profile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out unchanged frozen product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fab182f17cbce7bdc85e66e6f31ddfb2897362a3
      - name: Set up exact test Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Measure import and profile complete original controls
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, subprocess, time, traceback, re
          root = Path.cwd()
          out = root / 'binding-argument-profile'
          out.mkdir()
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == 'fab182f17cbce7bdc85e66e6f31ddfb2897362a3'
          assert git('rev-parse', 'HEAD^{tree}') == 'c6b13ee33695f9cc4970e198f11c921447a8ed80'
          cmake = (root / 'cmake/build_tests.cmake').read_text('utf-8')
          marker = 'set_tests_properties(binding_fetch_arguments_contract_controls'
          assert cmake.count(marker) == 1
          gate = cmake.split(marker, 1)[1].split(')', 1)[0]
          assert re.search(r'TIMEOUT\s+30(?:\s|$)', gate), gate
          paths = [root / p for p in git('ls-files', 'tools', 'tests/test_binding_fetch_arguments_contract.mjs', 'tests/fixtures', 'cmake/build_tests.cmake').splitlines()]
          inputs = {p.relative_to(root).as_posix(): sha(p) for p in paths if p.is_file()}
          (out / 'source-inputs.json').write_text(json.dumps(inputs, indent=2) + '\n')
          record = dict(complete=False, createdUTC=datetime.now(timezone.utc).isoformat(), sourceCommit=git('rev-parse', 'HEAD'), sourceTree=git('rev-parse', 'HEAD^{tree}'), node=subprocess.check_output(['node', '--version'], text=True).strip(), originalCTestSeconds=30, diagnosticDeadlineSeconds=180, formalAcceptanceClaimed=False, sourceFilesModified=False, measurements=[])
          save = lambda: (out / 'run.json').write_text(json.dumps(record, indent=2) + '\n')
          save()
          def run(label, arguments):
              started = time.monotonic()
              with (out / (label + '.stdout.log')).open('wb') as stdout, (out / (label + '.stderr.log')).open('wb') as stderr:
                  completed = subprocess.run(['node', *arguments], stdout=stdout, stderr=stderr, timeout=180)
              item = dict(label=label, arguments=arguments, exitCode=completed.returncode, elapsedSeconds=time.monotonic()-started)
              record['measurements'].append(item)
              save()
              assert completed.returncode == 0, item
          try:
              run('cold-import', ['--input-type=module', '-e', "const started=performance.now();await import('./tools/binding-fetch-arguments-contract.mjs');console.log(JSON.stringify({importMilliseconds:performance.now()-started}));"])
              run('original-complete-controls', ['--test', '--test-reporter=spec', 'tests/test_binding_fetch_arguments_contract.mjs'])
              profile = out / 'cpu'
              profile.mkdir()
              run('profiled-complete-controls', ['--cpu-prof', '--cpu-prof-dir=' + str(profile), '--test', '--test-reporter=spec', 'tests/test_binding_fetch_arguments_contract.mjs'])
              assert all(sha(root / p) == value for p, value in inputs.items())
              assert git('diff', '--name-only') == ''
              record.update(complete=True, status='diagnostic-captured', allOriginalControlsPreserved=True, sourceInputsUnchanged=True)
          except BaseException:
              record.update(status='error', error=traceback.format_exc())
              raise
          finally:
              record['finishedUTC'] = datetime.now(timezone.utc).isoformat()
              save()
      - name: Preserve complete profiles and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-binding-argument-profile
          path: binding-argument-profile
          if-no-files-found: error

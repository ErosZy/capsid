th (out/(label+'.stdout.log')).open('xb') as so,(out/(label+'.stderr.log')).open('xb') as se:\n  p=subprocess.run(list(map(str,args)),cwd=root,env=env,stdout=so,stderr=se)\n row=dict(label=label,command=list(map(str,args)),exitCode=p.returncode,seconds=time.monotonic()-start,\n  stdoutSHA256=sha(out/(label+'.stdout.log')),stderrSHA256=sha(out/(label+'.stderr.log')))\n if label.startswith('original-'):\n  log=build/'Testing/Temporary/LastTest.log';copy=out/(label+'-LastTest.log');assert not copy.exists();copy.write_bytes(log.read_bytes());row['lastTestSHA256']=sha(copy)\n r['attempts'].append(row);save();guard();return p.returncode\ntry:\n save();guard()\n for index in range(20):\n  status=run('original-'+str(index),['ctest','--test-dir',build,'--no-tests=error','-R','^native_fetch_large_gzip$',\n   '--output-on-failure','--output-junit',out/('original-'+str(index)+'-junit.xml')])\n  if status:break\n # A separate, explicitly identified wrapper records real user-space CPU\n # stacks. -q suppresses only perf's normal status chatter, not helper/TSan\n # diagnostics, and the original helper/worker/assertions remain unchanged.\n wrapper=out/'actual-helper-perf.py'\n wrapper.write_text('#!'+sys.executable+'\\nimport os,sys,json\\nfrom pathlib import Path\\n'\n  'out=Path('+repr(str(out))+')\\n'\n  'target=out/(\"perf-helper-\"+str(os.getpid())+\".data\")\\n'\n  '(target.with_suffix(\".invocation.json\")).write_text(json.dumps(dict(wrapperPid=os.getpid(),argv=sys.argv,actualHelper='+repr(str(helper))+'),indent=2)+\"\\\\n\")\\n'\n  'os.execv('+repr(perf['selectedActualPerf'])+','+repr([perf['selectedActualPerf'],'record','-q','-e','cpu-clock:u','-F','99','-g','-o'])+'+[str(target),\"--\",'+repr(str(helper))+']+sys.argv[1:])\\n')\n wrapper.chmod(0o700);r['profilingWrapperSHA256']=sha(wrapper);save()\n profiled=list(command);profiled[profiled.index('--helper')+1]=str(wrapper)\n run('profiled-original-helper',profiled)\n profiles=[]\n for file in sorted(out.glob('perf-helper-*
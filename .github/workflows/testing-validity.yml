name: Exact native argument integrity and Darwin reference observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  argument-models:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ebf58518b3c01d237a33f191c6286b80847c834
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.3'
      - name: Run every original argument control with unchanged budgets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil,signal,subprocess,time
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'argument-model-evidence';out.mkdir(exist_ok=True)
          node=shutil.which('node');assert node
          runtime=json.loads(subprocess.check_output([node,'-p','JSON.stringify({node:process.version,undici:process.versions.undici})'],text=True))
          assert runtime=={'node':'v24.14.0','undici':'7.21.0'}
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          guard={p:sha(p) for p in ['tools/workerd-fetch-arguments-contract.mjs','tests/test_workerd_fetch_arguments_contract.mjs','tests/test_binding_fetch_arguments_contract.mjs']}
          record=dict(complete=False,platform=os.environ['RUNNER_OS'],runtime=runtime,nodeSHA256=sha(node),sourceFiles=guard,steps=[],validationResultsCached=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          for label,file,budget,count in [('native','tests/test_workerd_fetch_arguments_contract.mjs',60,9249),('binding','tests/test_binding_fetch_arguments_contract.mjs',30,14)]:
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen([node,'--test','--test-reporter=tap',file],stdout=so,stderr=se,start_new_session=os.name!='nt')
            try:code=child.wait(timeout=budget)
            except subprocess.TimeoutExpired:
             if os.name=='nt':subprocess.run(['taskkill','/PID',str(child.pid),'/T','/F'],capture_output=True,timeout=15)
             else:os.killpg(child.pid,signal.SIGKILL)
             child.wait(5);code=124
           text=(out/(label+'.stdout.log')).read_text('utf-8')
           record['steps'].append(dict(label=label,exitCode=code,seconds=time.monotonic()-start,originalBudgetSeconds=budget));save()
           assert code==0,(label,code)
           for name,expected in [('tests',count),('pass',count),('fail',0),('skipped',0),('cancelled',0)]:
            assert re.findall(r'^# '+name+r' (\d+)\s*$',text,re.M)==[str(expected)],(label,name)
           if label=='binding':assert '"rejectedMutations":19189' in text and '"uniqueArgumentInputs":10920' in text
          assert guard=={p:sha(p) for p in guard}
          record.update(complete=True,allOriginalControlsRetained=True,additionalIntegrityTests=4,originalBudgetsRetained=True)
          save();print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: argument-models-${{ runner.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/argument-model-evidence
  darwin-reference:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ebf58518b3c01d237a33f191c6286b80847c834
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.3'
      - name: Install the original certificate executable
        run: |
          brew install openssl@3.5
          printf 'CAPSID_DIAG_OPENSSL=%s/bin/openssl\n' "$(brew --prefix openssl@3.5)" >> "${{GITHUB_ENV}}"
      - name: Configure distinct loopback peers for redirect contracts
        run: |
          set -euo pipefail
          sudo ifconfig lo0 alias 127.0.0.2 netmask 255.255.255.255
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import net from 'node:net';
          import {once} from 'node:events';
          const servers=[];
          try {
            let port=0;
            for(const host of ['127.0.0.1','127.0.0.2']) {
              const server=net.createServer(socket=>socket.end(host));servers.push(server);
              server.listen({host,port});await once(server,'listening');
              assert.equal(server.address().address,host);port=server.address().port;
            }
            for(const host of ['127.0.0.1','127.0.0.2']) {
              const client=net.createConnection({host,port});let body='';
              for await(const bytes of client)body+=bytes.toString();
              assert.equal(body,host,'distinct loopback peer receives the actual connection');
            }
            console.log(JSON.stringify({complete:true,loopbackPeers:2,samePort:true,actualRoundTrips:2}));
          } finally {await Promise.all(servers.map(server=>new Promise(resolve=>server.close(resolve))));}
          JS

      - name: Install and verify locked workerd reference
        run: |
          set -euo pipefail
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"

      - name: Observe original pinned native gates and pre-cleanup terminals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,signal,subprocess,time
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'darwin-reference-evidence';out.mkdir(exist_ok=True)
          node='node';sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          scripts=['tests/test_websocket_ordinary_fetch.mjs','tests/test_websocket_http_codec.mjs','tests/test_websocket_fetch_boundaries.mjs']
          guard={p:sha(p) for p in scripts};record=dict(complete=False,diagnosticOnly=True,referenceBinarySHA256=sha(os.environ['CAPSID_WORKERD_REF']),sourceFiles=guard,steps=[])
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          for label,file,args,budget in [('ordinary',scripts[0],['--shard','core'],120),('codec',scripts[1],['--shard','metadata'],120),('boundary',scripts[2],['--openssl',os.environ['CAPSID_DIAG_OPENSSL']],120)]:
           command=[node,file,'--reference-from-env','1',*args,'--report',str(out/(label+'.json'))]
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen(command,stdout=so,stderr=se,start_new_session=True)
            try:code=child.wait(timeout=budget)
            except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(5);code=124
           record['steps'].append(dict(label=label,exitCode=code,seconds=time.monotonic()-start,originalBudgetSeconds=budget,command=command));save()
          # Preserve the real pre-cleanup observation for HEAD and late CRC, even if
          # the original full gate failed before assigning its successful final snapshot.
          source=(root/scripts[1]).read_text()
          needle='const cases = httpCodecCasesForShard(shard);'
          assert source.count(needle)==1
          source=source.replace(needle,needle[:-1]+'.filter(id => ["codec-supp-head","codec-supp-fragment-crc-late"].includes(id));')
          needle='  } finally {\n    peer?.dispose();'
          assert source.count(needle)==1
          source=source.replace(needle,'  } finally {\n    fs.appendFileSync(process.env.CAPSID_NATIVE_DIAGNOSTIC, JSON.stringify({phase:"before-cleanup", id, challenge:value.challenge, failure:value.failure??null, upstream:source?.snapshot()})+"\\n");\n    peer?.dispose();')
          needle='    if (source) await source.stop();'
          assert source.count(needle)==1
          source=source.replace(needle,'    fs.appendFileSync(process.env.CAPSID_NATIVE_DIAGNOSTIC, JSON.stringify({phase:"after-helper-before-fixture-stop", id, challenge:value.challenge, upstream:source?.snapshot()})+"\\n");\n'+needle)
          source=source.replace('validateHttpCodecReport(report, { lock, inputs, runId, host: binaries.host, worker: binaries.worker, shard });','assert.equal(report.cases.length, 2, "two diagnostic observations only; this is not a full reference gate");')
          diagnostic=root/'tests/diagnostic_native_codec_r1.mjs';diagnostic.write_text(source,encoding='utf-8')
          record['diagnosticRunnerSHA256']=sha(diagnostic);record['diagnosticRunnerSelection']=['codec-supp-head','codec-supp-fragment-crc-late'];save()
          env=dict(os.environ,CAPSID_NATIVE_DIAGNOSTIC=str(out/'codec-pre-cleanup.jsonl'))
          with (out/'codec-diagnostic.stdout.log').open('wb') as so,(out/'codec-diagnostic.stderr.log').open('wb') as se:
           child=subprocess.Popen([node,str(diagnostic),'--reference-from-env','1','--shard','metadata','--report',str(out/'codec-diagnostic.json')],env=env,stdout=so,stderr=se,start_new_session=True)
           try:code=child.wait(timeout=120)
           except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(5);code=124
          record['diagnosticExitCode']=code;assert guard=={p:sha(p) for p in guard}
          record.update(complete=True,fullGateAcceptanceClaimed=False,originalFailuresRetained=True)
          save();print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: darwin-reference-observations
          if-no-files-found: error
          path: ${{ runner.temp }}/darwin-reference-evidence

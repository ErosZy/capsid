{
  "name": "Profile original fully instrumented frame fuzz without weakening its limits",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "profile": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "b38ed48c4dbde4b383e9ed7d72ea2cfd0b4c1901",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Install Clang and Ninja",
          "run": "sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\nsudo apt-get \"${apt_network[@]}\" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev\n\nsudo apt-get -o Acquire::Retries=3 install -y linux-tools-generic\n"
        },
        {
          "name": "Require actual hosted perf counters",
          "run": "python3 -B tools/setup-hosted-perf.py\n"
        },
        {
          "name": "Configure fuzz harnesses",
          "env": {
            "CC": "clang",
            "CXX": "clang++"
          },
          "run": "cmake -S . -B build-fuzz -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -DCAPSID_BUILD_WORKER=OFF \\\n  -DCAPSID_BUILD_FUZZERS=ON \\\n  -DCAPSID_USE_MIMALLOC=OFF\n"
        },
        {
          "name": "Build fuzz harnesses",
          "run": "cmake --build build-fuzz --parallel 2"
        },
        {
          "name": "Profile unchanged frame fuzz work within the original run and resource budgets",
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport hashlib,json,os,re,shutil,subprocess,tarfile,time\nout=Path('frame-profile-evidence');out.mkdir()\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\nbuild=Path('build-fuzz');binary=build/'fuzz-websocket-frames';source=Path('tests/fuzz/fuzz_websocket_frames.cc')\nregistration=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-L','fuzz']))\ntest=next(t for t in registration['tests'] if t['name']=='fuzz-websocket-frames_smoke')\nassert {p['name']:p['value'] for p in test['properties']}['TIMEOUT']==60\nfor flag in ['-runs=10000','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1']:assert flag in test['command']\nshutil.copy2(binary,out/'fuzz-websocket-frames');shutil.copy2(source,out/source.name)\n(out/'registration.json').write_text(json.dumps(registration,indent=2)+chr(10))\nwith tarfile.open(out/'starting-corpus.tar.gz','w:gz') as t:t.add(build/'fuzz/corpus/websocket_frames',arcname='websocket_frames')\nperf=Path(shutil.which('perf')).resolve();assert perf.is_file()\ncommand=['timeout','--signal=TERM','--kill-after=3','60s',str(perf),'record','-F','499','-e','cpu-clock:u','--call-graph','fp','-o',str(out/'frame.data'),'--',*test['command'],'-seed=4191328252']\nrecord=dict(complete=False,status='profiling-original-frame-gate',createdUTC=datetime.now(timezone.utc).isoformat(),sourceCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),sourceTree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),sourceSHA256=sha(source),binarySHA256=sha(binary),perfSHA256=sha(perf),command=command,original60SecondWorkBudgetRetained=True,original10000Units64KiB512MiBAnd2SecondInputLimitsRetained=True,originalFailureRun=43417908994,productAndHarnessSourceChanged=False,profileIsDiagnosisNotQualification=True,formalPerformancePoints=0,fullV030GoalComplete=False)\n(out/'run.json').write_text(json.dumps(record,indent=2)+chr(10));started=time.monotonic()\nwith (out/'profile.stdout.log').open('xb') as so,(out/'profile.stderr.log').open('xb') as se:result=subprocess.run(command,stdout=so,stderr=se)\nrecord.update(exitCode=result.returncode,seconds=time.monotonic()-started,workBudgetTimedOut=result.returncode in [124,137])\ntext=(out/'profile.stderr.log').read_text('utf-8',errors='replace')\nunits=re.search(r'stat::number_of_executed_units:\\s*(\\d+)',text)\nrecord['completedUnits']=int(units.group(1)) if units else None\nrecord['fullOriginalGatePassed']=result.returncode==0 and record['completedUnits']==10000\nfor label,flags in [('self',['--no-children']),('children',['--children'])]:\n    report=subprocess.run([str(perf),'report','--stdio','--sort','symbol,dso','--percent-limit','0.5',*flags,'-i',str(out/'frame.data')],capture_output=True)\n    (out/('perf-'+label+'.txt')).write_bytes(report.stdout);(out/('perf-'+label+'.stderr.log')).write_bytes(report.stderr)\n    assert report.returncode==0\nwith tarfile.open(out/'after-corpus.tar.gz','w:gz') as t:t.add(build/'fuzz/corpus/websocket_frames',arcname='websocket_frames')\nrecord.update(complete=True,status='original-frame-profile-collected-full-acceptance-still-pending',profileSHA256=sha(out/'frame.data'),inputFiles={p.name:sha(p) for p in out.iterdir() if p.is_file() and p.name!='run.json'})\n(out/'run.json').write_text(json.dumps(record,indent=2)+chr(10));print(json.dumps({k:record[k] for k in ['complete','exitCode','seconds','completedUnits','fullOriginalGatePassed']}))\n\nPY\n"
        },
        {
          "name": "Save complete original frame profile",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "if": "always()",
          "with": {
            "name": "frame-fuzz-cpu-profile-evidence",
            "path": "frame-profile-evidence/**\nbuild-fuzz/compile_commands.json\nbuild-fuzz/generated/build-info.txt\nbuild-perf-prerequisite/evidence/**\n",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

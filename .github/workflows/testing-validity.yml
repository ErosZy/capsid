        files=[Path('tests/fuzz/fuzz_websocket_frames.cc'),build/'fuzz/corpus']\nfiles += sorted({Path(test['command'][0])\
        \ for test in registration['tests'] if Path(test['command'][0]).is_file() and Path(test['command'][0]).resolve().is_relative_to(Path.cwd())})\n\
        target=build/'fuzz-replay-after.tar.gz'\nwith tarfile.open(target,'w:gz',dereference=False) as tar:\n    for path\

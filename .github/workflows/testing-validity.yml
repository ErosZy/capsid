name: Complete archive construction controls under original budgets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve exact source line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5e78134412a7681105212a2fe498df8f0b713d68
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.3'
      - name: Preserve every original control and execute the freshness negative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,re,shutil,signal,subprocess,time
          root=Path.cwd();out=root/'build-gate-construction-copy';out.mkdir()
          baseline=Path(os.environ['RUNNER_TEMP'])/'gate-archive-original-baseline'
          parent='4cecdfc79797f13e31902c4fe6c16ed7d9649ab3'
          subprocess.run(['git','worktree','add','--detach',str(baseline),parent],check=True)
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          changed={'tests/test_workerd_reference_gate.mjs': '3f42f5b5bd75c79352f6fe7115ab7c06381307ff91b18a8cfd5ad7c0e46c826d', 'tests/fixtures/workerd-gate-control-inventory.json': 'e4403814050ca3901076c28997d5f9f93260a712b059cc4705b028ed093fdb33'}
          for path,digest in changed.items():assert sha(root/path)==digest
          original=json.loads((baseline/'tests/fixtures/workerd-gate-control-inventory.json').read_text('utf-8'))
          current=json.loads((root/'tests/fixtures/workerd-gate-control-inventory.json').read_text('utf-8'))
          assert len(original['cases'])==296 and len(current['cases'])==297 and current['cases'][:296]==original['cases']
          node=shutil.which('node');assert node
          assert subprocess.check_output([node,'--version'],text=True).strip()=='v24.14.0'
          record=dict(complete=False,status='verifying-original-budgets-and-complete-construction-copy-controls',createdUTC=datetime.now(timezone.utc).isoformat(),
           sourceSnapshot='8342f9c64c02a70b283c11c4aaa714ec472c6437',checkoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),platform=os.environ['RUNNER_OS'],
           sourceSHA256=changed,originalInventory=296,currentInventory=297,originalPerShardBudgetSeconds=120,
           actualAllOriginalControlsRequired=True,originalValidatorsUnchanged=True,fullCurrentRuntimeAcceptanceClaimed=False,steps=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          def run(label,cwd,args,budget=120,shard='archives'):
           env=dict(os.environ,CAPSID_WS_GATE_CONTROL_SHARD=shard);start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            kwargs=dict(start_new_session=True) if os.name!='nt' else dict(creationflags=subprocess.CREATE_NEW_PROCESS_GROUP)
            child=subprocess.Popen(list(map(str,args)),cwd=cwd,env=env,stdout=so,stderr=se,**kwargs)
            try:code=child.wait(timeout=budget)
            except subprocess.TimeoutExpired:
             if os.name=='nt':subprocess.run(['taskkill','/PID',str(child.pid),'/T','/F'],capture_output=True,timeout=15)
             else:os.killpg(child.pid,signal.SIGKILL)
             child.wait(10);code=124
           record['steps'].append(dict(label=label,exitCode=code,seconds=time.monotonic()-start,budgetSeconds=budget,shard=shard));save()
           return code
          def count(label,total):
           text=(out/(label+'.stdout.log')).read_text('utf-8')
           for key,value in [('tests',total),('pass',total),('fail',0),('skipped',0),('cancelled',0)]:assert re.search(r'^# '+key+' '+str(value)+r'$',text,re.M),(label,key)
          baseline_code=run('original-full-archive-baseline',baseline,[node,'--test','--test-reporter=tap','tests/test_workerd_reference_gate.mjs'])
          if baseline_code==0:count('original-full-archive-baseline',117)
          record['actualOriginalArchiveBaselineExitCode']=baseline_code;record['actualOriginalArchiveBudgetPassed']=baseline_code==0;save()
          results={}
          for shard,total in [('primary',114),('archives',117),('extensions',66)]:
           label='current-complete-'+shard
           code=run(label,root,[node,'--test','--test-reporter=tap','tests/test_workerd_reference_gate.mjs'],shard=shard)
           assert code==0,(label,code);count(label,total);results[shard]=total
          record['actualCurrentControlsPassed']=sum(results.values());record['actualCurrentControlsPerGroup']=results;save()
          # Only restore the previous construction copier in a separate temporary test
          # file. The new graph/freshness case must reject its stale serialized input.
          current_source=(root/'tests/test_workerd_reference_gate.mjs').read_text('utf-8')
          old_source=(baseline/'tests/test_workerd_reference_gate.mjs').read_text('utf-8')
          start=old_source.index('function cloneConstructionTemplate(');end=old_source.index('\nfunction matrix(',start);old_clone=old_source[start:end]
          start=current_source.index('function cloneConstructionTemplate(');end=current_source.index('\nfunction matrix(',start)
          mutant="import {serialize,deserialize} from 'node:v8';\nconst constructionTemplateBytes=new WeakMap();\n"+current_source[:start]+old_clone+current_source[end:]
          file=root/'tests/.old-construction-copy-negative.mjs';assert not file.exists();file.write_text(mutant,encoding='utf-8')
          try:
           assert run('old-copier-negative-syntax-check',root,[node,'--check',file],20,shard='extensions')==0
           code=run('actual-original-copier-freshness-negative',root,[node,'--test','--test-reporter=tap',
            '--test-name-pattern=^construction clones preserve current values and independent complete graph ownership$',file],20,shard='extensions')
           assert code==1,code
           text=(out/'actual-original-copier-freshness-negative.stdout.log').read_text('utf-8')+(out/'actual-original-copier-freshness-negative.stderr.log').read_text('utf-8')
           assert 'every call reads the current construction input' in text
           assert 'SyntaxError' not in text and 'ERR_ASSERTION' in text
           assert re.search(r'^# tests 1$',text,re.M) and re.search(r'^# fail 1$',text,re.M)
           (out/'old-construction-copy-negative.mjs').write_text(mutant,encoding='utf-8')
          finally:file.unlink()
          assert all(sha(root/p)==h for p,h in changed.items())
          old,=[s for s in record['steps'] if s['label']=='original-full-archive-baseline'];new,=[s for s in record['steps'] if s['label']=='current-complete-archives']
          record.update(complete=True,status='complete297-controls-pass-original120-second-budgets-old-copier-freshness-rejected',
           actualOriginalControlsRetainedAndPassed=296,actualNewIntegrityControlsPassed=1,actualOldCopierFreshnessFailureReproduced=True,
           originalArchiveSeconds=old['seconds'],currentArchiveSeconds=new['seconds'],archiveSpeedRatio=old['seconds']/new['seconds'],
           actualPerGroupCountsRequired=True,originalBudgetAndFailureRulesUnchanged=True,productionRuntimeAndValidatorsUnchanged=True)
          save();print(json.dumps(record,indent=2))
          PY
      - name: Preserve paired full outputs and original budgets
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: archive-controls-${{ runner.os }}
          if-no-files-found: error
          path: build-gate-construction-copy/

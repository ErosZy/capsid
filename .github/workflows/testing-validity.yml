name: Measure unmodified frame fuzzer CPU hotspots for diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-frame-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact private baseline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5dcbe8d6b848c79c865e6cb7eb3c432e6bcd203b
          submodules: recursive
      - name: Install original fully instrumented compiler prerequisites
        run: |
          set -euo pipefail
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev linux-tools-generic
      - name: Build and preserve the unmodified baseline frame harness
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          mkdir -p evidence/baseline evidence/experiment
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCAPSID_BUILD_WORKER=OFF -DCAPSID_BUILD_FUZZERS=ON -DCAPSID_USE_MIMALLOC=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-fuzz --target fuzz-websocket-frames --parallel 2
          cp build-fuzz/fuzz-websocket-frames evidence/baseline/
          cp tests/fuzz/fuzz_websocket_frames.cc evidence/baseline/
          cp build-fuzz/compile_commands.json evidence/baseline/
          ctest --test-dir build-fuzz --show-only=json-v1 > evidence/original-registration.json
          cp -a build-fuzz/fuzz/corpus/websocket_frames evidence/initial-corpus
      - name: Enable and verify actual hosted software perf counters
        run: python3 -B tools/setup-hosted-perf.py
      - name: Record CPU hotspots without changing the harness or qualification gate
        run: |
          set -euo pipefail
          lscpu > evidence/cpu-description.txt
          uname -a > evidence/kernel.txt
          mkdir -p evidence/profiles
          cp -a evidence/initial-corpus evidence/profiles/sampling-corpus
          cp -a evidence/initial-corpus evidence/profiles/counters-corpus
          # This1000-input profile diagnoses cost. It is never counted as the
          # required10000-input smoke gate and changes no product CTest budget.
          timeout 60s perf record --event cpu-clock --freq 99 --call-graph dwarf,8192 --output evidence/profiles/cpu-clock.data -- evidence/baseline/fuzz-websocket-frames evidence/profiles/sampling-corpus -runs=1000 -max_len=65536 -timeout=2 -rss_limit_mb=512 -print_final_stats=1 -seed=710362044 > evidence/profiles/sampling.stdout 2> evidence/profiles/sampling.stderr
          perf report --input evidence/profiles/cpu-clock.data --stdio --no-children --percent-limit 0.5 --sort symbol,dso > evidence/profiles/hotspots.txt
          timeout 60s perf stat --event task-clock,context-switches,cpu-migrations,page-faults --output evidence/profiles/counters.txt -- evidence/baseline/fuzz-websocket-frames evidence/profiles/counters-corpus -runs=1000 -max_len=65536 -timeout=2 -rss_limit_mb=512 -print_final_stats=1 -seed=710362044 > evidence/profiles/counters.stdout 2> evidence/profiles/counters.stderr
          git diff --exit-code -- tests/fuzz/fuzz_websocket_frames.cc src/host/ws_codec.cc src/host/ws_stream.cc src/protocol.cc
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('evidence/private-profile.json')
          p.write_text(json.dumps(dict(complete=True,privateDiagnosticOnly=True,diagnosticExecutions=1000,
              qualificationClaimed=False,originalHarnessUnmodified=True,allOriginalQualificationBudgetsRetained=True,
              binarySHA256=hashlib.sha256(Path('evidence/baseline/fuzz-websocket-frames').read_bytes()).hexdigest(),
              formalPerformancePoints=0,fullV030GoalComplete=False),indent=2)+'\n')
          PY
      - name: Save exact binary, original source, actual CPU samples and counter prerequisites
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: frame-cpu-hotspot-diagnostic
          if-no-files-found: error
          path: |
            evidence/
            build-perf-prerequisite/evidence/

name: Observe original current cold cancellation without changing assertions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 27edca96069d88386950b4dd54c22db0bd0df52e
          submodules: recursive
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install original GCC native component prerequisites
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update --error-on=any
          sudo apt-get install -y ninja-build libssl-dev libc-ares-dev
          for directory in vendor/txiki.js examples/hono-reference examples/itty-router-reference examples/h3-v2-reference examples/elysia-reference; do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          git -C vendor/txiki.js fetch --depth=1 origin refs/tags/v26.6.0:refs/tags/v26.6.0
      - name: Preserve real process ancestry and original cancellation assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,shutil,signal,subprocess,tarfile,time
          root=Path.cwd();build=root/'build-cold-signal';out=build/'evidence';out.mkdir(parents=True)
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          record=dict(complete=False,status='building-current-original-cold-signal-diagnostic',createdUTC=datetime.now(timezone.utc).isoformat(),
           snapshot='63a3cc1a1ed222c6639be01c8fb41e48c29c6479',checkoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           diagnosticOnly=True,wholeProviderInstrumentationNotClaimed=True,sourceOrBudgetsNotChanged=True,steps=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          env=dict(os.environ,ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1',LSAN_OPTIONS='')
          def run(label,args,budget,expected=(0,)):
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen(list(map(str,args)),cwd=root,env=env,stdout=so,stderr=se,start_new_session=True)
            try:code=child.wait(budget)
            except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(10);code=124
           record['steps'].append(dict(label=label,exitCode=code,budgetSeconds=budget,seconds=time.monotonic()-start));save()
           assert code in expected,(label,code)
           return code
          save()
          run('configure',['cmake','-S',root,'-B',build,'-G','Ninja','-DCMAKE_BUILD_TYPE=Debug',
           '-DCMAKE_C_COMPILER=gcc','-DCMAKE_CXX_COMPILER=g++','-DBUILD_TESTING=ON','-DCAPSID_BUILD_HOST=OFF',
           '-DCAPSID_BUILD_WORKER=ON','-DCAPSID_USE_MIMALLOC=OFF','-DCAPSID_SANDBOX_PROFILE=sanitizer','-DCAPSID_ENABLE_ASAN=ON'],300)
          run('build-original-components',['cmake','--build',build,'--parallel','2','--target','benchmark-cold-start','capsid-worker','--verbose'],1200)
          commands=subprocess.check_output(['ninja','-C',str(build),'-t','commands','benchmark-cold-start','capsid-worker'],text=True)
          (out/'full-build-commands.txt').write_text(commands);shutil.copy2(build/'compile_commands.json',out/'compile_commands.json');shutil.copy2(build/'CMakeCache.txt',out/'CMakeCache.txt')
          original=run('actual-original-cold-tool-seven-tests',['python3','-B',root/'tests/test_benchmark_cold_tool.py',
           '--tool',build/'cold-start','--worker',build/'capsid-worker'],100,(0,1))
          file=build/'observe.py';file.write_text("from pathlib import Path\nimport argparse,importlib.util,json,os,sys,time,traceback,unittest\nparser=argparse.ArgumentParser();parser.add_argument('--tool');parser.add_argument('--worker');parser.add_argument('--source');parser.add_argument('--out');options=parser.parse_args()\nroot=Path(options.source);out=Path(options.out);out.mkdir(exist_ok=True)\nsys.argv=[str(root/'tests/test_benchmark_cold_tool.py'),'--tool',options.tool,'--worker',options.worker,'--runtime',str(root/'bench/measurement_runtime.py')]\nspec=importlib.util.spec_from_file_location('original_cold_tests',root/'tests/test_benchmark_cold_tool.py')\noriginal=importlib.util.module_from_spec(spec);sys.modules[spec.name]=original;spec.loader.exec_module(original)\ntrace=(out/'owned-process-observations.jsonl').open('w');observations={};attempt=0\ndef emit(value):trace.write(json.dumps(dict(attempt=attempt,monotonicNs=time.monotonic_ns(),**value))+'\\n');trace.flush()\nclass ObserveProc:\n def __init__(self,proc,owned):self.delegate=proc;self.owned=owned;self.root=proc.root\n def __getattr__(self,name):return getattr(self.delegate,name)\n def detail(self,identity):\n  folder=Path('/proc')/str(identity.pid);row=dict(pid=identity.pid,start=identity.start,parent=identity.parent,session=identity.session,state=identity.state)\n  for field in ['status','cmdline','wchan']:\n   try:row[field]=(folder/field).read_bytes().replace(b'\\0',b' ').decode('utf-8','replace')\n   except OSError:pass\n  try:row['executable']=os.readlink(folder/'exe')\n  except OSError:pass\n  try:row['children']=(folder/'task'/str(identity.pid)/'children').read_text()\n  except OSError:pass\n  signature=(row['parent'],row['state'],row.get('status'),row.get('executable'),row.get('children'))\n  key=(identity.pid,identity.start)\n  if observations.get(key)!=signature:observations[key]=signature;emit(dict(kind='actual-owned-process',process=row))\n def snapshot(self):\n  result=self.delegate.snapshot()\n  for identity in result.values():\n   if identity.session==self.owned.root.pid or identity.pid in self.owned.known:self.detail(identity)\n  return result\n def identity(self,pid):\n  result=self.delegate.identity(pid)\n  if result is not None and (result.session==self.owned.root.pid or pid in self.owned.known):self.detail(result)\n  return result\nclass Observed(original.ColdToolTests):\n def launch(self,*args,**kwargs):\n  owned=super().launch(*args,**kwargs);owned.proc=ObserveProc(owned.proc,owned)\n  emit(dict(kind='launched-original-cold-tool',root=owned.root.pid));return owned\n def finish(self,owned,*args,**kwargs):\n  try:return super().finish(owned,*args,**kwargs)\n  except BaseException:\n   emit(dict(kind='original-finish-assertion-before-outer-cleanup',error=traceback.format_exc(),\n    stdout=self.out.read_text(),stderr=self.err.read_text(),lastKnown=[dict(pid=p.pid,start=p.start,parent=p.parent,session=p.session,state=p.state) for p in owned.discover().values()]))\n   raise\nresult=None\nfor attempt in range(1,201):\n result=unittest.TestResult();Observed('test_interrupts_reap_the_actual_worker_without_a_sample').run(result)\n emit(dict(kind='original-signal-test-result',errors=result.errors,failures=result.failures))\n if result.errors or result.failures:break\ntrace.close()\nrecord=dict(complete=True,diagnosticOnly=True,attempts=attempt,originalSignalAssertionUnchanged=True,\n originalOwnerCleanupNotMovedBeforeAssertion=True,actualProcessReaderResultsUnchanged=True,\n actualSignalFailureReproduced=bool(result.errors or result.failures),allOriginalExceptionsRetained=True,\n originalColdFailureFixedNotClaimed=True,fullV030GoalComplete=False)\n(out/'diagnostic.json').write_text(json.dumps(record,indent=2)+'\\n');print(json.dumps(record))\n",encoding='utf-8')
          run('actual-original-signal-observation',['python3','-B',file,'--source',root,'--tool',build/'cold-start',
           '--worker',build/'capsid-worker','--out',out],300)
          observation=json.loads((out/'diagnostic.json').read_text())
          for name in ['cold-start','capsid-worker']:
           (out/(name+'-ldd.txt')).write_text(subprocess.check_output(['ldd',str(build/name)],text=True))
          with tarfile.open(out/'original-executables.tar.gz','w:gz') as archive:
           for name in ['cold-start','capsid-worker']:archive.add(build/name,arcname=name)
          record.update(complete=True,status='original-cold-signal-observations-retained',actualOriginalSevenTestExitCode=original,
           diagnostic=observation,originalBenchSourceSHA256=sha(root/'bench/cold-start.cc'),originalClientSourceSHA256=sha(root/'src/client.cc'),
           originalTestSourceSHA256=sha(root/'tests/test_benchmark_cold_tool.py'),runtimeIdentityReaderSHA256=sha(root/'bench/measurement_runtime.py'))
          save();print(json.dumps(record,indent=2))
          PY
      - name: Preserve original binaries and observed process identities
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: current-original-cold-signal-diagnostic
          if-no-files-found: error
          path: build-cold-signal/evidence/

name: Qualify private cold descendant ownership against real worker and old implementation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [gcc-asan, clang-asan-ubsan, release]
    env:
      COLD_REVIEW_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 27edca96069d88386950b4dd54c22db0bd0df52e
          submodules: recursive
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install original GCC native component prerequisites
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update --error-on=any
          sudo apt-get install -y ninja-build libssl-dev libc-ares-dev
          for directory in vendor/txiki.js examples/hono-reference examples/itty-router-reference examples/h3-v2-reference examples/elysia-reference; do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          git -C vendor/txiki.js fetch --depth=1 origin refs/tags/v26.6.0:refs/tags/v26.6.0
      - name: Preserve real process ancestry and original cancellation assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import base64,hashlib,json,os,shutil,signal,subprocess,tarfile,time,zlib
          overlays=json.loads(zlib.decompress(base64.b64decode('')))
          root=Path.cwd();build=root/'build-cold-descendant';out=build/'evidence';out.mkdir(parents=True)
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          profile=os.environ['COLD_REVIEW_PROFILE'];gcc=profile=='gcc-asan';release=profile=='release'
          record=dict(complete=False,status='qualifying-private-cold-descendant-proposal',createdUTC=datetime.now(timezone.utc).isoformat(),
           baseSnapshot='63a3cc1a1ed222c6639be01c8fb41e48c29c6479',checkoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           profile=profile,privateProposal=True,rootSourceNotYetChanged=True,wholeProviderInstrumentationNotClaimed=True,
           originalSevenTestAssertionsAnd100SecondBudgetUnchanged=True,steps=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          env=dict(os.environ,ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1',
           UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1',LSAN_OPTIONS='')
          def run(label,args,budget,expected=(0,)):
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen(list(map(str,args)),cwd=root,env=env,stdout=so,stderr=se,start_new_session=True)
            try:code=child.wait(budget)
            except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(10);code=124
           record['steps'].append(dict(label=label,exitCode=code,budgetSeconds=budget,seconds=time.monotonic()-start));save()
           assert code in expected,(label,code)
           return code
          configure=['cmake','-S',root,'-B',build,'-G','Ninja','-DCMAKE_BUILD_TYPE='+('Release' if release else 'Debug'),
           '-DCMAKE_C_COMPILER='+('gcc' if gcc else 'clang'),'-DCMAKE_CXX_COMPILER='+('g++' if gcc else 'clang++'),
           '-DBUILD_TESTING=ON','-DCAPSID_BUILD_HOST=OFF','-DCAPSID_BUILD_WORKER=ON','-DCAPSID_USE_MIMALLOC=OFF',
           '-DCAPSID_SANDBOX_PROFILE='+('production' if release else 'sanitizer')]
          if not release:configure+=['-DCAPSID_ENABLE_ASAN=ON']
          if profile=='clang-asan-ubsan':configure+=['-DCAPSID_ENABLE_UBSAN=ON']
          save();assert sha(root/'bench/cold-start.cc')=='9aca791353c126cb0e015a060244e74bd4ecbe64f82903e00e3ee0dd099484b9'
          run('configure-original',configure,300)
          run('build-original-components',['cmake','--build',build,'--parallel','2','--target','benchmark-cold-start','capsid-worker','--verbose'],1200)
          old=out/'old-cold-start';shutil.copy2(build/'cold-start',old)
          record['oldToolSHA256']=sha(old);record['actualWorkerSHA256']=sha(build/'capsid-worker');save()
          for name,encoded in overlays.items():
           path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(base64.b64decode(encoded))
          record['proposalSHA256']={name:sha(root/name) for name in overlays};save()
          run('freeze-private-proposal',['git','add','--',*overlays],30)
          run('commit-private-proposal',['git','-c','user.name=Capsid validation','-c','user.email=validation@invalid','commit','-qm','Private cold descendant qualification'],30)
          record['actualPrivateProposalCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();save()
          run('configure-proposal',configure,300)
          run('build-proposal-components',['cmake','--build',build,'--parallel','2','--target','benchmark-cold-start','test-cold-worker-descendant','--verbose'],1200)
          test=['python3','-B',root/'tests/test_benchmark_cold_descendants.py','--worker',build/'capsid-worker',
           '--descendant-helper',build/'test-cold-worker-descendant']
          run('old-tool-negative',test+['--tool',old],30,(1,))
          negative=(out/'old-tool-negative.stderr.log').read_text()
          assert 'Ran 4 tests' in negative and 'C-ABI worker was not reaped by the tool' in negative
          assert 'SyntaxError' not in negative and 'FAILED (failures=10)' in negative,negative[-5000:]
          run('original-seven-tests',['python3','-B',root/'tests/test_benchmark_cold_tool.py','--tool',build/'cold-start','--worker',build/'capsid-worker'],100)
          run('actual-worker-descendants',test+['--tool',build/'cold-start'],30)
          rows=[json.loads(line) for line in (out/'actual-worker-descendants.stdout.log').read_text().splitlines()]
          assert len(rows)==10 and all(r['beforeOuterCleanupAssertionPassed'] for r in rows)
          record.update(complete=True,status='private-cold-descendant-proposal-qualified',actualScenarios=rows,
           oldImplementationRejectedBeforeOuterCleanup=True,oldNegativeFailureCount=10,
           currentToolSHA256=sha(build/'cold-start'),testOnlyHelperSHA256=sha(build/'test-cold-worker-descendant'),
           originalClientAndProductionSchedulerNotChanged=True)
          for name in ['compile_commands.json','CMakeCache.txt']:shutil.copy2(build/name,out/name)
          (out/'full-build-commands.txt').write_text(subprocess.check_output(['ninja','-C',str(build),'-t','commands','benchmark-cold-start','capsid-worker','test-cold-worker-descendant'],text=True))
          with tarfile.open(out/'actual-executables.tar.gz','w:gz') as archive:
           for name,path in [('old-cold-start',old),('cold-start',build/'cold-start'),('capsid-worker',build/'capsid-worker'),('test-cold-worker-descendant',build/'test-cold-worker-descendant')]:archive.add(path,arcname=name)
          save();print(json.dumps(record,indent=2))
          PY
      - name: Preserve original binaries and observed process identities
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cold-descendant-${{ matrix.profile }}
          if-no-files-found: error
          path: build-cold-descendant/evidence/

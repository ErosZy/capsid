name: Private actual frame binary replay and diagnostic timing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frame-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact final native prerequisite candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a86b58ed761304a8c1de7f47aa92d5e9967be5fa
      - name: Fetch original failed actual fuzz executables and corpus
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: fuzz-hosted-evidence
          run-id: 43358123744
          repository: ErosZy/capsid
          github-token: ${{ github.token }}
          path: original-fuzz
      - name: Replay exact original binary and profile private copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,re,shutil,subprocess,tarfile,time
          root=Path.cwd();out=root/'frame-replay-profile-observations';out.mkdir()
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          source=root/'tests/fuzz/fuzz_websocket_frames.cc'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='a86b58ed761304a8c1de7f47aa92d5e9967be5fa'
          archive=next((root/'original-fuzz').rglob('fuzz-replay-before.tar.gz'))
          assert sha(archive)=='4cfaa77d0deb22fde4745527039e18f9b36ebd2c59aaf9f6a724da2dcd1f3479'
          original=out/'original';original.mkdir()
          with tarfile.open(archive,'r:gz') as tar:
              for m in tar.getmembers():assert (original/m.name).resolve().is_relative_to(original.resolve())
              tar.extractall(original,filter='data')
          binary=original/'build-fuzz/fuzz-websocket-frames';gold=original/'build-fuzz/fuzz/corpus/websocket_frames'
          assert sha(binary)=='3ca108061f689a2c518c644c2012baf466e72568a08c01f7a265dc93acd6f8a8'
          assert source.read_bytes()==(original/'tests/fuzz/fuzz_websocket_frames.cc').read_bytes()
          gold_hashes={p.name:sha(p) for p in gold.iterdir() if p.is_file()};assert len(gold_hashes)==9
          guards={str(p):sha(p) for p in [source,root/'src/host/ws_codec.cc',root/'src/host/ws_stream.cc',root/'src/protocol.cc',root/'cmake/build_tests.cmake']}
          record=dict(complete=False,diagnosticOnly=True,rootIntegrated=False,createdUTC=datetime.now(timezone.utc).isoformat(),originalRun=43358123744,originalArtifact=14007486183,sourceCommit='a86b58ed761304a8c1de7f47aa92d5e9967be5fa',originalBinarySHA256=sha(binary),originalBeforeArchiveSHA256=sha(archive),immutableOriginalCorpus=gold_hashes,originalBudgetsRetained=True,observations=[],formalPerformancePoints=0,fullV030GoalComplete=False)
          def save():(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          def observe(label,command,timeout=60):
              folder=out/label;folder.mkdir();started=time.monotonic();code=None;timedout=False
              with (folder/'stdout.log').open('xb') as so,(folder/'stderr.log').open('xb') as se:
                  try:code=subprocess.run(command,stdout=so,stderr=se,timeout=timeout).returncode
                  except subprocess.TimeoutExpired:timedout=True
              log=(folder/'stderr.log').read_text(errors='replace')
              row=dict(label=label,command=command,seconds=time.monotonic()-started,exitCode=code,original60SecondBudgetExceeded=timedout,completed10000=bool(re.search(r'Done 10000 runs in ',log)),fatalDiagnostic=bool(re.search(r'ERROR: (?:AddressSanitizer|LeakSanitizer)|runtime error:|WS_INVARIANT|SUMMARY:.*Sanitizer',log)),stderrSHA256=sha(folder/'stderr.log'))
              record['observations'].append(row);save();print(json.dumps(row),flush=True)
              return row
          save()
          for index,seed in enumerate([2645387111,2645387111,2192745715,1]):
              label=f'actual-binary-replay-{index}-seed-{seed}';corpus=out/(label+'-corpus');shutil.copytree(gold,corpus)
              observe(label,[str(binary),str(corpus),'-runs=10000','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1','-seed='+str(seed)])
              assert {p.name:sha(p) for p in gold.iterdir() if p.is_file()}==gold_hashes and sha(binary)==record['originalBinarySHA256']
          timer=r'''
          #include <chrono>
          namespace {
          struct ProfileValue { unsigned long long calls=0, ns=0; };
          ProfileValue profile_values[7];
          struct ProfileTimer {
              unsigned id; std::chrono::steady_clock::time_point start;
              explicit ProfileTimer(unsigned value):id(value),start(std::chrono::steady_clock::now()) {}
              ~ProfileTimer() { ++profile_values[id].calls; profile_values[id].ns += static_cast<unsigned long long>(std::chrono::duration_cast<std::chrono::nanoseconds>(std::chrono::steady_clock::now()-start).count()); }
          };
          struct ProfilePrint {
              ~ProfilePrint() {
                  const char* labels[]={"input","wire","stream","parser","valid","invalid","encode"};
                  for(unsigned i=0;i<7;++i) std::fprintf(stderr,"FRAME_PROFILE label=%s calls=%llu ns=%llu\n",labels[i],profile_values[i].calls,profile_values[i].ns);
              }
          } profile_print;
          }
          '''
          text=source.read_text();anchor='namespace {\nnamespace ws';assert text.count(anchor)==1
          text=text.replace(anchor,timer+'\n'+anchor,1)
          signatures=[
          ('extern "C" int LLVMFuzzerTestOneInput(const uint8_t* data, size_t size) {',0),
          ('Bytes wire(const Packet& p, bool masked, uint32_t key) {',1),
          ('Observed stream(const Bytes& bytes, ws::Role role, uint64_t limit, bool fragmented) {',2),
          ('void parser(const Bytes& bytes, ws::Role role, const std::vector<Packet>* expected, bool chunks) {',3),
          ('void valid(const uint8_t* data, size_t size, bool masked, bool text, bool split) {',4),
          ('void invalid() {',5)]
          for signature,index in signatures:
              assert text.count(signature)==1;text=text.replace(signature,signature+'\n    ProfileTimer profile_timer('+str(index)+');',1)
          anchor='        check(ws::encode(input, masked ? ws::kClient : ws::kServer, masked ? key : 0, &actual));'
          assert text.count(anchor)==1;text=text.replace(anchor,'        { ProfileTimer encode_timer(6);\n'+anchor+'\n        }',1)
          profile_source=out/'profile-only.cc';profile_source.write_text(text)
          command=['clang++','-std=c++11','-g','-O1','-fsanitize=fuzzer,address,undefined','-fno-omit-frame-pointer','-fno-sanitize-recover=all','-Wall','-Wextra','-Wpedantic','-Werror','-I'+str(root/'src'),'-I'+str(root/'include'),str(profile_source),str(root/'src/host/ws_codec.cc'),str(root/'src/host/ws_stream.cc'),str(root/'src/protocol.cc'),'-o',str(out/'profile-only')]
          compiled=subprocess.run(command,capture_output=True,timeout=180)
          (out/'profile-build.stdout.log').write_bytes(compiled.stdout);(out/'profile-build.stderr.log').write_bytes(compiled.stderr)
          assert compiled.returncode==0,compiled.stderr[-2000:]
          record['profileBuild']=dict(command=command,sourceSHA256=sha(profile_source),binarySHA256=sha(out/'profile-only'),compiler=subprocess.check_output(['clang++','--version'],text=True));save()
          vectors=out/'deterministic-vectors';vectors.mkdir();value=0x42f8d18a
          for index in range(384):
              size=[0,1,2,125,126,127,1024,4095,4096,4097,16384,32768,65535,65536][index%14];data=bytearray()
              for offset in range(size):value=(1664525*value+1013904223)&0xffffffff;data.append(value>>24)
              (vectors/f'{index:04d}').write_bytes(data)
          for p in gold.iterdir():shutil.copy2(p,vectors/('gold-'+p.name))
          for label,corpus in [('profile-original393',vectors),('profile-actual-failed-corpus',out/'actual-binary-replay-0-seed-2645387111-corpus')]:
              row=observe(label,[str(out/'profile-only'),str(corpus),'-runs=0','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1'])
              assert row['exitCode']==0 and not row['fatalDiagnostic']
          assert all(sha(Path(p))==h for p,h in guards.items())
          record.update(complete=True,status='actual-binary-fixed-seed-replays-and-private-timing-profile-complete',allRootInputsUnchanged=True,originalFailuresNeverRelabelled=True,profileBuildNotAnAcceptanceGate=True);save()
          PY
      - name: Archive original replays and diagnostic sources
        if: always()
        run: |
          tar -czf frame-replay-profile-observations.tar.gz frame-replay-profile-observations
          sha256sum frame-replay-profile-observations.tar.gz > frame-replay-profile-observations.tar.gz.sha256
      - name: Save private frame diagnosis
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: frame-replay-profile-observations
          if-no-files-found: error
          path: |
            frame-replay-profile-observations.tar.gz
            frame-replay-profile-observations.tar.gz.sha256

{
  "name": "Private unchanged-oracle miniz Debug optimization diagnosis",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "miniz-o1-proposal": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "name": "tsan",
              "cmake_flag": "CAPSID_ENABLE_TSAN",
              "compiler": "clang",
              "build_host": 1,
              "ctest_parallel": 1,
              "ctest_exclude": "^(wpt_conformance_not_configured|worker_package_.*|websocket_managed_(replacement-recursion|reclamation-idle))$"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "be19fc0848c9b9640e618743a9c45dc26894a31a",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.22.x"
          }
        },
        {
          "name": "Install build and locked JavaScript dependencies",
          "run": "set -euo pipefail\n# Match the Release dependency transport and reject stale indexes.\nsudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\n# libclang-rt-dev supplies the Clang sanitizer runtimes (TSan\n# included, arch-suffixed) that the clang-based tsan matrix entry\n# links against.\nsudo apt-get \"${apt_network[@]}\" install -y ninja-build libboost-system-dev libc-ares-dev libclang-rt-dev openssl python3-venv linux-tools-generic\n/usr/bin/openssl version\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n"
        },
        {
          "name": "Require actual Linux perf counters for evidence controls",
          "run": "python3 -B tools/setup-hosted-perf.py"
        },
        {
          "name": "Install locked independent clients and reference for sanitizers",
          "run": "set -euo pipefail\n/usr/bin/python3.12 tools/setup-ws-interop-python.py \"${RUNNER_TEMP}/capsid-ws-python\"\nprintf 'CAPSID_WS_INTEROP_PYTHON=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/bin/python\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/node-ws\" >> \"${GITHUB_ENV}\"\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Build OpenSSL 3.5 for sanitizer targets",
          "run": "set -euo pipefail\ncase \"${{ matrix.name }}\" in\n  asan) sanitizer=address ;;\n  ubsan) sanitizer=undefined ;;\n  tsan) sanitizer=thread ;;\n  *) echo \"Unknown sanitizer matrix entry\" >&2; exit 1 ;;\nesac\ncompiler=cc\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler=clang\nfi\nsanitizer_flags=\"-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all\"\n# Built in the runner temp dir: extracting the tarball inside the\n# workspace dirties the checkout and trips the build-identity\n# clean-worktree gate.\ncd \"${RUNNER_TEMP}\"\necho \"a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz\" > openssl.sha256\ncurl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz\nsha256sum -c openssl.sha256\ntar xzf openssl-3.5.7.tar.gz\ncd openssl-3.5.7\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider openssl --source \"$PWD\" | tee \"${evidence}/openssl-source.json\"\n# Match the Capsid compiler/runtime and instrument the provider's C\n# implementation, including paths normally implemented in assembly.\nCC=\"${compiler}\" CFLAGS=\"${sanitizer_flags}\" CXXFLAGS=\"${sanitizer_flags}\" LDFLAGS=\"-fsanitize=${sanitizer}\" \\\n  ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm\nmake -j2\nsudo make install_sw\n"
        },
        {
          "name": "Build c-ares 1.34.5 for sanitizer targets",
          "run": "set -euo pipefail\ncase \"${{ matrix.name }}\" in\n  asan) sanitizer=address ;;\n  ubsan) sanitizer=undefined ;;\n  tsan) sanitizer=thread ;;\n  *) echo \"Unknown sanitizer matrix entry\" >&2; exit 1 ;;\nesac\ncompiler=cc\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler=clang\nfi\nsanitizer_flags=\"-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all\"\ncd \"${RUNNER_TEMP}\"\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\ncurl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013\necho \"cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz\" | sha256sum -c -\ntar xzf capsid-cares.tar.gz\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider cares --source \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" | tee \"${evidence}/cares-source.json\"\ncmake -S \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" -B \"${RUNNER_TEMP}/capsid-cares-build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -DCMAKE_C_COMPILER=\"${compiler}\" \\\n  -DCMAKE_C_FLAGS=\"${sanitizer_flags}\" \\\n  -DCMAKE_C_FLAGS_DEBUG=\"-g -O1\" \\\n  -DCMAKE_EXE_LINKER_FLAGS=\"-fsanitize=${sanitizer}\" \\\n  -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \\\n  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \\\n  -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \\\n  -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF\ncmake --build \"${RUNNER_TEMP}/capsid-cares-build\" --parallel 2 --verbose\nsudo cmake --install \"${RUNNER_TEMP}/capsid-cares-build\"\ncp \"${RUNNER_TEMP}/capsid-cares-build/compile_commands.json\" \"${evidence}/cares-compile-commands.json\"\n"
        },
        {
          "name": "Configure ${{ matrix.name }}",
          "run": "compiler_args=()\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler_args=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)\nfi\nhost_args=(-DCMAKE_PREFIX_PATH=/opt/openssl35 -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include)\nif [ \"${{ matrix.build_host }}\" = \"1\" ]; then\n  host_args+=(-DCAPSID_BUILD_HOST=ON)\nfi\ncmake -S . -B \"build-${{ matrix.name }}\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -D${{ matrix.cmake_flag }}=ON \\\n  -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \\\n  -DCAPSID_SANDBOX_PROFILE=sanitizer \\\n  -DCAPSID_USE_MIMALLOC=OFF \\\n  -DCAPSID_BUILD_BENCHMARKS=ON \\\n  \"${compiler_args[@]}\" \"${host_args[@]}\"\n"
        },
        {
          "name": "Build ${{ matrix.name }}",
          "run": "cmake --build build-tsan --parallel 2 --target capsid-worker test-native-fetch-response-limits\n"
        },
        {
          "name": "Preserve complete instrumented build and registration identities",
          "run": "ninja -C \"build-${{ matrix.name }}\" -t commands > \"build-${{ matrix.name }}/full-build-commands.txt\"\nctest --test-dir \"build-${{ matrix.name }}\" --show-only=json-v1 > \"build-${{ matrix.name }}/full-registration.json\"\nctest --test-dir \"build-${{ matrix.name }}\" --show-only=json-v1 -E '${{ matrix.ctest_exclude }}' > \"build-${{ matrix.name }}/selected-registration.json\"\n"
        },
        {
          "name": "Compare eight complete original oracle executions without modifying baseline inputs",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport hashlib,json,os,re,shlex,shutil,subprocess,sys,time,traceback\nroot=Path.cwd();build=root/'build-tsan';out=build/'miniz-o1-proposal';out.mkdir(exist_ok=False)\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\ncommit='be19fc0848c9b9640e618743a9c45dc26894a31a'\nentries=json.loads((build/'compile_commands.json').read_text())\nentry=next(e for e in entries if e['file'].endswith('/deps/miniz/miniz.c'))\noriginal=shlex.split(entry['command']);assert '-fsanitize=thread' in original and '-fno-sanitize-recover=all' in original\nassert not any(re.fullmatch(r'-O[0-3sgz]',v) for v in original),'preserve the actual unoptimized baseline'\nregistration=json.loads(subprocess.check_output(['ctest','--test-dir',build,'--show-only=json-v1']))\ntest=next(t for t in registration['tests'] if t['name']=='native_fetch_large_gzip');command=test['command']\nworker=Path(command[command.index('--worker')+1]);helper=Path(command[command.index('--helper')+1])\ninputs={str(p):sha(p) for p in (worker,helper,Path(entry['file']),root/'tests/test_native_fetch_large_gzip.mjs',root/'tests/fixtures/native-fetch-gzip-members.mjs')}\nr=dict(complete=False,status='private-miniz-o1-equivalence-and-cpu-proposal',productCheckout=commit,inputs=inputs,originalCommand=original,steps=[],runs=[],\n allFrozenInputsAndOriginalBinariesUnmodified=True,onlyPrivateMinizObjectAddsO1=True,fullFatalThreadInstrumentationRetained=True,\n originalFiveSecondEventAndTwelveSecondRunnerDeadlinesRetained=True,fixtureAndAllAssertionsUnchanged=True,\n notIntegratedOrProductQualification=True,formalPerformancePoints=0,fullV030GoalComplete=False)\ndef save():(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\ndef guard():\n assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==commit\n assert not subprocess.check_output(['git','status','--porcelain']).strip()\n assert all(sha(p)==h for p,h in inputs.items())\ndef run(label,args,cwd=root,env=None):\n guard();start=time.monotonic()\n with (out/(label+'.stdout.log')).open('xb') as so,(out/(label+'.stderr.log')).open('xb') as se:\n  p=subprocess.run(list(map(str,args)),cwd=cwd,env=env,stdout=so,stderr=se)\n row=dict(label=label,command=list(map(str,args)),exitCode=p.returncode,seconds=time.monotonic()-start,\n  stdoutSHA256=sha(out/(label+'.stdout.log')),stderrSHA256=sha(out/(label+'.stderr.log')))\n r['steps'].append(row);save();guard();return row\ntry:\n save();guard()\n obj=out/'miniz-o1.o';cmd=list(original);cmd[cmd.index('-o')+1]=str(obj);cmd.append('-O1')\n if '-MF' in cmd:cmd[cmd.index('-MF')+1]=str(out/'miniz-o1.d')\n assert run('compile-private-miniz-o1',cmd,Path(entry['directory']))['exitCode']==0\n cache=dict(line.split('=',1) for line in (build/'CMakeCache.txt').read_text().splitlines() if '=' in line and not line.startswith(('#','//')))\n ar=cache['CMAKE_AR:FILEPATH'];ranlib=cache['CMAKE_RANLIB:FILEPATH'];library=out/'libminiz-o1.a'\n assert run('archive-private-miniz',[ar,'qc',library,obj])['exitCode']==0\n assert run('index-private-miniz',[ranlib,library])['exitCode']==0\n lines=subprocess.check_output(['ninja','-C',build,'-t','commands','capsid-worker'],text=True).splitlines()\n text=next(s for s in reversed(lines) if ' -o capsid-worker ' in s)\n link=shlex.split(text)\n if link[:2]==[':','&&']:link=link[2:]\n if link[-2:]==['&&',':']:link=link[:-2]\n assert not set(link)&{'&&',';','|'}\n old=[v for v in link if v.endswith('/libminiz.a')];assert len(old)==1\n candidate=out/'capsid-worker-miniz-o1';link[link.index('-o')+1]=str(candidate);link[link.index(old[0])]=str(library)\n link=[(v.split('=',1)[0]+'='+str(out/'private-worker-link.d')) if v.startswith(('-Wl,--dependency-file=','--dependency-file=')) else v for v in link]\n assert run('link-private-worker',link,build)['exitCode']==0\n r.update(originalWorkerSHA256=sha(worker),privateWorkerSHA256=sha(candidate),privateMinizObjectSHA256=sha(obj));save()\n for index,variant in enumerate('ABBAABBA'):\n  label='abba-'+str(index)+'-'+variant;reports=out/(label+'-reports');reports.mkdir()\n  env=dict(os.environ,PYTHONDONTWRITEBYTECODE='1',CAPSID_WS_REPORT_DIR=str(reports),CAPSID_WS_RUN_ID=label)\n  args=list(command);args[args.index('--worker')+1]=str(worker if variant=='A' else candidate)\n  row=run(label,args,env=env);r['runs'].append(dict(variant=variant,**row));save();assert row['exitCode']==0,(label,row['exitCode'])\n a=[x['seconds'] for x in r['runs'] if x['variant']=='A'];b=[x['seconds'] for x in r['runs'] if x['variant']=='B']\n r.update(complete=True,status='private-instrumented-miniz-o1-abba-passed',baselineSeconds=a,proposalSeconds=b,\n  wallRatio=sum(b)/sum(a),allEightFullOracleExecutionsPassed=True,originalWholeSuiteStillRequired=True)\n guard();save();print(json.dumps({k:r[k] for k in ['complete','baselineSeconds','proposalSeconds','wallRatio','notIntegratedOrProductQualification']}))\nexcept BaseException:\n r.update(status='private-proposal-failed',error=traceback.format_exc());save();raise\n\nPY\n"
        },
        {
          "name": "Preserve actual ABBA observations including any original failure",
          "if": "always()",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport tarfile,hashlib,json\nroot=Path.cwd();build=root/'build-tsan';build.mkdir(exist_ok=True)\narchive=build/'miniz-o1-proposal.tar.gz';assert not archive.exists()\nselected=[root/p for p in ['build-tsan/miniz-o1-proposal','build-tsan/compile_commands.json','build-tsan/generated/build-info.txt','build-tsan/full-registration.json'] if (root/p).exists()]\nwith tarfile.open(archive,'x:gz',dereference=False) as t:\n for p in selected:t.add(p,arcname=p.relative_to(root).as_posix())\nr=dict(archiveSHA256=hashlib.sha256(archive.read_bytes()).hexdigest(),targetedTargetsOnly=True,originalBaselineObjectsSourceAndExecutablesNotModified=True,notProductQualification=True,fullV030GoalComplete=False)\n(archive.with_name(archive.name+'.sha256')).write_text(r['archiveSHA256']+'  '+archive.name+'\\n')\n(build/'miniz-o1-proposal-archive.json').write_text(json.dumps(r,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Save private miniz proposal evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "private-miniz-o1-proposal-evidence",
            "path": "build-tsan/miniz-o1-proposal.tar.gz\nbuild-tsan/miniz-o1-proposal.tar.gz.sha256\nbuild-tsan/miniz-o1-proposal-archive.json",
            "if-no-files-found": "error"
          }
        }
      ],
      "name": "Private fatal-TSan miniz Debug O0 versus O1 ABBA (not acceptance)"
    }
  }
}

{
  "name": "Windows original-budget complete evidence suite isolated-process diagnostic ABBA",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "windows-suite-process-proposal": {
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "77c8c7aa853dafaaf4689c54e4d4219764ae64f9",
            "submodules": "recursive",
            "fetch-tags": true,
            "persist-credentials": false
          }
        },
        {
          "name": "Run every original assertion in serial-isolated-isolated-serial order under the unchanged90second whole-file deadline",
          "shell": "pwsh",
          "run": "New-Item -ItemType Directory -Force -Path build-suite-controller | Out-Null\n@'\nfrom pathlib import Path\nimport ast,base64,hashlib,json,os,re,shutil,subprocess,sys,time\nroot=Path.cwd();out=root/'build-suite-process-proposal';out.mkdir(exist_ok=False);assert sys.platform=='win32' and sys.version_info[:3]==(3,12,3)\noriginal=root/'tests/test_perf_evidence.py';proposed=Path(os.environ['RUNNER_TEMP'])/'capsid-isolated-suite-proposal/tests/test_perf_evidence.py';proposed.parent.mkdir(parents=True,exist_ok=False);proposed.write_bytes(base64.b64decode(''));shutil.copytree(root/'tests/helpers',proposed.parent/'helpers');sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\ndef classes(p):return [ast.dump(n,include_attributes=False) for n in ast.parse(p.read_text(encoding='utf-8')).body if isinstance(n,ast.ClassDef)]\nassert classes(original)==classes(proposed);original_sha=sha(original)\nr=dict(complete=False,sourceCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),runtimeAndOriginalSourceNeverModified=True,allOriginalTestAndFixtureAstsIdentical=True,pythonExecutable=sys.executable,pythonVersion=sys.version,originalSharedDeadlineSeconds=90,attempts=[],notQualification=True,formalPerformancePoints=0,fullV030GoalComplete=False)\ndef save():(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\ntry:\n for index,variant in enumerate(['original-A','isolated-B','isolated-B','original-A'],1):\n  file=original if variant=='original-A' else proposed;command=[sys.executable,'-B',str(file),'--collector',str(root/'bench/collect-perf-point.py')];start=time.monotonic();timed=False\n  try:p=subprocess.run(command,capture_output=True,timeout=90);code=p.returncode;stdout=p.stdout;stderr=p.stderr\n  except subprocess.TimeoutExpired as error:timed=True;code=None;stdout=error.stdout or b'';stderr=error.stderr or b''\n  label='attempt-'+str(index);(out/(label+'.stdout.log')).write_bytes(stdout);(out/(label+'.stderr.log')).write_bytes(stderr)\n  passed=not timed and code==0 and re.search(rb'Ran 32 tests in ',stderr) is not None and re.search(rb'^OK\\s*$',stderr,re.M) is not None and b'skipped=' not in stderr\n  row=dict(index=index,variant=variant,seconds=time.monotonic()-start,exitCode=code,timedOut=timed,complete32OriginalTestsPassed=passed,command=command,stdoutSHA256=sha(out/(label+'.stdout.log')),stderrSHA256=sha(out/(label+'.stderr.log')));r['attempts'].append(row);save();print(json.dumps(row),flush=True)\n assert sha(original)==original_sha and all(a['complete32OriginalTestsPassed'] for a in r['attempts'] if a['variant']=='isolated-B')\n r.update(complete=True,originalFailureAndPassingAttemptsAllRetained=True,original90SecondBudgetAndAll32TestsRetained=True,extraPrivateProcessFixturesExplicit=True);save()\nfinally:\n target=root/'windows-suite-process-proposal-evidence.tar.gz'\n import tarfile\n with tarfile.open(target,'x:gz') as tar:tar.add(out,arcname=out.name)\n target.with_name(target.name+'.sha256').write_text(sha(target)+'  '+target.name+'\\n')\n'@ | Set-Content -LiteralPath build-suite-controller/controller.py -Encoding utf8\n& 'C:/hostedtoolcache/windows/Python/3.12.3/x64/python3.exe' -B build-suite-controller/controller.py\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
        },
        {
          "name": "Keep every original timeout and exact child result; collection is not whole-product qualification",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "if": "always()",
          "with": {
            "name": "windows-suite-process-proposal-evidence",
            "path": "windows-suite-process-proposal-evidence.tar.gz\nwindows-suite-process-proposal-evidence.tar.gz.sha256\nbuild-suite-controller/controller.py",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

name: Native macOS recovery observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-observations:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d9fd796bd86de6c8aa7826606ebd86ed968bd493
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Observe native failed spawn resources
        run: |
          set -euo pipefail
          mkdir build-spawn-observation
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='842a27ea829a17251d06c9c4e4bdeabf96ca43b2c4e52976e6601c21a87926bf'
          Path('build-spawn-observation/native.cc').write_bytes(raw)
          PY
          xcrun clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror build-spawn-observation/native.cc -lproc -o build-spawn-observation/native
          build-spawn-observation/native | tee build-spawn-observation/native.jsonl
      - name: Observe original density control deadline and thread stacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,signal,subprocess,sys,time
          out=Path('build-spawn-observation')
          childcode="import faulthandler,runpy,shutil,signal,sys;faulthandler.register(signal.SIGUSR1,all_threads=True);sys.argv=['tests/test_benchmark_density_control.py','--node',shutil.which('node'),'-v'];runpy.run_path(sys.argv[0],run_name='__main__')"
          with (out/'density.stdout.log').open('wb') as so,(out/'density.stderr.log').open('wb') as se:
              child=subprocess.Popen([sys.executable,'-u','-c',childcode],stdout=so,stderr=se,start_new_session=True)
              try:code=child.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  os.kill(child.pid,signal.SIGUSR1);time.sleep(.2)
                  os.killpg(child.pid,signal.SIGTERM);child.wait(timeout=5);code=124
          (out/'density-exit.txt').write_text(str(code)+'\n')
          print('Original density control observation exit:',code)
          PY
      - name: Preserve exact diagnostic source and observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-spawn-observations
          if-no-files-found: error
          path: build-spawn-observation/

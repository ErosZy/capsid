name: Verify complete Linux validator matrices with actual reference archives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-reference-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fab182f17cbce7bdc85e66e6f31ddfb2897362a3
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Execute all original affected contracts and new managed omission controls
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          source=Path.cwd();directory=source/'evidence'
          plans=json.loads('[{"name": "native_retired_ownership_contract_controls", "args": ["--test", "--test-reporter=tap", "SOURCE_ROOT/tests/test_native_retired_ownership_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_owner_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_owner_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_async_callback_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_async_callback_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_cross_context_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_cross_context_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_fetch_resource_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_resource_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_ordinary_fetch_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_ordinary_fetch_contract.mjs"], "timeout": 120.0, "role": "control"}, {"name": "workerd_http_codec_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_http_codec_contract.mjs"], "timeout": 120.0, "role": "control"}, {"name": "workerd_fetch_upgrade_lifetime_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_upgrade_lifetime_contract.mjs"], "timeout": 15.0, "role": "control"}, {"name": "workerd_fetch_proxy_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_proxy_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_fetch_boundary_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_boundary_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_fetch_transition_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_transition_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_fetch_arguments_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_arguments_contract.mjs"], "timeout": 60.0, "role": "control"}, {"name": "workerd_fetch_reader_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_reader_contract.mjs"], "timeout": 60.0, "role": "control"}, {"name": "workerd_reader_intrinsic_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_reader_intrinsic_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_native_reader_lifecycle_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_native_reader_lifecycle_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_reader_scope_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_reader_scope_contract.mjs"], "timeout": 60.0, "role": "control"}, {"name": "workerd_standard_reader_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_standard_reader_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_crypto_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_crypto_contract.mjs"], "timeout": 10.0, "role": "control"}]');commands=[]
          for plan in plans:
              args=['node',*[a.replace('SOURCE_ROOT/',str(source)+'/') for a in plan['args']]]
              commands.append('add_test('+json.dumps(plan['name'])+' '+' '.join(map(json.dumps,args))+')')
              commands.append('set_tests_properties('+json.dumps(plan['name'])+' PROPERTIES TIMEOUT '+str(plan['timeout'])+')')
          (directory/'selected-original-control-registration.json').write_text(json.dumps(plans,indent=2)+'\n')
          (directory/'CTestTestfile.cmake').write_text('\n'.join(commands)+'\n')
          subprocess.run(['ctest','--test-dir',str(directory),'--no-tests=error','--parallel','2','--output-on-failure','--output-junit',str(directory/'junit.xml')],check=True)
          PY
      - name: Save all exact original control transcripts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: complete-reference-backend-controls
          if-no-files-found: error
          path: evidence/

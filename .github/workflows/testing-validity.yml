name: Testing validity macOS log component

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-validity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-log-stop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5cbce430739cd3433d5c318d9650cdc5d4d25440
          fetch-depth: 2

      - name: Prepare real component project with exact ordinary test properties
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path.cwd();out=root/'build-log-native';out.mkdir()
          text=(root/'cmake/build_tests.cmake').read_text()
          start=text.index('        foreach(CAPSID_STRUCTURED_LOG_TEST_ID')
          end=text.index('        endforeach()',start)+len('        endforeach()')
          block=text[start:end]
          assert 'PROPERTIES TIMEOUT 30' in block
          assert all(n in block for n in ['structured_log_flush_idle_writer','structured_log_flush_after_final_event','structured_log_concurrent_flush_joins_writer'])
          source=out/'source';source.mkdir()
          project='cmake_minimum_required(VERSION 3.20)\nproject(LogWriterNativeQualification LANGUAGES CXX)\nenable_testing()\n'
          project+='add_executable(test-host-structured-log "'+str(root/'src/host/structured_log.cc')+'" "'+str(root/'tests/test_host_structured_log.cc')+'")\n'
          project+='target_include_directories(test-host-structured-log PRIVATE "'+str(root/'src')+'")\n'
          project+='set_target_properties(test-host-structured-log PROPERTIES CXX_STANDARD 20 CXX_STANDARD_REQUIRED ON CXX_EXTENSIONS OFF)\n'
          project+='target_compile_options(test-host-structured-log PRIVATE -Wall -Wextra -Wpedantic -Werror)\n'+block+'\n'
          (source/'CMakeLists.txt').write_text(project)
          paths=['src/host/structured_log.cc','src/host/structured_log.h','tests/test_host_structured_log.cc','cmake/build_tests.cmake']
          hashes={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}
          (out/'source-inputs.json').write_text(json.dumps(hashes,indent=2)+'\n')
          original=subprocess.check_output(['git','show','bb336d9b7335e6c217baeeaab42151e88b455a7e:src/host/structured_log.cc'])
          (out/'original-log.cc').write_bytes(original)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='5cbce430739cd3433d5c318d9650cdc5d4d25440'
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          PY

      - name: Build actual current component and original counterfactual
        run: |
          set -euo pipefail
          xcrun clang++ --version > build-log-native/compiler-version.txt
          cmake -S build-log-native/source -B build-log-native/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)"
          cmake --build build-log-native/build --parallel 2
          xcrun clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Isrc build-log-native/original-log.cc tests/test_host_structured_log.cc -pthread -o build-log-native/original-log
          ctest --test-dir build-log-native/build --show-only=json-v1 > build-log-native/registration.json

      - name: Execute every real component case with unchanged budgets
        run: |
          ctest --test-dir build-log-native/build --no-tests=error --parallel 1 --output-on-failure --output-junit component-junit.xml

      - name: Reject the real original concurrent-flush behavior and bind raw results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,platform,subprocess,xml.etree.ElementTree as X
          root=Path.cwd();out=root/'build-log-native'
          expected=['structured_log_emits_single_line_json','structured_log_app_lane_drops_and_counts','structured_log_control_lane_never_drops','structured_log_control_precedes_app_backlog','structured_log_app_lane_is_fifo','structured_log_flush_idle_writer','structured_log_flush_after_final_event','structured_log_concurrent_flush_joins_writer']
          registration=json.loads((out/'registration.json').read_text())
          assert sorted(t['name'] for t in registration['tests'])==sorted(expected)
          for t in registration['tests']:
            props={p['name']:p['value'] for p in t['properties']}
            assert props['TIMEOUT']==30 and not props.get('DISABLED') and not props.get('WILL_FAIL') and 'SKIP_RETURN_CODE' not in props
          cases=list(X.parse(out/'build/component-junit.xml').iter('testcase'))
          assert len(cases)==8 and sorted(c.get('name') for c in cases)==sorted(expected)
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          with (out/'original-counter.stdout.log').open('xb') as so,(out/'original-counter.stderr.log').open('xb') as se:
            p=subprocess.run([str(out/'original-log'),expected[-1]],stdout=so,stderr=se,timeout=30)
          assert p.returncode==1 and 'every flush must wait for the writer' in (out/'original-counter.stderr.log').read_text()
          hashes=json.loads((out/'source-inputs.json').read_text())
          assert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==h for p,h in hashes.items())
          result=dict(complete=True,snapshotCommit='5cbce430739cd3433d5c318d9650cdc5d4d25440',platform=platform.platform(),machine=platform.machine(),selected=8,passed=8,failed=0,skipped=0,originalConcurrentFlushRejected=True,sourceSHA256=hashes,componentOnly=True,wholeMacosMatrixPassed=False)
          (out/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY

      - name: Save original component evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-log-stop-evidence
          if-no-files-found: error
          path: |
            build-log-native/result.json
            build-log-native/source-inputs.json
            build-log-native/compiler-version.txt
            build-log-native/registration.json
            build-log-native/build/component-junit.xml
            build-log-native/build/Testing/Temporary/LastTest.log
            build-log-native/original-counter.stdout.log
            build-log-native/original-counter.stderr.log

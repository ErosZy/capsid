name: Windows independent failed process controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-process-control:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Set up native compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Compile independent operating system witness
        shell: pwsh
        run: |
          @'
          #include <windows.h>
          #include <cstdio>
          #include <string>
          
          DWORD handles() {
              DWORD value = 0;
              if (!GetProcessHandleCount(GetCurrentProcess(), &value)) ExitProcess(20);
              return value;
          }
          void missing(const std::wstring& path, bool ansi, unsigned iteration) {
              const DWORD before = handles();
              PROCESS_INFORMATION process = {};
              BOOL created;
              if (ansi) {
                  const int size = WideCharToMultiByte(CP_ACP, 0, path.c_str(), -1, nullptr, 0, nullptr, nullptr);
                  if (size <= 0) ExitProcess(27);
                  std::string narrow(static_cast<size_t>(size), char(0));
                  if (!WideCharToMultiByte(CP_ACP, 0, path.c_str(), -1, &narrow[0], size, nullptr, nullptr)) ExitProcess(28);
                  STARTUPINFOA startup = {}; startup.cb = sizeof(startup);
                  created = CreateProcessA(narrow.c_str(), nullptr, nullptr, nullptr, FALSE,
                                           CREATE_NO_WINDOW, nullptr, nullptr, &startup, &process);
              } else {
                  STARTUPINFOW startup = {}; startup.cb = sizeof(startup);
                  created = CreateProcessW(path.c_str(), nullptr, nullptr, nullptr, FALSE,
                                           CREATE_NO_WINDOW, nullptr, nullptr, &startup, &process);
              }
              const DWORD error = GetLastError();
              if (created || process.hProcess || process.hThread || (error != ERROR_FILE_NOT_FOUND && error != ERROR_PATH_NOT_FOUND)) ExitProcess(21);
              std::printf("NATIVE_MISSING api=%s iteration=%u before=%lu after=%lu error=%lu\n", ansi ? "A" : "W", iteration,
                          static_cast<unsigned long>(before), static_cast<unsigned long>(handles()), static_cast<unsigned long>(error));
          }
          void valid(const std::wstring& path, unsigned iteration) {
              const DWORD before = handles();
              STARTUPINFOW startup = {}; startup.cb = sizeof(startup);
              PROCESS_INFORMATION process = {};
              std::wstring command = L"\"" + path + L"\" /d /c exit 0";
              if (!CreateProcessW(path.c_str(), &command[0], nullptr, nullptr, FALSE, CREATE_NO_WINDOW, nullptr, nullptr, &startup, &process)) ExitProcess(22);
              if (WaitForSingleObject(process.hProcess, 5000) != WAIT_OBJECT_0) ExitProcess(23);
              DWORD code = STILL_ACTIVE;
              const BOOL exited = GetExitCodeProcess(process.hProcess, &code);
              const BOOL thread_closed = CloseHandle(process.hThread), process_closed = CloseHandle(process.hProcess);
              if (!exited || code || !thread_closed || !process_closed) ExitProcess(24);
              std::printf("NATIVE_VALID iteration=%u before=%lu after=%lu\n", iteration,
                          static_cast<unsigned long>(before), static_cast<unsigned long>(handles()));
          }
          int main(int argc, char** argv) {
              if (argc != 2) return 25;
              wchar_t system[MAX_PATH];
              const UINT size = GetSystemDirectoryW(system, MAX_PATH);
              if (!size || size >= MAX_PATH) return 26;
              const std::wstring command = std::wstring(system) + L"\\cmd.exe";
              const std::wstring nonexistent = std::wstring(system) + L"\\capsid-private-no-such-directory\\missing.exe";
              const std::string order = argv[1];
              if (order == "valid-first") for (unsigned i = 0; i < 3; ++i) valid(command, i);
              if (order == "wide-first") for (unsigned i = 0; i < 5; ++i) missing(nonexistent, false, i);
              for (unsigned i = 0; i < 5; ++i) missing(nonexistent, true, i);
              if (order != "wide-first") for (unsigned i = 0; i < 5; ++i) missing(nonexistent, false, i);
              if (order != "valid-first") for (unsigned i = 0; i < 3; ++i) valid(command, i);
              return 0;
          }
          '@ | Set-Content -LiteralPath control.cc -Encoding utf8
          cl.exe /nologo /W4 /WX /EHsc control.cc /Fe:control.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe three independent API initialization orders
        shell: pwsh
        run: |
          foreach ($order in @('valid-first','wide-first','ansi-first')) {
            & ./control.exe $order | Set-Content -LiteralPath ($order + '.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain exact native controls
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-failed-process-api-controls
          path: |
            control.cc
            control.exe
            *.log

name: Complete byte-preserving checkout and density fixture validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-validity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 913055de94cb61b8d95976b4a0b5011d623a452f
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Install Clang and Ninja
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev

      - name: Configure fuzz harnesses
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCAPSID_BUILD_WORKER=OFF \
            -DCAPSID_BUILD_FUZZERS=ON \
            -DCAPSID_USE_MIMALLOC=OFF

      - name: Build fuzz harnesses
        run: cmake --build build-fuzz --parallel 2

      - name: Preserve complete fuzz build and registration identities
        run: |
          ninja -C build-fuzz -t commands > build-fuzz/full-build-commands.txt
          ctest --test-dir build-fuzz --show-only=json-v1 -L fuzz > build-fuzz/full-registration.json

      - name: Retain original fuzz binaries and immutable starting corpus
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,tarfile
          build=Path('build-fuzz');registration=json.loads((build/'full-registration.json').read_text())
          files=[Path('tests/fuzz/fuzz_websocket_frames.cc'),build/'fuzz/corpus']
          files += sorted({Path(test['command'][0]) for test in registration['tests'] if Path(test['command'][0]).is_file() and Path(test['command'][0]).resolve().is_relative_to(Path.cwd())})
          target=build/'fuzz-replay-before.tar.gz'
          with tarfile.open(target,'w:gz',dereference=False) as tar:
              for path in files:
                  if path.exists():tar.add(path,arcname=str(path.resolve().relative_to(Path.cwd())),recursive=True)
          target.with_name(target.name+'.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\n')
          PY

      - name: Run bounded corpus gates
        run: |
          ctest --test-dir build-fuzz \
            --no-tests=error \
            --output-on-failure \
            --output-junit fuzz-junit.xml \
            -L fuzz

      - name: Retain actual fuzz binaries mutated corpus and crash inputs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,tarfile
          build=Path('build-fuzz');registration=json.loads((build/'full-registration.json').read_text())
          files=[Path('tests/fuzz/fuzz_websocket_frames.cc'),build/'fuzz/corpus']
          files += sorted({Path(test['command'][0]) for test in registration['tests'] if Path(test['command'][0]).is_file() and Path(test['command'][0]).resolve().is_relative_to(Path.cwd())})
          target=build/'fuzz-replay-after.tar.gz'
          with tarfile.open(target,'w:gz',dereference=False) as tar:
              for path in files:
                  if path.exists():tar.add(path,arcname=str(path.resolve().relative_to(Path.cwd())),recursive=True)
          target.with_name(target.name+'.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\n')
          PY

      - name: Save fuzz evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-hosted-evidence
          if-no-files-found: error
          path: |
            build-fuzz/fuzz-junit.xml
            build-fuzz/fuzz-replay-*.tar.gz
            build-fuzz/fuzz-replay-*.tar.gz.sha256
            build-fuzz/Testing/Temporary/LastTest.log
            build-fuzz/CMakeCache.txt
            build-fuzz/compile_commands.json
            build-fuzz/full-build-commands.txt
            build-fuzz/full-registration.json
            build-fuzz/generated/build-info.txt

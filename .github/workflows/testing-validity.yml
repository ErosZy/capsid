name: Original port ownership and PSS isolation controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-original-case-observations:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5292dafcdd1adba8b32827c392e30c52c9243650
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Install and verify locked workerd reference
        run: |
          set -euo pipefail
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Hosted probes verified this Ubuntu mirror while the ubuntu.com
          # domains failed DNS. Preserve suites, components and Signed-By.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y ninja-build libboost-system-dev libc-ares-dev openssl python3-venv linux-tools-generic
          /usr/bin/openssl version
          # The vendor audit's expected tag must match cmake/build_tests.cmake
          # (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.
          git -C vendor/txiki.js fetch --depth=1 origin \
            refs/tags/v26.6.0:refs/tags/v26.6.0
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done

      - name: Require actual Linux perf counters for evidence controls
        run: python3 -B tools/setup-hosted-perf.py

      - name: Install locked independent WebSocket clients
        run: |
          set -euo pipefail
          /usr/bin/python3.12 tools/setup-ws-interop-python.py "${RUNNER_TEMP}/capsid-ws-python"
          printf 'CAPSID_WS_INTEROP_PYTHON=%s\n' "${RUNNER_TEMP}/capsid-ws-python/bin/python" >> "${GITHUB_ENV}"
          printf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\n' "${RUNNER_TEMP}/capsid-ws-python/node-ws" >> "${GITHUB_ENV}"

      - name: Check out the manifest-pinned WPT revision
        env:
          WPT_DIRECTORY: ${{ runner.temp }}/wpt
        run: |
          set -euo pipefail
          repository=$(node -p \
            "require('./tests/wpt/manifest.json').repository")
          commit=$(node -p \
            "require('./tests/wpt/manifest.json').commit")
          git init "${WPT_DIRECTORY}"
          git -C "${WPT_DIRECTORY}" remote add origin "${repository}"
          git -C "${WPT_DIRECTORY}" fetch --depth=1 origin "${commit}"
          git -C "${WPT_DIRECTORY}" checkout --detach FETCH_HEAD
          test "$(git -C "${WPT_DIRECTORY}" rev-parse HEAD)" = "${commit}"

      # capsid-bytecode-compile and the Host trust chain require OpenSSL
      # >= 3.5. ubuntu-24.04 supplies 3.0, so the Release build must use the
      # same pinned provider source as the sanitizer Host build.
      - name: Build OpenSSL 3.5 for Release
        run: |
          set -euo pipefail
          # Built in the runner temp dir: extracting the tarball inside the
          # workspace dirties the checkout and trips the Release
          # clean-worktree identity gate.
          cd "${RUNNER_TEMP}"
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" > openssl.sha256
          curl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz
          sha256sum -c openssl.sha256
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider openssl --source "$PWD" | tee "${evidence}/openssl-source.json"
          ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm
          make -j2
          sudo make install_sw

      - name: Build c-ares 1.34.5 for Release
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          curl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013
          echo "cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz" | sha256sum -c -
          tar xzf capsid-cares.tar.gz
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider cares --source "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" | tee "${evidence}/cares-source.json"
          cmake -S "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" -B "${RUNNER_TEMP}/capsid-cares-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \
            -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF
          cmake --build "${RUNNER_TEMP}/capsid-cares-build" --parallel 2 --verbose
          sudo cmake --install "${RUNNER_TEMP}/capsid-cares-build"
          cp "${RUNNER_TEMP}/capsid-cares-build/compile_commands.json" "${evidence}/cares-compile-commands.json"

      - name: Configure Release/LTO with WPT and benchmarks
        env:
          WPT_DIRECTORY: ${{ runner.temp }}/wpt
        run: |
          cmake -S . -B build-validity -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCAPSID_BUILD_HOST=ON \
            -DCAPSID_ENABLE_LTO=ON \
            -DCAPSID_USE_MIMALLOC=OFF \
            -DCAPSID_BUILD_BENCHMARKS=ON \
            -DCAPSID_GENERATE_LINK_MAP=ON \
            -DCMAKE_PREFIX_PATH=/opt/openssl35 \
            -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include \
            -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \
            -DCAPSID_SANDBOX_PROFILE=production \
            -DCAPSID_WPT_ROOT="${WPT_DIRECTORY}"

      - name: Build
        run: cmake --build build-validity --parallel 2 --target capsid-host capsid-worker test-native-retired-ownership benchmark-cold-start test-cold-worker-descendant benchmark-loadgen

      - name: Observe original cases with unchanged deadlines
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
          OBSERVATION_BUILD: build-validity
          OBSERVATION_PROFILE: release
          OBSERVATION_PARALLEL: 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,re,shutil,subprocess,time,xml.etree.ElementTree as ET
          root=Path.cwd();build=root/os.environ['OBSERVATION_BUILD'];profile=os.environ['OBSERVATION_PROFILE']
          out=build/'original-case-observations';out.mkdir();sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          budgets={'binding_fetch_arguments_contract_controls':30,
           'native_retired_ownership_promise_finally':60,'native_retired_ownership_promise_catch':60,
           'native_retired_ownership_contract_controls':30,'benchmark_cold_control':60,
           'benchmark_cold_producer':60,'benchmark_qps_probe':90,'benchmark_cold_tool':100,
           'benchmark_cold_descendants':30,'benchmark_cold_descendant_sample_fork':30,
           'benchmark_cold_descendant_sample_clone':30,'websocket_fetch_byob_reflect-standard_managed':120}
          serial={n for n in budgets if n.startswith('benchmark_')}|{'binding_fetch_arguments_contract_controls'}
          assert len(budgets)==12 and len(serial)==8
          expression='^('+'|'.join(map(re.escape,sorted(budgets)))+')$'
          inventory=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-R',expression],text=True))
          assert {t['name'] for t in inventory['tests']}==set(budgets)
          for t in inventory['tests']:
           properties={p['name']:p['value'] for p in t['properties']}
           assert properties['TIMEOUT']==budgets[t['name']],(t['name'],properties)
           assert bool(properties.get('RUN_SERIAL',False))==(t['name'] in serial),(t['name'],properties)
          (out/'registration.json').write_text(json.dumps(inventory,indent=2)+'\n')
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert tree=='ebf5c96c7447eb7211c53703a4ab7e2f911de7a4'
          executables={n:sha(build/n) for n in ['capsid-host','capsid-worker','cold-start','test-native-retired-ownership','test-cold-worker-descendant','benchmark-tools/loadgen']}
          inputs={n:sha(root/n) for n in ['cmake/build_tests.cmake','tests/test_native_retired_ownership.mjs',
           'tests/helpers/workerd_listener_control.mjs','tools/workerd-fetch-byob-contract.mjs',
           'tests/test_native_retired_ownership_contract.mjs','tests/test_binding_fetch_arguments_contract.mjs',
           'tests/test_benchmark_cold_control.py','tests/test_benchmark_cold_lane.py','tests/test_benchmark_qps_probe.py',
           'tests/test_benchmark_cold_tool.py','tests/test_benchmark_cold_descendants.py',
           'tests/test_websocket_fetch_byob.mjs','tools/native-retired-ownership-contract.mjs']}
          record=dict(complete=False,status='collecting-original-cases-with-reference-listener-and-sampling-isolation',
           createdUTC=datetime.now(timezone.utc).isoformat(),profile=profile,diagnosticOnly=True,qualificationNotClaimed=True,
           actualCheckoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),sourceTree=tree,
           localFrozenSnapshot='1fb5e29a8f0f33bf33b336e06f629921f36e533f',originalPerTestBudgets=budgets,
           actualSerialCases=sorted(serial),originalNativeTestsStillAllowedToRunConcurrently=True,
           internalConcurrentControllerCasesUnchanged=True,executables=executables,inputs=inputs,attempts=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save();all_ok=True
          for attempt in range(1,4):
           folder=out/('attempt-'+str(attempt));folder.mkdir();reports=folder/'reports';reports.mkdir()
           env=dict(os.environ,CAPSID_WS_REPORT_DIR=str(reports),CAPSID_WS_RUN_ID='isolation-original-'+profile+'-'+str(attempt))
           for n,h in executables.items():assert sha(build/n)==h
           for n,h in inputs.items():assert sha(root/n)==h
           start=time.monotonic()
           with (folder/'ctest.stdout.log').open('wb') as so,(folder/'ctest.stderr.log').open('wb') as se:
            ran=subprocess.run(['ctest','--test-dir',str(build),'-R',expression,'--parallel',os.environ['OBSERVATION_PARALLEL'],
             '--no-tests=error','--output-on-failure','--output-junit',str(folder/'junit.xml')],env=env,stdout=so,stderr=se,timeout=sum(budgets.values())+60)
           shutil.copyfile(build/'Testing/Temporary/LastTest.log',folder/'LastTest.log')
           cases=list(ET.parse(folder/'junit.xml').iter('testcase'))
           assert len(cases)==12 and {c.get('name') for c in cases}==set(budgets)
           failures=[c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
           skipped=[c.get('name') for c in cases if c.find('skipped') is not None]
           row=dict(attempt=attempt,exitCode=ran.returncode,seconds=time.monotonic()-start,selected=12,
            failures=failures,skipped=skipped,passed=12-len(failures)-len(skipped))
           record['attempts'].append(row);save();print(json.dumps(row),flush=True)
           all_ok=all_ok and ran.returncode==0 and not failures and not skipped
          for n,h in executables.items():assert sha(build/n)==h
          for n,h in inputs.items():assert sha(root/n)==h
          for name in ['CMakeCache.txt','compile_commands.json']:
           shutil.copyfile(build/name,out/name)
          (out/'actual-build-commands.txt').write_text(subprocess.check_output(['ninja','-C',str(build),'-t','commands',
           'capsid-host','capsid-worker','test-native-retired-ownership','benchmark-cold-start','test-cold-worker-descendant','benchmark-loadgen'],text=True))
          record.update(complete=True,status='all-three-original-case-attempts-passed' if all_ok else 'complete-with-original-case-findings',
           allSelectedAttemptsPassed=all_ok,originalRawFailuresNeverConvertedToPass=True)
          save();assert all_ok,'Original selected cases still have findings; inspect preserved sidecars'
          PY
      - name: Archive every original sidecar and runtime member
        if: always()
        env:
          OBSERVATION_BUILD: build-validity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,tarfile
          build=Path(os.environ['OBSERVATION_BUILD']);folder=build/'original-case-observations'
          archive=build/'original-case-observations.tar.gz'
          with tarfile.open(archive,'w:gz',dereference=False) as out:
              if folder.exists():out.add(folder,arcname=folder.name)
          archive.with_name(archive.name+'.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n')
          PY
      - name: Save complete original-case controls
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: port-and-pss-release-original-cases
          if-no-files-found: error
          path: |
            build-validity/original-case-observations.tar.gz
            build-validity/original-case-observations.tar.gz.sha256
            ${{ runner.temp }}/capsid-native-provider-evidence/
  sanitizers:
    runs-on: ubuntu-24.04
    # The measured TSan matrix alone takes over 60 minutes, before provider
    # and product builds. Keep individual CTest timeouts unchanged.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The packaging gates (worker_package_*) are the Release row's
        # responsibility (§12.5): under sanitizers the instrumented worker
        # links a dynamic libasan/libtsan, which the package smoke's
        # undeclared-dependency scan would reject, and the §12.3 second
        # fresh build would duplicate a full sanitizer build.
        include:
          - name: asan
            cmake_flag: CAPSID_ENABLE_ASAN
            build_host: 1
            ctest_parallel: 2
            ctest_exclude: >-
              ^(wpt_conformance_not_configured|worker_package_.*|websocket_managed_(replacement-recursion|reclamation-idle))$
          - name: ubsan
            cmake_flag: CAPSID_ENABLE_UBSAN
            build_host: 1
            ctest_parallel: 2
            ctest_exclude: '^(wpt_conformance_not_configured|worker_package_.*)$'
          - name: tsan
            cmake_flag: CAPSID_ENABLE_TSAN
            compiler: clang
            build_host: 1
            # TSan's shadow allocator runs out of mmap space under
            # -j2 (observed: "ThreadSanitizer: out of memory ... Failed
            # to mmap" on the hosted runner); the matrix runs serially.
            ctest_parallel: 1
            # Clang and GCC select the existing TSan test-driver wait
            # scale. Run all native managed checks; an unsupported finite
            # RLIMIT_AS probe reports its explicit CTest skip code.
            ctest_exclude: >-
              ^(wpt_conformance_not_configured|worker_package_.*|websocket_managed_(replacement-recursion|reclamation-idle))$

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5292dafcdd1adba8b32827c392e30c52c9243650
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'

      - name: Install build and locked JavaScript dependencies
        run: |
          set -euo pipefail
          # Match the Release dependency transport and reject stale indexes.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${apt_network[@]}" update --error-on=any
          # libclang-rt-dev supplies the Clang sanitizer runtimes (TSan
          # included, arch-suffixed) that the clang-based tsan matrix entry
          # links against.
          sudo apt-get "${apt_network[@]}" install -y ninja-build libboost-system-dev libc-ares-dev libclang-rt-dev openssl python3-venv linux-tools-generic
          /usr/bin/openssl version
          # The vendor audit's expected tag must match cmake/build_tests.cmake
          # (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.
          git -C vendor/txiki.js fetch --depth=1 origin \
            refs/tags/v26.6.0:refs/tags/v26.6.0
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done

      - name: Require actual Linux perf counters for evidence controls
        run: python3 -B tools/setup-hosted-perf.py

      - name: Install locked independent clients and reference for sanitizers
        run: |
          set -euo pipefail
          /usr/bin/python3.12 tools/setup-ws-interop-python.py "${RUNNER_TEMP}/capsid-ws-python"
          printf 'CAPSID_WS_INTEROP_PYTHON=%s\n' "${RUNNER_TEMP}/capsid-ws-python/bin/python" >> "${GITHUB_ENV}"
          printf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\n' "${RUNNER_TEMP}/capsid-ws-python/node-ws" >> "${GITHUB_ENV}"
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"

      # The worker-side bytecode compiler and the Host both require OpenSSL
      # >= 3.5. Every sanitizer entry therefore provisions the same pinned
      # provider, even when that matrix entry does not build capsid-host.
      - name: Build OpenSSL 3.5 for sanitizer targets
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            asan) sanitizer=address ;;
            ubsan) sanitizer=undefined ;;
            tsan) sanitizer=thread ;;
            *) echo "Unknown sanitizer matrix entry" >&2; exit 1 ;;
          esac
          compiler=cc
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            compiler=clang
          fi
          sanitizer_flags="-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all"
          # Built in the runner temp dir: extracting the tarball inside the
          # workspace dirties the checkout and trips the build-identity
          # clean-worktree gate.
          cd "${RUNNER_TEMP}"
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" > openssl.sha256
          curl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz
          sha256sum -c openssl.sha256
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider openssl --source "$PWD" | tee "${evidence}/openssl-source.json"
          # Match the Capsid compiler/runtime and instrument the provider's C
          # implementation, including paths normally implemented in assembly.
          CC="${compiler}" CFLAGS="${sanitizer_flags}" CXXFLAGS="${sanitizer_flags}" LDFLAGS="-fsanitize=${sanitizer}" \
            ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm
          make -j2
          sudo make install_sw

      - name: Build c-ares 1.34.5 for sanitizer targets
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            asan) sanitizer=address ;;
            ubsan) sanitizer=undefined ;;
            tsan) sanitizer=thread ;;
            *) echo "Unknown sanitizer matrix entry" >&2; exit 1 ;;
          esac
          compiler=cc
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            compiler=clang
          fi
          sanitizer_flags="-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cd "${RUNNER_TEMP}"
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          curl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013
          echo "cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz" | sha256sum -c -
          tar xzf capsid-cares.tar.gz
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider cares --source "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" | tee "${evidence}/cares-source.json"
          cmake -S "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" -B "${RUNNER_TEMP}/capsid-cares-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="${compiler}" \
            -DCMAKE_C_FLAGS="${sanitizer_flags}" \
            -DCMAKE_C_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${sanitizer}" \
            -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \
            -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF
          cmake --build "${RUNNER_TEMP}/capsid-cares-build" --parallel 2 --verbose
          sudo cmake --install "${RUNNER_TEMP}/capsid-cares-build"
          cp "${RUNNER_TEMP}/capsid-cares-build/compile_commands.json" "${evidence}/cares-compile-commands.json"

      - name: Configure ${{ matrix.name }}
        run: |
          compiler_args=()
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            compiler_args=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          fi
          host_args=(-DCMAKE_PREFIX_PATH=/opt/openssl35 -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include)
          if [ "${{ matrix.build_host }}" = "1" ]; then
            host_args+=(-DCAPSID_BUILD_HOST=ON)
          fi
          cmake -S . -B "build-${{ matrix.name }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -D${{ matrix.cmake_flag }}=ON \
            -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \
            -DCAPSID_SANDBOX_PROFILE=sanitizer \
            -DCAPSID_USE_MIMALLOC=OFF \
            -DCAPSID_BUILD_BENCHMARKS=ON \
            "${compiler_args[@]}" "${host_args[@]}"

      - name: Build ${{ matrix.name }}
        run: |
          cmake --build "build-${{ matrix.name }}" --parallel 2 --target capsid-host capsid-worker test-native-retired-ownership benchmark-cold-start test-cold-worker-descendant benchmark-loadgen

      - name: Observe original cases with unchanged deadlines
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
          OBSERVATION_BUILD: build-${{ matrix.name }}
          OBSERVATION_PROFILE: ${{ matrix.name }}
          OBSERVATION_PARALLEL: ${{ matrix.ctest_parallel }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,re,shutil,subprocess,time,xml.etree.ElementTree as ET
          root=Path.cwd();build=root/os.environ['OBSERVATION_BUILD'];profile=os.environ['OBSERVATION_PROFILE']
          out=build/'original-case-observations';out.mkdir();sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          budgets={'binding_fetch_arguments_contract_controls':30,
           'native_retired_ownership_promise_finally':60,'native_retired_ownership_promise_catch':60,
           'native_retired_ownership_contract_controls':30,'benchmark_cold_control':60,
           'benchmark_cold_producer':60,'benchmark_qps_probe':90,'benchmark_cold_tool':100,
           'benchmark_cold_descendants':30,'benchmark_cold_descendant_sample_fork':30,
           'benchmark_cold_descendant_sample_clone':30,'websocket_fetch_byob_reflect-standard_managed':120}
          serial={n for n in budgets if n.startswith('benchmark_')}|{'binding_fetch_arguments_contract_controls'}
          assert len(budgets)==12 and len(serial)==8
          expression='^('+'|'.join(map(re.escape,sorted(budgets)))+')$'
          inventory=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-R',expression],text=True))
          assert {t['name'] for t in inventory['tests']}==set(budgets)
          for t in inventory['tests']:
           properties={p['name']:p['value'] for p in t['properties']}
           assert properties['TIMEOUT']==budgets[t['name']],(t['name'],properties)
           assert bool(properties.get('RUN_SERIAL',False))==(t['name'] in serial),(t['name'],properties)
          (out/'registration.json').write_text(json.dumps(inventory,indent=2)+'\n')
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert tree=='ebf5c96c7447eb7211c53703a4ab7e2f911de7a4'
          executables={n:sha(build/n) for n in ['capsid-host','capsid-worker','cold-start','test-native-retired-ownership','test-cold-worker-descendant','benchmark-tools/loadgen']}
          inputs={n:sha(root/n) for n in ['cmake/build_tests.cmake','tests/test_native_retired_ownership.mjs',
           'tests/helpers/workerd_listener_control.mjs','tools/workerd-fetch-byob-contract.mjs',
           'tests/test_native_retired_ownership_contract.mjs','tests/test_binding_fetch_arguments_contract.mjs',
           'tests/test_benchmark_cold_control.py','tests/test_benchmark_cold_lane.py','tests/test_benchmark_qps_probe.py',
           'tests/test_benchmark_cold_tool.py','tests/test_benchmark_cold_descendants.py',
           'tests/test_websocket_fetch_byob.mjs','tools/native-retired-ownership-contract.mjs']}
          record=dict(complete=False,status='collecting-original-cases-with-reference-listener-and-sampling-isolation',
           createdUTC=datetime.now(timezone.utc).isoformat(),profile=profile,diagnosticOnly=True,qualificationNotClaimed=True,
           actualCheckoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),sourceTree=tree,
           localFrozenSnapshot='1fb5e29a8f0f33bf33b336e06f629921f36e533f',originalPerTestBudgets=budgets,
           actualSerialCases=sorted(serial),originalNativeTestsStillAllowedToRunConcurrently=True,
           internalConcurrentControllerCasesUnchanged=True,executables=executables,inputs=inputs,attempts=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save();all_ok=True
          for attempt in range(1,4):
           folder=out/('attempt-'+str(attempt));folder.mkdir();reports=folder/'reports';reports.mkdir()
           env=dict(os.environ,CAPSID_WS_REPORT_DIR=str(reports),CAPSID_WS_RUN_ID='isolation-original-'+profile+'-'+str(attempt))
           for n,h in executables.items():assert sha(build/n)==h
           for n,h in inputs.items():assert sha(root/n)==h
           start=time.monotonic()
           with (folder/'ctest.stdout.log').open('wb') as so,(folder/'ctest.stderr.log').open('wb') as se:
            ran=subprocess.run(['ctest','--test-dir',str(build),'-R',expression,'--parallel',os.environ['OBSERVATION_PARALLEL'],
             '--no-tests=error','--output-on-failure','--output-junit',str(folder/'junit.xml')],env=env,stdout=so,stderr=se,timeout=sum(budgets.values())+60)
           shutil.copyfile(build/'Testing/Temporary/LastTest.log',folder/'LastTest.log')
           cases=list(ET.parse(folder/'junit.xml').iter('testcase'))
           assert len(cases)==12 and {c.get('name') for c in cases}==set(budgets)
           failures=[c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
           skipped=[c.get('name') for c in cases if c.find('skipped') is not None]
           row=dict(attempt=attempt,exitCode=ran.returncode,seconds=time.monotonic()-start,selected=12,
            failures=failures,skipped=skipped,passed=12-len(failures)-len(skipped))
           record['attempts'].append(row);save();print(json.dumps(row),flush=True)
           all_ok=all_ok and ran.returncode==0 and not failures and not skipped
          for n,h in executables.items():assert sha(build/n)==h
          for n,h in inputs.items():assert sha(root/n)==h
          for name in ['CMakeCache.txt','compile_commands.json']:
           shutil.copyfile(build/name,out/name)
          (out/'actual-build-commands.txt').write_text(subprocess.check_output(['ninja','-C',str(build),'-t','commands',
           'capsid-host','capsid-worker','test-native-retired-ownership','benchmark-cold-start','test-cold-worker-descendant','benchmark-loadgen'],text=True))
          record.update(complete=True,status='all-three-original-case-attempts-passed' if all_ok else 'complete-with-original-case-findings',
           allSelectedAttemptsPassed=all_ok,originalRawFailuresNeverConvertedToPass=True)
          save();assert all_ok,'Original selected cases still have findings; inspect preserved sidecars'
          PY
      - name: Archive every original sidecar and runtime member
        if: always()
        env:
          OBSERVATION_BUILD: build-${{ matrix.name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,tarfile
          build=Path(os.environ['OBSERVATION_BUILD']);folder=build/'original-case-observations'
          archive=build/'original-case-observations.tar.gz'
          with tarfile.open(archive,'w:gz',dereference=False) as out:
              if folder.exists():out.add(folder,arcname=folder.name)
          archive.with_name(archive.name+'.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n')
          PY
      - name: Save complete original-case controls
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: port-and-pss-${{ matrix.name }}-original-cases
          if-no-files-found: error
          path: |
            build-${{ matrix.name }}/original-case-observations.tar.gz
            build-${{ matrix.name }}/original-case-observations.tar.gz.sha256
            ${{ runner.temp }}/capsid-native-provider-evidence/

name: Complete byte-preserving checkout and density fixture validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-validity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host-library:
    runs-on: windows-latest
    # The measured serial Release matrix alone takes about 104 minutes.
    # Allow dependency/build time without changing individual test budgets.
    timeout-minutes: 180

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 913055de94cb61b8d95976b4a0b5011d623a452f
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Set up the locked Python WebSocket runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: '3.12.3'

      - name: Locate OpenSSL for WebSocket test certificates
        shell: pwsh
        run: |
          $git_root = Split-Path (Split-Path (Get-Command git -ErrorAction Stop).Source)
          $openssl_candidates = @(
            (Join-Path $git_root 'mingw64/bin/openssl.exe'),
            (Join-Path $git_root 'usr/bin/openssl.exe')
          )
          $openssl_fixture = $openssl_candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $openssl_fixture) { throw 'OpenSSL CLI for fixture certificates is missing' }
          & $openssl_fixture version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Split-Path $openssl_fixture) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install locked independent WebSocket clients
        shell: pwsh
        run: |
          $interop_root = Join-Path $env:RUNNER_TEMP 'capsid-ws-interop'
          python tools/setup-ws-interop-python.py $interop_root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CAPSID_WS_INTEROP_PYTHON=$interop_root\Scripts\python.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSID_WS_INTEROP_NODE_PACKAGE=$interop_root\node-ws" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install the locked native Windows workerd reference
        shell: pwsh
        run: |
          $reference_path = Join-Path $env:RUNNER_TEMP 'capsid-workerd-reference/workerd.exe'
          node tools/workerd-reference.mjs install $reference_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CAPSID_WORKERD_REF=$reference_path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSID_WORKERD_REQUIRED=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Ninja invokes `cl` via PATH, unlike the MSBuild generator that
      # resolves the toolchain itself; without the VS developer
      # environment CMake cannot find the MSVC compiler.
      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (v1.13.0; default-branch commits carry no node_modules)

      # The worker bootstrap bundles via esbuild from the locked txiki.js
      # node_modules; without this the Windows configure fails with
      # "esbuild is missing".
      - name: Install locked JavaScript dependencies
        run: |
          set -euo pipefail
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          # The vendor audit's expected tag must match cmake/build_tests.cmake
          # (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.
          git -C vendor/txiki.js fetch --depth=1 origin \
            refs/tags/v26.6.0:refs/tags/v26.6.0
        shell: bash

      # OpenSSL (static) and Boost.System/Asio (header-only) come from the
      # runner's preinstalled vcpkg; the static triplet matches the /MT CRT
      # policy pinned by the vendored txiki build. boost-asio is a separate
      # port from boost-system (the Host data plane needs <boost/asio.hpp>).
      - name: Install Windows build dependencies (vcpkg)
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            openssl c-ares boost-system boost-asio boost-beast --triplet x64-windows-static
        shell: pwsh

      # §12.5 Windows row: Host units, non-strict worker contracts and the
      # actual package contents/metadata/smoke/reproducibility gates.
      # Platform-specific Linux tests retain their explicit registration or
      # skip policy. Creating the Release archive alone does not validate it.
      # Ninja keeps this single-config like every other job; the Visual
      # Studio generator would default to Debug builds and require ctest
      # -C <config>, which quietly "Not Run"s the whole matrix. Pin the
      # compiler to cl: in a non-vcvars shell Ninja otherwise grabs mingw
      # gcc off PATH, which cannot build the CRT/winsock port.
      - name: Configure Windows host library and worker contracts
        run: |
          cmake -S . -B build-windows `
            -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
              -DCAPSID_BUILD_HOST=ON `
              -DCAPSID_BUILD_WORKER=ON `
              -DCAPSID_STRICT_WARNINGS=ON `
              -DCAPSID_USE_MIMALLOC=OFF `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
        shell: pwsh

      - name: Build original native recovery component
        shell: pwsh
        run: cmake --build build-windows --parallel 2 --target test-spawn-failure-recovery capsid-worker
      - name: Qualify native prerequisite and reject a real leaked descriptor
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64,hashlib,json,re,subprocess,xml.etree.ElementTree as ET
          root=Path.cwd();out=root/'native-spawn-controls';out.mkdir();build=root/'build-windows'
          source=root/'tests/test_spawn_failure_recovery.cc';client=root/'src/client.cc';original=source.read_bytes()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          record=dict(complete=False,privateProposalOnly=True,rootIntegrated=False,sourceCommit='913055de94cb61b8d95976b4a0b5011d623a452f',
              original60SecondCTestBudgetAndAll25Valid25Rejected5Missing1RecoveryCyclesRetained=True,observations=[])
          def save():(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          def run(label,command,expected):
              result=subprocess.run(command,capture_output=True,timeout=600)
              (out/(label+'.stdout.log')).write_bytes(result.stdout);(out/(label+'.stderr.log')).write_bytes(result.stderr)
              record['observations'].append(dict(label=label,exitCode=result.returncode,stdoutSHA256=sha(out/(label+'.stdout.log')),stderrSHA256=sha(out/(label+'.stderr.log'))));save()
              assert result.returncode in expected,(label,result.returncode,result.stderr[-2000:])
              return result
          registration=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-R','^spawn_failure_recovery$']))
          test,=registration['tests'];assert {p['name']:p['value'] for p in test['properties']}['TIMEOUT']==60
          (out/'original-registration.json').write_text(json.dumps(registration,indent=2)+'\n')
          worker=build/'capsid-worker.exe';worker_sha=sha(worker);client_sha=sha(client)
          original_result=run('original',['ctest','--test-dir',str(build),'--output-on-failure','--output-junit',str(out/'original.xml'),'-R','^spawn_failure_recovery$'],{0,8})
          if original_result.returncode:
              assert b'failed CreateProcess: handle count changed' in original_result.stdout
          source.write_bytes(base64.b64decode(''))
          run('build-prerequisite',['cmake','--build',str(build),'--parallel','2','--target','test-spawn-failure-recovery'],{0})
          for iteration in range(3):
              result=run('prerequisite-'+str(iteration),['ctest','--test-dir',str(build),'--output-on-failure','--verbose','--output-junit',str(out/('prerequisite-'+str(iteration)+'.xml')),'-R','^spawn_failure_recovery$'],{0})
              lines=re.findall(rb'WIN32_MISSING iteration=(\d+) before=(\d+) after=(\d+) error=2',result.stdout)
              assert len(lines)==3 and all(a==b for _,a,b in lines[1:])
              assert b'PASS valid=25 rejected=25 missing=5 recovered=1' in result.stdout
          assert sha(worker)==worker_sha and sha(client)==client_sha
          old=client.read_text(encoding='utf-8');needle='    if (!created) {\n        close(sockets[0]);\n        return CAPSID_CHILD_ERROR;\n    }'
          assert old.count(needle)==1
          client.write_text(old.replace(needle,needle.replace('close(sockets[0]);','(void)sockets[0]; // deliberate private failed-spawn descriptor leak'),1),encoding='utf-8',newline='\n')
          run('build-deliberate-leak',['cmake','--build',str(build),'--parallel','2','--target','test-spawn-failure-recovery'],{0})
          fault=run('deliberate-leak',['ctest','--test-dir',str(build),'--output-on-failure','--output-junit',str(out/'deliberate-leak.xml'),'-R','^spawn_failure_recovery$'],{8})
          assert b'failed CreateProcess: handle count changed' in fault.stdout
          counts=re.findall(rb'failed CreateProcess: handle count changed (\d+) -> (\d+)',fault.stdout)
          assert len(counts)==1 and int(counts[0][1])==int(counts[0][0])+1
          assert sha(worker)==worker_sha
          record.update(complete=True,status='native-prerequisite-three-real-cabi-runs-qualified-and-one-real-descriptor-leak-rejected',
              workerSHA256=worker_sha,originalClientSHA256=client_sha,originalSourceSHA256=hashlib.sha256(original).hexdigest(),
              proposalSourceSHA256=sha(source),deliberateLeakOnlyInPrivateClient=True,originalFailurePreserved=True)
          save()
          '@ | Set-Content -LiteralPath native-driver.py -Encoding utf8
          python -B native-driver.py
      - name: Preserve original and private proposal observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-spawn-prerequisite-controls
          path: |
            native-spawn-controls
            native-driver.py
            tests/test_spawn_failure_recovery.cc
            src/client.cc
            build-windows/generated/build-info.txt
            build-windows/compile_commands.json

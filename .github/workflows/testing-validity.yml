name: Native Darwin corrected fixture controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corrected-native-fixtures:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 991adfc40c0bc1d3fe9a58ec2877d8b5d26b0192
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.3'
      - name: Preserve exact proposed sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,os,tarfile
          out=Path('build-corrected-fixtures');out.mkdir()
          raw=base64.b64decode('');assert hashlib.sha256(raw).hexdigest()=='6b19326900e9e9c36a039a6aa9c55645d77a70cdb8085c89809ac8d53338c38c'
          (out/'native.cc').write_bytes(raw)
          raw=base64.b64decode('');assert hashlib.sha256(raw).hexdigest()=='2c0e8905346b2e9fbe01622e9d1279a27f702fb4dd303e459244f36051ccae9b'
          folder=Path(os.environ['RUNNER_TEMP'])/'capsid-corrected-fixture';folder.mkdir()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              assert all(m.isfile() and not Path(m.name).is_absolute() and '..' not in Path(m.name).parts for m in archive.getmembers())
              archive.extractall(folder,filter='data')
          expected={'tests/test_spawn_failure_recovery.cc': 'f5936d43f5687026cd4d1adc914db86a3836c8045712e8a963181f026c211284', 'tests/test_benchmark_density_control.py': '4bbedec58f5c00b0ca8b1af98b571ee7a861e07b8e1a9951d0ffe9f468b31672', 'bench/density_control.py': '66bb8b9050ff6420451868c4a9235a2477e3d3c214127bff7571362e1a0c39ce', 'bench/density_probe.py': '0c0e33b008118f677d8a639022488a4f2c208268ab48414a736237a03e531276', 'bench/measurement_runtime.py': '8f0f52c50a140ea340f82137d8377b8bbab8793be8b085c56427f154ceb749c7', 'bench/gen-cold-start-apps.py': '9ed3b2c699d9d12aee9d1470a8bce9f9a5971ba6cf4c11bb3aa1f1fc9e54d8ed'}
          assert all(hashlib.sha256((folder/p).read_bytes()).hexdigest()==h for p,h in expected.items())
          PY
      - name: Verify actual native ownership and constant observer negatives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,time
          out=Path('build-corrected-fixtures');source=(out/'native.cc').read_text()
          a=source.index('size_t own_children() {');b=source.index('\nvoid observe(',a)
          record=dict(complete=False,proposalOnly=True,steps=[],fullCandidateAcceptanceClaimed=False)
          for name,value in [('actual',None),('constant-zero',0),('constant-one',1)]:
              text=source if value is None else source[:a]+'size_t own_children() {return '+str(value)+';}\n'+source[b:]
              cpp=out/(name+'.cc');cpp.write_text(text);binary=out/name
              result=subprocess.run(['xcrun','clang++','-std=c++17','-O2','-Wall','-Wextra','-Wpedantic','-Werror',str(cpp),'-lproc','-o',str(binary)],capture_output=True,timeout=90)
              (out/(name+'.compile.stderr.log')).write_bytes(result.stderr);assert result.returncode==0
              start=time.monotonic()
              with (out/(name+'.stdout.log')).open('wb') as so,(out/(name+'.stderr.log')).open('wb') as se:
                  result=subprocess.run([binary.resolve()],stdout=so,stderr=se,timeout=15)
              record['steps'].append(dict(name=name,exitCode=result.returncode,seconds=time.monotonic()-start))
              if name=='actual':assert result.returncode==0
              else:assert result.returncode==24
          record.update(complete=True,actualTenNativeFailedSpawnsPassed=True,actualLiveAndZombieControlsPassed=True,constantOwnershipObserversRejected=2)
          (out/'ownership-result.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Verify all twenty-one density controls within the original deadline
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil,signal,subprocess,sys,time
          out=Path('build-corrected-fixtures');fixture=Path(os.environ['RUNNER_TEMP'])/'capsid-corrected-fixture/tests/test_benchmark_density_control.py'
          code="import faulthandler,runpy,signal,sys;faulthandler.register(signal.SIGUSR1,all_threads=True);sys.argv=["+repr(str(fixture))+",'--node',"+repr(shutil.which('node'))+",'-v'];runpy.run_path(sys.argv[0],run_name='__main__')"
          start=time.monotonic()
          with (out/'density.stdout.log').open('wb') as so,(out/'density.stderr.log').open('wb') as se:
              child=subprocess.Popen([sys.executable,'-u','-c',code],stdout=so,stderr=se,start_new_session=True)
              try:result=child.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  os.kill(child.pid,signal.SIGUSR1);time.sleep(.2);os.killpg(child.pid,signal.SIGTERM);child.wait(5);result=124
          (out/'density-result.json').write_text(json.dumps(dict(exitCode=result,seconds=time.monotonic()-start,budgetSeconds=30,actualTestsPassed=result==0,proposalOnly=True,fullCandidateAcceptanceClaimed=False),indent=2)+'\n')
          assert result==0 and 'Ran 21 tests' in (out/'density.stderr.log').read_text()
          PY
      - name: Preserve raw positive and negative observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: darwin-corrected-fixture-controls
          if-no-files-found: error
          path: build-corrected-fixtures/

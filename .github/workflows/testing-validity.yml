name: Diagnose frame fuzz allocation overhead with original work and budgets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 06562c017355c2c98d8442a60e933b3b7ce5d1ca
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Install Clang and Ninja
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev

      - name: Configure fuzz harnesses
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCAPSID_BUILD_WORKER=OFF \
            -DCAPSID_BUILD_FUZZERS=ON \
            -DCAPSID_USE_MIMALLOC=OFF

      - name: Build fuzz harnesses
        run: cmake --build build-fuzz --parallel 2

      - name: Preserve complete fuzz build and registration identities
        run: |
          ninja -C build-fuzz -t commands > build-fuzz/full-build-commands.txt
          ctest --test-dir build-fuzz --show-only=json-v1 -L fuzz > build-fuzz/full-registration.json

      - name: Compare original and allocation-only models with every original invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import base64,hashlib,json,os,re,shutil,subprocess,time
          root=Path.cwd();out=root/'frame-fuzz-observations';out.mkdir()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          source=root/'tests/fuzz/fuzz_websocket_frames.cc';build=root/'build-fuzz';binary=build/'fuzz-websocket-frames'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='06562c017355c2c98d8442a60e933b3b7ce5d1ca'
          assert sha(source)=='23c4787f71349e428b8ae8e6338a6b6032acc1d12672ceb799cc9138cc9da4b9'
          original=source.read_bytes();(out/'original.cc').write_bytes(original)
          proposal=base64.b64decode('');assert hashlib.sha256(proposal).hexdigest()=='c8b42a9688816d59fc97750b52d509f157dcca6395492f26ff315525e6b78fe8'
          (out/'proposal.cc').write_bytes(proposal)
          guards={str(p):sha(p) for p in [root/'src/host/ws_codec.cc',root/'src/host/ws_stream.cc',root/'cmake/build_tests.cmake']}
          registration=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-L','fuzz']))
          (out/'original-registration.json').write_text(json.dumps(registration,indent=2)+chr(10))
          frame=next(t for t in registration['tests'] if t['name']=='fuzz-websocket-frames_smoke')
          assert {p['name']:p['value'] for p in frame['properties']}['TIMEOUT']==60
          assert frame['command'][2:]==['-runs=10000','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1']
          gold=out/'immutable-original-corpus';shutil.copytree(build/'fuzz/corpus/websocket_frames',gold)
          gold_hashes={p.name:sha(p) for p in gold.iterdir() if p.is_file()};assert len(gold_hashes)==9
          vectors=out/'deterministic-corpus';vectors.mkdir()
          value=0x42f8d18a
          for index in range(384):
           size=[0,1,2,125,126,127,1024,4095,4096,4097,16384,32768,65535,65536][index%14]
           data=bytearray()
           for offset in range(size):
            value=(1664525*value+1013904223)&0xffffffff;data.append(value>>24)
           (vectors/f'{index:04d}').write_bytes(data)
          for p in gold.iterdir():shutil.copy2(p,vectors/('gold-'+p.name))
          record=dict(complete=False,createdUTC=datetime.now(timezone.utc).isoformat(),diagnosticOnly=True,rootIntegrated=False,
           codeCommit='06562c017355c2c98d8442a60e933b3b7ce5d1ca',sourceTree='9e6ab2966e81ffb8025165947989e73d86309ce1',
           originalFailureRun=43275284036,originalFailureJob=131381983647,originalFailureSeed=2192745715,
           original10000Runs65536Bytes60SecondsRetained=True,initialCorpusSHA256=gold_hashes,
           deterministicInputFiles=len(list(vectors.iterdir())),allOriginalAssertionsAndInputVariantsRetained=True,
           sourceSHA256={'original':hashlib.sha256(original).hexdigest(),'proposal':hashlib.sha256(proposal).hexdigest()},
           runtimeAndCmakeGuards=guards,observations=[],formalPerformancePoints=0,fullV030GoalComplete=False)
          def save():(out/'run.json').write_text(json.dumps(record,indent=2)+chr(10))
          def observe(label,command):
           folder=out/label;folder.mkdir();started=time.monotonic();code=None;timed_out=False
           with (folder/'stdout.log').open('xb') as so,(folder/'stderr.log').open('xb') as se:
            try:code=subprocess.run(command,stdout=so,stderr=se,timeout=60).returncode
            except subprocess.TimeoutExpired:timed_out=True
           log=(folder/'stderr.log').read_text(errors='replace')
           row=dict(label=label,command=command,seconds=time.monotonic()-started,exitCode=code,original60SecondBudgetExceeded=timed_out,
            actualBinarySHA256=sha(binary),logSHA256=sha(folder/'stderr.log'),
            completed10000=bool(re.search(r'Done 10000 runs in ',log)),fatalDiagnostic=bool(re.search(r'ERROR: (?:AddressSanitizer|LeakSanitizer)|runtime error:|WS_INVARIANT|SUMMARY:.*Sanitizer',log)))
           record['observations'].append(row);save();print(json.dumps(row),flush=True)
           return row
          for variant in ['original','proposal']:
           if variant=='proposal':
            source.write_bytes(proposal)
            with (out/'proposal-build.log').open('xb') as log:
             subprocess.run(['cmake','--build',str(build),'--parallel','2','--target','fuzz-websocket-frames'],stdout=log,stderr=subprocess.STDOUT,check=True)
           shutil.copy2(binary,out/(variant+'-fuzz-websocket-frames'))
           command=[str(binary),str(vectors),'-runs=0','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1']
           result=observe(variant+'-all-deterministic-inputs',command);assert result['exitCode']==0 and not result['fatalDiagnostic']
           for seed in [2192745715,1,2]:
            label=variant+'-seed-'+str(seed);corpus=out/(label+'-corpus');shutil.copytree(gold,corpus)
            command=[str(binary),str(corpus),*frame['command'][2:],'-seed='+str(seed)]
            result=observe(label,command)
            assert not result['fatalDiagnostic'],result
            if variant=='proposal':assert result['exitCode']==0 and result['completed10000'] and not result['fatalDiagnostic'],result
           assert all(sha(Path(p))==h for p,h in guards.items())
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['tests/fuzz/fuzz_websocket_frames.cc']
          record.update(complete=True,status='allocation-proposal-completed-original-work-and-differential-inputs',
           sourceIntentionallyDirtyOnlyForDiagnosticProposal=True,fullOriginalCtestStillRequired=True)
          save()
          PY

      - name: Run bounded corpus gates
        run: |
          ctest --test-dir build-fuzz \
            --no-tests=error \
            --output-on-failure \
            --output-junit fuzz-junit.xml \
            -L fuzz

      - name: Preserve both actual binaries inputs and every original diagnostic
        if: always()
        run: |
          tar -czf frame-fuzz-observations.tar.gz frame-fuzz-observations
          sha256sum frame-fuzz-observations.tar.gz > frame-fuzz-observations.tar.gz.sha256

      - name: Save fuzz evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frame-fuzz-allocation-observations
          if-no-files-found: error
          path: |
            frame-fuzz-observations.tar.gz
            frame-fuzz-observations.tar.gz.sha256
            build-fuzz/fuzz-junit.xml
            build-fuzz/Testing/Temporary/LastTest.log
            build-fuzz/CMakeCache.txt
            build-fuzz/compile_commands.json
            build-fuzz/full-build-commands.txt
            build-fuzz/full-registration.json
            build-fuzz/generated/build-info.txt


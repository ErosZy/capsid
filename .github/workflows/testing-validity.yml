name: Profile frame oracle storage with original instrumentation and budgets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-frame-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact private baseline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5dcbe8d6b848c79c865e6cb7eb3c432e6bcd203b
          submodules: recursive
      - name: Install original fully instrumented compiler prerequisites
        run: |
          set -euo pipefail
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev
      - name: Build and preserve the unmodified baseline frame harness
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          mkdir -p evidence/baseline evidence/experiment
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCAPSID_BUILD_WORKER=OFF -DCAPSID_BUILD_FUZZERS=ON -DCAPSID_USE_MIMALLOC=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-fuzz --target fuzz-websocket-frames --parallel 2
          cp build-fuzz/fuzz-websocket-frames evidence/baseline/
          cp tests/fuzz/fuzz_websocket_frames.cc evidence/baseline/
          cp build-fuzz/compile_commands.json evidence/baseline/
          ctest --test-dir build-fuzz --show-only=json-v1 > evidence/original-registration.json
          cp -a build-fuzz/fuzz/corpus/websocket_frames evidence/initial-corpus
      - name: Reserve only oracle vector storage without changing bytes or checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/fuzz/fuzz_websocket_frames.cc');s=p.read_text()
          old='    Bytes result{static_cast<uint8_t>((p.fin ? 128 : 0) | p.opcode)};'
          assert s.count(old)==1
          s=s.replace(old,'    Bytes result;\n    result.reserve(p.payload.size() + 14);\n    result.push_back(static_cast<uint8_t>((p.fin ? 128 : 0) | p.opcode));')
          old='    Bytes encoded;';assert s.count(old)==1
          s=s.replace(old,old+'\n    encoded.reserve(payload.size() + 64);')
          p.write_text(s)
          PY
          git diff -- tests/fuzz/fuzz_websocket_frames.cc > evidence/allocation-only.diff
          cmake --build build-fuzz --target fuzz-websocket-frames --parallel 2
          cp build-fuzz/fuzz-websocket-frames evidence/experiment/
          cp tests/fuzz/fuzz_websocket_frames.cc evidence/experiment/
          cp build-fuzz/compile_commands.json evidence/experiment/
          ninja -C build-fuzz -t commands fuzz-websocket-frames > evidence/experiment/full-build-commands.txt
      - name: Replay both original seeds with the same checks and original60s CTest budget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,shutil,subprocess,time,xml.etree.ElementTree as ET
          source=Path.cwd();evidence=source/'evidence'
          registration=json.loads((evidence/'original-registration.json').read_text())
          original=next(t for t in registration['tests'] if t['name']=='fuzz-websocket-frames_smoke')
          props={p['name']:p['value'] for p in original['properties']};assert props['TIMEOUT']==60
          flags=original['command'][2:]
          assert flags==['-runs=10000','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1']
          plan=[('original-first','baseline',710362044),('experiment-failed-seed','experiment',710362044),
              ('experiment-passed-seed','experiment',2608565322),('original-last','baseline',710362044)]
          result=dict(complete=False,privateDiagnosticOnly=True,originalFlags=flags,originalCTestTimeoutSeconds=60,cases=[])
          for name,variant,seed in plan:
              folder=evidence/'replays'/name;folder.mkdir(parents=True)
              shutil.copytree(evidence/'initial-corpus',folder/'corpus')
              binary=evidence/variant/'fuzz-websocket-frames'
              args=[str(binary),str(folder/'corpus'),*flags,'-seed='+str(seed)]
              (folder/'CTestTestfile.cmake').write_text('add_test('+json.dumps(name)+' '+' '.join(map(json.dumps,args))+')\nset_tests_properties('+json.dumps(name)+' PROPERTIES TIMEOUT 60)\n')
              started=time.monotonic()
              code=subprocess.run(['ctest','--test-dir',str(folder),'--no-tests=error','--output-on-failure','--output-junit',str(folder/'junit.xml')]).returncode
              elapsed=time.monotonic()-started
              raw=(folder/'Testing/Temporary/LastTest.log').read_text()
              stats=re.search(r'stat::number_of_executed_units:\s*(\d+)',raw)
              completed=code==0 and 'Done 10000 runs in ' in raw and stats and int(stats[1])==10000
              result['cases'].append(dict(name=name,variant=variant,seed=seed,ctestExitCode=code,elapsedSeconds=elapsed,
                  original10000ExecutionsCompleted=bool(completed),executions=int(stats[1]) if stats else None,
                  lastReportedCoverageEvent=int(re.findall(r'(?m)^#(\d+)\s',raw)[-1]),
                  binarySHA256=hashlib.sha256(binary.read_bytes()).hexdigest()))
              (evidence/'paired-result.json').write_text(json.dumps(result,indent=2)+'\n')
          result['complete']=True
          result['experimentBothOriginalSeedsPassed']=all(c['original10000ExecutionsCompleted'] for c in result['cases'] if c['variant']=='experiment')
          result['rootIntegrated']=False;result['fullReleaseQualificationClaimed']=False
          (evidence/'paired-result.json').write_text(json.dumps(result,indent=2)+'\n')
          assert result['experimentBothOriginalSeedsPassed'],'private allocation experiment must finish both original workloads'
          PY
      - name: Save both exact binaries, sources, flags, all corpora and original transcripts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: frame-storage-paired-diagnostic
          if-no-files-found: error
          path: evidence/

name: Preserve full raw observations for original three TSan failures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    # The measured TSan matrix alone takes over 60 minutes, before provider
    # and product builds. Keep individual CTest timeouts unchanged.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tsan
            cmake_flag: CAPSID_ENABLE_TSAN
            compiler: clang
            build_host: 1
            # TSan's shadow allocator runs out of mmap space under
            # -j2 (observed: "ThreadSanitizer: out of memory ... Failed
            # to mmap" on the hosted runner); the matrix runs serially.
            ctest_parallel: 1
            # Clang and GCC select the existing TSan test-driver wait
            # scale. Run all native managed checks; an unsupported finite
            # RLIMIT_AS probe reports its explicit CTest skip code.
            ctest_exclude: >-
              ^(wpt_conformance_not_configured|worker_package_.*|websocket_managed_(replacement-recursion|reclamation-idle))$

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 27edca96069d88386950b4dd54c22db0bd0df52e
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'

      - name: Install build and locked JavaScript dependencies
        run: |
          set -euo pipefail
          # Match the Release dependency transport and reject stale indexes.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          # libclang-rt-dev supplies the Clang sanitizer runtimes (TSan
          # included, arch-suffixed) that the clang-based tsan matrix entry
          # links against.
          sudo apt-get "${apt_network[@]}" install -y ninja-build libboost-system-dev libc-ares-dev libclang-rt-dev openssl python3-venv
          /usr/bin/openssl version
          # The vendor audit's expected tag must match cmake/build_tests.cmake
          # (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.
          git -C vendor/txiki.js fetch --depth=1 origin \
            refs/tags/v26.6.0:refs/tags/v26.6.0
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done

      - name: Install locked independent clients and reference for sanitizers
        run: |
          set -euo pipefail
          /usr/bin/python3.12 tools/setup-ws-interop-python.py "${RUNNER_TEMP}/capsid-ws-python"
          printf 'CAPSID_WS_INTEROP_PYTHON=%s\n' "${RUNNER_TEMP}/capsid-ws-python/bin/python" >> "${GITHUB_ENV}"
          printf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\n' "${RUNNER_TEMP}/capsid-ws-python/node-ws" >> "${GITHUB_ENV}"
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"

      # The worker-side bytecode compiler and the Host both require OpenSSL
      # >= 3.5. Every sanitizer entry therefore provisions the same pinned
      # provider, even when that matrix entry does not build capsid-host.
      - name: Build OpenSSL 3.5 for sanitizer targets
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            asan) sanitizer=address ;;
            ubsan) sanitizer=undefined ;;
            tsan) sanitizer=thread ;;
            *) echo "Unknown sanitizer matrix entry" >&2; exit 1 ;;
          esac
          compiler=cc
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            compiler=clang
          fi
          sanitizer_flags="-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all"
          # Built in the runner temp dir: extracting the tarball inside the
          # workspace dirties the checkout and trips the build-identity
          # clean-worktree gate.
          cd "${RUNNER_TEMP}"
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" > openssl.sha256
          curl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz
          sha256sum -c openssl.sha256
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider openssl --source "$PWD" | tee "${evidence}/openssl-source.json"
          # Match the Capsid compiler/runtime and instrument the provider's C
          # implementation, including paths normally implemented in assembly.
          CC="${compiler}" CFLAGS="${sanitizer_flags}" CXXFLAGS="${sanitizer_flags}" LDFLAGS="-fsanitize=${sanitizer}" \
            ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm
          make -j2
          sudo make install_sw

      - name: Build c-ares 1.34.5 for sanitizer targets
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            asan) sanitizer=address ;;
            ubsan) sanitizer=undefined ;;
            tsan) sanitizer=thread ;;
            *) echo "Unknown sanitizer matrix entry" >&2; exit 1 ;;
          esac
          compiler=cc
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            compiler=clang
          fi
          sanitizer_flags="-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cd "${RUNNER_TEMP}"
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          curl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013
          echo "cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz" | sha256sum -c -
          tar xzf capsid-cares.tar.gz
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider cares --source "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" | tee "${evidence}/cares-source.json"
          cmake -S "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" -B "${RUNNER_TEMP}/capsid-cares-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="${compiler}" \
            -DCMAKE_C_FLAGS="${sanitizer_flags}" \
            -DCMAKE_C_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${sanitizer}" \
            -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \
            -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF
          cmake --build "${RUNNER_TEMP}/capsid-cares-build" --parallel 2 --verbose
          sudo cmake --install "${RUNNER_TEMP}/capsid-cares-build"
          cp "${RUNNER_TEMP}/capsid-cares-build/compile_commands.json" "${evidence}/cares-compile-commands.json"

      - name: Configure ${{ matrix.name }}
        run: |
          compiler_args=()
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            compiler_args=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          fi
          host_args=(-DCMAKE_PREFIX_PATH=/opt/openssl35 -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include)
          if [ "${{ matrix.build_host }}" = "1" ]; then
            host_args+=(-DCAPSID_BUILD_HOST=ON)
          fi
          cmake -S . -B "build-${{ matrix.name }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -D${{ matrix.cmake_flag }}=ON \
            -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \
            -DCAPSID_SANDBOX_PROFILE=sanitizer \
            -DCAPSID_USE_MIMALLOC=OFF \
            -DCAPSID_BUILD_BENCHMARKS=ON \
            "${compiler_args[@]}" "${host_args[@]}"

      - name: Build ${{ matrix.name }}
        run: |
          cmake --build "build-${{ matrix.name }}" --parallel 2 --target capsid-host capsid-worker test-native-fetch-response-limits

      - name: Collect original three cases with unchanged test deadlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,shutil,subprocess,time,xml.etree.ElementTree as ET
          root=Path.cwd();build=root/'build-tsan';out=build/'three-original-observations';out.mkdir()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          names=['native_fetch_large_gzip','websocket_native_reader_lifecycle_managed','websocket_reader_scope_managed']
          inventory=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1'],text=True))
          (out/'registration.json').write_text(json.dumps(inventory,indent=2)+'\n')
          registered={r['name']:r for r in inventory['tests']};assert set(names)<=registered.keys()
          budgets={name:next(p['value'] for p in registered[name]['properties'] if p['name']=='TIMEOUT') for name in names}
          assert budgets==dict(native_fetch_large_gzip=60,websocket_native_reader_lifecycle_managed=120,websocket_reader_scope_managed=120)
          record=dict(complete=False,status='collecting-original-three-tsan-failures',createdUTC=datetime.now(timezone.utc).isoformat(),
           sourceSnapshot='63a3cc1a1ed222c6639be01c8fb41e48c29c6479',diagnosticOnly=True,qualificationNotClaimed=True,
           originalTestSourcesAndBudgetsUnchanged=True,originalProviderBuildRecipesUnchanged=True,
           actualBuiltTargets=['capsid-host','capsid-worker','test-native-fetch-response-limits'],
           actualExecutableSHA256={n:sha(build/n) for n in ['capsid-host','capsid-worker','test-native-fetch-response-limits']},
           originalPerTestBudgets=budgets,attempts=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          for attempt in range(1,4):
           folder=out/('attempt-'+str(attempt));folder.mkdir();reports=folder/'reports';reports.mkdir()
           env=dict(os.environ,ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1',UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1',TSAN_OPTIONS='halt_on_error=1',
            CAPSID_WS_REPORT_DIR=str(reports),CAPSID_WS_RUN_ID='original-tsan-three-'+str(attempt))
           start=time.monotonic()
           with (folder/'ctest.stdout.log').open('wb') as so,(folder/'ctest.stderr.log').open('wb') as se:
            result=subprocess.run(['ctest','--test-dir',str(build),'-R','^('+'|'.join(names)+')$','--parallel','1','--no-tests=error','--output-on-failure','--output-junit',str(folder/'junit.xml')],env=env,stdout=so,stderr=se,timeout=sum(budgets.values())+30)
           assert result.returncode in [0,8]
           shutil.copy2(build/'Testing/Temporary/LastTest.log',folder/'LastTest.log')
           cases=list(ET.parse(folder/'junit.xml').iter('testcase'));assert {c.attrib['name'] for c in cases}==set(names)
           bad=[c.attrib['name'] for c in cases if c.find('failure') is not None or c.find('error') is not None]
           assert all(c.find('skipped') is None for c in cases)
           record['attempts'].append(dict(attempt=attempt,exitCode=result.returncode,seconds=time.monotonic()-start,selected=3,failures=bad,
            exactRawReports={p.name:sha(p) for p in reports.iterdir() if p.is_file()}))
           save();print(json.dumps(record['attempts'][-1]),flush=True)
          for name in ['compile_commands.json','CMakeCache.txt']:shutil.copy2(build/name,out/name)
          (out/'full-build-commands.txt').write_text(subprocess.check_output(['ninja','-C',str(build),'-t','commands','capsid-host','capsid-worker','test-native-fetch-response-limits'],text=True))
          record.update(complete=True,status='three-original-tsan-case-observations-collected');save()
          PY
      - name: Preserve complete source observations and native provider records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: original-three-tsan-case-observations
          if-no-files-found: error
          path: |
            build-tsan/three-original-observations/
            ${{ runner.temp }}/capsid-native-provider-evidence/

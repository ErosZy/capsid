{
  "name": "Pinned workerd original cold-wave startup-only hold ABA controls",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "workerd-density-diagnostics": {
      "name": "Original 2048 cold ABA controls with a no-request startup hold (not qualification)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "be19fc0848c9b9640e618743a9c45dc26894a31a",
            "submodules": "recursive",
            "fetch-tags": true,
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Install and verify locked workerd reference",
          "run": "set -euo pipefail\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Install build dependencies",
          "run": "set -euo pipefail\n# Hosted probes verified this Ubuntu mirror while the ubuntu.com\n# domains failed DNS. Preserve suites, components and Signed-By.\nsudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\nsudo apt-get \"${apt_network[@]}\" install -y ninja-build libboost-system-dev libc-ares-dev openssl python3-venv linux-tools-generic\n/usr/bin/openssl version\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n"
        },
        {
          "name": "Require actual Linux perf counters for evidence controls",
          "run": "python3 -B tools/setup-hosted-perf.py"
        },
        {
          "name": "Preserve original 1024/2048-cell cold waves with real process/CPU diagnosis (not qualification)",
          "run": "sudo env PATH=\"$PATH\" CAPSID_WORKERD_REF=\"$CAPSID_WORKERD_REF\" python3 -B - <<'PY'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport hashlib,json,os,signal,subprocess,sys,threading,time,traceback\nassert sys.platform=='linux' and 'microsoft' not in os.uname().release.lower()\nroot=Path.cwd();out=root/'build-density-diagnostics';out.mkdir(exist_ok=False)\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\npending=[root];seen=set()\nwhile pending:\n directory=pending.pop()\n if directory in seen:continue\n seen.add(directory);assert directory.is_relative_to(root)\n subprocess.run(['git','config','--global','--add','safe.directory',str(directory)],check=True)\n modules=directory/'.gitmodules'\n if modules.exists():\n  p=subprocess.run(['git','config','--file',str(modules),'--get-regexp',r'^submodule\\..*\\.path$'],capture_output=True,text=True)\n  assert p.returncode in (0,1)\n  pending.extend((directory/line.split(None,1)[1]).resolve() for line in p.stdout.splitlines())\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='be19fc0848c9b9640e618743a9c45dc26894a31a'\nassert not subprocess.check_output(['git','status','--porcelain']).strip()\nworkerd=Path(os.environ['CAPSID_WORKERD_REF']);lock=json.loads((root/'tests/fixtures/workerd-ws/reference-lock.json').read_text());assert sha(workerd)==lock['binary_sha256']\ncpus=sorted(os.sched_getaffinity(0))[:4];assert len(cpus)==4;cpuset=','.join(map(str,cpus))\nimport resource\nbefore=resource.getrlimit(resource.RLIMIT_NOFILE);assert before[1]>=65536\nresource.setrlimit(resource.RLIMIT_NOFILE,(max(before[0],65536),before[1]))\napps=out/'apps';subprocess.run([sys.executable,'-B',root/'bench/gen-cold-start-apps.py',apps],check=True)\nsys.path.insert(0,str(root/'bench'))\nfrom density_conditioning import ConditionedDensityProbe\nfrom measurement_runtime import PortAllocator\nperf=json.loads((root/'build-perf-prerequisite/evidence/prerequisite.json').read_text())['selectedActualPerf']\ninputs={str(p.relative_to(root)):sha(p) for p in [root/'bench/density_probe.py',root/'bench/density_conditioning.py',root/'bench/density_control.py',root/'bench/measurement_runtime.py',root/'bench/gen-cold-start-apps.py']}\nr=dict(complete=False,productCheckout='be19fc0848c9b9640e618743a9c45dc26894a31a',sourceInputs=inputs,workerdSHA256=sha(workerd),cpuSet=cpus,attempts=[],\n originalFailureRun=43536350850,originalCount=2048,originalFiveSecondRequestTimeoutRetained=True,originalCoverageDeadlineSeconds=300,\n originalWaveCountEqualsCellCount=True,connectionParallelism=64,onlyRealPinnedWorkerdInvoked=True,noCapsidRuntimeInvoked=True,\n noProductOrFormalPerformanceQualification=True,formalPerformancePoints=0,fullV030GoalComplete=False)\ndef save():(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\nclass WatchedProbe(ConditionedDensityProbe):\n def __init__(self,profile,index,**kw):\n  super().__init__(**kw);self.profile=profile;self.index=index;self.phase='not-started';self.stop=threading.Event();self.thread=None;self.profiler=None;self.stream=None\n def prepare(self,folder,stack,size,count,ports,nonce):\n  argv=super().prepare(folder,stack,size,count,ports,nonce)\n  if self.index==1:argv.append('--control-fd=1')\n  return argv\n def wait_ready(self,tree,folder,stack,ports):\n  readinessStarted=time.monotonic()\n  self.phase='wait-ready';self.tree=tree;self.stream=(out/('process-'+str(self.index)+'.jsonl')).open('x');self.started=time.monotonic()\n  def watch():\n   while not self.stop.is_set():\n    row=dict(elapsed=time.monotonic()-self.started,phase=self.phase,rootPid=tree.root.pid)\n    try:\n     for identity in tree.discover().values():\n      p=Path('/proc')/str(identity.pid)\n      item=dict(pid=identity.pid,start=identity.start,stat=(p/'stat').read_text(),status=(p/'status').read_text(),exe=os.readlink(p/'exe'))\n      try:item['smapsRollup']=(p/'smaps_rollup').read_text();item['fds']=len(list((p/'fd').iterdir()))\n      except OSError as e:item['readError']=str(e)\n      row.setdefault('processes',[]).append(item)\n    except BaseException as e:row['observerError']=str(e)\n    self.stream.write(json.dumps(row)+'\\n');self.stream.flush();self.stop.wait(.25)\n  self.thread=threading.Thread(target=watch);self.thread.start()\n  try:\n   result=super().wait_ready(tree,folder,stack,ports)\n   if self.index==1:\n    self.phase='control-fd-real-listen-readiness'\n    expected={f's{i}':port for i,port in enumerate(ports)}\n    while True:\n     assert tree.alive() and time.monotonic()-readinessStarted<self.startup_timeout,'control readiness must complete within original startup deadline'\n     logs=list(self.out.glob('probe-*/stderr.log'));assert len(logs)==1\n     raw=logs[0].read_bytes();assert b'CAPSID_BENCH_DENSITY_V1 ' not in raw,'no business or warm requests before readiness'\n     observed={}\n     lines=raw.split(b'\\n')[:-1]\n     for line in lines:\n      value=json.loads(line)\n      assert set(value)=={'event','socket','port'} and value['event']=='listen'\n      name=value['socket'];assert name in expected and name not in observed and value['port']==expected[name]\n      observed[name]=value['port']\n     if observed==expected:break\n     time.sleep(.01)\n    r['controlFdReadyBeforeTraffic']=dict(sockets=len(observed),everyConfiguredPortMatched=True,totalReadinessSeconds=time.monotonic()-readinessStarted,withinOriginal120SecondStartupDeadline=True,noBusinessOrWarmRequests=True)\n\n   self.phase='ready-before-coverage'\n   return result\n  except BaseException:self.phase='wait-ready-failed';raise\n def cover(self,tree,counter,stack,ports,count,target,nonce,output):\n  self.phase='coverage'\n  if self.profile:\n   log=(out/('perf-'+str(self.index)+'.stderr.log')).open('xb');self.perfLog=log\n   self.profiler=subprocess.Popen([perf,'record','-q','-e','cpu-clock:u','-F','99','-g','-o',str(out/('perf-'+str(self.index)+'.data')),'-p',str(tree.root.pid)],stdout=log,stderr=log,start_new_session=True)\n  try:\n   result=super().cover(tree,counter,stack,ports,count,target,nonce,output);self.phase='coverage-passed';return result\n  except BaseException:self.phase='coverage-failed';raise\n  finally:\n   if self.profiler is not None:\n    if self.profiler.poll() is None:self.profiler.send_signal(signal.SIGINT)\n    self.profiler.wait(timeout=10);self.perfLog.close()\n def stop_observer(self):\n  self.stop.set()\n  if self.thread is not None:self.thread.join(timeout=5);assert not self.thread.is_alive()\n  if self.stream is not None:self.stream.close()\ntry:\n save()\n for index,count,profile in [(0,2048,False),(1,2048,False),(2,2048,False)]:\n  directory=out/('attempt-'+str(index));directory.mkdir();start=time.monotonic()\n  # These paths are never executed: the source API resolves all three names,\n  # but stack=workerd invokes only the independently hash-verified workerd.\n  probe=WatchedProbe(profile,index,host=out/'UNUSED-HOST-NOT-EXECUTABLE',worker=out/'UNUSED-WORKER-NOT-EXECUTABLE',workerd=workerd,apps=apps,out=directory,cpuset=cpuset,\n   warm_requests=100,parallel=64,startup_timeout=120,coverage_timeout=300)\n  attempt=dict(index=index,count=count,profiled=profile,phase='cold',passed=False)\n  try:\n   with PortAllocator().allocate(count) as lease:\n    result=probe(stack='workerd',size='10k',phase='cold',count=count,ports=list(lease.ports),release_ports=lease.release,probe_index=1,final=False)\n   attempt.update(passed=True,result=result)\n  except BaseException:attempt['error']=traceback.format_exc()\n  finally:\n   probe.stop_observer();attempt.update(seconds=time.monotonic()-start,lastStage=probe.phase);r['attempts'].append(attempt);save()\n  if profile and (out/('perf-'+str(index)+'.data')).exists():\n   with (out/('perf-'+str(index)+'.report.txt')).open('xb') as log:\n    p=subprocess.run([perf,'report','--stdio','--no-children','-i',out/('perf-'+str(index)+'.data')],stdout=log,stderr=subprocess.STDOUT)\n   attempt['perfReportExitCode']=p.returncode;save()\n assert all(sha(root/p)==h for p,h in inputs.items()) and sha(workerd)==r['workerdSHA256']\n assert not subprocess.check_output(['git','status','--porcelain']).strip()\n r.update(complete=True,status='original-workerd-2048-cold-ABA-control-fd-readiness-controls-preserved',originalAFailuresReproduced=not r['attempts'][0]['passed'] and not r['attempts'][2]['passed'],controlFdReadinessTreatmentPassed=r['attempts'][1]['passed'],sourceAndWorkerdUnmodified=True);save();print(json.dumps({k:r[k] for k in ['complete','status','originalAFailuresReproduced','controlFdReadinessTreatmentPassed','formalPerformancePoints']}))\nexcept BaseException:\n r['controllerFailure']=traceback.format_exc();save();raise\n\nPY\n"
        },
        {
          "name": "Preserve original outcomes even if the diagnostic controller fails",
          "if": "always()",
          "run": "sudo python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,tarfile\nroot=Path.cwd();folder=root/'build-density-diagnostics';folder.mkdir(exist_ok=True)\narchive=root/'build-density-timeout-evidence.tar.gz';assert not archive.exists()\nwith tarfile.open(archive,'x:gz',dereference=False) as t:t.add(folder,arcname=folder.name)\nhash=hashlib.sha256(archive.read_bytes()).hexdigest()\narchive.with_name(archive.name+'.sha256').write_text(hash+'  '+archive.name+'\\n')\n(root/'build-density-timeout-archive.json').write_text(json.dumps(dict(archiveSHA256=hash,notProductQualification=True,originalFailuresRetained=True,formalPerformancePoints=0))+'\\n')\nPY\n"
        },
        {
          "name": "Save actual density timeout and CPU evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "workerd-density-control-fd-evidence",
            "path": "build-density-timeout-evidence.tar.gz\nbuild-density-timeout-evidence.tar.gz.sha256\nbuild-density-timeout-archive.json",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

name: Private density pipelined transport using qualified production package
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  density-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact byte-preserving candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 913055de94cb61b8d95976b4a0b5011d623a452f
      - name: Set up locked reference installer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install pinned workerd reference
        run: |
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"
      - name: Fetch exact already-qualified production package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: release-wpt-hosted-evidence
          run-id: 43337806862
          repository: ErosZy/capsid
          github-token: ${{ github.token }}
          path: diagnostic-release
      - name: Qualify original controls and actual cold hot coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import base64,hashlib,json,os,shutil,subprocess,sys,tarfile,tempfile,time,traceback
          root=Path.cwd();out=root/'density-pipeline-observations';out.mkdir()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='913055de94cb61b8d95976b4a0b5011d623a452f'
          assert sha(root/'bench/density_probe.py')=='0d3eb1574ba0423bcea83e7b63b0f8c401172daaada6d5644f10cd3dee0210d2'
          packages=list((root/'diagnostic-release').rglob('capsid-0.3.0-linux-gnu.tar.gz'));assert len(packages)==1
          package=packages[0];assert sha(package)=='e77a867b1da983858f7e2a20c1e9d404ee8c9a22ee8ad025a2778102ee3451c7'
          destination=out/'package';destination.mkdir()
          with tarfile.open(package,'r:gz') as tar:
              for member in tar.getmembers():
                  assert (destination/member.name).resolve().is_relative_to(destination.resolve())
              tar.extractall(destination,filter='data')
          installed=destination/'capsid-0.3.0-linux-gnu';binary=installed/'bin'
          identity=(installed/'share/capsid/build-info.txt').read_text()
          assert 'commit=913055de94cb61b8d95976b4a0b5011d623a452f\n' in identity and 'treeClean=true\n' in identity
          reference=Path(os.environ['CAPSID_WORKERD_REF'])
          assert sha(reference)=='50f31156a9a4c7d549f1b4753dd61eb527e1b6b0cd416e5ba3d02d64dfdee5dd'
          private=out/'proposal';(private/'bench').mkdir(parents=True);(private/'tests').mkdir()
          for n in ['density_control.py','measurement_runtime.py','gen-cold-start-apps.py']:shutil.copy2(root/'bench'/n,private/'bench'/n)
          module=base64.b64decode('');(private/'bench/density_probe.py').write_bytes(module)
          assert hashlib.sha256(module).hexdigest()=='71ea462c60325f3e64fa696ff3ff83e6cdb01e90e643dc631f24aef4a82f1ec9'
          (private/'tests/test_benchmark_density_control.py').write_bytes(base64.b64decode(''))
          (private/'tests/test_pipeline_transport.py').write_bytes(base64.b64decode(''))
          (private/'tests/fixtures').symlink_to(root/'tests/fixtures',target_is_directory=True)
          inputs={str(p):sha(p) for p in [root/'bench/density_probe.py',root/'src/host/generation_pool.cc',root/'src/host/generation_pool.h',
              private/'bench/density_probe.py',binary/'capsid-host',binary/'capsid-worker',reference]}
          record=dict(complete=False,status='controls',pid=os.getpid(),createdUTC=datetime.now(timezone.utc).isoformat(),
              privateProposalOnly=True,rootIntegrated=False,sourceCommit='913055de94cb61b8d95976b4a0b5011d623a452f',
              sourceTree='f3b1f8e0d110e8d9474a8c1a593a0cabb6297ef5',packageSHA256=sha(package),inputs=inputs,
              productionSchedulerAndFixtureTimingUnchanged=True,requestCeilingsAnd300SecondCoverageLimitUnchanged=True,
              qpsRemains64=True,actualCases=[],formalPerformancePoints=0,fullV030GoalComplete=False)
          def save():(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          assert sha(private/'tests/test_pipeline_transport.py')=='8fd7dbbb3e9e953adae6d3a7d8b1d1915c5fa89714c19312c0deff01754c9186'
          environment=dict(os.environ,CAPSID_DENSITY_PROPOSAL_BENCH=str(private/'bench'))
          for label,command in [
              ('original-density-controls',[sys.executable,'-B',str(private/'tests/test_benchmark_density_control.py'),'--module',str(private/'bench/density_control.py'),'--node',shutil.which('node')]),
              ('new-pipeline-controls',[sys.executable,'-B',str(private/'tests/test_pipeline_transport.py')]),
          ]:
              result=subprocess.run(command,capture_output=True,env=environment,timeout=90)
              (out/(label+'.stdout.log')).write_bytes(result.stdout);(out/(label+'.stderr.log')).write_bytes(result.stderr)
              assert result.returncode==0,(label,result.stderr[-2000:])
          sys.path.insert(0,str(private/'bench'))
          from density_probe import DensityProbe
          from density_control import checked_probe
          from measurement_runtime import PortAllocator
          apps=out/'apps';subprocess.run([sys.executable,'-B',str(private/'bench/gen-cold-start-apps.py'),str(apps)],check=True,capture_output=True,timeout=30)
          scratch=Path('/tmp/c78densitypipe1');scratch.mkdir(mode=0o700);tempfile.tempdir=str(scratch)
          allocator=PortAllocator();cpuset=','.join(map(str,sorted(os.sched_getaffinity(0))[:4]));record['sutCpuSet']=cpuset
          index=0
          for count,stacks in [(65,['capsid','workerd']),(128,['capsid','workerd']),(256,['capsid'])]:
              for stack in stacks:
                  for phase in ['cold','warm']:
                      index+=1;assert all(sha(Path(p))==h for p,h in inputs.items())
                      record.update(status=f'{stack}-{phase}-{count}-running');save();started=time.monotonic()
                      probe=DensityProbe(host=binary/'capsid-host',worker=binary/'capsid-worker',workerd=reference,apps=apps,out=out,cpuset=cpuset)
                      case=dict(stack=stack,phase=phase,count=count,passed=False)
                      try:
                          with allocator.allocate(1 if stack=='capsid' else count) as lease:
                              value=probe(stack=stack,size='10k',phase=phase,count=count,ports=list(lease.ports),release_ports=lease.release,probe_index=index,final=False)
                          checked_probe(value,stack,'10k',phase,count,100)
                          assert len(value['requestsPerWorker'])==count and min(value['requestsPerWorker'].values())>=(100 if phase=='warm' else 1)
                          assert value['cleanup']['ownedPidsRemaining']==0
                          case.update(passed=True,minimumPerWorker=min(value['requestsPerWorker'].values()),responses=value['correctness']['responses_checked'],pss=value['pss_readings_kb'],
                              resultFile=str(out/value['probeDirectory']/'result.json'),resultSHA256=sha(out/value['probeDirectory']/'result.json'))
                      except BaseException:
                          case.update(error=traceback.format_exc())
                      case['seconds']=time.monotonic()-started;record['actualCases'].append(case);save();print(json.dumps(case),flush=True)
          assert all(sha(Path(p))==h for p,h in inputs.items())
          record.update(complete=True,status='complete-qualified-private-transport' if all(c['passed'] for c in record['actualCases']) else 'complete-with-original-coverage-failures',
              allBoundInputsUnchanged=True,allActualCasesPassed=all(c['passed'] for c in record['actualCases']));save()
          assert record['allActualCasesPassed'],'private transport does not yet qualify; preserve all actual failures'
          PY
      - name: Retain every actual request counter process and PSS observation
        if: always()
        run: |
          tar -czf density-pipeline-observations.tar.gz density-pipeline-observations
          sha256sum density-pipeline-observations.tar.gz > density-pipeline-observations.tar.gz.sha256
      - name: Upload original private observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: density-pipeline-observations
          path: |
            density-pipeline-observations.tar.gz
            density-pipeline-observations.tar.gz.sha256

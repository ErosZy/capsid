          "if": "always()",
          "shell": "pwsh",
          "run": "@'\nfrom pathlib import Path\nimport hashlib,json\nbuild=Path('build-windows')\nnames=['capsid-host.exe','capsid-worker.exe','test-spawn-failure-recovery.exe']\nfound={name:dict(bytes=(build/name).stat().st_size,sha256=hashlib.sha256((build/name).read_bytes()).hexdigest()) for name in names if (build/name).is_file()}\n(build/'native-executable-identities.json').write_text(json.dumps(dict(expected=names,found=found),indent=2)+'\\n')\n'@ | Set-Content -LiteralPath capture-native-executables.py -Encoding utf8\npython -B capture-native-executables.py\n"
        },
        {
          "name": "Save Windows evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "windows-host-library-evidence",
            "if-no-files-found": "error",
            "path": "build-windows/windows-junit.xml\nbuild-windows/capsid-host.exe\nbuild-windows/capsid-worker.exe\nbuild-windows/test-spawn-failure-recovery.exe\nbuild-windows/native-executable-identities.json\nbuild-windows/full-registration.json\nbuild-windows/full-build-commands.txt\nbuild-windows/build.log\nbuild-windows/generated/build-info.txt\n${{ runner.temp }}/capsid-full-driver-reports/\nbuild-windows/ctest.log\nbuild-windows/Testing/Temporary/LastTest.log\nbuild-windows/workerd-compatibility/\n"
          }
        }
      ]
    },
    "hosted-evidence-index": {
      "if": "always()",
      "needs": [
        "release-wpt-and-delegated-sandbox",
        "sanitizers",
        "fuzz",
        "posix-host-library",
        "windows-host-library"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Download all hosted evidence",
          "continue-on-error": true,
          "uses": "actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53",
          "with": {
            "pattern": "*-evidence",
            "path": "hosted-evidence/inputs"
          }
        },
        {
          "name": "Generate run and content index",
          "env": {
            "RELEASE_RESULT": "${{ needs.release-wpt-and-delegated-sandbox.result }}",
            "SANITIZER_RESULT": "${{ needs.sanitizers.result }}",
            "FUZZ_RESULT": "${{ needs.fuzz.result }}",
            "MACOS_RESULT": "${{ needs.posix-host-library.result }}",
            "WINDOWS_RESULT": "${{ needs.windows-host-library.result }}"
          },
          "run": "set -euo pipefail\nmkdir -p hosted-evidence/inputs\n{\n  printf 'run_url=%s/%s/actions/runs/%s\\n' \\\n    \"${GITHUB_SERVER_URL}\" \"${GITHUB_REPOSITORY}\" \"${GITHUB_RUN_ID}\"\n  printf 'repository=%s\\n' \"${GITHUB_REPOSITORY}\"\n  printf 'commit_sha=%s\\n' \"${GITHUB_SHA}\"\n  printf 'ref=%s\\n' \"${GITHUB_REF}\"\n  printf 'release=%s\\n' \"${RELEASE_RESULT}\"\n  printf 'sanitizers=%s\\n' \"${SANITIZER_RESULT}\"\n  printf 'fuzz=%s\\n' \"${FUZZ_RESULT}\"\n  printf 'macos=%s\\n' \"${MACOS_RESULT}\"\n  printf 'windows=%s\\n' \"${WINDOWS_RESULT}\"\n} > hosted-evidence/run.txt\n# \u00a712.5: the index also records the Release package identity \u2014\n# build ID, compatibility ID, package hash and SBOM hash \u2014 from\n# the Release job's package-evidence.txt.\npackage_evidence=$(find hosted-evidence/inputs \\\n  -name package-evidence.txt -print -quit)\nif test -n \"${package_evidence}\"; then\n  cat \"${package_evidence}\" >> hosted-evidence/run.txt\nfi\n(\n  cd hosted-evidence\n  find inputs -type f -print0 |\n    sort -z |\n    xargs -0 -r sha256sum > sha256sums.txt\n  sha256sum sha256sums.txt |\n    awk '{print $1}' > evidence-tree.sha256\n)\n"
        },
        {
          "name": "Save hosted evidence index",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "hosted-evidence-index",
            "if-no-files-found": "error",
            "path": "hosted-evidence/run.txt\nhosted-evidence/sha256sums.txt\nhosted-evidence/evidence-tree.sha256\n"
          }
        },
        {
          "name": "Require every hosted job to pass",
          "env": {
            "RELEASE_RESULT": "${{ needs.release-wpt-and-delegated-sandbox.result }}",
            "SANITIZER_RESULT": "${{ needs.sanitizers.result }}",
            "FUZZ_RESULT": "${{ needs.fuzz.result }}",
            "MACOS_RESULT": "${{ needs.posix-host-library.result }}",
            "WINDOWS_RESULT": "${{ needs.windows-host-library.result }}"
          },
          "run": "test \"${RELEASE_RESULT}\" = success\ntest \"${SANITIZER_RESULT}\" = success\ntest \"${FUZZ_RESULT}\" = success\ntest \"${MACOS_RESULT}\" = success\ntest \"${WINDOWS_RESULT}\" = success\n"
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": null
  }
}

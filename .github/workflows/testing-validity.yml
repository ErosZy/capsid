name: Native Darwin pinned source terminal observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-terminals:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 991adfc40c0bc1d3fe9a58ec2877d8b5d26b0192
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install and verify the unchanged pinned native reference
        run: |
          node tools/workerd-reference.mjs install "${RUNNER_TEMP}/capsid-workerd/workerd"
          printf 'CAPSID_WORKERD_REF=%s\n' "${RUNNER_TEMP}/capsid-workerd/workerd" >> "${GITHUB_ENV}"
      - name: Preserve exact diagnostic collector and checkout identity
        run: |
          mkdir build-source-terminals
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='368668aae63542c27ffba83726e50174b4f8c3b1e09a7247969c23428d4832d5'
          Path('build-source-terminals/collector.mjs').write_bytes(raw)
          PY
          git rev-parse HEAD > build-source-terminals/checkout.txt
      - name: Observe the original large-body and abort-prefix inputs
        run: |
          node build-source-terminals/collector.mjs large build-source-terminals/large.json
          node build-source-terminals/collector.mjs abort build-source-terminals/abort.json
      - name: Preserve complete raw native reference observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: darwin-source-terminals
          if-no-files-found: error
          path: build-source-terminals/

{
  "name": "Trace actual managed admin startup transport without retries or relaxed assertions",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "diagnostics": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 180,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "name": "tsan",
              "cmake_flag": "CAPSID_ENABLE_TSAN",
              "compiler": "clang",
              "build_host": 1,
              "ctest_parallel": 1,
              "ctest_exclude": "^(wpt_conformance_not_configured|worker_package_.*|websocket_managed_(replacement-recursion|reclamation-idle))$"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "ce35c1b933a9984802b07b401b65f9cc8e73f995",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.22.x"
          }
        },
        {
          "name": "Install build and locked JavaScript dependencies",
          "run": "set -euo pipefail\n# Match the Release dependency transport and reject stale indexes.\nsudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\n# libclang-rt-dev supplies the Clang sanitizer runtimes (TSan\n# included, arch-suffixed) that the clang-based tsan matrix entry\n# links against.\nsudo apt-get \"${apt_network[@]}\" install -y ninja-build libboost-system-dev libc-ares-dev libclang-rt-dev openssl python3-venv linux-tools-generic\n/usr/bin/openssl version\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n\nsudo apt-get -o Acquire::Retries=3 install -y strace\n"
        },
        {
          "name": "Require actual Linux perf counters for evidence controls",
          "run": "python3 -B tools/setup-hosted-perf.py"
        },
        {
          "name": "Install locked independent clients and reference for sanitizers",
          "run": "set -euo pipefail\n/usr/bin/python3.12 tools/setup-ws-interop-python.py \"${RUNNER_TEMP}/capsid-ws-python\"\nprintf 'CAPSID_WS_INTEROP_PYTHON=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/bin/python\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/node-ws\" >> \"${GITHUB_ENV}\"\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Build OpenSSL 3.5 for sanitizer targets",
          "run": "set -euo pipefail\ncase \"${{ matrix.name }}\" in\n  asan) sanitizer=address ;;\n  ubsan) sanitizer=undefined ;;\n  tsan) sanitizer=thread ;;\n  *) echo \"Unknown sanitizer matrix entry\" >&2; exit 1 ;;\nesac\ncompiler=cc\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler=clang\nfi\nsanitizer_flags=\"-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all\"\n# Built in the runner temp dir: extracting the tarball inside the\n# workspace dirties the checkout and trips the build-identity\n# clean-worktree gate.\ncd \"${RUNNER_TEMP}\"\necho \"a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz\" > openssl.sha256\ncurl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz\nsha256sum -c openssl.sha256\ntar xzf openssl-3.5.7.tar.gz\ncd openssl-3.5.7\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider openssl --source \"$PWD\" | tee \"${evidence}/openssl-source.json\"\n# Match the Capsid compiler/runtime and instrument the provider's C\n# implementation, including paths normally implemented in assembly.\nCC=\"${compiler}\" CFLAGS=\"${sanitizer_flags}\" CXXFLAGS=\"${sanitizer_flags}\" LDFLAGS=\"-fsanitize=${sanitizer}\" \\\n  ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm\nmake -j2\nsudo make install_sw\n"
        },
        {
          "name": "Build c-ares 1.34.5 for sanitizer targets",
          "run": "set -euo pipefail\ncase \"${{ matrix.name }}\" in\n  asan) sanitizer=address ;;\n  ubsan) sanitizer=undefined ;;\n  tsan) sanitizer=thread ;;\n  *) echo \"Unknown sanitizer matrix entry\" >&2; exit 1 ;;\nesac\ncompiler=cc\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler=clang\nfi\nsanitizer_flags=\"-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all\"\ncd \"${RUNNER_TEMP}\"\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\ncurl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013\necho \"cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz\" | sha256sum -c -\ntar xzf capsid-cares.tar.gz\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider cares --source \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" | tee \"${evidence}/cares-source.json\"\ncmake -S \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" -B \"${RUNNER_TEMP}/capsid-cares-build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -DCMAKE_C_COMPILER=\"${compiler}\" \\\n  -DCMAKE_C_FLAGS=\"${sanitizer_flags}\" \\\n  -DCMAKE_C_FLAGS_DEBUG=\"-g -O1\" \\\n  -DCMAKE_EXE_LINKER_FLAGS=\"-fsanitize=${sanitizer}\" \\\n  -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \\\n  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \\\n  -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \\\n  -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF\ncmake --build \"${RUNNER_TEMP}/capsid-cares-build\" --parallel 2 --verbose\nsudo cmake --install \"${RUNNER_TEMP}/capsid-cares-build\"\ncp \"${RUNNER_TEMP}/capsid-cares-build/compile_commands.json\" \"${evidence}/cares-compile-commands.json\"\n"
        },
        {
          "name": "Configure ${{ matrix.name }}",
          "run": "compiler_args=()\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler_args=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)\nfi\nhost_args=(-DCMAKE_PREFIX_PATH=/opt/openssl35 -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include)\nif [ \"${{ matrix.build_host }}\" = \"1\" ]; then\n  host_args+=(-DCAPSID_BUILD_HOST=ON)\nfi\ncmake -S . -B \"build-${{ matrix.name }}\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -D${{ matrix.cmake_flag }}=ON \\\n  -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \\\n  -DCAPSID_SANDBOX_PROFILE=sanitizer \\\n  -DCAPSID_USE_MIMALLOC=OFF \\\n  -DCAPSID_BUILD_BENCHMARKS=ON \\\n  \"${compiler_args[@]}\" \"${host_args[@]}\"\n"
        },
        {
          "name": "Build ${{ matrix.name }}",
          "run": "cmake --build \"build-${{ matrix.name }}\" --parallel 2\n"
        },
        {
          "name": "Preserve complete instrumented build and registration identities",
          "run": "ninja -C \"build-${{ matrix.name }}\" -t commands > \"build-${{ matrix.name }}/full-build-commands.txt\"\nctest --test-dir \"build-${{ matrix.name }}\" --show-only=json-v1 > \"build-${{ matrix.name }}/full-registration.json\"\nctest --test-dir \"build-${{ matrix.name }}\" --show-only=json-v1 -E '${{ matrix.ctest_exclude }}' > \"build-${{ matrix.name }}/selected-registration.json\"\n"
        },
        {
          "name": "Replay original managed core shard and capture bounded admin transport diagnostics",
          "env": {
            "ASAN_OPTIONS": "detect_leaks=1:abort_on_error=1:strict_string_checks=1",
            "UBSAN_OPTIONS": "halt_on_error=1:print_stacktrace=1",
            "TSAN_OPTIONS": "halt_on_error=1",
            "CAPSID_WS_REPORT_DIR": "${{ github.workspace }}/build-${{ matrix.name }}/matrix-case-reports"
          },
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport base64,hashlib,json,os,shutil,subprocess,time,traceback,xml.etree.ElementTree as ET\nout=Path('managed-admin-diagnostics');out.mkdir()\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\nserver=Path('src/host/admin_service.cc');helper=Path('tests/helpers/ws_host_backend.mjs')\nassert sha(server)=='6a6c8e90d5ff879a3cb2773aa3fe70cd548ba531761a61b6077e13496a7654c7' and sha(helper)=='2ed476c62922be0998182a1ea86fbfe99d18209d46b2aab02f0c97c9dca158ac'\nbuild=Path('build-tsan');target='websocket_ordinary_fetch_core_managed'\nregistration=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-R','^'+target+'$']))\nassert len(registration['tests'])==1 and registration['tests'][0]['name']==target\nassert {p['name']:p['value'] for p in registration['tests'][0]['properties']}['TIMEOUT']==120\n(out/'original-selected-registration.json').write_text(json.dumps(registration,indent=2)+chr(10))\nfor path in [server,helper,Path('tests/test_websocket_ordinary_fetch.mjs'),Path('tools/workerd-ordinary-fetch-contract.mjs')]:\n    shutil.copy2(path,out/('original-'+path.name))\nrecord=dict(complete=False,status='original-untraced-reproduction-running',createdUTC=datetime.now(timezone.utc).isoformat(),sourceCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),sourceTree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),originalSourceHashes={str(p):sha(p) for p in [server,helper,Path('tests/test_websocket_ordinary_fetch.mjs'),Path('tools/workerd-ordinary-fetch-contract.mjs')]},runs=[],allOriginalPerTest120SecondLimitsRequired=True,originalRequestAndStartupDeadlinesRetained=True,noRetryOfAnIndividualAdminRequest=True,allFailuresRetained=True,rootSourceChanged=False,formalPerformancePoints=0,fullV030GoalComplete=False)\ndef save():(out/'run.json').write_text(json.dumps(record,indent=2)+chr(10))\ndef execute(label,trace=False):\n    folder=out/label;folder.mkdir()\n    report=folder/'reports';report.mkdir()\n    env={**os.environ,'CAPSID_WS_REPORT_DIR':str(report.resolve()),'CAPSID_WS_RUN_ID':label}\n    if not label.startswith('original-'):env['CAPSID_TEST_ADMIN_TRACE']='1'\n    command=['ctest','--test-dir',str(build),'--parallel','1','--no-tests=error','-R','^'+target+'$','--output-on-failure','--output-junit',str((folder/'junit.xml').resolve())]\n    if trace:command=['strace','-ff','-ttt','-yy','-s','96','-e','trace=accept,accept4,connect,close,close_range,shutdown,dup,dup2,dup3,fcntl,openat,newfstatat,read,write,sendto,recvfrom','-o',str((folder/'syscalls').resolve()),*command]\n    started=time.monotonic()\n    with (folder/'stdout.log').open('xb') as so,(folder/'stderr.log').open('xb') as se:\n        result=subprocess.run(command,stdout=so,stderr=se,env=env)\n    shutil.copy2(build/'Testing/Temporary/LastTest.log',folder/'LastTest.log')\n    cases=list(ET.parse(folder/'junit.xml').iter('testcase'));assert len(cases)==1 and cases[0].get('name')==target\n    failure=cases[0].find('failure') is not None or cases[0].find('error') is not None\n    assert (result.returncode==0)==(not failure) and cases[0].find('skipped') is None\n    reports=[]\n    for path in report.glob('*.json'):\n        data=json.loads(path.read_text());reports.append(dict(file=str(path),sha256=sha(path),complete=data.get('complete'),cases=len(data.get('cases',[])),failedCases=[dict(index=i,id=c.get('id'),failure=c.get('failure'),observation=c.get('failureObservation'),cleanupFailure=c.get('cleanupFailure')) for i,c in enumerate(data.get('cases',[])) if c.get('failure') or c.get('cleanupFailure')]))\n    row=dict(label=label,traced=trace,command=command,exitCode=result.returncode,failed=failure,seconds=time.monotonic()-started,reports=reports)\n    record['runs'].append(row);save();print(json.dumps({k:row[k] for k in ['label','exitCode','failed','seconds']}),flush=True)\nsave()\ntry:\n    shutil.copy2(build/'capsid-host',out/'original-capsid-host');shutil.copy2(build/'capsid-worker',out/'capsid-worker')\n    for i in range(5):execute('original-'+str(i))\n    server.write_bytes(base64.b64decode(''));helper.write_bytes(base64.b64decode(''))\n    assert sha(server)=='2eaf6169b3914b3304f32b041d7dad7dbe68d8d5ef4d6cf32c3d0d192e218537' and sha(helper)=='f499c809e3ff728482a1e7f4a3787608b07bae872c093f5fca070395cda83a25'\n    subprocess.run(['cmake','--build',str(build),'--target','capsid-host','--parallel','2'],check=True)\n    shutil.copy2(build/'capsid-host',out/'diagnostic-capsid-host')\n    record.update(status='bounded-instrumented-reproduction-running',diagnosticSourceHashes={str(server):sha(server),str(helper):sha(helper)});save()\n    for i in range(10):execute('diagnostic-'+str(i))\n    for i in range(10):execute('traced-'+str(i),True)\n    record.update(complete=True,status='complete-diagnostic-series-with-all-original-failures-retained',plannedRuns=25,executedRuns=len(record['runs']),failedRuns=sum(r['failed'] for r in record['runs']),binaryHashes={p.name:sha(p) for p in [out/'original-capsid-host',out/'diagnostic-capsid-host',out/'capsid-worker']},productionAcceptanceClaimed=False);save()\n    assert record['failedRuns']==0,'diagnostic series retained failing original scenarios'\nexcept BaseException:\n    record['error']=traceback.format_exc();save();raise\n\nPY\n"
        },
        {
          "name": "Save complete managed admin diagnostic evidence",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "if": "always()",
          "with": {
            "name": "managed-admin-transport-diagnostic-evidence",
            "path": "managed-admin-diagnostics/**\nbuild-tsan/compile_commands.json\nbuild-tsan/generated/build-info.txt\nbuild-tsan/full-registration.json\nbuild-tsan/CMakeCache.txt\n",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

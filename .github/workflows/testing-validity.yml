name: Private frame optimization comparison with original budgets
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frame-o2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact current qualification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a86b58ed761304a8c1de7f47aa92d5e9967be5fa
          submodules: recursive
          fetch-tags: true
      - name: Install original fuzz dependencies
        run: |
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev
      - name: Fetch immutable original actual binaries and corpus
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: fuzz-hosted-evidence
          run-id: 43358123744
          repository: ErosZy/capsid
          github-token: ${{ github.token }}
          path: original-fuzz
      - name: Compare optimization with all checks and budgets retained
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os, re, shutil, subprocess, tarfile, time
          
          root = Path.cwd()
          out = root / 'frame-o2-observations'
          out.mkdir()
          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          source_commit = 'a86b58ed761304a8c1de7f47aa92d5e9967be5fa'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source_commit
          archive = next((root / 'original-fuzz').rglob('fuzz-replay-before.tar.gz'))
          assert sha(archive) == '4cfaa77d0deb22fde4745527039e18f9b36ebd2c59aaf9f6a724da2dcd1f3479'
          original = out / 'original'
          original.mkdir()
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  assert (original / member.name).resolve().is_relative_to(original.resolve())
              tar.extractall(original, filter='data')
          old = original / 'build-fuzz/fuzz-websocket-frames'
          gold = original / 'build-fuzz/fuzz/corpus/websocket_frames'
          assert sha(old) == '3ca108061f689a2c518c644c2012baf466e72568a08c01f7a265dc93acd6f8a8'
          guard_paths = ['tests/fuzz/fuzz_websocket_frames.cc', 'src/host/ws_codec.cc',
                         'src/host/ws_stream.cc', 'src/protocol.cc']
          guards = {p: sha(root / p) for p in guard_paths}
          assert (root / guard_paths[0]).read_bytes() == (original / guard_paths[0]).read_bytes()
          gold_hashes = {p.name: sha(p) for p in gold.iterdir() if p.is_file()}
          assert len(gold_hashes) == 9
          record = dict(complete=False, diagnosticOnly=True, rootIntegrated=False,
                        createdUTC=datetime.now(timezone.utc).isoformat(), sourceCommit=source_commit,
                        originalRun=43358123744, originalArtifact=14007486183,
                        originalBinarySHA256=sha(old), sourceSHA256=guards,
                        originalCorpusSHA256=gold_hashes, observations=[], formalPerformancePoints=0,
                        originalBudgetsAndAllChecksRetained=True, fullV030GoalComplete=False)
          def save():
              (out / 'run.json').write_text(json.dumps(record, indent=2) + '\n')
          def observe(label, command, timeout):
              folder = out / label
              folder.mkdir()
              started = time.monotonic()
              timedout = False
              code = None
              with (folder / 'stdout.log').open('xb') as stdout, (folder / 'stderr.log').open('xb') as stderr:
                  try:
                      code = subprocess.run(command, stdout=stdout, stderr=stderr, timeout=timeout).returncode
                  except subprocess.TimeoutExpired:
                      timedout = True
              log = (folder / 'stderr.log').read_text(errors='replace')
              row = dict(label=label, command=command, seconds=time.monotonic()-started,
                         exitCode=code, timeout=timedout,
                         completed10000=bool(re.search(r'Done 10000 runs in ', log)),
                         fatalDiagnostic=bool(re.search(r'ERROR: (?:AddressSanitizer|LeakSanitizer)|runtime error:|WS_INVARIANT|SUMMARY:.*Sanitizer', log)),
                         stdoutSHA256=sha(folder / 'stdout.log'), stderrSHA256=sha(folder / 'stderr.log'))
              record['observations'].append(row)
              save()
              print(json.dumps(row), flush=True)
              return row
          save()
          (out / 'machine.txt').write_text(subprocess.check_output(['lscpu'], text=True))
          cmake = root / 'cmake/build_tests.cmake'
          before = cmake.read_text()
          anchor = '        # Compile every exercised project source with fuzzer/ASan/UBSan flags.'
          assert before.count(anchor) == 1
          after = before.replace(anchor,
              '        # Keep full fuzz/ASan/UBSan instrumentation and every existing gate.\n'
              '        target_compile_options(fuzz-websocket-frames PRIVATE -O2)\n' + anchor, 1)
          cmake.write_text(after)
          (out / 'build_tests.before.cmake').write_text(before)
          (out / 'build_tests.proposal.cmake').write_text(after)
          (out / 'proposal.diff').write_text(subprocess.check_output(['git', 'diff', '--', 'cmake/build_tests.cmake'], text=True))
          build = root / 'build-fuzz-o2'
          env = dict(os.environ, CC='clang', CXX='clang++')
          configure = ['cmake', '-S', str(root), '-B', str(build), '-G', 'Ninja',
                       '-DCMAKE_BUILD_TYPE=Debug', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON',
                       '-DCAPSID_BUILD_WORKER=OFF', '-DCAPSID_BUILD_FUZZERS=ON', '-DCAPSID_USE_MIMALLOC=OFF']
          result = subprocess.run(configure, capture_output=True, env=env, timeout=180)
          (out / 'configure.stdout.log').write_bytes(result.stdout)
          (out / 'configure.stderr.log').write_bytes(result.stderr)
          assert result.returncode == 0, result.stderr[-2000:]
          row = observe('build-all', ['cmake', '--build', str(build), '--parallel', '2'], 600)
          assert row['exitCode'] == 0
          compile_commands = json.loads((build / 'compile_commands.json').read_text())
          frame_commands = [c for c in compile_commands if '/fuzz-websocket-frames.dir/' in c['command']]
          assert len(frame_commands) == 4
          for command in frame_commands:
              options = command['command']
              assert '-fsanitize=fuzzer,address,undefined' in options
              assert '-fno-sanitize-recover=all' in options and '-fno-omit-frame-pointer' in options
              assert options.rfind('-O2') > options.rfind('-O1')
          record['optimizedCompileCommands'] = frame_commands
          new = build / 'fuzz-websocket-frames'
          record['optimizedBinarySHA256'] = sha(new)
          save()
          for index, seed in enumerate([2645387111, 1, 2192745715, 2]):
              # Alternate order to expose host drift; each run starts from the same immutable nine inputs.
              variants = [('o1-original', old), ('o2-proposal', new)]
              if index % 2:
                  variants.reverse()
              for variant, binary in variants:
                  label = f'{index}-{variant}-seed-{seed}'
                  corpus = out / (label + '-corpus')
                  shutil.copytree(gold, corpus)
                  observe(label, [str(binary), str(corpus), '-runs=10000', '-max_len=65536',
                                 '-timeout=2', '-rss_limit_mb=512', '-print_final_stats=1', '-seed='+str(seed)], 60)
                  assert {p.name: sha(p) for p in gold.iterdir() if p.is_file()} == gold_hashes
                  assert sha(old) == record['originalBinarySHA256']
          registration = subprocess.check_output(['ctest', '--test-dir', str(build), '--show-only=json-v1'], text=True)
          (out / 'registration.json').write_text(registration)
          tests = [t for t in json.loads(registration)['tests'] if 'fuzz' in next((p['value'] for p in t.get('properties', []) if p['name'] == 'LABELS'), [])]
          assert len(tests) == 9
          record['allFuzzRegistrations'] = tests
          suite = observe('original-nine-fuzz-ctest-gates', ['ctest', '--test-dir', str(build),
              '--no-tests=error', '--output-on-failure', '--output-junit', str(out / 'fuzz-junit.xml'), '-L', 'fuzz'], 600)
          assert all(sha(root / p) == h for p, h in guards.items())
          for p in ['compile_commands.json', 'CMakeCache.txt', 'CTestTestfile.cmake']:
              shutil.copy2(build / p, out / p)
          for p in [new, root / 'tests/fuzz/fuzz_websocket_frames.cc']:
              shutil.copy2(p, out / p.name)
          record.update(complete=True, status='original-o1-and-private-o2-comparison-complete',
                        allHarnessAndProductionSourceBytesUnchanged=True,
                        allOriginalNineFuzzGatesPassed=suite['exitCode'] == 0,
                        allProposalSeedsPassed=all(x['exitCode'] == 0 and x['completed10000'] and not x['fatalDiagnostic']
                            for x in record['observations'] if 'o2-proposal' in x['label']))
          save()
          PY
      - name: Archive comparison and failure evidence
        if: always()
        run: |
          tar -czf frame-o2-observations.tar.gz frame-o2-observations
          sha256sum frame-o2-observations.tar.gz > frame-o2-observations.tar.gz.sha256
      - name: Save private comparison
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: frame-o2-observations
          if-no-files-found: error
          path: |
            frame-o2-observations.tar.gz
            frame-o2-observations.tar.gz.sha256

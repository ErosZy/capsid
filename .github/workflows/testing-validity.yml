name: Complete byte-preserving checkout and density fixture validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-validity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host-library:
    runs-on: windows-latest
    # The measured serial Release matrix alone takes about 104 minutes.
    # Allow dependency/build time without changing individual test budgets.
    timeout-minutes: 180

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 913055de94cb61b8d95976b4a0b5011d623a452f
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Set up the locked Python WebSocket runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: '3.12.3'

      - name: Locate OpenSSL for WebSocket test certificates
        shell: pwsh
        run: |
          $git_root = Split-Path (Split-Path (Get-Command git -ErrorAction Stop).Source)
          $openssl_candidates = @(
            (Join-Path $git_root 'mingw64/bin/openssl.exe'),
            (Join-Path $git_root 'usr/bin/openssl.exe')
          )
          $openssl_fixture = $openssl_candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $openssl_fixture) { throw 'OpenSSL CLI for fixture certificates is missing' }
          & $openssl_fixture version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Split-Path $openssl_fixture) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install locked independent WebSocket clients
        shell: pwsh
        run: |
          $interop_root = Join-Path $env:RUNNER_TEMP 'capsid-ws-interop'
          python tools/setup-ws-interop-python.py $interop_root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CAPSID_WS_INTEROP_PYTHON=$interop_root\Scripts\python.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSID_WS_INTEROP_NODE_PACKAGE=$interop_root\node-ws" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install the locked native Windows workerd reference
        shell: pwsh
        run: |
          $reference_path = Join-Path $env:RUNNER_TEMP 'capsid-workerd-reference/workerd.exe'
          node tools/workerd-reference.mjs install $reference_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CAPSID_WORKERD_REF=$reference_path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSID_WORKERD_REQUIRED=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Ninja invokes `cl` via PATH, unlike the MSBuild generator that
      # resolves the toolchain itself; without the VS developer
      # environment CMake cannot find the MSVC compiler.
      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (v1.13.0; default-branch commits carry no node_modules)

      # The worker bootstrap bundles via esbuild from the locked txiki.js
      # node_modules; without this the Windows configure fails with
      # "esbuild is missing".
      - name: Install locked JavaScript dependencies
        run: |
          set -euo pipefail
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          # The vendor audit's expected tag must match cmake/build_tests.cmake
          # (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.
          git -C vendor/txiki.js fetch --depth=1 origin \
            refs/tags/v26.6.0:refs/tags/v26.6.0
        shell: bash

      # OpenSSL (static) and Boost.System/Asio (header-only) come from the
      # runner's preinstalled vcpkg; the static triplet matches the /MT CRT
      # policy pinned by the vendored txiki build. boost-asio is a separate
      # port from boost-system (the Host data plane needs <boost/asio.hpp>).
      - name: Install Windows build dependencies (vcpkg)
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            openssl c-ares boost-system boost-asio boost-beast --triplet x64-windows-static
        shell: pwsh

      # §12.5 Windows row: Host units, non-strict worker contracts and the
      # actual package contents/metadata/smoke/reproducibility gates.
      # Platform-specific Linux tests retain their explicit registration or
      # skip policy. Creating the Release archive alone does not validate it.
      # Ninja keeps this single-config like every other job; the Visual
      # Studio generator would default to Debug builds and require ctest
      # -C <config>, which quietly "Not Run"s the whole matrix. Pin the
      # compiler to cl: in a non-vcvars shell Ninja otherwise grabs mingw
      # gcc off PATH, which cannot build the CRT/winsock port.
      - name: Configure Windows host library and worker contracts
        run: |
          cmake -S . -B build-windows `
            -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
              -DCAPSID_BUILD_HOST=ON `
              -DCAPSID_BUILD_WORKER=ON `
              -DCAPSID_STRICT_WARNINGS=ON `
              -DCAPSID_USE_MIMALLOC=OFF `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
        shell: pwsh

      - name: Build original native recovery component
        shell: pwsh
        run: cmake --build build-windows --parallel 2 --target test-spawn-failure-recovery capsid-worker
      - name: Qualify native prerequisite and reject a real leaked descriptor
        shell: pwsh
        run: |
          python -c "import base64;from pathlib import Path;Path('native-driver.py').write_bytes(base64.b64decode(''))"
          python -B native-driver.py
      - name: Preserve original and private proposal observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-spawn-prerequisite-controls
          path: |
            native-spawn-controls
            native-driver.py
            tests/test_spawn_failure_recovery.cc
            src/client.cc
            build-windows/generated/build-info.txt
            build-windows/compile_commands.json

{
  "name": "Integrated portable runtime density archive qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "benchmark-controls": {
      "name": "Complete benchmark controls and real pinned workerd service-readiness evidence",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "d6b4ead0d09c75b0b1e04c10d7683b766a6d1cbf",
            "submodules": "recursive",
            "fetch-tags": true,
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Install and verify locked workerd reference",
          "run": "set -euo pipefail\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.22.x"
          }
        },
        {
          "name": "Install build dependencies",
          "run": "set -euo pipefail\n# Hosted probes verified this Ubuntu mirror while the ubuntu.com\n# domains failed DNS. Preserve suites, components and Signed-By.\nsudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\nsudo apt-get \"${apt_network[@]}\" install -y ninja-build libboost-system-dev libc-ares-dev openssl python3-venv linux-tools-generic\n/usr/bin/openssl version\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n"
        },
        {
          "name": "Build the original real Go correctness client",
          "run": "mkdir -p build-benchmark-control-tools\n(cd bench/loadgen && go build -o ../../build-benchmark-control-tools/loadgen .)\n"
        },
        {
          "name": "Run all seven complete original-budget benchmark test files",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,subprocess,sys,time\nroot=Path.cwd();out=root/'build-benchmark-control-evidence';out.mkdir(exist_ok=False)\nnode=subprocess.check_output(['which','node'],text=True).strip();loadgen=root/'build-benchmark-control-tools/loadgen'\ncases=[('qps-probe',90,['--loadgen',loadgen,'--probe',root/'bench/qps_probe.py']),('qps-control',30,[]),('qps-lane',60,['--lane',root/'bench/qps-lane.py']),\n ('density-control',30,['--node',node]),('density-conditioning',30,[]),('density-lane',30,['--lane',root/'bench/density-lane.py']),('perf-evidence',90,['--collector',root/'bench/collect-perf-point.py'])]\nr=dict(complete=False,tests=[],allOriginalBudgetsRetained=True,formalPerformancePoints=0,fullV030GoalComplete=False)\nfor label,budget,extra in cases:\n filename='test_perf_evidence.py' if label=='perf-evidence' else 'test_benchmark_'+label.replace('-','_')+'.py'\n command=[sys.executable,'-B',root/'tests'/filename,*extra];started=time.monotonic()\n with (out/(label+'.stdout.log')).open('xb') as so,(out/(label+'.stderr.log')).open('xb') as se:\n  try:p=subprocess.run(list(map(str,command)),stdout=so,stderr=se,timeout=budget);exit=p.returncode;timed=False\n  except subprocess.TimeoutExpired:exit=None;timed=True\n row=dict(label=label,originalBudgetSeconds=budget,exitCode=exit,timedOut=timed,seconds=time.monotonic()-started);r['tests'].append(row)\n (out/'result.json').write_text(json.dumps(r,indent=2)+'\\n');print(json.dumps(row),flush=True)\n assert exit==0 and not timed,label\nr['complete']=True;(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Exercise the integrated real workerd cold/readiness and warm coverage controls (not formal points)",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,subprocess,sys\nroot=Path.cwd();out=root/'build-benchmark-control-evidence/actual-workerd';out.mkdir(exist_ok=False)\nsys.path.insert(0,str(root/'bench'))\nfrom density_conditioning import ConditionedDensityProbe\nfrom density_control import checked_probe\nfrom density_evidence import validate_density_conditioning\nfrom measurement_runtime import PortAllocator\nfrom perf_evidence import PROTOCOL\nworkerd=Path(os.environ['CAPSID_WORKERD_REF']);lock=json.loads((root/'tests/fixtures/workerd-ws/reference-lock.json').read_text());assert hashlib.sha256(workerd.read_bytes()).hexdigest()==lock['binary_sha256']\napps=out/'apps';subprocess.run([sys.executable,'-B',root/'bench/gen-cold-start-apps.py',apps],check=True)\ncpus=sorted(os.sched_getaffinity(0))[:4];assert len(cpus)==4\nclass ReadOnlyArchive:\n def __init__(self,root):self.root=root\n def json(self,name):return json.loads((self.root/name).read_text())\n def jsonl(self,name):return [json.loads(s) for s in (self.root/name).read_text().splitlines()]\n def sealed(self,name):return self.root/name\nr=dict(complete=False,actualPinnedWorkerdOnly=True,noCapsidRuntimeInvoked=True,notFormalPerformanceEvidence=True,cases=[],formalPerformancePoints=0)\nfor index,(size,phase,count) in enumerate([('10k','cold',2048),('10k','warm',65),('1m','cold',8)],1):\n directory=out/('case-'+str(index));directory.mkdir()\n probe=ConditionedDensityProbe(host=out/'UNUSED-HOST',worker=out/'UNUSED-WORKER',workerd=workerd,apps=apps,out=directory,cpuset=','.join(map(str,cpus)))\n with PortAllocator().allocate(count) as lease:\n  ports=list(lease.ports);result=probe(stack='workerd',size=size,phase=phase,count=count,ports=ports,release_ports=lease.release,probe_index=1,final=False)\n pss=checked_probe(result,'workerd',size,phase,count,100);row=dict(result,ports=ports)\n validate_density_conditioning(ReadOnlyArchive(directory),('workerd',size,phase),row,result['correctness'],PROTOCOL['density'])\n r['cases'].append(dict(size=size,phase=phase,count=count,pssKiB=pss,actualStrictConditioningEvidenceReplayed=True,sourceRuntimeUnmodified=True))\n (out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\nr['complete']=True;(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n');print(json.dumps(r))\nPY\n"
        },
        {
          "name": "Validate integrated controller against exact historical source at identical low native conntrack capacity (diagnostic ABA, not formal points)",
          "run": "mkdir -p build-benchmark-control-tools\ncat > build-benchmark-control-tools/integrated-stress.py <<'PY'\nfrom pathlib import Path\nfrom contextlib import contextmanager\nfrom datetime import datetime,timezone\nimport base64,hashlib,json,os,resource,subprocess,sys,threading,time,traceback,types\nassert sys.platform=='linux' and 'microsoft' not in os.uname().release.lower()\nroot=Path.cwd();out=root/'build-benchmark-control-evidence/integrated-stress-aba';out.mkdir(exist_ok=False)\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='d6b4ead0d09c75b0b1e04c10d7683b766a6d1cbf'\nassert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='dc5684a08ddc27ef6bf3f5b788aad79ce3bb7937'\nassert not subprocess.check_output(['git','status','--porcelain']).strip()\nworkerd=Path(os.environ['CAPSID_WORKERD_REF']);lock=json.loads((root/'tests/fixtures/workerd-ws/reference-lock.json').read_text());assert sha(workerd)==lock['binary_sha256']\ncpus=sorted(os.sched_getaffinity(0))[:4];assert len(cpus)==4\nbefore=resource.getrlimit(resource.RLIMIT_NOFILE);assert before[1]>=65536\nif before[0]<65536:resource.setrlimit(resource.RLIMIT_NOFILE,(65536,before[1]))\napps=out/'apps';subprocess.run([sys.executable,'-B',root/'bench/gen-cold-start-apps.py',apps],check=True)\nsys.path.insert(0,str(root/'bench'))\nimport density_probe as module\nfrom density_conditioning import ConditionedDensityProbe\nfrom density_control import checked_probe\nfrom density_evidence import validate_density_conditioning\nfrom perf_evidence import PROTOCOL\nfrom measurement_runtime import PortAllocator\ninputs={p:sha(root/p) for p in ['bench/density_probe.py','bench/density_conditioning.py','bench/density_control.py','bench/density_evidence.py','bench/measurement_runtime.py']}\nr=dict(complete=False,createdUTC=datetime.now(timezone.utc).isoformat(),productCheckout='d6b4ead0d09c75b0b1e04c10d7683b766a6d1cbf',originalFailedRun=43555973603,\n sourceInputs=inputs,workerdSHA256=sha(workerd),cpuSet=cpus,attempts=[],originalTimeouts=dict(startup=120,request=5,coverage=300),\n originalWarmRequestsPerWorker=100,originalConnectParallelism=64,originalWaveCountEqualsCells=True,noCapsidRuntimeInvoked=True,\n observationsAreDiagnosticNotProductOrFormalPerformanceQualification=True,kernelLimitProposalNotIntegratedIntoFormalWorkflow=True,formalPerformancePoints=0,fullV030GoalComplete=False)\nfor name in ['ip_local_port_range','tcp_tw_reuse','tcp_fin_timeout','tcp_max_tw_buckets']:\n p=Path('/proc/sys/net/ipv4')/name\n if p.is_file():r.setdefault('networkPrerequisites',{})[name]=p.read_text().strip()\ndef save():(out/'result.json').write_text(json.dumps(r,indent=2)+'\\n')\nclass RawArchive:\n def __init__(self,path):self.root=path\n def json(self,name):return json.loads((self.root/name).read_text())\n def jsonl(self,name):return [json.loads(v) for v in (self.root/name).read_text().splitlines()]\n def sealed(self,name):return self.root/name\n@contextmanager\ndef traced_wave(directory,events):\n originalConnect=module.socket.create_connection;originalResponse=module.http.client.HTTPResponse;originalWave=module.validated_wave\n lock=threading.Lock();stream=(directory/'request-errors.jsonl').open('x');wave=0\n def failure(stage,port,start,error):\n  row=dict(stage=stage,port=port,operationSeconds=time.monotonic()-start,errorType=type(error).__name__,error=str(error),wave=wave)\n  with lock:stream.write(json.dumps(row)+'\\n');stream.flush()\n class WatchedSocket:\n  def __init__(self,sock,port):self.socket=sock;self.port=port\n  def __getattr__(self,name):return getattr(self.socket,name)\n  def sendall(self,*args,**kw):\n   start=time.monotonic()\n   try:return self.socket.sendall(*args,**kw)\n   except BaseException as error:failure('sendall',self.port,start,error);raise\n def connect(address,*args,**kw):\n  start=time.monotonic()\n  try:return WatchedSocket(originalConnect(address,*args,**kw),address[1])\n  except BaseException as error:failure('connect',address[1],start,error);raise\n class Response(originalResponse):\n  def __init__(self,sock,*args,**kw):self.tracePort=getattr(sock,'port',None);super().__init__(sock,*args,**kw)\n  def begin(self,*args,**kw):\n   start=time.monotonic()\n   try:return super().begin(*args,**kw)\n   except BaseException as error:failure('read-response-head',self.tracePort,start,error);raise\n  def read(self,*args,**kw):\n   start=time.monotonic()\n   try:return super().read(*args,**kw)\n   except BaseException as error:failure('read-response-body',self.tracePort,start,error);raise\n def measured(ports,nonce,**kw):\n  nonlocal wave\n  wave+=1;start=time.monotonic()\n  try:\n   result=originalWave(ports,nonce,**kw);events.append(dict(wave=wave,requests=len(ports),seconds=time.monotonic()-start,passed=True));return result\n  except BaseException:\n   events.append(dict(wave=wave,requests=len(ports),seconds=time.monotonic()-start,passed=False));raise\n module.socket.create_connection=connect;module.http.client.HTTPResponse=Response;module.validated_wave=measured\n try:yield\n finally:module.socket.create_connection=originalConnect;module.http.client.HTTPResponse=originalResponse;module.validated_wave=originalWave;stream.close()\nclass WatchedProbe(ConditionedDensityProbe):\n def wait_ready(self,tree,folder,stack,ports,*,control_log=None,**kw):\n  self.tree=tree\n  return super().wait_ready(tree,folder,stack,ports,control_log=control_log,**kw)\n\nlegacyProbe=types.ModuleType('frozen_cf4_density_probe')\nlegacyProbe.__file__='frozen-cf4/bench/density_probe.py'\nlegacyProbeBytes=base64.b64decode('')\nexec(compile(legacyProbeBytes,legacyProbe.__file__,'exec'),legacyProbe.__dict__)\nlegacyEvidence=types.ModuleType('frozen_cf4_density_evidence')\nlegacyEvidenceBytes=base64.b64decode('')\nexec(compile(legacyEvidenceBytes,'frozen-cf4/bench/density_evidence.py','exec'),legacyEvidence.__dict__)\nr['legacySource']=dict(productCheckout='6ef4eb9e0e6e9103c58a963ac103d244714637f3',densityProbeSHA256=hashlib.sha256(legacyProbeBytes).hexdigest(),densityEvidenceSHA256=hashlib.sha256(legacyEvidenceBytes).hexdigest())\nclass LegacyProbe(WatchedProbe):\n __call__=legacyProbe.DensityProbe.__call__\n def wait_ready(self,tree,folder,stack,ports,*,control_log=None):\n  self.tree=tree\n  return legacyProbe.DensityProbe.wait_ready(self,tree,folder,stack,ports,control_log=control_log)\n\ndef observer(probe,stop,path):\n with path.open('x') as stream:\n  while not stop.wait(.25):\n   row=dict(monotonic=time.monotonic())\n   for label,pid in [('client',os.getpid()),('workerd',probe.tree.root.pid if hasattr(probe,'tree') else None)]:\n    if pid is None:continue\n    proc=Path('/proc')/str(pid)\n    try:row[label]=dict(pid=pid,stat=(proc/'stat').read_text(),status=(proc/'status').read_text(),fds=len(list((proc/'fd').iterdir())))\n    except OSError as error:row[label]=dict(pid=pid,readError=str(error))\n   for label,file in [('sockstat','/proc/net/sockstat'),('memoryPressure','/proc/pressure/memory'),('cpuPressure','/proc/pressure/cpu'),('tcpNetstat','/proc/net/netstat'),('tcpSnmp','/proc/net/snmp'),('conntrackCount','/proc/sys/net/netfilter/nf_conntrack_count'),('conntrackMax','/proc/sys/net/netfilter/nf_conntrack_max'),('conntrackStats','/proc/net/stat/nf_conntrack')]:\n    try:row[label]=Path(file).read_text()\n    except OSError:pass\n   stream.write(json.dumps(row)+'\\n');stream.flush()\nassert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_OS')=='Linux'\nconntrackPath=Path('/proc/sys/net/netfilter/nf_conntrack_max');initialRunnerConntrack=int(conntrackPath.read_text());assert initialRunnerConntrack>0\noriginalConntrack=262144 # Match the already observed diagnostic capacity, not an assumed runner default.\nr['initialRunnerConntrackMax']=initialRunnerConntrack;r['controlCapacityFromObservedEarlierDiagnostic']=originalConntrack;save()\nmemoryKiB=int(next(v.split()[1] for v in Path('/proc/meminfo').read_text().splitlines() if v.startswith('MemTotal:')));assert memoryKiB>=8*1024*1024\nr['kernelProposal']=dict(parameter='net.netfilter.nf_conntrack_max',original=originalConntrack,proposal=originalConntrack,disposableRunnerOnly=True,\n noTimeWaitOrReuseOrTimeoutSettingChanged=True,notIntegratedOrQualification=True,reference='https://docs.kernel.org/networking/nf_conntrack-sysctl.html')\nr['kernelTransitions']=[]\ndef setConntrack(value):\n if int(conntrackPath.read_text())!=value:\n  p=subprocess.run(['sudo','-n','sysctl','-w','net.netfilter.nf_conntrack_max='+str(value)],capture_output=True,text=True,timeout=15)\n  r['kernelTransitions'].append(dict(value=value,exitCode=p.returncode,stdout=p.stdout,stderr=p.stderr));save();assert p.returncode==0\n assert int(conntrackPath.read_text())==value\ntry:\n save()\n plan=[(stage,limit,count) for stage,limit in [('original-A',originalConntrack),('integrated-B',originalConntrack),('restored-A',originalConntrack)] for count in [1024,768,1024,768]]\n for index,(stage,limit,count) in enumerate(plan,1):\n  setConntrack(limit);traced=True\n  directory=out/('attempt-'+str(index));directory.mkdir();start=time.monotonic();events=[]\n  probe=(WatchedProbe if stage=='integrated-B' else LegacyProbe)(host=out/'UNUSED-HOST',worker=out/'UNUSED-WORKER',workerd=workerd,apps=apps,out=directory,cpuset=','.join(map(str,cpus)),warm_requests=100,parallel=64,startup_timeout=120,coverage_timeout=300)\n  stop=threading.Event();thread=None;attempt=dict(index=index,count=count,phase='warm',traced=traced,passed=False,stage=stage,conntrackMax=int(conntrackPath.read_text()))\n  if traced:thread=threading.Thread(target=observer,args=(probe,stop,directory/'process-observations.jsonl'));thread.start()\n  @contextmanager\n  def unchanged():yield\n  try:\n   with traced_wave(directory,events) if traced else unchanged():\n    with PortAllocator().allocate(count) as lease:\n     ports=list(lease.ports);result=probe(stack='workerd',size='10k',phase='warm',count=count,ports=ports,release_ports=lease.release,probe_index=1,final=False)\n   pss=checked_probe(result,'workerd','10k','warm',count,100)\n   (validate_density_conditioning if stage=='integrated-B' else legacyEvidence.validate_density_conditioning)(RawArchive(directory),('workerd','10k','warm'),dict(result,ports=ports),result['correctness'],PROTOCOL['density'])\n   attempt.update(passed=True,wholeTreePssKiB=pss,originalFullConditioningEvidenceReparsed=True)\n  except BaseException:attempt['error']=traceback.format_exc()\n  finally:\n   stop.set()\n   if thread is not None:thread.join(timeout=5);assert not thread.is_alive()\n   kernelLog=subprocess.run(['sudo','-n','dmesg','--color=never'],capture_output=True,text=True,timeout=15)\n   attempt['kernelConntrackWarnings']=[line for line in kernelLog.stdout.splitlines() if 'nf_conntrack' in line and 'table full' in line]\n   attempt['kernelReadExitCode']=kernelLog.returncode\n   attempt.update(seconds=time.monotonic()-start,waves=events);r['attempts'].append(attempt);save();print(json.dumps({k:attempt[k] for k in ['index','count','traced','passed','seconds']}),flush=True)\n assert all(sha(root/p)==h for p,h in inputs.items()) and sha(workerd)==r['workerdSHA256']\n assert not subprocess.check_output(['git','status','--porcelain']).strip()\n r.update(complete=True,status='original-budget-warm-kernel-limit-aba-observations-preserved',sourceAndWorkerdUnchanged=True,historicalFailureCauseNotAutomaticallyClosed=True);save()\nexcept BaseException:r['controllerFailure']=traceback.format_exc();save();raise\n\nfinally:\n setConntrack(initialRunnerConntrack)\n r['initialRunnerKernelLimitRestored']=int(conntrackPath.read_text())==initialRunnerConntrack;save()\n\nPY\ncp build-benchmark-control-tools/integrated-stress.py build-benchmark-control-evidence/integrated-stress-controller.py\nsudo --preserve-env=CAPSID_WORKERD_REF,GITHUB_ACTIONS,RUNNER_OS python3 -B build-benchmark-control-tools/integrated-stress.py\npython3 -B - <<'PY'\nfrom pathlib import Path\nimport json\nr=json.loads(Path('build-benchmark-control-evidence/integrated-stress-aba/result.json').read_text())\nassert r['complete'] and r['initialRunnerKernelLimitRestored']\nassert len(r['attempts'])==12 and all(a['conntrackMax']==262144 for a in r['attempts'])\nassert all(a['passed'] for a in r['attempts'] if a['stage']=='integrated-B')\nassert any(not a['passed'] for a in r['attempts'] if a['stage']=='original-A')\nassert any(not a['passed'] for a in r['attempts'] if a['stage']=='restored-A')\nprint('integrated controller passes every original full-conditioning B; same-capacity original/restored negative controls fail')\nPY\n"
        },
        {
          "name": "Preserve every actual control outcome and failure",
          "if": "always()",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,tarfile\nroot=Path.cwd();out=root/'build-benchmark-control-evidence';out.mkdir(exist_ok=True)\np=root/'build-benchmark-control-evidence.tar.gz'\nwith tarfile.open(p,'x:gz',dereference=False) as t:t.add(out,arcname=out.name)\np.with_name(p.name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\\n')\nPY\n"
        },
        {
          "name": "Save complete original-budget benchmark control evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "workerd-runtime-archive-candidate-benchmark-evidence",
            "path": "build-benchmark-control-evidence.tar.gz\nbuild-benchmark-control-evidence.tar.gz.sha256",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

name: Actual writer pressure barrier on native sanitized POSIX workers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pressure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9abb537fb3d706b73200b43206aab38e6a047f9d
          fetch-depth: 2
          submodules: recursive
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install native Linux component tools
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update --error-on=any
          sudo apt-get install -y clang libclang-rt-dev ninja-build libboost-system-dev libssl-dev
      - name: Require native macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install boost openssl@3.5
          clang++ --version
          if ! command -v ninja >/dev/null; then brew install ninja; fi
      - name: Prepare the original worker bootstrap dependencies
        run: |
          for directory in vendor/txiki.js examples/hono-reference examples/itty-router-reference examples/h3-v2-reference examples/elysia-reference; do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          git -C vendor/txiki.js fetch --depth=1 origin refs/tags/v26.6.0:refs/tags/v26.6.0
      - name: Verify actual instrumented workers and retained negative controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,re,shlex,shutil,signal,subprocess,time,xml.etree.ElementTree as X
          root=Path.cwd();build=root/'build-writer-pressure';evidence=build/'evidence';evidence.mkdir(parents=True)
          expected={'tests/worker_writer_gate.h': 'd829dca9596cb5750c5eb3ca644d8726bba90b5b1aa54ccce76be061b0963e4b', 'tests/worker_writer_receipt.h': '6719e1ad1ea23e4e1ca42878584b041fc5bf3cc76641841f22f324cb0b4b622c', 'tests/worker_writer_fixture.cc': '5da51624b63ccca7c5859082bde2deca3558a7590d390356f2c811a5caad9f29', 'tests/test_worker_writer_gate.cc': '574e3400c228f58a70db5cc13fca9e5c1ca4e5ed6515fd4cf2c86ec84dd69d3d', 'tests/test_worker_outbound.cc': 'da01d8890eb1dd5a965f31748daa0d45fbef17b5bcb62f8d2e7c4e5fbf415878', 'src/worker_runtime_io.h': '147465809f82ea32f732d35ef8787106177c6382a6f9b4aab0997c11da44fce3', 'src/worker_runtime.cc': '596464420095d4f33f10d7c0b75ebfcf8fc615a3571f0cf79fb0143c31c344aa', 'src/client.cc': '446cfbb1c1ad0e0496084bb0a7af7c81a99d195fda49593e80eb5143a66370f2', 'cmake/build_tests.cmake': 'b9473494cf3fb7737d03f889878a03b4182b9b8f921752e45377af166b98defb'}
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert all(sha(p)==h for p,h in expected.items())
          record=dict(complete=False,platform=os.environ['RUNNER_OS'],createdUTC=datetime.now(timezone.utc).isoformat(),sourceSHA256=expected,
              snapshotCommit='cb5a8f1566e5b1cd1a64942f41991a1bc7020b02',checkoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              componentOnly=True,fullCandidateAcceptanceClaimed=False,steps=[],originalPressureBudgetSeconds=30)
          save=lambda:(evidence/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save();env=dict(os.environ,ASAN_OPTIONS='halt_on_error=1',UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1')
          def run(label,args,budget,expected_code=0,cwd=root):
           start=time.monotonic()
           with (evidence/(label+'.stdout.log')).open('wb') as so,(evidence/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen(list(map(str,args)),cwd=cwd,env=env,stdout=so,stderr=se,start_new_session=True)
            try:code=child.wait(timeout=budget)
            except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(5);code=124
           record['steps'].append(dict(label=label,exitCode=code,seconds=time.monotonic()-start,budgetSeconds=budget));save()
           if code!=expected_code:
            if (build/'Testing/Temporary/LastTest.log').is_file():shutil.copy2(build/'Testing/Temporary/LastTest.log',evidence/'LastTest.log')
            record.update(status='error',failedPhase=label,actualExitCode=code);save()
           assert code==expected_code,(label,code)
           return (evidence/(label+'.stdout.log')).read_text('utf-8')+(evidence/(label+'.stderr.log')).read_text('utf-8')
          configure=['cmake','-S',root,'-B',build,'-G','Ninja','-DCMAKE_BUILD_TYPE=Debug','-DCMAKE_C_COMPILER=clang','-DCMAKE_CXX_COMPILER=clang++',
           '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON','-DBUILD_TESTING=ON','-DCAPSID_BUILD_HOST=ON','-DCAPSID_USE_MIMALLOC=OFF',
           '-DCAPSID_ENABLE_ASAN=ON','-DCAPSID_ENABLE_UBSAN=ON',
           '-DCAPSID_SANDBOX_PROFILE='+('sanitizer' if os.environ['RUNNER_OS']=='Linux' else 'production')]
          record['leakSanitizerNotClaimedOnDarwin']=os.environ['RUNNER_OS']=='macOS';save()
          if os.environ['RUNNER_OS']=='macOS':
           configure.append('-DCMAKE_PREFIX_PATH='+subprocess.check_output(['brew','--prefix','openssl@3.5'],text=True).strip()+';'+subprocess.check_output(['brew','--prefix','boost'],text=True).strip())
          run('configure',configure,300)
          targets=['test-worker-writer-gate','test-worker-writer-fixture','test-worker-outbound','capsid-worker']
          run('build-components',['cmake','--build',build,'--parallel','2','--target',*targets,'--verbose'],1200)
          commands=subprocess.check_output(['ninja','-C',str(build),'-t','commands',*targets],text=True);(evidence/'full-build-commands.txt').write_text(commands)
          rows=json.loads((build/'compile_commands.json').read_text());units=[]
          for path in ['tests/test_worker_writer_gate.cc','tests/worker_writer_fixture.cc','tests/test_worker_outbound.cc','src/worker_runtime.cc','src/client.cc']:
           matches=[r for r in rows if r['file'].endswith('/'+path)]
           assert matches,path
           for row in matches:
            args=shlex.split(row['command']);sanitizers=set()
            for arg in args:
             if arg.startswith('-fsanitize='):sanitizers.update(arg.split('=',1)[1].split(','))
            assert {'address','undefined'}<=sanitizers and '-fno-sanitize-recover=all' in args
            obj=Path(args[args.index('-o')+1]);obj=obj if obj.is_absolute() else build/obj
            # Some separately registered targets reuse this source but are not linked
            # into the selected three components. Inspect only actual built objects.
            if not obj.is_file():continue
            symbols=subprocess.check_output(['nm','-u',str(obj)],text=True)
            assert 'asan_' in symbols and 'ubsan_' in symbols,(path,obj)
            symbol_file=evidence/('symbols-'+str(len(units))+'.txt');symbol_file.write_text(symbols)
            units.append(dict(source=path,object=str(obj.relative_to(build)),objectSHA256=sha(obj),symbolsSHA256=sha(symbol_file),command=row['command']))
          assert len(units)>=5
          record['actualInstrumentedTranslationUnits']=units;save()
          selected='^(worker_writer_gate_contract_controls|worker_outbound_websocket|worker_outbound_result_ack_pressure)$'
          registration=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-R',selected],text=True))
          (evidence/'selected-registration.json').write_text(json.dumps(registration,indent=2)+'\n')
          assert {t['name'] for t in registration['tests']}=={'worker_writer_gate_contract_controls','worker_outbound_websocket','worker_outbound_result_ack_pressure'}
          for test in registration['tests']:
           props={p['name']:p['value'] for p in test['properties']};assert props['TIMEOUT']==(10 if test['name']=='worker_writer_gate_contract_controls' else 30)
          run('actual-original-ctest-components',['ctest','--test-dir',build,'--parallel','1','--no-tests=error','--output-on-failure','--output-junit',evidence/'junit.xml','-R',selected],120)
          shutil.copy2(build/'Testing/Temporary/LastTest.log',evidence/'LastTest.log')
          cases=list(X.parse(evidence/'junit.xml').iter('testcase'));assert len(cases)==3
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          for case in cases:
           if case.get('name')=='worker_writer_gate_contract_controls':continue
           text=case.findtext('system-out','')
           assert 'pre-ACCEPT delay=0 ms PASS' in text and 'pre-ACCEPT delay=350 ms PASS' in text
           assert text.count('WRITER_BARRIER pid=')==2 and text.count('"complete":true')==2
           assert text.count('"queuePeak":4096')==2 and '"invalid":true' not in text
          legacy=evidence/'legacy';legacy.mkdir()
          parent='bae27090d82a124e063cb2fa9dcc75f36c9aa622'
          for path in ['tests/test_worker_outbound.cc','tests/worker_writer_fixture.cc','tests/worker_writer_gate.h']:
           raw=subprocess.check_output(['git','show',parent+':'+path]);(legacy/Path(path).name).write_bytes(raw)
          old=legacy/'test_worker_outbound.cc';text=old.read_text()
          needle='    ok(capsid_worker_dial_accept(peer.worker,dial.dial_id,1,1024*1024,"chat"),"ACCEPT under pressure");'
          assert text.count(needle)==1;old.write_text(text.replace(needle,'    std::this_thread::sleep_for(std::chrono::milliseconds(350));\n'+needle))
          def legacy_binary(target,file):
           row,=[r for r in rows if r['file'].endswith('/tests/'+file)]
           args=shlex.split(row['command']);args[args.index('-c')+1]=str(legacy/file);obj=legacy/(file+'.o');args[args.index('-o')+1]=str(obj)
           args[1:1]=['-I'+str(legacy)]
           for flag in ['-MF','-MT']:
            if flag in args:args[args.index(flag)+1]=str(obj)+('.d' if flag=='-MF' else '')
           run('compile-legacy-'+target,args,120,cwd=build)
           line,=[line for line in commands.splitlines() if ' -o '+target+' ' in line]
           args=shlex.split(line.removeprefix(': && ').removesuffix(' && :'))
           matches=[i for i,arg in enumerate(args) if arg.endswith('/tests/'+file+'.o')];assert len(matches)==1
           args[matches[0]]=str(obj);exe=legacy/target;args[args.index('-o')+1]=str(exe)
           run('link-legacy-'+target,args,120,cwd=build);return exe
          old_fixture=legacy_binary('test-worker-writer-fixture','worker_writer_fixture.cc');old_test=legacy_binary('test-worker-outbound','test_worker_outbound.cc')
          negative=run('actual-original-slow-host-negative',[old_test,old_fixture,'ack-pressure'],30,1,cwd=build)
          assert 'one assigned cancel after observed ACCEPT before open dispatch' in negative
          assert '"ack":0' in negative and '"blockedAcks":0' in negative and '"invalid":true' in negative
          assert all(sha(p)==h for p,h in expected.items()) and not list(build.glob('capsid-test-writer-*.receipt'))
          for file in evidence.glob('actual-original-ctest-components.*.log'):
           text=file.read_text();assert all(marker not in text for marker in ['ERROR: AddressSanitizer','ERROR: LeakSanitizer','runtime error:'])
          record.update(complete=True,status='native-sanitized-observed-pressure-barrier-pass-original-timer-race-rejected',actualPressureCases=4,
              actualDelayedAcceptCases=2,actualOriginalTimerRaceReproduced=True,originalUnitAndCtestAssertionsRetained=True,
              actualNaturalWorkerExitAndReapRequired=True,noOwnedReceiptResidue=True,
              binaries={name:sha(build/name) for name in targets},
              fullRuntimeAndNativeProviderInstrumentationNotClaimed=True,fullV030GoalComplete=False)
          save();print(json.dumps(record,indent=2))
          PY
      - name: Preserve full native observations and instrumentation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: writer-pressure-${{ runner.os }}
          if-no-files-found: error
          path: |
            build-writer-pressure/evidence/
            build-writer-pressure/CMakeCache.txt
            build-writer-pressure/compile_commands.json

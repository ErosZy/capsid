{
  "name": "Resolve fixed-corpus fuzz cost using interleaved exact inputs and kernel CPU time",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "fuzz": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "b38ed48c4dbde4b383e9ed7d72ea2cfd0b4c1901",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Install Clang and Ninja",
          "run": "sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\nsudo apt-get \"${apt_network[@]}\" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev\n"
        },
        {
          "name": "Configure fuzz harnesses",
          "env": {
            "CC": "clang",
            "CXX": "clang++"
          },
          "run": "cmake -S . -B build-fuzz -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -DCAPSID_BUILD_WORKER=OFF \\\n  -DCAPSID_BUILD_FUZZERS=ON \\\n  -DCAPSID_USE_MIMALLOC=OFF\n"
        },
        {
          "name": "Build fuzz harnesses",
          "run": "cmake --build build-fuzz --parallel 2"
        },
        {
          "name": "Replay identical retained inputs in ABBA order with kernel CPU accounting",
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport base64,hashlib,io,json,os,resource,shutil,subprocess,tarfile,threading,time,traceback\nout=Path('exact-cpu-evidence');out.mkdir()\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\npayload=base64.b64decode('')\nassert hashlib.sha256(payload).hexdigest()=='46aa16330ff584bf69165d7490d164cfaff5b7bec1799d7952f111af33087501'\nprivate=out/'inputs';private.mkdir()\nwith tarfile.open(fileobj=io.BytesIO(payload),mode='r:gz') as tar:\n    for member in tar.getmembers():assert member.isfile() and (private/member.name).resolve().is_relative_to(private.resolve())\n    tar.extractall(private,filter='data')\nsource=Path('tests/fuzz/fuzz_websocket_frames.cc');assert source.read_bytes()==(private/'original.cc').read_bytes()\nbinary=Path('build-fuzz/fuzz-websocket-frames');shutil.copy2(binary,out/'baseline-fuzz-websocket-frames')\ncommands=subprocess.check_output(['ninja','-C','build-fuzz','-t','commands']);(out/'baseline-build-commands.txt').write_bytes(commands)\nsource.write_bytes((private/'proposed.cc').read_bytes())\nsubprocess.run(['cmake','--build','build-fuzz','--target','fuzz-websocket-frames','--parallel','2'],check=True)\nassert subprocess.check_output(['ninja','-C','build-fuzz','-t','commands'])==commands\nshutil.copy2(binary,out/'proposed-fuzz-websocket-frames')\nshutil.copy2('build-fuzz/compile_commands.json',out/'compile_commands.json')\nrecord=dict(complete=False,status='exact-cpu-abba-running',createdUTC=datetime.now(timezone.utc).isoformat(),sourceCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),sourceTree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),sourceSHA256={'original':sha(private/'original.cc'),'proposed':sha(source)},binarySHA256={v:sha(out/(v+'-fuzz-websocket-frames')) for v in ['baseline','proposed']},inputFiles={str(p):sha(p) for p in private.rglob('*') if p.is_file()},runs=[],sameImmutableInputsRequired=True,allOriginalInvariantsRequired=True,eachInvocationOriginal60SecondBudget=True,productionSourcesChanged=False,rootSourceChanged=False,formalPerformancePoints=0,fullV030GoalComplete=False)\ndef save():(out/'run.json').write_text(json.dumps(record,indent=2)+chr(10))\nsave()\ntry:\n    paths=[str(p) for p in sorted((private/'after').iterdir())];assert len(paths)==165\n    for pair in range(3):\n        for slot,variant in enumerate(['baseline','proposed','proposed','baseline']):\n            label=str(pair)+'-'+str(slot)+'-'+variant\n            command=[str(out/(variant+'-fuzz-websocket-frames')),*paths,'-runs=20','-max_len=65536','-timeout=2','-rss_limit_mb=512','-print_final_stats=1']\n            before=resource.getrusage(resource.RUSAGE_CHILDREN)\n            started=time.monotonic();expired=threading.Event()\n            with (out/(label+'.stdout.log')).open('xb') as so,(out/(label+'.stderr.log')).open('xb') as se:\n                child=subprocess.Popen(command,stdout=so,stderr=se)\n                def expire():expired.set();child.kill()\n                timer=threading.Timer(60,expire);timer.daemon=True;timer.start()\n                try:code=child.wait()\n                finally:timer.cancel();timer.join()\n            elapsed=time.monotonic()-started;after=resource.getrusage(resource.RUSAGE_CHILDREN)\n            row=dict(label=label,variant=variant,abbaGroup=pair,slot=slot,command=command,exitCode=code,timeout=expired.is_set(),seconds=elapsed,userCpuSeconds=after.ru_utime-before.ru_utime,systemCpuSeconds=after.ru_stime-before.ru_stime,cpuSeconds=after.ru_utime+after.ru_stime-before.ru_utime-before.ru_stime,replayInputs=165,repetitionsPerInput=20,executedInputCalls=3300,timeoutSeconds=60,stdoutSHA256=sha(out/(label+'.stdout.log')),stderrSHA256=sha(out/(label+'.stderr.log')))\n            record['runs'].append(row);save();print(json.dumps(row),flush=True)\n            assert code==0 and not expired.is_set()\n    record.update(complete=True,status='exact-cpu-abba-completed',originalSourceUnchangedInWorkspace=True,expectedRuns=12,immutableCallsPerVariant=19800,performanceQualificationRequiresMedianCpuRatioBelowPoint95=True);save()\nexcept BaseException:\n    record.update(status='error',error=traceback.format_exc());save();raise\n\nPY\n"
        },
        {
          "name": "Save exact CPU comparison evidence",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "if": "always()",
          "with": {
            "name": "frame-exact-cpu-evidence",
            "path": "exact-cpu-evidence/**",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}

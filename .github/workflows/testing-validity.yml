      run: "cmake -S . -B build-fuzz -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -DCAPSID_BUILD_WORKER=OFF \\\n  -DCAPSID_BUILD_FUZZERS=ON\
        \ \\\n  -DCAPSID_USE_MIMALLOC=OFF\n"

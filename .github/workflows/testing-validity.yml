name: Real failed-spawn rollback on native sanitized POSIX workers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rollback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 406a4290bb21b143f3406ac0be8ed3e90893107d
          fetch-depth: 2
          submodules: recursive
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install native Linux component tools
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update --error-on=any
          sudo apt-get install -y clang libclang-rt-dev ninja-build libboost-system-dev libssl-dev libc-ares-dev
      - name: Require native macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install boost openssl@3.5 c-ares
          clang++ --version
          if ! command -v ninja >/dev/null; then brew install ninja; fi
      - name: Prepare the original worker bootstrap dependencies
        run: |
          for directory in vendor/txiki.js examples/hono-reference examples/itty-router-reference examples/h3-v2-reference examples/elysia-reference; do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          git -C vendor/txiki.js fetch --depth=1 origin refs/tags/v26.6.0:refs/tags/v26.6.0
      - name: Verify actual child reaping and original-source negative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,re,shlex,shutil,signal,subprocess,time,xml.etree.ElementTree as X
          root=Path.cwd();build=root/'build-spawn-rollback';out=build/'evidence';out.mkdir(parents=True)
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected={'src/client.cc': '5eea7efabc506235b8918edde3e4245deaa13f6aa34778b346539b382d97cf12', 'cmake/build_tests.cmake': '5b18cfb4f4cecf548efca3f6b44302d66acdb20e070ae01f04ab3a97eb7b3efc', 'tests/test_worker_spawn_rollback.cc': '4f55638d9809ec34e237d10b1f9fd36637ee48bff6f45052c77e6d3b7662cba2', 'tests/worker_spawn_rollback_hooks.h': '65a9ee84f5416ca8d7e52aba202b2a77709de81d7f0d357912252d3f455b4330'}
          assert all(sha(root/p)==h for p,h in expected.items())
          record=dict(complete=False,status='qualifying-real-post-spawn-allocation-failure-rollback',createdUTC=datetime.now(timezone.utc).isoformat(),
           platform=os.environ['RUNNER_OS'],snapshotCommit='c35c8b517a8dd6f63aa13b1775b5c47c8116764b',checkoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           sourceSHA256=expected,componentOnly=True,fullCurrentCandidateAcceptanceClaimed=False,originalRollbackBudgetSeconds=15,
           actualKernelWaitWitnessesRequired=True,productionClientContainsNoTestAdapters=True,steps=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          env=dict(os.environ,ASAN_OPTIONS='halt_on_error=1',UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1')
          def run(label,args,budget,expected_code=0,cwd=root):
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen(list(map(str,args)),cwd=cwd,env=env,stdout=so,stderr=se,start_new_session=True)
            try:code=child.wait(timeout=budget)
            except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(10);code=124
           record['steps'].append(dict(label=label,exitCode=code,budgetSeconds=budget,seconds=time.monotonic()-start));save()
           assert code==expected_code,(label,code)
           return (out/(label+'.stdout.log')).read_text('utf-8')+(out/(label+'.stderr.log')).read_text('utf-8')
          save()
          configure=['cmake','-S',root,'-B',build,'-G','Ninja','-DCMAKE_BUILD_TYPE=Debug',
           '-DCMAKE_C_COMPILER=clang','-DCMAKE_CXX_COMPILER=clang++','-DCMAKE_EXPORT_COMPILE_COMMANDS=ON',
           '-DBUILD_TESTING=ON','-DCAPSID_BUILD_HOST=ON','-DCAPSID_USE_MIMALLOC=OFF',
           '-DCAPSID_ENABLE_ASAN=ON','-DCAPSID_ENABLE_UBSAN=ON',
           '-DCAPSID_SANDBOX_PROFILE='+('sanitizer' if os.environ['RUNNER_OS']=='Linux' else 'production')]
          if os.environ['RUNNER_OS']=='macOS':
           configure.append('-DCMAKE_PREFIX_PATH='+subprocess.check_output(['brew','--prefix','openssl@3.5'],text=True).strip()+';'+subprocess.check_output(['brew','--prefix','boost'],text=True).strip())
          run('configure',configure,300)
          targets=['test-worker-spawn-rollback','test-spawn-failure-recovery','test-abi-guard']
          if os.environ['RUNNER_OS']=='Linux':targets.append('test-worker-forced-reap')
          run('build-native-controls',['cmake','--build',build,'--parallel','2','--target',*targets,'--verbose'],1200)
          commands=subprocess.check_output(['ninja','-C',str(build),'-t','commands',*targets],text=True)
          (out/'full-build-commands.txt').write_text(commands)
          rows=json.loads((build/'compile_commands.json').read_text());units=[]
          for path in ['src/client.cc','tests/test_worker_spawn_rollback.cc']:
           for row in [r for r in rows if r['file'].endswith('/'+path)]:
            args=shlex.split(row['command']);obj=Path(args[args.index('-o')+1]);obj=obj if obj.is_absolute() else build/obj
            if not obj.is_file():continue
            flags=set()
            for arg in args:
             if arg.startswith('-fsanitize='):flags.update(arg.split('=',1)[1].split(','))
            assert {'address','undefined'}<=flags and '-fno-sanitize-recover=all' in args
            symbols=subprocess.check_output(['nm','-u',str(obj)],text=True)
            assert 'asan_' in symbols and 'ubsan_' in symbols
            item=out/('symbols-'+str(len(units))+'.txt');item.write_text(symbols)
            hooked='test-worker-spawn-rollback-client.dir/' in row['command']
            assert ('CAPSID_TEST_SPAWN_ROLLBACK_RENAME=1' in row['command'])==hooked
            units.append(dict(source=path,object=str(obj.relative_to(build)),objectSHA256=sha(obj),command=row['command'],
             nativeCallsRedirectedForTestObjectOnly=hooked,symbolsSHA256=sha(item)))
          assert len(units)==3,units
          record['actualInstrumentedTranslationUnits']=units;save()
          names={'worker_spawn_rollback','spawn_failure_recovery','abi_guard_oom_countdown','abi_guard_without_worker'}
          if os.environ['RUNNER_OS']=='Linux':names.add('worker_forced_reap')
          selected='^('+'|'.join(sorted(names))+')$'
          registration=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1','-R',selected],text=True))
          (out/'selected-registration.json').write_text(json.dumps(registration,indent=2)+'\n')
          assert {t['name'] for t in registration['tests']}==names
          for test in registration['tests']:
           props={p['name']:p['value'] for p in test['properties']}
           assert props['TIMEOUT']==(15 if test['name'] in {'worker_spawn_rollback','worker_forced_reap'} else 60)
          run('actual-unchanged-budget-ctest',['ctest','--test-dir',build,'--parallel','1','--no-tests=error','--output-on-failure',
           '--output-junit',out/'junit.xml','-R',selected],240)
          shutil.copy2(build/'Testing/Temporary/LastTest.log',out/'LastTest.log')
          cases=list(X.parse(out/'junit.xml').iter('testcase'));assert len(cases)==len(names)
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          full=(out/'LastTest.log').read_text();observed=[]
          for line in full.splitlines():
           if line.startswith('SPAWN_ROLLBACK '):observed.append(dict(part.split('=',1) for part in line.split()[1:]))
          assert len(observed)==9 and {(r['mode'],r['parameter']) for r in observed}=={(str(m),str(p)) for m in range(3) for p in [0,1,3]}
          assert all(all(r[k]=='1' for k in ['injected','error','completed_before_fixture_cleanup','exact','descriptors_restored']) for r in observed)
          record['actualFixedCases']=observed;save()
          # Restore only the original production client source. Keep the very same
          # fault injection, stubborn child, real normal Worker, and kernel witnesses.
          old=out/'original-client.cc';old.write_bytes(subprocess.check_output(['git','show','4cecdfc79797f13e31902c4fe6c16ed7d9649ab3:src/client.cc']))
          row,=[r for r in rows if r['file'].endswith('/src/client.cc') and 'test-worker-spawn-rollback-client.dir/' in r['command']]
          args=shlex.split(row['command']);args[args.index('-c')+1]=str(old);obj=out/'original-client.o';args[args.index('-o')+1]=str(obj)
          for flag in ['-MF','-MT']:
           if flag in args:args[args.index(flag)+1]=str(obj)+('.d' if flag=='-MF' else '')
          run('compile-original-client-negative',args,180,cwd=build)
          line,=[l for l in commands.splitlines() if ' -o test-worker-spawn-rollback ' in l]
          args=shlex.split(line.removeprefix(': && ').removesuffix(' && :'))
          index,=[i for i,a in enumerate(args) if a.endswith('test-worker-spawn-rollback-client.dir/src/client.cc.o')]
          args[index]=str(obj);exe=out/'original-client-negative';args[args.index('-o')+1]=str(exe)
          run('link-original-client-negative',args,180,cwd=build)
          text=run('actual-original-client-negative',[exe,build/'capsid-worker',build/'test-stubborn-worker'],15,1,cwd=build)
          observed=[dict(part.split('=',1) for part in line.split()[1:]) for line in text.splitlines() if line.startswith('SPAWN_ROLLBACK ')]
          assert len(observed)==9
          for row in observed:
           assert all(row[k]=='1' for k in ['injected','error','descriptors_restored'])
           assert row['completed_before_fixture_cleanup']==('1' if row['parameter']=='0' else '0')
           assert row['exact']==('1' if row['parameter']=='0' else '0')
          assert all(sha(root/p)==h for p,h in expected.items())
          record.update(complete=True,status='native-asan-ubsan-startup-rollback-and-original-eintr-negative-qualified',actualOriginalCases=observed,
           actualOriginalInterruptedWaitFailures=6,actualFixedRollbackCases=9,originalCTestNamesAndBudgetsPreserved=True,
           actualRealHealthyRequestsBeforeAndAfter=True,actualOwnedChildReapedBeforeFixtureCleanup=True,
           leakSanitizerNotClaimedOnDarwin=os.environ['RUNNER_OS']=='macOS')
          save();print(json.dumps(record,indent=2))
          PY
      - name: Preserve full native build and wait witnesses
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-rollback-${{ runner.os }}
          if-no-files-found: error
          path: build-spawn-rollback/evidence/

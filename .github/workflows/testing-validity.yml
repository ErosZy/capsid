name: Complete raw fuzz evidence for the unchanged native recovery snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7402d3c36dfe7e10f6e37d615c280aa4d808202f
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Install Clang and Ninja
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev

      - name: Configure fuzz harnesses
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCAPSID_BUILD_WORKER=OFF \
            -DCAPSID_BUILD_FUZZERS=ON \
            -DCAPSID_USE_MIMALLOC=OFF

      - name: Build fuzz harnesses
        run: cmake --build build-fuzz --parallel 2

      - name: Preserve exact fuzz commands and original registrations
        run: |
          ninja -C build-fuzz -t commands > build-fuzz/full-build-commands.txt
          ctest --test-dir build-fuzz --show-only=json-v1 -L fuzz > build-fuzz/full-registration.json

      - name: Run bounded corpus gates
        run: |
          ctest --test-dir build-fuzz \
            --no-tests=error \
            --output-on-failure \
            --output-junit fuzz-junit.xml \
            -L fuzz

      - name: Save fuzz evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-hosted-evidence
          if-no-files-found: error
          path: |
            build-fuzz/fuzz-junit.xml
            build-fuzz/Testing/Temporary/LastTest.log
            build-fuzz/CMakeCache.txt
            build-fuzz/full-build-commands.txt
            build-fuzz/full-registration.json

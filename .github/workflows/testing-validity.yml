{
  "name": "Complete workerd control-readiness and original-budget qualification",
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "testing-validity-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "release-wpt-and-delegated-sandbox": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "6ef4eb9e0e6e9103c58a963ac103d244714637f3",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Install and verify locked workerd reference",
          "run": "set -euo pipefail\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.22.x"
          }
        },
        {
          "name": "Set up Deno",
          "uses": "denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed",
          "with": {
            "deno-version": "v2.x"
          }
        },
        {
          "name": "Install build dependencies",
          "run": "set -euo pipefail\n# Hosted probes verified this Ubuntu mirror while the ubuntu.com\n# domains failed DNS. Preserve suites, components and Signed-By.\nsudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\nsudo apt-get \"${apt_network[@]}\" install -y ninja-build libboost-system-dev libc-ares-dev openssl python3-venv linux-tools-generic\n/usr/bin/openssl version\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n"
        },
        {
          "name": "Require actual Linux perf counters for evidence controls",
          "run": "python3 -B tools/setup-hosted-perf.py"
        },
        {
          "name": "Install locked independent WebSocket clients",
          "run": "set -euo pipefail\n/usr/bin/python3.12 tools/setup-ws-interop-python.py \"${RUNNER_TEMP}/capsid-ws-python\"\nprintf 'CAPSID_WS_INTEROP_PYTHON=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/bin/python\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/node-ws\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Check out the manifest-pinned WPT revision",
          "env": {
            "WPT_DIRECTORY": "${{ runner.temp }}/wpt"
          },
          "run": "set -euo pipefail\nrepository=$(node -p \\\n  \"require('./tests/wpt/manifest.json').repository\")\ncommit=$(node -p \\\n  \"require('./tests/wpt/manifest.json').commit\")\ngit init \"${WPT_DIRECTORY}\"\ngit -C \"${WPT_DIRECTORY}\" remote add origin \"${repository}\"\ngit -C \"${WPT_DIRECTORY}\" fetch --depth=1 origin \"${commit}\"\ngit -C \"${WPT_DIRECTORY}\" checkout --detach FETCH_HEAD\ntest \"$(git -C \"${WPT_DIRECTORY}\" rev-parse HEAD)\" = \"${commit}\"\n"
        },
        {
          "name": "Build OpenSSL 3.5 for Release",
          "run": "set -euo pipefail\n# Built in the runner temp dir: extracting the tarball inside the\n# workspace dirties the checkout and trips the Release\n# clean-worktree identity gate.\ncd \"${RUNNER_TEMP}\"\necho \"a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz\" > openssl.sha256\ncurl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz\nsha256sum -c openssl.sha256\ntar xzf openssl-3.5.7.tar.gz\ncd openssl-3.5.7\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider openssl --source \"$PWD\" | tee \"${evidence}/openssl-source.json\"\n./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm\nmake -j2\nsudo make install_sw\n"
        },
        {
          "name": "Build c-ares 1.34.5 for Release",
          "run": "set -euo pipefail\ncd \"${RUNNER_TEMP}\"\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\ncurl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013\necho \"cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz\" | sha256sum -c -\ntar xzf capsid-cares.tar.gz\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider cares --source \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" | tee \"${evidence}/cares-source.json\"\ncmake -S \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" -B \"${RUNNER_TEMP}/capsid-cares-build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \\\n  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \\\n  -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \\\n  -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF\ncmake --build \"${RUNNER_TEMP}/capsid-cares-build\" --parallel 2 --verbose\nsudo cmake --install \"${RUNNER_TEMP}/capsid-cares-build\"\ncp \"${RUNNER_TEMP}/capsid-cares-build/compile_commands.json\" \"${evidence}/cares-compile-commands.json\"\n"
        },
        {
          "name": "Configure Release/LTO with WPT and benchmarks",
          "env": {
            "WPT_DIRECTORY": "${{ runner.temp }}/wpt"
          },
          "run": "cmake -S . -B build-validity -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCAPSID_BUILD_HOST=ON \\\n  -DCAPSID_ENABLE_LTO=ON \\\n  -DCAPSID_USE_MIMALLOC=OFF \\\n  -DCAPSID_BUILD_BENCHMARKS=ON \\\n  -DCAPSID_GENERATE_LINK_MAP=ON \\\n  -DCMAKE_PREFIX_PATH=/opt/openssl35 \\\n  -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include \\\n  -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \\\n  -DCAPSID_SANDBOX_PROFILE=production \\\n  -DCAPSID_WPT_ROOT=\"${WPT_DIRECTORY}\"\n"
        },
        {
          "name": "Build",
          "run": "cmake --build build-validity --parallel 2"
        },
        {
          "name": "Preserve complete production build and registration identities",
          "run": "ninja -C build-validity -t commands > build-validity/full-build-commands.txt\nctest --test-dir build-validity --show-only=json-v1 > build-validity/full-registration.json\n"
        },
        {
          "name": "Require complete workerd WebSocket comparison",
          "run": "node tools/run-workerd-ws-gate.mjs \\\n  build-validity build-validity/workerd-ws-evidence\n"
        },
        {
          "name": "Run the complete ordinary-host matrix",
          "id": "ordinary_host",
          "env": {
            "CAPSID_WS_REPORT_DIR": "${{ github.workspace }}/build-validity/ordinary-driver-reports"
          },
          "continue-on-error": true,
          "run": "rm -f build-validity/ordinary-host-exit-code.txt\nctest --test-dir build-validity --no-tests=error --show-only=json-v1 \\\n  > build-validity/ordinary-host-registration.json\nordinary_ctest_status=0\nctest --test-dir build-validity \\\n  --no-tests=error \\\n  --output-on-failure \\\n  --output-junit ordinary-host-junit.xml \\\n  --parallel 2 || ordinary_ctest_status=$?\nprintf '%s\\n' \"${ordinary_ctest_status}\" > build-validity/ordinary-host-exit-code.txt\nexit \"${ordinary_ctest_status}\"\n"
        },
        {
          "name": "Audit the versioned workerd profile without changing standard results",
          "if": "${{ !cancelled() && steps.ordinary_host.outcome != 'skipped' }}",
          "run": "set -euo pipefail\nevidence=build-validity/workerd-wpt-profile-evidence\nmkdir -p \"${evidence}\"\ncp build-validity/Testing/Temporary/LastTest.log \"${evidence}/ordinary-LastTest.log\"\ncp build-validity/ordinary-host-junit.xml \"${evidence}/ordinary-junit.xml\"\ncp build-validity/ordinary-host-exit-code.txt \"${evidence}/ordinary-exit-code.txt\"\nnode tools/run_workerd_wpt_context.mjs \\\n  --build build-validity \\\n  --registration build-validity/ordinary-host-registration.json \\\n  --output \"${evidence}/context\"\nnode tools/workerd-wpt-acceptance.mjs audit \\\n  --ctest-exit-code \"${evidence}/ordinary-exit-code.txt\" \\\n  --ordinary-outcome '${{ steps.ordinary_host.outcome }}' \\\n  --last-test \"${evidence}/ordinary-LastTest.log\" \\\n  --junit \"${evidence}/ordinary-junit.xml\" \\\n  --registration build-validity/ordinary-host-registration.json \\\n  --gate build-validity/workerd-ws-evidence \\\n  --context \"${evidence}/context/context.json\" \\\n  --build build-validity --wpt-root \"${RUNNER_TEMP}/wpt\" \\\n  --output \"${evidence}/profile-audit.json\" \\\n  --acceptance-output \"${evidence}/compatibility-acceptance.json\"\n"
        },
        {
          "name": "Display raw WPT failure separately from compatibility qualification",
          "if": "always()",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nimport json,os\np=Path('build-validity/workerd-wpt-profile-evidence/compatibility-acceptance.json')\nd=json.loads(p.read_text()) if p.exists() else {}\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:\n    stream.write('## Separate raw standards and compatibility verdicts\\n\\n')\n    stream.write('| Gate | Actual result |\\n|---|---|\\n')\n    stream.write('| Raw full CTest/WPT suite | '+('FAILED \u2014 '+str(len(d.get('rawFullSuite',{}).get('failed',[])))+' retained WPT file failures' if d.get('rawCTestExitText')=='8\\n' else 'not independently qualified here')+' |\\n')\n    stream.write('| Locked workerd compatibility profile | '+('QUALIFIED' if d.get('complete') is True and d.get('compatibilityQualified') is True else 'NOT QUALIFIED')+' |\\n')\n    stream.write('| Full WPT / standards conformance | NOT CLAIMED |\\n')\n    stream.write('\\nA successful compatibility job does not turn any raw WPT failure into a pass. Full v0.3.0 acceptance remains separate.\\n')\nPY\n"
        },
        {
          "name": "Run the privileged sandbox matrix",
          "if": "${{ !cancelled() && steps.ordinary_host.outcome != 'skipped' }}",
          "run": "set -euo pipefail\n# Binding \u00a77.9: a sandbox test that skips (77) under root is a\n# failure in the Hosted Validity workflow \u2014 the delegated\n# environment must actually execute every profile probe.\nsudo ctest --test-dir build-validity \\\n  --no-tests=error \\\n  --output-on-failure \\\n  -L sandbox 2>&1 | tee build-validity/sandbox-run.log\nif grep -q \"Skipped\" build-validity/sandbox-run.log; then\n  echo \"::error::a sandbox test skipped under root; Binding \u00a77.9 \"\\\n       \"requires every probe to execute\"\n  exit 1\nfi\n"
        },
        {
          "name": "Record package evidence (build ID, compatibility ID, package and SBOM hashes)",
          "if": "${{ !cancelled() && steps.ordinary_host.outcome != 'skipped' }}",
          "run": "set -euo pipefail\narchive=$(ls -t build-validity/capsid-*.tar.gz | head -1)\ntest -f \"${archive}\"\npackage_sha256=$(sha256sum \"${archive}\" | awk '{print $1}')\nbuild_info=build-validity/generated/build-info.txt\nbuild_id=$(sed -n 's/^buildId=//p' \"${build_info}\")\ncompatibility_id=$(sed -n 's/^compatibilityId=//p' \"${build_info}\")\ntest -n \"${build_id}\"\ntest -n \"${compatibility_id}\"\nstaging=$(mktemp -d)\ntar xzf \"${archive}\" -C \"${staging}\"\nsbom=$(find \"${staging}\" -name SBOM.spdx.json -print -quit)\ntest -n \"${sbom}\"\nsbom_sha256=$(sha256sum \"${sbom}\" | awk '{print $1}')\n{\n  printf 'build_id=%s\\n' \"${build_id}\"\n  printf 'compatibility_id=%s\\n' \"${compatibility_id}\"\n  printf 'package_archive=%s\\n' \"$(basename \"${archive}\")\"\n  printf 'package_sha256=%s\\n' \"${package_sha256}\"\n  printf 'sbom_sha256=%s\\n' \"${sbom_sha256}\"\n} > build-validity/package-evidence.txt\ncat build-validity/package-evidence.txt\n"
        },
        {
          "name": "Generate txiki.js upgrade gate report",
          "if": "${{ !cancelled() && steps.ordinary_host.outcome != 'skipped' }}",
          "run": "set -euo pipefail\nevidence=build-validity/workerd-wpt-profile-evidence\ncmp build-validity/ordinary-host-junit.xml \"${evidence}/ordinary-junit.xml\"\npython3 tools/generate-txiki-upgrade-report.py \\\n  --source-root . \\\n  --build-dir build-validity \\\n  --junit \"${evidence}/ordinary-junit.xml\" \\\n  --baseline docs/txiki-upgrade-baseline.json \\\n  --node-executable \"$(node -p 'process.execPath')\" \\\n  --workerd-python \"${CAPSID_WS_INTEROP_PYTHON}\" \\\n  --workerd-acceptance \"${evidence}/compatibility-acceptance.json\" \\\n  --workerd-last-test \"${evidence}/ordinary-LastTest.log\" \\\n  --workerd-registration build-validity/ordinary-host-registration.json \\\n  --workerd-gate build-validity/workerd-ws-evidence \\\n  --workerd-context \"${evidence}/context/context.json\" \\\n  --workerd-wpt-root \"${RUNNER_TEMP}/wpt\" \\\n  --workerd-ctest-exit-code \"${evidence}/ordinary-exit-code.txt\" \\\n  --output-json build-validity/txiki-upgrade-report.json \\\n  --output-md build-validity/txiki-upgrade-report.md\n"
        },
        {
          "name": "Require delegated cgroup v2 and network namespace passes",
          "if": "${{ !cancelled() && steps.ordinary_host.outcome != 'skipped' }}",
          "run": "docker run --rm \\\n  --privileged \\\n  --cgroupns=private \\\n  -e CAPSID_DELEGATED_SANDBOX_CONTAINER=1 \\\n  -v \"${GITHUB_WORKSPACE}:/repo:ro\" \\\n  -v \"${GITHUB_WORKSPACE}/build-validity:/build:ro\" \\\n  --entrypoint /bin/bash \\\n  ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \\\n  /repo/scripts/run-delegated-sandbox-tests.sh /build\n"
        },
        {
          "name": "Archive workerd execution evidence",
          "if": "always()",
          "run": "set -euo pipefail\nif [ -d build-validity/workerd-ws-evidence ]; then\n  tar -czf build-validity/workerd-ws-evidence.tar.gz -C build-validity workerd-ws-evidence\n  sha256sum build-validity/workerd-ws-evidence.tar.gz > build-validity/workerd-ws-evidence.tar.gz.sha256\nfi\n"
        },
        {
          "name": "Archive complete ordinary driver reports",
          "if": "always()",
          "env": {
            "REPORT_DIRECTORY": "${{ github.workspace }}/build-validity/ordinary-driver-reports",
            "RAW_ARCHIVE": "build-validity/ordinary-driver-reports.tar.gz"
          },
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,tarfile\nreport=Path(os.environ['REPORT_DIRECTORY']);archive=Path(os.environ['RAW_ARCHIVE'])\narchive.parent.mkdir(parents=True,exist_ok=True)\nwith tarfile.open(archive,'w:gz',dereference=False) as output:\n    if report.exists():output.add(report,arcname='raw-driver-reports')\ndigest=hashlib.sha256(archive.read_bytes()).hexdigest()\narchive.with_name(archive.name+'.sha256').write_text(digest+'  '+archive.name+'\\n')\nprint(json.dumps(dict(sourceExists=report.exists(),archive=str(archive),sha256=digest,originalNamesAndSymlinksPreserved=True)))\nPY\n"
        },
        {
          "name": "Save hosted Release evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "release-wpt-hosted-evidence",
            "if-no-files-found": "error",
            "path": "build-validity/ordinary-host-junit.xml\nbuild-validity/ordinary-host-registration.json\nbuild-validity/full-registration.json\nbuild-validity/full-build-commands.txt\nbuild-validity/CMakeCache.txt\nbuild-validity/compile_commands.json\nbuild-validity/generated/build-info.txt\nbuild-validity/ordinary-driver-reports.tar.gz\nbuild-validity/ordinary-driver-reports.tar.gz.sha256\nbuild-validity/ordinary-host-exit-code.txt\nbuild-validity/workerd-wpt-profile-evidence/\nbuild-validity/workerd-ws-evidence.tar.gz\nbuild-validity/workerd-ws-evidence.tar.gz.sha256\nbuild-validity/bench/build-metadata.json\nbuild-validity/txiki-upgrade-report.json\nbuild-validity/txiki-upgrade-report.md\nbuild-validity/package-evidence.txt\nbuild-perf-prerequisite/evidence/\nbuild-validity/generated/build-info.txt\nbuild-validity/capsid-*.tar.gz\n${{ runner.temp }}/capsid-native-provider-evidence/\n"
          }
        }
      ],
      "name": "Release/LTO + workerd compatibility (raw WPT failures retained)"
    },
    "sanitizers": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 180,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "name": "asan",
              "cmake_flag": "CAPSID_ENABLE_ASAN",
              "build_host": 1,
              "ctest_parallel": 2,
              "ctest_exclude": "^(wpt_conformance_not_configured|worker_package_.*|websocket_managed_(replacement-recursion|reclamation-idle))$"
            },
            {
              "name": "ubsan",
              "cmake_flag": "CAPSID_ENABLE_UBSAN",
              "build_host": 1,
              "ctest_parallel": 2,
              "ctest_exclude": "^(wpt_conformance_not_configured|worker_package_.*)$"
            },
            {
              "name": "tsan",
              "cmake_flag": "CAPSID_ENABLE_TSAN",
              "compiler": "clang",
              "build_host": 1,
              "ctest_parallel": 1,
              "ctest_exclude": "^(wpt_conformance_not_configured|worker_package_.*|websocket_managed_(replacement-recursion|reclamation-idle))$"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "6ef4eb9e0e6e9103c58a963ac103d244714637f3",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.22.x"
          }
        },
        {
          "name": "Install build and locked JavaScript dependencies",
          "run": "set -euo pipefail\n# Match the Release dependency transport and reject stale indexes.\nsudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\n# libclang-rt-dev supplies the Clang sanitizer runtimes (TSan\n# included, arch-suffixed) that the clang-based tsan matrix entry\n# links against.\nsudo apt-get \"${apt_network[@]}\" install -y ninja-build libboost-system-dev libc-ares-dev libclang-rt-dev openssl python3-venv linux-tools-generic\n/usr/bin/openssl version\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n"
        },
        {
          "name": "Require actual Linux perf counters for evidence controls",
          "run": "python3 -B tools/setup-hosted-perf.py"
        },
        {
          "name": "Install locked independent clients and reference for sanitizers",
          "run": "set -euo pipefail\n/usr/bin/python3.12 tools/setup-ws-interop-python.py \"${RUNNER_TEMP}/capsid-ws-python\"\nprintf 'CAPSID_WS_INTEROP_PYTHON=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/bin/python\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/node-ws\" >> \"${GITHUB_ENV}\"\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Build OpenSSL 3.5 for sanitizer targets",
          "run": "set -euo pipefail\ncase \"${{ matrix.name }}\" in\n  asan) sanitizer=address ;;\n  ubsan) sanitizer=undefined ;;\n  tsan) sanitizer=thread ;;\n  *) echo \"Unknown sanitizer matrix entry\" >&2; exit 1 ;;\nesac\ncompiler=cc\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler=clang\nfi\nsanitizer_flags=\"-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all\"\n# Built in the runner temp dir: extracting the tarball inside the\n# workspace dirties the checkout and trips the build-identity\n# clean-worktree gate.\ncd \"${RUNNER_TEMP}\"\necho \"a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz\" > openssl.sha256\ncurl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz\nsha256sum -c openssl.sha256\ntar xzf openssl-3.5.7.tar.gz\ncd openssl-3.5.7\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider openssl --source \"$PWD\" | tee \"${evidence}/openssl-source.json\"\n# Match the Capsid compiler/runtime and instrument the provider's C\n# implementation, including paths normally implemented in assembly.\nCC=\"${compiler}\" CFLAGS=\"${sanitizer_flags}\" CXXFLAGS=\"${sanitizer_flags}\" LDFLAGS=\"-fsanitize=${sanitizer}\" \\\n  ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm\nmake -j2\nsudo make install_sw\n"
        },
        {
          "name": "Build c-ares 1.34.5 for sanitizer targets",
          "run": "set -euo pipefail\ncase \"${{ matrix.name }}\" in\n  asan) sanitizer=address ;;\n  ubsan) sanitizer=undefined ;;\n  tsan) sanitizer=thread ;;\n  *) echo \"Unknown sanitizer matrix entry\" >&2; exit 1 ;;\nesac\ncompiler=cc\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler=clang\nfi\nsanitizer_flags=\"-fsanitize=${sanitizer} -fno-omit-frame-pointer -fno-sanitize-recover=all\"\ncd \"${RUNNER_TEMP}\"\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\ncurl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013\necho \"cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz\" | sha256sum -c -\ntar xzf capsid-cares.tar.gz\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider cares --source \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" | tee \"${evidence}/cares-source.json\"\ncmake -S \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" -B \"${RUNNER_TEMP}/capsid-cares-build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -DCMAKE_C_COMPILER=\"${compiler}\" \\\n  -DCMAKE_C_FLAGS=\"${sanitizer_flags}\" \\\n  -DCMAKE_C_FLAGS_DEBUG=\"-g -O1\" \\\n  -DCMAKE_EXE_LINKER_FLAGS=\"-fsanitize=${sanitizer}\" \\\n  -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \\\n  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \\\n  -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \\\n  -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF\ncmake --build \"${RUNNER_TEMP}/capsid-cares-build\" --parallel 2 --verbose\nsudo cmake --install \"${RUNNER_TEMP}/capsid-cares-build\"\ncp \"${RUNNER_TEMP}/capsid-cares-build/compile_commands.json\" \"${evidence}/cares-compile-commands.json\"\n"
        },
        {
          "name": "Configure ${{ matrix.name }}",
          "run": "compiler_args=()\nif [ \"${{ matrix.compiler }}\" = \"clang\" ]; then\n  compiler_args=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)\nfi\nhost_args=(-DCMAKE_PREFIX_PATH=/opt/openssl35 -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include)\nif [ \"${{ matrix.build_host }}\" = \"1\" ]; then\n  host_args+=(-DCAPSID_BUILD_HOST=ON)\nfi\ncmake -S . -B \"build-${{ matrix.name }}\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Debug \\\n  -D${{ matrix.cmake_flag }}=ON \\\n  -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \\\n  -DCAPSID_SANDBOX_PROFILE=sanitizer \\\n  -DCAPSID_USE_MIMALLOC=OFF \\\n  -DCAPSID_BUILD_BENCHMARKS=ON \\\n  \"${compiler_args[@]}\" \"${host_args[@]}\"\n"
        },
        {
          "name": "Build ${{ matrix.name }}",
          "run": "cmake --build \"build-${{ matrix.name }}\" --parallel 2\n"
        },
        {
          "name": "Preserve complete instrumented build and registration identities",
          "run": "ninja -C \"build-${{ matrix.name }}\" -t commands > \"build-${{ matrix.name }}/full-build-commands.txt\"\nctest --test-dir \"build-${{ matrix.name }}\" --show-only=json-v1 > \"build-${{ matrix.name }}/full-registration.json\"\nctest --test-dir \"build-${{ matrix.name }}\" --show-only=json-v1 -E '${{ matrix.ctest_exclude }}' > \"build-${{ matrix.name }}/selected-registration.json\"\n"
        },
        {
          "name": "Record original ASan RSS results",

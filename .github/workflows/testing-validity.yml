name: Native macOS I/O observations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-validity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-io-observations:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed source identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5cbce430739cd3433d5c318d9650cdc5d4d25440
          fetch-depth: 2

      - name: Set up the locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0

      - name: Materialize exact reviewed diagnostic inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          out=Path('build-io-observation');out.mkdir()
          assets={'macos-io-observation-r1.cc': '', 'macos-io-observation-r1.mjs': ''}
          hashes={'macos-io-observation-r1.cc': '1fc9adb1f67a88a15ab5b5056cfeddbe4922505e5356a57d1b33fba9b84904be', 'macos-io-observation-r1.mjs': '760dc22db517f080295419935c426dba3917e757ea939d901e61152bbbd1a0f6'}
          for name,data in assets.items():
            raw=base64.b64decode(data);assert hashlib.sha256(raw).hexdigest()==hashes[name]
            (out/name).write_bytes(raw)
          (out/'source-inputs.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY

      - name: Observe real stdin flags, fragmented commands and receive buffers
        run: |
          set -euo pipefail
          xcrun clang++ --version > build-io-observation/compiler-version.txt
          xcrun clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror build-io-observation/macos-io-observation-r1.cc -o build-io-observation/native-probe
          node build-io-observation/macos-io-observation-r1.mjs "${PWD}/build-io-observation/native-probe" build-io-observation/observations | tee build-io-observation/observations.stdout.log

      - name: Save original observations and exact source
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-native-io-observations
          if-no-files-found: error
          path: build-io-observation/

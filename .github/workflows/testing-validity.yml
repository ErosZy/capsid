        },
        {
          "name": "Archive sanitizer driver reports preserving original names",
          "if": "always()",
          "env": {
            "REPORT_DIRECTORY": "build-${{ matrix.name }}/matrix-case-reports"
          },
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,tarfile\nreport=Path(os.environ['REPORT_DIRECTORY'])\nreport.parent.mkdir(parents=True,exist_ok=True)\narchive=report.parent/(report.name+'.tar.gz')\nwith tarfile.open(archive,'w:gz',dereference=False) as output:\n    if report.exists():output.add(report,arcname=report.name)\ndigest=hashlib.sha256(archive.read_bytes()).hexdigest()\narchive.with_name(archive.name+'.sha256').write_text(digest+'  '+archive.name+'\\n')\nprint(json.dumps(dict(complete=True,sourceDirectory=str(report),sourceExists=report.exists(),\n    archive=str(archive),sha256=digest,originalNamesAndSymlinksPreserved=True)))\nPY\n"
        },
        {

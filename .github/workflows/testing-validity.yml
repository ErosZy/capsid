{
  "name": "Retry unacquired macOS capacity for the exact Admin ownership candidate",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "testing-validity-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "posix-host-library": {
      "runs-on": "macos-15",
      "timeout-minutes": 180,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "cf60ee1b17144c862d1891937fad60ff544aef87",
            "submodules": "recursive",
            "fetch-tags": true
          }
        },
        {
          "name": "Install macOS Host dependencies",
          "run": "brew install boost c-ares openssl@3.5"
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Configure distinct loopback peers for redirect contracts",
          "run": "set -euo pipefail\nsudo ifconfig lo0 alias 127.0.0.2 netmask 255.255.255.255\nnode --input-type=module - <<'JS'\nimport assert from 'node:assert/strict';\nimport net from 'node:net';\nimport {once} from 'node:events';\nconst servers=[];\ntry {\n  let port=0;\n  for(const host of ['127.0.0.1','127.0.0.2']) {\n    const server=net.createServer(socket=>socket.end(host));servers.push(server);\n    server.listen({host,port});await once(server,'listening');\n    assert.equal(server.address().address,host);port=server.address().port;\n  }\n  for(const host of ['127.0.0.1','127.0.0.2']) {\n    const client=net.createConnection({host,port});let body='';\n    for await(const bytes of client)body+=bytes.toString();\n    assert.equal(body,host,'distinct loopback peer receives the actual connection');\n  }\n  console.log(JSON.stringify({complete:true,loopbackPeers:2,samePort:true,actualRoundTrips:2}));\n} finally {await Promise.all(servers.map(server=>new Promise(resolve=>server.close(resolve))));}\nJS\n"
        },
        {
          "name": "Set up the locked Python WebSocket runtime",
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.12.3"
          }
        },
        {
          "name": "Install locked independent WebSocket clients",
          "run": "set -euo pipefail\npython3 tools/setup-ws-interop-python.py \"${RUNNER_TEMP}/capsid-ws-python\"\nprintf 'CAPSID_WS_INTEROP_PYTHON=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/bin/python\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/node-ws\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Install and verify locked workerd reference",
          "run": "set -euo pipefail\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Install locked JavaScript dependencies",
          "run": "set -euo pipefail\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\n"
        },
        {
          "name": "Configure macOS host library and worker contracts",
          "run": "set -euo pipefail\nnode_binary=$(node -p 'process.execPath')\ncmake -S . -B build-macos \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_PREFIX_PATH=\"$(brew --prefix openssl@3.5);$(brew --prefix boost)\" \\\n  -DCAPSID_BUILD_HOST=ON \\\n  -DCAPSID_BUILD_WORKER=ON \\\n  -DCAPSID_ENABLE_LTO=ON \\\n  -DCAPSID_HOST_TEST_NODE=\"${node_binary}\" \\\n  -DCAPSID_NODE_EXECUTABLE=\"${node_binary}\"\n"
        },
        {
          "name": "Build macOS Host, Admin transport, and unit gates",
          "run": "cmake --build build-macos --parallel 2\n# Named targets make a missing/quietly skipped Boost-backed Admin\n# surface an explicit configuration failure.\ncmake --build build-macos --parallel 2 --target \\\n  capsid-host \\\n  test-host-admin-api \\\n  test-host-admin-http \\\n  test-host-admin-service\n"
        },
        {
          "name": "Preserve complete native macOS build and registration identities",
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nimport json\nbuild=Path('build-macos');cache=(build/'CMakeCache.txt').read_text()\nassert 'CMAKE_GENERATOR:INTERNAL=Unix Makefiles' in cache\ncommands=json.loads((build/'compile_commands.json').read_text());assert commands\nlinks=[dict(file=str(p.relative_to(build)),command=p.read_text()) for p in sorted(build.rglob('link.txt'))]\nassert links\n(build/'full-build-commands.txt').write_text(json.dumps(dict(generator='Unix Makefiles',actualCompileDatabase=commands,generatedLinkCommands=links),indent=2)+'\\n')\nPY\nctest --test-dir build-macos --show-only=json-v1 -E '^(wpt_conformance_not_configured|worker_package_reproducibility)$' > build-macos/full-registration.json\n"
        },
        {
          "name": "Run POSIX host-side matrix",
          "env": {
            "CAPSID_WS_REPORT_DIR": "${{ runner.temp }}/capsid-full-driver-reports"
          },
          "run": "ctest --test-dir build-macos \\\n  --no-tests=error \\\n  --output-on-failure \\\n  --output-junit macos-junit.xml \\\n  -E '^(wpt_conformance_not_configured|worker_package_reproducibility)$'\n"
        },
        {
          "name": "Archive all native macOS driver reports",
          "if": "always()",
          "env": {
            "REPORT_DIRECTORY": "${{ runner.temp }}/capsid-full-driver-reports",
            "RAW_ARCHIVE": "native-raw-archive/macos-driver-reports.tar.gz"
          },
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,tarfile\nreport=Path(os.environ['REPORT_DIRECTORY']);archive=Path(os.environ['RAW_ARCHIVE'])\narchive.parent.mkdir(parents=True,exist_ok=True)\nwith tarfile.open(archive,'w:gz',dereference=False) as output:\n    if report.exists():output.add(report,arcname='raw-driver-reports')\ndigest=hashlib.sha256(archive.read_bytes()).hexdigest()\narchive.with_name(archive.name+'.sha256').write_text(digest+'  '+archive.name+'\\n')\nprint(json.dumps(dict(sourceExists=report.exists(),archive=str(archive),sha256=digest,originalNamesAndSymlinksPreserved=True)))\nPY\n"
        },
        {
          "name": "Save macOS evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "macos-host-library-evidence",
            "if-no-files-found": "error",
            "path": "build-macos/macos-junit.xml\nbuild-macos/Testing/Temporary/LastTest.log\nbuild-macos/CMakeCache.txt\nbuild-macos/compile_commands.json\nbuild-macos/full-build-commands.txt\nbuild-macos/full-registration.json\nbuild-macos/generated/build-info.txt\nnative-raw-archive/macos-driver-reports.tar.gz\nnative-raw-archive/macos-driver-reports.tar.gz.sha256\n"
          }
        }
      ]
    }
  }
}

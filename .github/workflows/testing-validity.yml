name: Refresh actual reference captures and verify every affected contract
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-reference-archive-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 35719ba70a041f2fc95b04af4ba449960ebf3df9
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Download original verified reference reports
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: remaining-reference-child-listeners
          run-id: 43380637489
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-original/
      - name: Install and verify original locked workerd
        run: |
          set -euo pipefail
          mkdir -p evidence/fresh-reports evidence/original-samples
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"
      - name: Capture full original130 argument groups without merging partial reports
        run: |
          set -euo pipefail
          timeout 120s node tests/test_websocket_fetch_arguments.mjs --reference-from-env 1 --openssl /usr/bin/openssl --report "${PWD}/evidence/fresh-reports/fetch-arguments-full-reference.json" > evidence/full-arguments.stdout 2> evidence/full-arguments.stderr
      - name: Preserve actual capture bytes in every affected stored sample
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib,json,shutil
          mapping=json.loads('{"workerd-owner": "owner-lifecycle-reference.json", "workerd-async-callback": "async-shared-reference.json", "workerd-cross-context": "cross-context-reference.json", "workerd-crypto": "crypto-reference.json", "workerd-fetch-resource": "fetch-resources-reference.json", "workerd-fetch-upgrade-lifetime": "fetch-upgrade-lifetime-reference.json", "workerd-fetch-arguments": "fetch-arguments-full-reference.json", "workerd-fetch-boundary": "fetch-boundary-reference.json", "workerd-fetch-proxy": "fetch-proxy-reference.json", "workerd-fetch-reader": "fetch-readers-reference.json", "workerd-fetch-transition": "fetch-transition-reference.json", "workerd-native-reader-lifecycle": "native-reader-lifecycle-reference.json", "workerd-reader-intrinsic": "reader-intrinsics-shared-reference.json", "workerd-reader-scope": "reader-scope-reference.json"}')
          receipt=[];digest=lambda b:hashlib.sha256(b).hexdigest()
          for stem,name in mapping.items():
              rawPath=Path('evidence/fresh-reports')/name if stem=='workerd-fetch-arguments' else Path('downloaded-original/reports')/name
              raw=rawPath.read_bytes();r=json.loads(raw)
              assert r['complete'] and r['mode']=='reference' and 'listenerControl' in r['inputs'] and 'listenerContract' in r['inputs']
              fixture=Path('tests/fixtures')/(stem+'-report.json');packed=Path(str(fixture)+'.gz')
              shutil.copy2(fixture,Path('evidence/original-samples')/fixture.name)
              if packed.exists():
                  shutil.copy2(packed,Path('evidence/original-samples')/packed.name)
                  metadata=json.loads(fixture.read_bytes());data=gzip.compress(raw,mtime=0);packed.write_bytes(data)
                  for key in ['source','sourceReport']:
                      if key in metadata:metadata[key]=name
                  if 'sha256' in metadata:metadata['sha256']=digest(data)
                  if 'bytes' in metadata:metadata['bytes']=len(raw)
                  if 'gzipSHA256' in metadata:metadata['gzipSHA256']=digest(data)
                  if 'rawBytes' in metadata:metadata['rawBytes']=len(raw)
                  if 'sourceReportSHA256' in metadata:metadata['sourceReportSHA256']=digest(raw)
                  if 'sourceCommit' in metadata:metadata['sourceCommit']=r['referenceLock']['source_commit']
                  if 'referenceBinarySHA256' in metadata:metadata['referenceBinarySHA256']=r['referenceLock']['binary_sha256']
                  if 'cases' in metadata:assert metadata['cases']==len(r['cases'])
                  fixture.write_text(json.dumps(metadata,indent=2)+'\n');assert gzip.decompress(packed.read_bytes())==raw
              else:fixture.write_bytes(raw);assert fixture.read_bytes()==raw
              receipt.append(dict(sample=str(fixture),sourceReport=str(rawPath),actualSourceReportSHA256=digest(raw),actualCases=len(r['cases']),unalteredActualReport=True))
          Path('evidence/actual-capture-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Execute complete original contract controls without changing validators
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          source=Path.cwd();directory=source/'evidence'
          plans=json.loads('[{"name": "native_retired_ownership_contract_controls", "args": ["--test", "--test-reporter=tap", "SOURCE_ROOT/tests/test_native_retired_ownership_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_owner_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_owner_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_async_callback_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_async_callback_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_cross_context_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_cross_context_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_fetch_resource_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_resource_contract.mjs"], "timeout": 10.0, "role": "control"}, {"name": "workerd_ordinary_fetch_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_ordinary_fetch_contract.mjs"], "timeout": 120.0, "role": "control"}, {"name": "workerd_http_codec_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_http_codec_contract.mjs"], "timeout": 120.0, "role": "control"}, {"name": "workerd_fetch_upgrade_lifetime_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_upgrade_lifetime_contract.mjs"], "timeout": 15.0, "role": "control"}, {"name": "workerd_fetch_proxy_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_proxy_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_fetch_boundary_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_boundary_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_fetch_transition_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_transition_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_fetch_arguments_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_arguments_contract.mjs"], "timeout": 60.0, "role": "control"}, {"name": "workerd_fetch_reader_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_fetch_reader_contract.mjs"], "timeout": 60.0, "role": "control"}, {"name": "workerd_reader_intrinsic_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_reader_intrinsic_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_native_reader_lifecycle_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_native_reader_lifecycle_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_reader_scope_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_reader_scope_contract.mjs"], "timeout": 60.0, "role": "control"}, {"name": "workerd_standard_reader_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_standard_reader_contract.mjs"], "timeout": 30.0, "role": "control"}, {"name": "workerd_crypto_contract_controls", "args": ["--test", "SOURCE_ROOT/tests/test_workerd_crypto_contract.mjs"], "timeout": 10.0, "role": "control"}]');commands=[]
          for plan in plans:
              args=['node',*[a.replace('SOURCE_ROOT/',str(source)+'/') for a in plan['args']]]
              commands.append('add_test('+json.dumps(plan['name'])+' '+' '.join(map(json.dumps,args))+')')
              commands.append('set_tests_properties('+json.dumps(plan['name'])+' PROPERTIES TIMEOUT '+str(plan['timeout'])+')')
          (directory/'selected-original-control-registration.json').write_text(json.dumps(plans,indent=2)+'\n')
          (directory/'CTestTestfile.cmake').write_text('\n'.join(commands)+'\n')
          subprocess.run(['ctest','--test-dir',str(directory),'--no-tests=error','--parallel','2','--output-on-failure','--output-junit',str(directory/'junit.xml')],check=True)
          PY
      - name: Save original captures, refreshed exact sample bytes and control transcripts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: remaining-reference-actual-archive-refresh
          if-no-files-found: error
          path: |
            evidence/
            tests/fixtures/workerd-*-report.json
            tests/fixtures/workerd-*-report.json.gz

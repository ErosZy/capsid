{
  "name": "Native v0.3.0 dependency-complete frozen three-lane qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "native-formal-performance": {
      "name": "Native four-CPU formal measurements (not WPT conformance)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 360,
      "steps": [
        {
          "name": "Check out recursively pinned sources",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "be19fc0848c9b9640e618743a9c45dc26894a31a",
            "submodules": "recursive",
            "fetch-tags": true,
            "persist-credentials": false
          }
        },
        {
          "name": "Require the native four-CPU measurement prerequisite before preparation",
          "run": "python3 - <<'PY'\nimport os,platform\nassert platform.system()=='Linux' and 'microsoft' not in platform.release().lower()\nassert len(os.sched_getaffinity(0))>=4, 'the original formal protocol requires four available CPUs; no two-CPU fallback'\nprint({'nativeLinux':True,'availableCpus':sorted(os.sched_getaffinity(0))})\nPY\n"
        },
        {
          "name": "Set up Node.js",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.14.0"
          }
        },
        {
          "name": "Install and verify locked workerd reference",
          "run": "set -euo pipefail\nreference=\"${RUNNER_TEMP}/capsid-workerd/workerd\"\nnode tools/workerd-reference.mjs install \"${reference}\"\nprintf 'CAPSID_WORKERD_REF=%s\\n' \"${reference}\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "1.22.12"
          }
        },
        {
          "name": "Set up Deno",
          "uses": "denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed",
          "with": {
            "deno-version": "v2.9.8"
          }
        },
        {
          "name": "Install build dependencies",
          "run": "set -euo pipefail\n# Hosted probes verified this Ubuntu mirror while the ubuntu.com\n# domains failed DNS. Preserve suites, components and Signed-By.\nsudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources\napt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)\nsudo apt-get \"${apt_network[@]}\" update --error-on=any\nsudo apt-get \"${apt_network[@]}\" install -y ninja-build libboost-system-dev libc-ares-dev openssl python3-venv linux-tools-generic nginx php8.3-fpm php8.3-cli composer unzip\n/usr/bin/openssl version\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\ndone\n"
        },
        {
          "name": "Require actual Linux perf counters for evidence controls",
          "run": "python3 -B tools/setup-hosted-perf.py"
        },
        {
          "name": "Install locked independent WebSocket clients",
          "run": "set -euo pipefail\n/usr/bin/python3.12 tools/setup-ws-interop-python.py \"${RUNNER_TEMP}/capsid-ws-python\"\nprintf 'CAPSID_WS_INTEROP_PYTHON=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/bin/python\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\\n' \"${RUNNER_TEMP}/capsid-ws-python/node-ws\" >> \"${GITHUB_ENV}\"\n"
        },
        {
          "name": "Check out the manifest-pinned WPT revision",
          "env": {
            "WPT_DIRECTORY": "${{ runner.temp }}/wpt"
          },
          "run": "set -euo pipefail\nrepository=$(node -p \\\n  \"require('./tests/wpt/manifest.json').repository\")\ncommit=$(node -p \\\n  \"require('./tests/wpt/manifest.json').commit\")\ngit init \"${WPT_DIRECTORY}\"\ngit -C \"${WPT_DIRECTORY}\" remote add origin \"${repository}\"\ngit -C \"${WPT_DIRECTORY}\" fetch --depth=1 origin \"${commit}\"\ngit -C \"${WPT_DIRECTORY}\" checkout --detach FETCH_HEAD\ntest \"$(git -C \"${WPT_DIRECTORY}\" rev-parse HEAD)\" = \"${commit}\"\n"
        },
        {
          "name": "Build OpenSSL 3.5 for Release",
          "run": "set -euo pipefail\n# Built in the runner temp dir: extracting the tarball inside the\n# workspace dirties the checkout and trips the Release\n# clean-worktree identity gate.\ncd \"${RUNNER_TEMP}\"\necho \"a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz\" > openssl.sha256\ncurl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz\nsha256sum -c openssl.sha256\ntar xzf openssl-3.5.7.tar.gz\ncd openssl-3.5.7\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider openssl --source \"$PWD\" | tee \"${evidence}/openssl-source.json\"\n./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm\nmake -j2\nsudo make install_sw\n"
        },
        {
          "name": "Build c-ares 1.34.5 for Release",
          "run": "set -euo pipefail\ncd \"${RUNNER_TEMP}\"\nevidence=\"${RUNNER_TEMP}/capsid-native-provider-evidence\"\nmkdir -p \"${evidence}\"\ncurl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013\necho \"cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz\" | sha256sum -c -\ntar xzf capsid-cares.tar.gz\npython3 \"${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py\" \\\n  --provider cares --source \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" | tee \"${evidence}/cares-source.json\"\ncmake -S \"${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013\" -B \"${RUNNER_TEMP}/capsid-cares-build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \\\n  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \\\n  -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \\\n  -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF\ncmake --build \"${RUNNER_TEMP}/capsid-cares-build\" --parallel 2 --verbose\nsudo cmake --install \"${RUNNER_TEMP}/capsid-cares-build\"\ncp \"${RUNNER_TEMP}/capsid-cares-build/compile_commands.json\" \"${evidence}/cares-compile-commands.json\"\n"
        },
        {
          "name": "Configure Release/LTO with WPT and benchmarks",
          "env": {
            "WPT_DIRECTORY": "${{ runner.temp }}/wpt"
          },
          "run": "cmake -S . -B build-validity -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCAPSID_BUILD_HOST=ON \\\n  -DCAPSID_ENABLE_LTO=ON \\\n  -DCAPSID_USE_MIMALLOC=OFF \\\n  -DCAPSID_BUILD_BENCHMARKS=ON \\\n  -DCAPSID_GENERATE_LINK_MAP=ON \\\n  -DCMAKE_PREFIX_PATH=/opt/openssl35 \\\n  -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include \\\n  -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \\\n  -DCAPSID_SANDBOX_PROFILE=production \\\n  -DCAPSID_WPT_ROOT=\"${WPT_DIRECTORY}\"\n"
        },
        {
          "name": "Build",
          "run": "cmake --build build-validity --parallel 2"
        },
        {
          "name": "Preserve complete production build and registration identities",
          "run": "ninja -C build-validity -t commands > build-validity/full-build-commands.txt\nctest --test-dir build-validity --show-only=json-v1 > build-validity/full-registration.json\n"
        },
        {
          "name": "Install the original eleven-package PHP fixture lock before any observation",
          "run": "set -euo pipefail\nmkdir -p build-validity/formal-session-evidence\npython3 -B - <<'PY'\nfrom pathlib import Path\nimport base64,hashlib\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='82d919d5df1d22a232394711e53f3b1804768a9395e009075346949372c02eba'\np=Path('bench/bench-apps/php-slim/composer.lock');assert not p.exists();p.write_bytes(data)\nPY\ngit check-ignore -q -- bench/bench-apps/php-slim/composer.lock\ncomposer --version > build-validity/formal-session-evidence/reference-composer-version.txt\ncomposer --working-dir=bench/bench-apps/php-slim install --no-interaction --no-plugins --no-scripts --no-progress --prefer-dist > build-validity/formal-session-evidence/reference-composer-install.stdout.log 2> build-validity/formal-session-evidence/reference-composer-install.stderr.log\npython3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,subprocess\np=Path('bench/bench-apps/php-slim/composer.lock')\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='82d919d5df1d22a232394711e53f3b1804768a9395e009075346949372c02eba'\nassert p.with_name('vendor').joinpath('autoload.php').is_file()\nassert not subprocess.check_output(['git','status','--porcelain']).strip()\nr=dict(complete=True,composerLockSHA256='82d919d5df1d22a232394711e53f3b1804768a9395e009075346949372c02eba',packageVersions=[dict(name=p['name'],version=p['version']) for p in json.loads(p.read_bytes())['packages']],sourceOrProtocolNotModified=True)\nPath('build-validity/formal-session-evidence/reference-php-installation.json').write_text(json.dumps(r,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Prepare all reference dependencies before observing a quiet session",
          "run": "set -euo pipefail\nvenv=\"${RUNNER_TEMP}/capsid-formal-python\"\npython3 -m venv \"${venv}\"\n\"${venv}/bin/python\" -m pip install fastapi==0.115.6 uvicorn==0.34.0 Flask==3.1.0 gunicorn==26.2.0\nmkdir -p build-validity/formal-session-evidence\n\"${venv}/bin/python\" -m pip freeze --all > build-validity/formal-session-evidence/reference-python-freeze.txt\n\"${venv}/bin/python\" -I -B -m gunicorn --version > build-validity/formal-session-evidence/reference-gunicorn-version.txt\n\"${venv}/bin/python\" -I -B -m gunicorn --help > build-validity/formal-session-evidence/reference-gunicorn-help.txt\ngrep -F -- \"--control-socket PATH\" build-validity/formal-session-evidence/reference-gunicorn-help.txt\nprintf 'CAPSID_PERF_NODE=%s\\n' \"$(node -p 'process.execPath')\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_PERF_DENO=%s\\n' \"$(command -v deno)\" >> \"${GITHUB_ENV}\"\nprintf 'CAPSID_PERF_PYTHON=%s\\n' \"${venv}/bin/python\" >> \"${GITHUB_ENV}\"\n# These are the new disposable runner's package services, not production.\n# No unknown process is killed to manufacture a quiet observation.\nsudo systemctl stop nginx.service php8.3-fpm.service\nsudo systemctl stop apt-daily.timer apt-daily-upgrade.timer\n"
        },
        {
          "name": "Prepare the original v0.2.2 binaries and independently identified observer",
          "run": "set -euo pipefail\nsudo env PATH=\"$PATH\" RUNNER_TEMP=\"$RUNNER_TEMP\" GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=Never \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  CAPSID_WORKERD_REF=\"$CAPSID_WORKERD_REF\" \\\n  CAPSID_WS_INTEROP_PYTHON=\"$CAPSID_WS_INTEROP_PYTHON\" CAPSID_WS_INTEROP_NODE_PACKAGE=\"$CAPSID_WS_INTEROP_NODE_PACKAGE\" \\\n  CAPSID_PERF_NODE=\"$CAPSID_PERF_NODE\" CAPSID_PERF_DENO=\"$CAPSID_PERF_DENO\" CAPSID_PERF_PYTHON=\"$CAPSID_PERF_PYTHON\" \\\n  python3 -B - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,re,shlex,subprocess,sys,time,traceback\nassert sys.platform=='linux' and 'microsoft' not in os.uname().release.lower()\nroot=Path.cwd();build=root/'build-validity';out=build/'formal-session-evidence';out.mkdir(parents=True,exist_ok=True)\nsource=Path(os.environ['RUNNER_TEMP'])/'capsid-baseline-v022-source'\nbaseline=Path(os.environ['RUNNER_TEMP'])/'capsid-baseline-v022-build'\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\nr=dict(complete=False,status='preparing-original-v022',sourceTag='v0.2.2',sourceCommit='aef602081134d6e87fd141a5693bbbb7c9ad7f2e',\n    sourceRoot=str(source),build=str(baseline),measurementToolSourceCommit='be19fc0848c9b9640e618743a9c45dc26894a31a',\n    formalBaselinePointNotClaimed=True,commands=[])\ndef save():(out/'baseline-preparation.json').write_text(json.dumps(r,indent=2)+'\\n')\ndef run(name,args,cwd=root,timeout=1800):\n start=time.monotonic();p=subprocess.run(list(map(str,args)),cwd=cwd,capture_output=True,timeout=timeout)\n so=out/('baseline-'+name+'.stdout.log');se=out/('baseline-'+name+'.stderr.log');so.write_bytes(p.stdout);se.write_bytes(p.stderr)\n r['commands'].append(dict(label=name,command=list(map(str,args)),exitCode=p.returncode,seconds=time.monotonic()-start,\n  stdoutSHA256=sha(so),stderrSHA256=sha(se)));save();assert p.returncode==0,(name,p.stderr[-1200:])\n return p.stdout\ntry:\n assert not source.exists() and not baseline.exists()\n run('clone',['git','clone','--depth=1','--branch','v0.2.2','--recurse-submodules','--shallow-submodules','https://github.com/ErosZy/capsid.git',source])\n assert run('identity',['git','-C',source,'rev-parse','HEAD']).decode().strip()==r['sourceCommit']\n run('vendor-tag',['git','-C',source/'vendor/txiki.js','fetch','--depth=1','origin','refs/tags/v26.6.0:refs/tags/v26.6.0'])\n for rel in ['vendor/txiki.js','examples/hono-reference','examples/itty-router-reference','examples/h3-v2-reference','examples/elysia-reference']:\n  if (source/rel/'package-lock.json').is_file():run('npm-'+rel.replace('/','-'),['npm','ci','--ignore-scripts','--prefix',source/rel])\n args=['cmake','-S',source,'-B',baseline,'-G','Ninja','-DCMAKE_BUILD_TYPE=Release','-DBUILD_TESTING=OFF',\n  '-DCAPSID_BUILD_HOST=ON','-DCAPSID_BUILD_WORKER=ON','-DCAPSID_ENABLE_LTO=ON','-DCAPSID_USE_MIMALLOC=OFF',\n  '-DCMAKE_PREFIX_PATH=/opt/openssl35','-DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include']\n run('configure',args);run('build',['cmake','--build',baseline,'--parallel','2'])\n # The frozen new C-ABI observer is a separate measurement tool, linked to\n # the original baseline runtime. Never label its source as the old tag.\n entries=json.loads((build/'compile_commands.json').read_text())\n entry=next(c for c in entries if c['file'].endswith('/bench/cold-start.cc'))\n cmd=shlex.split(entry['command']);original_object=cmd[cmd.index('-o')+1]\n obj=out/'baseline-cold-observer.o';binary=out/'baseline-cold-observer'\n cmd[cmd.index('-o')+1]=str(obj)\n include='-I'+str(root/'include');assert include in cmd\n cmd[cmd.index(include)]='-I'+str(source/'include')\n if '-MF' in cmd:cmd[cmd.index('-MF')+1]=str(out/'baseline-cold-observer.d')\n # Keep the legacy ABI header and all response assertions. The newer observer\n # recognizes the current public Upgrade bit; the old runtime never emits it.\n current_header=root/'include/capsid/runtime.h';legacy_header=source/'include/capsid/runtime.h'\n flag=re.search(r'(?m)^#define CAPSID_RESPONSE_HEAD_FLAG_UPGRADE (\\d+u)\\s*$',current_header.read_text())\n assert flag and flag[1]=='32u' and 'CAPSID_RESPONSE_HEAD_FLAG_UPGRADE' not in legacy_header.read_text()\n cmd.append('-DCAPSID_RESPONSE_HEAD_FLAG_UPGRADE='+flag[1])\n r['observerLegacyHeaderCompatibility']=dict(flag='CAPSID_RESPONSE_HEAD_FLAG_UPGRADE',value=flag[1],\n  currentPublicHeaderSHA256=sha(current_header),legacyPublicHeaderSHA256=sha(legacy_header),\n  exactPublicFlagRetainedNotZeroed=True,allResponseAssertionsUnchanged=True,originalRuntimeNotModified=True)\n save()\n run('observer-compile',cmd,cwd=Path(entry['directory']))\n commands=run('observer-link-command',['ninja','-C',build,'-t','commands','cold-start']).decode().splitlines()\n line=next(line for line in reversed(commands) if original_object in line and ' -o cold-start ' in line)\n link=shlex.split(line)\n if link[:2]==[':','&&']:link=link[2:]\n if link[-2:]==['&&',':']:link=link[:-2]\n assert not any(x in link for x in ['&&',';','|'])\n link[link.index(original_object)]=str(obj);link[link.index('-o')+1]=str(binary)\n assert link.count('libcapsid_runtime.a')==1\n link[link.index('libcapsid_runtime.a')]=str(baseline/'libcapsid_runtime.a')\n for i,value in enumerate(link):\n  if value=='vendor/jansson/libcapsid_jansson.a':link[i]=str(baseline/value)\n run('observer-link',link,cwd=build)\n names={'host':baseline/'capsid-host','worker':baseline/'capsid-worker','compiler':baseline/'capsid-bytecode-compile','cold':binary}\n r.update(complete=True,status='original-v022-and-separate-observer-ready',\n  binaries={k:dict(path=str(p),sha256=sha(p)) for k,p in names.items()},\n  originalRootStatus=run('original-source-status',['git','-C',source,'status','--porcelain']).decode(),\n  observerSourceSHA256=sha(root/'bench/cold-start.cc'),observerHeaderSHA256=sha(root/'bench/cold_start_measurement.h'),\n  baselineHeaderSHA256=sha(source/'include/capsid/runtime.h'),baselineRuntimeSHA256=sha(baseline/'libcapsid_runtime.a'))\n save();print(json.dumps(dict(complete=True,status=r['status'],formalBaselinePointNotClaimed=True)))\nexcept BaseException:\n r.update(status='baseline-preparation-failed',error=traceback.format_exc());save()\n # Preserve this actual prerequisite failure while allowing the independent\n # candidate lanes to collect useful data. The final controller refuses to\n # claim that a missing baseline comparison completed the full goal.\n print(json.dumps(dict(complete=False,status=r['status'],formalBaselinePointNotClaimed=True)))\n\nPY\n"
        },
        {
          "name": "Execute one observed-quiet native session with original three-lane contracts",
          "run": "set -euo pipefail\nsudo env PATH=\"$PATH\" RUNNER_TEMP=\"$RUNNER_TEMP\" GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=Never \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  CAPSID_WORKERD_REF=\"$CAPSID_WORKERD_REF\" \\\n  CAPSID_WS_INTEROP_PYTHON=\"$CAPSID_WS_INTEROP_PYTHON\" CAPSID_WS_INTEROP_NODE_PACKAGE=\"$CAPSID_WS_INTEROP_NODE_PACKAGE\" \\\n  CAPSID_PERF_NODE=\"$CAPSID_PERF_NODE\" CAPSID_PERF_DENO=\"$CAPSID_PERF_DENO\" CAPSID_PERF_PYTHON=\"$CAPSID_PERF_PYTHON\" \\\n  python3 -B - <<'PY'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport hashlib,json,os,re,resource,shutil,subprocess,sys,time,traceback\nassert sys.platform=='linux' and 'microsoft' not in os.uname().release.lower()\nassert os.geteuid()==0,'use the dedicated runner root context for actual namespace prerequisites'\nroot=Path.cwd();build=root/'build-validity';out=build/'formal-session-evidence';out.mkdir(parents=True,exist_ok=True)\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\ncommit='be19fc0848c9b9640e618743a9c45dc26894a31a'\nsession='native-v030-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']\nr=dict(complete=False,status='preparing-native-session',session=session,productCheckout=commit,commands=[],quietWindows=[],\n formalPerformancePoints=0,fullV030GoalComplete=False,baselineObservationIsNotAFormalHistoricalPoint=True)\ndef save():(out/'session.json').write_text(json.dumps(r,indent=2)+'\\n')\ndef run(label,args,timeout=1800,check=True):\n start=time.monotonic();p=subprocess.run(list(map(str,args)),cwd=root,capture_output=True,timeout=timeout)\n so=out/(label+'.stdout.log');se=out/(label+'.stderr.log');so.write_bytes(p.stdout);se.write_bytes(p.stderr)\n row=dict(label=label,command=list(map(str,args)),exitCode=p.returncode,seconds=time.monotonic()-start,\n  stdoutSHA256=sha(so),stderrSHA256=sha(se));r['commands'].append(row);save()\n if check:assert p.returncode==0,(label,p.stderr[-1500:])\n return p\n\ndef idle_snapshot():\n values=[int(v) for v in Path('/proc/stat').read_text().splitlines()[0].split()[1:9]]\n return dict(total=sum(values),idle=values[3]+values[4],steal=values[7])\ndef quiet(label):\n before=idle_snapshot();start=time.monotonic();time.sleep(30);after=idle_snapshot()\n total=after['total']-before['total'];assert total>0\n busy=1-(after['idle']-before['idle'])/total;steal=(after['steal']-before['steal'])/total\n row=dict(label=label,seconds=time.monotonic()-start,before=before,after=after,busyFraction=busy,stealFraction=steal,\n  observedQuiet=busy<=0.05 and steal<=0.01,scope='dedicated hosted native-Linux guest; physical-host isolation not claimed')\n r['quietWindows'].append(row);save();assert row['observedQuiet'],'native guest did not meet quiet prerequisites'\n\ndef git(*args):return subprocess.check_output(['git','-C',str(root),*args],text=True).strip()\ntry:\n # Trust only the exact pinned checkout and its pinned submodule directories,\n # not a wildcard safe.directory or any other machine's working tree.\n pending=[root];seen=set()\n while pending:\n  directory=pending.pop()\n  if directory in seen:continue\n  seen.add(directory);assert directory.is_relative_to(root)\n  subprocess.run(['git','config','--global','--add','safe.directory',str(directory)],check=True)\n  modules=directory/'.gitmodules'\n  if modules.exists():\n   p=subprocess.run(['git','config','--file',str(modules),'--get-regexp',r'^submodule\\..*\\.path$'],capture_output=True,text=True)\n   assert p.returncode in (0,1)\n   pending.extend((directory/line.split(None,1)[1]).resolve() for line in p.stdout.splitlines())\n assert git('rev-parse','HEAD')==commit and git('rev-parse','HEAD^{tree}')=='dd0e4e8fd4454180df0e3917ffd473b7c9d7a588'\n assert not git('status','--porcelain')\n available=sorted(os.sched_getaffinity(0));before=resource.getrlimit(resource.RLIMIT_NOFILE)\n r['nativePrerequisite']=dict(availableCpus=available,nofileBefore=list(before),hardLimitNotRaised=
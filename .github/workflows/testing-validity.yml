name: Qualify actual CRC reset and approved larger density conditioning
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  larger-approved-density65-conditioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8bde1acf57c8421fc0e11bb7799d69bfb881ec53
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Install and verify locked workerd reference
        run: |
          set -euo pipefail
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Hosted probes verified this Ubuntu mirror while the ubuntu.com
          # domains failed DNS. Preserve suites, components and Signed-By.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y ninja-build libboost-system-dev libc-ares-dev openssl python3-venv linux-tools-generic
          /usr/bin/openssl version
          # The vendor audit's expected tag must match cmake/build_tests.cmake
          # (CAPSID_TXIKI_EXPECTED_TAG) and the pinned submodule commit.
          git -C vendor/txiki.js fetch --depth=1 origin \
            refs/tags/v26.6.0:refs/tags/v26.6.0
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference \
            examples/elysia-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done

      - name: Require actual Linux perf counters for evidence controls
        run: python3 -B tools/setup-hosted-perf.py

      - name: Install locked independent WebSocket clients
        run: |
          set -euo pipefail
          /usr/bin/python3.12 tools/setup-ws-interop-python.py "${RUNNER_TEMP}/capsid-ws-python"
          printf 'CAPSID_WS_INTEROP_PYTHON=%s\n' "${RUNNER_TEMP}/capsid-ws-python/bin/python" >> "${GITHUB_ENV}"
          printf 'CAPSID_WS_INTEROP_NODE_PACKAGE=%s\n' "${RUNNER_TEMP}/capsid-ws-python/node-ws" >> "${GITHUB_ENV}"

      - name: Check out the manifest-pinned WPT revision
        env:
          WPT_DIRECTORY: ${{ runner.temp }}/wpt
        run: |
          set -euo pipefail
          repository=$(node -p \
            "require('./tests/wpt/manifest.json').repository")
          commit=$(node -p \
            "require('./tests/wpt/manifest.json').commit")
          git init "${WPT_DIRECTORY}"
          git -C "${WPT_DIRECTORY}" remote add origin "${repository}"
          git -C "${WPT_DIRECTORY}" fetch --depth=1 origin "${commit}"
          git -C "${WPT_DIRECTORY}" checkout --detach FETCH_HEAD
          test "$(git -C "${WPT_DIRECTORY}" rev-parse HEAD)" = "${commit}"

      # capsid-bytecode-compile and the Host trust chain require OpenSSL
      # >= 3.5. ubuntu-24.04 supplies 3.0, so the Release build must use the
      # same pinned provider source as the sanitizer Host build.
      - name: Build OpenSSL 3.5 for Release
        run: |
          set -euo pipefail
          # Built in the runner temp dir: extracting the tarball inside the
          # workspace dirties the checkout and trips the Release
          # clean-worktree identity gate.
          cd "${RUNNER_TEMP}"
          echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" > openssl.sha256
          curl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz
          sha256sum -c openssl.sha256
          tar xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider openssl --source "$PWD" | tee "${evidence}/openssl-source.json"
          ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests no-asm
          make -j2
          sudo make install_sw

      - name: Build c-ares 1.34.5 for Release
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          evidence="${RUNNER_TEMP}/capsid-native-provider-evidence"
          mkdir -p "${evidence}"
          curl -sSL -o capsid-cares.tar.gz https://codeload.github.com/c-ares/c-ares/tar.gz/d3a507e920e7af18a5efb7f9f1d8044ed4750013
          echo "cd1968cd09d384a5c553c82bf53ba458e47e9bfcdc253a3627f1b36ea6f814e2  capsid-cares.tar.gz" | sha256sum -c -
          tar xzf capsid-cares.tar.gz
          python3 "${GITHUB_WORKSPACE}/tools/apply-native-provider-patches.py" \
            --provider cares --source "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" | tee "${evidence}/cares-source.json"
          cmake -S "${RUNNER_TEMP}/c-ares-d3a507e920e7af18a5efb7f9f1d8044ed4750013" -B "${RUNNER_TEMP}/capsid-cares-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/openssl35 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCARES_STATIC=ON -DCARES_SHARED=OFF -DCARES_STATIC_PIC=ON \
            -DCARES_BUILD_TESTS=OFF -DCARES_BUILD_TOOLS=OFF
          cmake --build "${RUNNER_TEMP}/capsid-cares-build" --parallel 2 --verbose
          sudo cmake --install "${RUNNER_TEMP}/capsid-cares-build"
          cp "${RUNNER_TEMP}/capsid-cares-build/compile_commands.json" "${evidence}/cares-compile-commands.json"

      - name: Configure Release/LTO with WPT and benchmarks
        env:
          WPT_DIRECTORY: ${{ runner.temp }}/wpt
        run: |
          cmake -S . -B build-validity -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCAPSID_BUILD_HOST=ON \
            -DCAPSID_ENABLE_LTO=ON \
            -DCAPSID_USE_MIMALLOC=OFF \
            -DCAPSID_BUILD_BENCHMARKS=ON \
            -DCAPSID_GENERATE_LINK_MAP=ON \
            -DCMAKE_PREFIX_PATH=/opt/openssl35 \
            -DCAPSID_CARES_PROVIDER_DIR=/opt/openssl35/include \
            -DCAPSID_TEST_OPENSSL_EXECUTABLE=/usr/bin/openssl \
            -DCAPSID_SANDBOX_PROFILE=production \
            -DCAPSID_WPT_ROOT="${WPT_DIRECTORY}"

      - name: Build
        run: cmake --build build-validity --parallel 2 --target capsid-host capsid-worker

      - name: Reject the actual underheated counter and retain all density controls
        run: |
          python3 -B tests/test_benchmark_density_control.py --node "$(command -v node)"

      - name: Verify current candidate cold and hot coverage of all 65 workers and cells
        env:
          TMPDIR: /tmp
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,subprocess,sys,traceback
          root=Path.cwd();build=root/'build-validity';out=build/'density65-observations';out.mkdir()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert tree=='2f43b17a00eb2633e87c728557d1bb7b1b1e3717'
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True).strip()
          host=build/'capsid-host';worker=build/'capsid-worker';workerd=Path(os.environ['CAPSID_WORKERD_REF'])
          inputs={n:sha(root/n) for n in ['bench/density_probe.py','bench/density_control.py','bench/measurement_runtime.py',
           'bench/gen-cold-start-apps.py','src/host/generation_pool.cc','src/host/worker_capacity_ledger.cc','src/host/managed_host.cc']}
          binaries={n:sha(p) for n,p in [('host',host),('worker',worker),('workerd',workerd)]}
          cpus=sorted(os.sched_getaffinity(0))[:4];assert len(cpus)>=2
          record=dict(complete=False,status='current-source-real65-worker-conditioning',createdUTC=datetime.now(timezone.utc).isoformat(),
           sourceTree=tree,actualCheckoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           localFrozenSnapshot='bc61dbebe23a20a18f79d98921c1575e970812c5',sourceInputSHA256=inputs,binarySHA256=binaries,
           cpuSet=cpus,TMPDIR=os.environ['TMPDIR'],diagnosticOnly=True,configuredParallel=64,
           approvedWarmupConcurrencyLimit=8320,coverageTimeoutSeconds=300,originalColdMaximumRequests=520,
           originalWarmMaximumRequests=208000,coldRequestsPerWorkerMinimum=1,hotRequestsPerWorkerMinimum=100,
           productionSchedulingChanged=False,qpsConcurrency=64,formalPerformancePoints=0,fullDensityMaximumQualified=False,
           fullV030GoalComplete=False,phases=[])
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          sys.path.insert(0,str(root/'bench'))
          from density_probe import DensityProbe
          from density_control import Coverage,CounterLog
          from measurement_runtime import PortAllocator,ProbeError
          apps=out/'apps'
          subprocess.run([sys.executable,'-B',str(root/'bench/gen-cold-start-apps.py'),str(apps)],check=True)
          record['generatedFixtureSHA256']={p.relative_to(apps).as_posix():sha(p) for p in apps.rglob('*') if p.is_file()}
          probe=DensityProbe(host=host,worker=worker,workerd=workerd,apps=apps,out=out/'probes',
           cpuset=','.join(map(str,cpus)),parallel=64,warm_requests=100)
          assert probe.coverage_timeout==300 and probe.warmup_concurrency(65)==8320
          all_passed=True
          for index,(stack,phase,target) in enumerate([('capsid','cold',1),('capsid','warm',100),('workerd','cold',1),('workerd','warm',100)],1):
           result=None;failure=None
           try:
            with PortAllocator().allocate(1 if stack=='capsid' else 65) as lease:
             result=probe(stack=stack,size='10k',phase=phase,count=65,ports=list(lease.ports),
              release_ports=lease.release,probe_index=index,final=False)
           except BaseException as exc:
            failure=exc.record() if isinstance(exc,ProbeError) else dict(type=type(exc).__name__,message=str(exc),traceback=traceback.format_exc())
           folder=out/'probes'/f'probe-{index:05d}-{stack}-10k-{phase}-65'
           launch=json.loads((folder/'launch.json').read_text())
           coverage=Coverage(65,launch['nonce']);CounterLog(folder/'stderr.log',coverage).poll()
           requests=[json.loads(line) for line in (folder/'requests.jsonl').read_text().splitlines()]
           cleanup=json.loads((folder/'cleanup.json').read_text())
           coverage_passed=coverage.complete(target) and sum(coverage.counts.values())==len(requests)
           if coverage_passed:coverage.verify(target,len(requests))
           assert cleanup['ownedPidsRemaining']==0
           assert all(r['status']==200 and r['ok'] is True and r['warmupConcurrencyLimit']==8320 for r in requests)
           if result is not None:
            assert coverage_passed and len(result['requestsPerWorker'])==65
            assert result['requestsPerWorker']==coverage.counts
            assert len(result['pss_readings_kb'])==2 and len(set(result['pss_readings_kb']))==1
            assert 0<result['pss_readings_kb'][0]<=2048*1024
            assert result['correctness']['responses_checked']==len(requests)
           if stack=='capsid':
            assert launch['mode']=='managed' and '--mode' in launch['command']
            assert launch['command'][launch['command'].index('--mode')+1]=='managed'
           row=dict(stack=stack,phase=phase,targetPerWorker=target,observedWorkers=len(coverage.counts),
            minimumRequestsPerWorker=min(coverage.counts.values(),default=0),validatedResponses=len(requests),
            coveragePassed=coverage_passed,pssPassed=result is not None,pssReadingsKB=result['pss_readings_kb'] if result else None,
            requestsPerWorker=coverage.counts,waveSizes=sorted({r['waveRequests'] for r in requests}),
            ownedPidsRemaining=cleanup['ownedPidsRemaining'],originalFailure=failure)
           record['phases'].append(row);save();print(json.dumps({k:row[k] for k in row if k!='requestsPerWorker'}),flush=True)
           all_passed=all_passed and coverage_passed and result is not None and failure is None
          for n,h in inputs.items():assert sha(root/n)==h
          assert binaries=={n:sha(p) for n,p in [('host',host),('worker',worker),('workerd',workerd)]}
          record.update(complete=True,status='all-four-real-density65-conditioning-phases-passed' if all_passed else 'complete-with-original-density65-findings',
           allFourRealPhasesPassed=all_passed,allSourceInputsAndBinariesUnchanged=True)
          save();assert all_passed,'Inspect original density65 reports; formal points remain zero'
          PY

      - name: Archive all original density runtime and request observations
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,tarfile
          folder=Path('build-validity/density65-observations')
          archive=folder.with_suffix('.tar.gz')
          assert folder.is_dir()
          with tarfile.open(archive,'w:gz',dereference=False) as stream:
              stream.add(folder,arcname=folder.name,recursive=True)
          archive.with_suffix(archive.suffix+'.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n')
          PY

      - name: Save actual density65 source and binary qualification observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: current-density65-observations
          if-no-files-found: error
          path: |
            build-validity/density65-observations.tar.gz
            build-validity/density65-observations.tar.gz.sha256
            build-validity/generated/build-info.txt
            build-validity/CMakeCache.txt
            build-validity/compile_commands.json

  codec-reset-windows-reference-and-preserved-binary-observations:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact private proposal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8bde1acf57c8421fc0e11bb7799d69bfb881ec53
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Set up locked Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.3'
      - name: Install the exact pinned Windows reference
        shell: pwsh
        run: |
          $reference_path = Join-Path $env:RUNNER_TEMP 'codec-reset-workerd.exe'
          node tools/workerd-reference.mjs install $reference_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CAPSID_WORKERD_REF=$reference_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSID_NODE=$((Get-Command node).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download and verify the preserved actual built binaries
        shell: bash
        env:
          CAPSID_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          fs.mkdirSync('codec-reset-observations');
          const response=await fetch('https://api.github.com/repos/ErosZy/capsid/actions/artifacts/13965900669/zip',
            {headers:{Authorization:'Bearer '+process.env.CAPSID_ARTIFACT_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(120000)});
          if(!response.ok)throw new Error('artifact HTTP '+response.status);
          const bytes=Buffer.from(await response.arrayBuffer());
          if(bytes.length!==17406599||createHash('sha256').update(bytes).digest('hex')!=='ed40da9ecf37a1d67b4f852f4453eea8307160ba25319aaf542b6b50f2171676')throw new Error('original artifact identity');
          fs.writeFileSync('codec-reset-observations/original-built-observation.zip',bytes,{flag:'wx'});
          JS
      - name: Observe original full metadata cases and independent rejection controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,subprocess,traceback,zipfile
          root=Path.cwd();out=root/'codec-reset-observations';out.mkdir(exist_ok=True)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert tree=='2f43b17a00eb2633e87c728557d1bb7b1b1e3717'
          archive=out/'original-built-observation.zip'
          assert archive.stat().st_size==17406599 and sha(archive)=='ed40da9ecf37a1d67b4f852f4453eea8307160ba25319aaf542b6b50f2171676'
          preserved=out/'preserved-binaries';preserved.mkdir()
          with zipfile.ZipFile(archive) as stream:
           find=lambda suffix:next(n for n in stream.namelist() if n.endswith(suffix))
           observation=json.loads(stream.read(find('failure-source-observation/run.json')))
           registration=json.loads(stream.read(find('registration.json')))
           for name,expected in observation['actualBinarySHA256'].items():
            p=preserved/name;p.write_bytes(stream.read(find(name)));assert sha(p)==expected
           info=stream.read(find('generated/build-info.txt')).decode().replace('\r\n','\n')
           assert 'commit=5292dafcdd1adba8b32827c392e30c52c9243650\n' in info and 'treeClean=true\n' in info
          budgets={t['name']:{p['name']:p['value'] for p in t['properties']}['TIMEOUT'] for t in registration['tests'] if t['name']=='workerd_http_codec_contract_controls' or t['name'].startswith('websocket_http_codec_metadata_')}
          names=['workerd_http_codec_contract_controls']+['websocket_http_codec_metadata_'+m for m in ['reference','single-worker','static-pool']]
          assert all(budgets[n]==120 for n in names)
          node=os.environ['CAPSID_NODE'];workerd=Path(os.environ['CAPSID_WORKERD_REF'])
          inputs={n:sha(root/n) for n in ['tests/test_websocket_http_codec.mjs','tests/test_workerd_http_codec_contract.mjs',
           'tools/workerd-http-codec-contract.mjs','tools/workerd-http-codec-input.mjs','tests/fixtures/workerd-http-codec-reset-observation.json']}
          record=dict(complete=False,createdUTC=datetime.now(timezone.utc).isoformat(),status='collecting-original-codec-metadata-with-qualified-reset-terminal',
           actualHarnessCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),actualHarnessTree=tree,
           localFrozenSnapshot='bc61dbebe23a20a18f79d98921c1575e970812c5',diagnosticOnly=True,rootIntegrated=False,
           actualPreservedBinaryBuildCommit='5292dafcdd1adba8b32827c392e30c52c9243650',actualPreservedBinaryTree='ebf5c96c7447eb7211c53703a4ab7e2f911de7a4',
           actualPreservedBinarySHA256=observation['actualBinarySHA256'],runtimeSourcesUnchangedFromPreservedBuild=True,
           originalCtestBudgets=budgets,originalThreeSecondEofWindowRetained=True,allOriginal31MetadataCasesRequired=True,
           fullNewSourceWindowsAllBuildNotClaimed=True,sourceInputSHA256=inputs,attempts=[],formalPerformancePoints=0,fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          control=subprocess.run([node,'--test','--test-reporter=tap',str(root/'tests/test_workerd_http_codec_contract.mjs')],capture_output=True,timeout=120)
          (out/'controls.stdout.log').write_bytes(control.stdout);(out/'controls.stderr.log').write_bytes(control.stderr)
          assert control.returncode==0 and b'# tests 85' in control.stdout and b'# pass 85' in control.stdout and b'# skipped 0' in control.stdout
          all_ok=True
          for attempt in (1,2):
           for mode in ('reference','single-worker','static-pool'):
            folder=out/(str(attempt)+'-'+mode);folder.mkdir();report=folder/'report.json'
            command=[node,str(root/'tests/test_websocket_http_codec.mjs')]
            command+=['--reference-from-env','1'] if mode=='reference' else ['--host',str(preserved/'capsid-host.exe'),'--worker',str(preserved/'capsid-worker.exe'),'--mode',mode]
            command+=['--shard','metadata','--report',str(report)]
            code=None;error=None
            try:
             ran=subprocess.run(command,capture_output=True,timeout=120);code=ran.returncode
             (folder/'stdout.log').write_bytes(ran.stdout);(folder/'stderr.log').write_bytes(ran.stderr)
            except BaseException as exc:error=traceback.format_exc()
            value=json.loads(report.read_text()) if report.exists() else None
            failures=[c['id'] for c in value['cases'] if c.get('failure') or c.get('cleanupFailure')] if value else []
            count=len(value['cases']) if value else 0
            row=dict(attempt=attempt,mode=mode,actualCases=count,exitCode=code,failures=failures,error=error,
             actualCrcSource=[{k:v for k,v in c['upstream'][0].items() if k in ['peerEnded','peerReset','fixtureEnded','fixtureDestroyed','events']} for c in value['cases'] if c['id']=='codec-supp-fragment-crc-late' and c.get('upstream')] if value else [])
            record['attempts'].append(row);save();print(json.dumps(row),flush=True)
            all_ok=all_ok and code==0 and value is not None and value['complete'] and count==31 and not failures and error is None
          for n,h in inputs.items():assert sha(root/n)==h
          assert all(sha(preserved/n)==h for n,h in observation['actualBinarySHA256'].items())
          record.update(complete=True,status='all-six-original-metadata-observations-passed' if all_ok else 'complete-with-original-metadata-findings',
           allSixOriginalAttemptsPassed=all_ok,actualPublicCases=sum(r['actualCases'] for r in record['attempts']),allInputsAndBinariesUnchanged=True)
          save();assert all_ok,'Inspect retained original metadata captures; no fullWindows qualification claimed'
          PY
      - name: Preserve every actual codec observation
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: codec-reset-windows-observations
          if-no-files-found: error
          path: codec-reset-observations/

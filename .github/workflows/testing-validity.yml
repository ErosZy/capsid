name: Native Darwin ownership and original density deadline observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-observers:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 991adfc40c0bc1d3fe9a58ec2877d8b5d26b0192
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.3'
      - name: Observe native ownership without consuming child state
        run: |
          mkdir build-native-observers
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          raw=base64.b64decode('');assert hashlib.sha256(raw).hexdigest()=='439db6007de3460391e668922c90ef0bacfc9614552c476ae269deba384717de'
          Path('build-native-observers/native.cc').write_bytes(raw)
          PY
          xcrun clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror build-native-observers/native.cc -lproc -o build-native-observers/native
          build-native-observers/native > build-native-observers/native.jsonl
      - name: Run all current density controls at the original thirty-second deadline
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil,signal,subprocess,sys,time
          out=Path('build-native-observers')
          code="import faulthandler,runpy,signal,sys;faulthandler.register(signal.SIGUSR1,all_threads=True);sys.argv=['tests/test_benchmark_density_control.py','--node',"+repr(shutil.which('node'))+",'-v'];runpy.run_path(sys.argv[0],run_name='__main__')"
          start=time.monotonic()
          with (out/'density.stdout.log').open('wb') as so,(out/'density.stderr.log').open('wb') as se:
              child=subprocess.Popen([sys.executable,'-u','-c',code],stdout=so,stderr=se,start_new_session=True)
              try:result=child.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  os.kill(child.pid,signal.SIGUSR1);time.sleep(.2)
                  os.killpg(child.pid,signal.SIGTERM);child.wait(timeout=5);result=124
          (out/'density-result.json').write_text(json.dumps(dict(exitCode=result,seconds=time.monotonic()-start,budgetSeconds=30,python=sys.version,actualTestsPassed=result==0,fullCandidateAcceptanceClaimed=False),indent=2)+'\n')
          print('Current original-budget density exit:',result)
          sys.exit(result)
          PY
      - name: Preserve actual native observations and timeout stacks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: darwin-observer-density-diagnostics
          if-no-files-found: error
          path: build-native-observers/

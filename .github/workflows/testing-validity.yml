        {
          "name": "Compare the original timer and fixed fragmentation fixture on native macOS",
          "run": "python3 -B - <<'PY'\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nimport hashlib\nimport json\nimport os\nimport shlex\nimport subprocess\nimport sys\nimport time\n\nassert sys.platform=='darwin'\nroot=Path.cwd();build=root/'build-macos'\nout=build/'native-fragment-fixture-control'\nout.mkdir(parents=True,exist_ok=False)\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\nsource=root/'tests/test_host_admin_http.cc'\ntext=source.read_text('utf-8')\nnew='''            // Keep FIONREAD as the per-fragment read barrier, but do not\n            // make every byte pay for a timer. Darwin may coalesce short\n            // sleeps enough to exhaust the real HTTP phase deadline before\n            // this fixture has delivered the bytes that exercise a limit.\n            std::this_thread::yield();'''\nold='''            std::this_thread::sleep_for(std::chrono::milliseconds(1));'''\nassert text.count(new)==1\nbaseline_source=out/'original-timer-fixture.cc'\nbaseline_source.write_text(text.replace(new,old),encoding='utf-8')\nrecord=dict(complete=False,createdUTC=datetime.now(timezone.utc).isoformat(),platform=sys.platform,\n    candidateSourceSHA256=sha(source),baselineSourceSHA256=sha(baseline_source),\n    baselineDiffIsOnlyOriginalOneMillisecondTimer=True,baselineHasDiagnosticOnlyImprovement=True,\n    productionParserUnchanged=True,headerAndBodyDeadlinesMilliseconds=1000,outerBudgetSeconds=10,\n    commands=[],baselineRuns=[],candidateRuns=[],fullMatrixStillMandatory=True)\ndef save():(out/'result.json').write_text(json.dumps(record,indent=2)+'\\n')\ndef run(label,args,cwd=build,timeout=120):\n    start=time.monotonic()\n    p=subprocess.run(list(map(str,args)),cwd=cwd,capture_output=True,timeout=timeout)\n    so=out/(label+'.stdout.log');se=out/(label+'.stderr.log')\n    so.write_bytes(p.stdout);se.write_bytes(p.stderr)\n    record['commands'].append(dict(label=label,command=list(map(str,args)),exitCode=p.returncode,\n        seconds=time.monotonic()-start,stdoutSHA256=sha(so),stderrSHA256=sha(se)))\n    save();return p\nentries=json.loads((build/'compile_commands.json').read_text())\nentry=next(e for e in entries if e['file'].endswith('/tests/test_host_admin_http.cc'))\ncompile_args=shlex.split(entry['command']);obj=compile_args[compile_args.index('-o')+1]\nbaseline_object=out/'original-timer-fixture.o';baseline_binary=out/'original-timer-fixture'\ncompile_args[compile_args.index('-o')+1]=str(baseline_object)\ncompile_args[compile_args.index('-c')+1]=str(baseline_source)\nif '-MF' in compile_args:compile_args[compile_args.index('-MF')+1]=str(out/'original-timer-fixture.d')\nassert run('baseline-build',compile_args,cwd=Path(entry['directory'])).returncode==0\nlink_args=shlex.split((build/'CMakeFiles/test-host-admin-http.dir/link.txt').read_text())\nassert not any(x in link_args for x in ['&&',';','|'])\nassert link_args.count(obj)==1\nlink_args[link_args.index(obj)]=str(baseline_object)\nlink_args[link_args.index('-o')+1]=str(baseline_binary)\nassert run('baseline-link',link_args).returncode==0\nrecord['baselineBinarySHA256']=sha(baseline_binary)\nrecord['candidateBinarySHA256']=sha(build/'test-host-admin-http')\nfor index in range(16):\n    p=run('baseline-'+str(index),[baseline_binary,'host_admin_http_fragmented_limits'],timeout=10)\n    diagnostic=p.stderr.decode('utf-8','replace').strip()\n    timeout_failure=p.returncode==1 and diagnostic in (\n        'FAIL: Admin HTTP response expected status 431, got 408',\n        'FAIL: Admin HTTP response expected status 413, got 408')\n    assert p.returncode==0 or timeout_failure,diagnostic\n    record['baselineRuns'].append(dict(round=index,exitCode=p.returncode,observedHttp408=timeout_failure,diagnostic=diagnostic))\n    save()\ncommand=['ctest','--test-dir',build,'--parallel','1','--no-tests=error','--output-on-failure','--repeat','until-fail:20',\n         '-R','^host_admin_http_(fragmented_headers|chunked_requests|chunked_errors|fragmented_limits|buffer_boundaries)$',\n         '--output-junit',out/'candidate-repeated-junit.xml']\np=run('candidate-repeat',command,cwd=root,timeout=120)\nassert p.returncode==0,p.stdout.decode('utf-8','replace')[-4000:]\nimport re\nassert len(re.findall(rb'Test\\s+#\\d+:\\s+host_admin_http_\\S+\\s+\\.+\\s+Passed',p.stdout))==100\nrecord.update(complete=True,status='native-candidate-fragmentation-fixture-qualified',candidateRepeatedPasses=100,\n    baselineTimeouts=sum(r['observedHttp408'] for r in record['baselineRuns']),\n    nativeOriginalFailureReproduced=any(r['observedHttp408'] for r in record['baselineRuns']),\n    productionImplementationModified=False,allRequestBytesAndExpectedStatusesRetained=True,\n    baselineIdleSuccessWouldNotEraseOriginalFullMatrixFailure=True)\nassert sha(source)==record['candidateSourceSHA256'] and sha(build/'test-host-admin-http')==record['candidateBinarySHA256']\nsave()\nprint(json.dumps({k:record[k] for k in ['complete','status','baselineTimeouts','nativeOriginalFailureReproduced','candidateRepeatedPasses']}))\n\nPY\n"
        },

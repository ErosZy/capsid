            "if-no-files-found": "error",
            "path": "build-${{ matrix.name }}/${{ matrix.name }}-junit.xml\nbuild-${{ matrix.name }}/CMakeCache.txt\nbuild-${{ matrix.name }}/compile_commands.json\nbuild-${{ matrix.name }}/full-build-commands.txt\nbuild-${{ matrix.name }}/full-registration.json\nbuild-${{ matrix.name }}/selected-registration.json\nbuild-${{ matrix.name }}/generated/build-info.txt\nbuild-${{ matrix.name }}/matrix-case-reports.tar.gz\nbuild-${{ matrix.name }}/matrix-case-reports.tar.gz.sha256\nbuild-${{ matrix.name }}/Testing/Temporary/LastTest.log\nbuild-perf-prerequisite/evidence/\nbuild-asan/asan-rss-raw-junit.xml\nbuild-asan/asan-rss-raw-LastTest.log\nbuild-asan/asan-rss-raw-exit-code.txt\nbuild-asan/asan-memory-*.json\nbuild-tsan/tsan-rss-raw-junit.xml\nbuild-tsan/tsan-rss-raw-LastTest.log\nbuild-tsan/tsan-rss-raw-exit-code.txt\nbuild-tsan/tsan-memory-*.json\n${{ runner.temp }}/capsid-native-provider-evidence/\n\nbuild-tsan/focused-dirfd-*/\n"
          }

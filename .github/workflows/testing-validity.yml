name: Observe Windows pinned codec source-close timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-codec-reference-observation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 704d1c864202dda18f1d9dc00e22c9a182686ea2
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Set up the locked Python WebSocket runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (node24)
        with:
          python-version: '3.12.3'

      - name: Install the locked native Windows workerd reference
        shell: pwsh
        run: |
          $reference_path = Join-Path $env:RUNNER_TEMP 'capsid-workerd-reference/workerd.exe'
          node tools/workerd-reference.mjs install $reference_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CAPSID_WORKERD_REF=$reference_path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSID_WORKERD_REQUIRED=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preserve unchanged EOF window across both observations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,subprocess,time
          root=Path.cwd();out=root/'build-codec-close-observation';out.mkdir()
          source=root/'tests/test_websocket_http_codec.mjs';original=source.read_bytes()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          newline='\r\n' if b'\r\n' in original else '\n'
          text=original.decode('utf-8').replace('\r\n','\n')
          failure='    if (error.observation) value.failureObservation = error.observation;\n'
          assert text.count(failure)==1
          baseline=text.replace(failure,failure+'    if (source) value.failureUpstream = source.snapshot();\n',1)
          old='    assert.ok(\n      await observeUntil(() => source.records.length > 0 && source.records.every((entry) => entry.peerEnded)),\n      "source observes actual client EOF before host shutdown or fixture disposal"\n    );\n    value.observed = await readState();'
          new='    const sourceEnded = observeUntil(() => source.records.length > 0 && source.records.every((entry) => entry.peerEnded));\n    const observedState = readState();\n    const [ended, observed] = await Promise.all([sourceEnded, observedState]);\n    assert.ok(\n      ended,\n      "source observes actual client EOF before host shutdown or fixture disposal"\n    );\n    value.observed = observed;'
          assert baseline.count(old)==1
          observed=baseline.replace(old,new,1)
          assert 'async function observeUntil(predicate, milliseconds = 3e3)' in baseline and 'async function observeUntil(predicate, milliseconds = 3e3)' in observed
          variants={'baseline-failure-snapshot':baseline,'concurrent-state-observation':observed}
          for name,value in variants.items():
           (out/(name+'.mjs')).write_bytes(value.replace('\n',newline).encode('utf-8'))
          (out/'original-driver.mjs').write_bytes(original)
          record=dict(complete=False,status='observing-windows-reference-source-close',createdUTC=datetime.now(timezone.utc).isoformat(),
           diagnosticOnly=True,fullNativeWindowsGateNotClaimed=True,actualSourceSnapshot='14fbabb4337771579f3866cd72c2494aa9f2c48d',
           originalDriverSHA256=sha(original),originalCtestDeadlineSeconds=120,originalSourceEofWindowSeconds=3,
           originalFixturePacketsAndAll31CasesUnchanged=True,originalClosureAndByteAssertionsRetained=True,
           baselineOnlyAddsFailureSnapshot=True,stateObservationChangesCausalOrder=True,
           stateQueryNeverExtendsEofSamplerDeadline=True,attempts=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          try:
           for round_number in range(1,3):
            for name,value in variants.items():
             data=value.replace('\n',newline).encode('utf-8');source.write_bytes(data)
             report=out/(name+'-'+str(round_number)+'.json')
             command=['node',str(source),'--reference-from-env','1','--shard','metadata','--report',str(report)]
             start=time.monotonic()
             with (out/(name+'-'+str(round_number)+'.stdout.log')).open('xb') as so,(out/(name+'-'+str(round_number)+'.stderr.log')).open('xb') as se:
              result=subprocess.run(command,stdout=so,stderr=se,env=os.environ,timeout=120,creationflags=subprocess.CREATE_NO_WINDOW)
             assert result.returncode in [0,1]
             raw=json.loads(report.read_text());assert len(raw['cases'])==31
             assert raw['binaries']['host']==raw['referenceLock']['binary_sha256']=='c8799724c4221af61dde76ed071aa5996b25c9bd5d247da94c166718cabe612a'
             failures=[dict(id=c['id'],failure=c.get('failure'),cleanupFailure=c.get('cleanupFailure'),
              sourceAtFailure=c.get('failureUpstream')) for c in raw['cases'] if c.get('failure') or c.get('cleanupFailure')]
             row=dict(round=round_number,variant=name,exitCode=result.returncode,seconds=time.monotonic()-start,
              actualExecutedDriverSHA256=sha(data),rawReportSHA256=sha(report.read_bytes()),complete=raw['complete'],
              cases=31,failures=failures,actualReferenceSHA256=raw['binaries']['host'])
             record['attempts'].append(row);save()
             print(json.dumps(dict(round=round_number,variant=name,exitCode=result.returncode,cases=31,failed=[x['id'] for x in failures])),flush=True)
           record.update(complete=True,status='original-and-state-observation-records-captured-no-product-acceptance')
           save()
          finally:
           source.write_bytes(original)
           assert source.read_bytes()==original
           record['originalDriverBytesRestored']=True;save()
          PY
      - name: Preserve both observations and all actual source snapshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-codec-close-observations
          if-no-files-found: error
          path: build-codec-close-observation/

        },
        {
          "name": "Run ${{ matrix.name }} matrix",
          "env": {
            "ASAN_OPTIONS": "detect_leaks=1:abort_on_error=1:strict_string_checks=1",
            "UBSAN_OPTIONS": "halt_on_error=1:print_stacktrace=1",
            "TSAN_OPTIONS": "halt_on_error=1",
            "CAPSID_WS_REPORT_DIR": "${{ github.workspace }}/build-${{ matrix.name }}/matrix-case-reports"
          },
          "run": "mkdir -p \"${CAPSID_WS_REPORT_DIR}\"\nctest --test-dir \"build-${{ matrix.name }}\" \\\n  --no-tests=error \\\n  --output-on-failure \\\n  --output-junit \"${{ matrix.name }}-junit.xml\" \\\n  --parallel ${{ matrix.ctest_parallel }} \\\n  -E '${{ matrix.ctest_exclude }}'\n"
        },
        {
          "name": "Require separate ASan memory acceptance",
          "if": "${{ !cancelled() && matrix.name == 'asan' && steps.asan_rss_raw.outcome != 'skipped' }}",
          "run": "python3 -B tools/asan-memory-acceptance.py \\\n  --registration build-asan/asan-memory-registration.json \\\n  --raw-junit build-asan/asan-rss-raw-junit.xml \\\n  --raw-last-test build-asan/asan-rss-raw-LastTest.log \\\n  --raw-exit-code build-asan/asan-rss-raw-exit-code.txt \\\n  --raw-outcome '${{ steps.asan_rss_raw.outcome }}' \\\n  --matrix-junit build-asan/asan-junit.xml \\\n  --resource-report-root build-asan \\\n  --output build-asan/asan-memory-acceptance.json\n"

        \ | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1\nif (-not $openssl_fixture) { throw 'OpenSSL\
        \ CLI for fixture certificates is missing' }\n& $openssl_fixture version\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE\
        \ }\n(Split-Path $openssl_fixture) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append\n"
    - name: Install locked independent WebSocket clients
      shell: pwsh
      run: "$interop_root = Join-Path $env:RUNNER_TEMP 'capsid-ws-interop'\npython tools/setup-ws-interop-python.py $interop_root\n\
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n\"CAPSID_WS_INTEROP_PYTHON=$interop_root\\Scripts\\python.exe\" |\n\
        \  Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\"CAPSID_WS_INTEROP_NODE_PACKAGE=$interop_root\\node-ws\"\
        \ |\n  Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n"
    - name: Install the locked native Windows workerd reference
      shell: pwsh
      run: "$reference_path = Join-Path $env:RUNNER_TEMP 'capsid-workerd-reference/workerd.exe'\nnode tools/workerd-reference.mjs\
        \ install $reference_path\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n\"CAPSID_WORKERD_REF=$reference_path\"\
        \ |\n  Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n\"CAPSID_WORKERD_REQUIRED=1\" |\n  Out-File -FilePath\
        \ $env:GITHUB_ENV -Encoding utf8 -Append\n"
    - name: Set up the MSVC developer environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
    - name: Install locked JavaScript dependencies
      run: "set -euo pipefail\nfor directory in \\\n  vendor/txiki.js \\\n  examples/hono-reference \\\n  examples/itty-router-reference\
        \ \\\n  examples/h3-v2-reference \\\n  examples/elysia-reference\ndo\n  npm ci --ignore-scripts --prefix \"${directory}\"\
        \ndone\n# The vendor audit's expected tag must match cmake/build_tests.cmake\n# (CAPSID_TXIKI_EXPECTED_TAG) and the\
        \ pinned submodule commit.\ngit -C vendor/txiki.js fetch --depth=1 origin \\\n  refs/tags/v26.6.0:refs/tags/v26.6.0\n"
      shell: bash
    - name: Install Windows build dependencies (vcpkg)
      run: "& \"$env:VCPKG_INSTALLATION_ROOT\\vcpkg.exe\" install `\n  openssl c-ares boost-system boost-asio boost-beast\
        \ --triplet x64-windows-static\n"
      shell: pwsh
    - name: Configure Windows host library and worker contracts
      run: "cmake -S . -B build-windows `\n  -G Ninja `\n  -DCMAKE_C_COMPILER=cl `\n  -DCMAKE_CXX_COMPILER=cl `\n  -DCMAKE_BUILD_TYPE=Release\
        \ `\n    -DCAPSID_BUILD_HOST=ON `\n    -DCAPSID_BUILD_WORKER=ON `\n    -DCAPSID_STRICT_WARNINGS=ON `\n    -DCAPSID_USE_MIMALLOC=OFF\
        \ `\n    -DCMAKE_TOOLCHAIN_FILE=\"$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake\" `\n  -DVCPKG_TARGET_TRIPLET=x64-windows-static\n"
      shell: pwsh
    - name: Build Windows Host and worker contracts
      shell: pwsh
      run: "# On failure, replay the build tail as ::error:: annotations so\n# the actual compiler diagnostic is visible in\
        \ the run summary\n# (raw step logs need a signed-in viewer).\ncmake --build build-windows --parallel 2 2>&1 | Tee-Object\
        \ build-windows\\build.log\nif ($LASTEXITCODE -ne 0) {\n  # GitHub accepts only a small annotation set. Emit compiler\
        \ and\n  # Ninja diagnostics first; annotating every normal tail line can\n  # exhaust that set before the actual\
        \ error is reached.\n  Select-String -Path build-windows\\build.log `\n    -Pattern '(error C[0-9]+|fatal error|FAILED:|ninja:\
        \ build stopped)' `\n    | Select-Object -First 20 `\n    | ForEach-Object { \"::error title=Windows build::$($_.Line.Trim())\"\
        \ }\n  Get-Content build-windows\\build.log -Tail 60\n  exit 1\n}\n# The named gate mirrors the macOS job: a quietly\
        \ skipped\n# Boost-backed Host surface would fail this step explicitly.\ncmake --build build-windows --parallel 2\
        \ --target capsid-host 2>&1 | Tee-Object build-windows\\build.log\nif ($LASTEXITCODE -ne 0) {\n  Select-String -Path\
        \ build-windows\\build.log `\n    -Pattern '(error C[0-9]+|fatal error|FAILED:|ninja: build stopped)' `\n    | Select-Object\
        \ -First 20 `\n    | ForEach-Object { \"::error title=Windows build::$($_.Line.Trim())\" }\n  Get-Content build-windows\\\
        build.log -Tail 60\n  exit 1\n}\n"
    - name: Preserve complete native Windows build and registration identities
      shell: pwsh
      run: "ninja -C build-windows -t commands | Out-File -FilePath build-windows/full-build-commands.txt -Encoding utf8\n\
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nctest --test-dir build-windows --show-only=json-v1 -E '^wpt_conformance_not_configured$'\
        \ |\n  Out-File -FilePath build-windows/full-registration.json -Encoding utf8\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE\
        \ }\n"
    - name: Run the native Windows workerd compatibility gate
      shell: pwsh
      run: 'node tools/run-workerd-ws-gate.mjs build-windows build-windows/workerd-compatibility

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Run Windows host-side matrix
      env:
        CAPSID_WS_REPORT_DIR: ${{ runner.temp }}/capsid-full-driver-reports
      run: "$evidence_root = (Resolve-Path build-windows).Path\n$ctest_log = Join-Path $evidence_root 'ctest.log'\n$junit_path\
        \ = Join-Path $evidence_root 'windows-junit.xml'\nctest --test-dir build-windows `\n  --parallel 1 `\n  --no-tests=error\
        \ `\n  --output-on-failure `\n  --output-junit $junit_path `\n  -E '^wpt_conformance_not_configured$' `\n  2>&1 |\
        \ Tee-Object -FilePath $ctest_log\n$ctest_exit = $LASTEXITCODE\nif ($ctest_exit -ne 0) {\n  Select-String -Path $ctest_log\
        \ `\n    -Pattern '(\\*\\*\\*Failed|\\*\\*\\*Timeout|The following tests FAILED|^FAIL:)' `\n    -Context 0,15 | Select-Object\
        \ -First 40 | ForEach-Object { \"::error::$_\" }\n  Get-Content $ctest_log -Tail 120\n  exit $ctest_exit\n}\n"
      shell: pwsh
    - name: Retain actual native executables for independent replay
      if: always()
      shell: pwsh
      run: '@''

        from pathlib import Path

        import hashlib,json

        build=Path(''build-windows'')

        names=[''capsid-host.exe'',''capsid-worker.exe'',''test-spawn-failure-recovery.exe'']

        found={name:dict(bytes=(build/name).stat().st_size,sha256=hashlib.sha256((build/name).read_bytes()).hexdigest()) for
        name in names if (build/name).is_file()}

        (build/''native-executable-identities.json'').write_text(json.dumps(dict(expected=names,found=found),indent=2)+''\n'')

        ''@ | Set-Content -LiteralPath capture-native-executables.py -Encoding utf8

        python -B capture-native-executables.py

        '
    - name: Save Windows evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: windows-host-library-evidence
        if-no-files-found: error
        path: 'build-windows/windows-junit.xml

          build-windows/capsid-host.exe

          build-windows/capsid-worker.exe

          build-windows/test-spawn-failure-recovery.exe

          build-windows/native-executable-identities.json

          build-windows/full-registration.json

          build-windows/full-build-commands.txt

          build-windows/build.log

          build-windows/generated/build-info.txt

          ${{ runner.temp }}/capsid-full-driver-reports/

          build-windows/ctest.log

          build-windows/Testing/Temporary/LastTest.log

          build-windows/workerd-compatibility/

          '
  hosted-evidence-index:
    if: always()
    needs:
    - release-wpt-and-delegated-sandbox
    - sanitizers
    - fuzz
    - posix-host-library
    - windows-host-library
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Download all hosted evidence
      continue-on-error: true
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: '*-evidence'
        path: hosted-evidence/inputs
    - name: Generate run and content index
      env:
        RELEASE_RESULT: ${{ needs.release-wpt-and-delegated-sandbox.result }}
        SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        FUZZ_RESULT: ${{ needs.fuzz.result }}
        MACOS_RESULT: ${{ needs.posix-host-library.result }}
        WINDOWS_RESULT: ${{ needs.windows-host-library.result }}
      run: "set -euo pipefail\nmkdir -p hosted-evidence/inputs\n{\n  printf 'run_url=%s/%s/actions/runs/%s\\n' \\\n    \"\
        ${GITHUB_SERVER_URL}\" \"${GITHUB_REPOSITORY}\" \"${GITHUB_RUN_ID}\"\n  printf 'repository=%s\\n' \"${GITHUB_REPOSITORY}\"\
        \n  printf 'commit_sha=%s\\n' \"${GITHUB_SHA}\"\n  printf 'ref=%s\\n' \"${GITHUB_REF}\"\n  printf 'release=%s\\n'\
        \ \"${RELEASE_RESULT}\"\n  printf 'sanitizers=%s\\n' \"${SANITIZER_RESULT}\"\n  printf 'fuzz=%s\\n' \"${FUZZ_RESULT}\"\
        \n  printf 'macos=%s\\n' \"${MACOS_RESULT}\"\n  printf 'windows=%s\\n' \"${WINDOWS_RESULT}\"\n} > hosted-evidence/run.txt\n\
        # \xA712.5: the index also records the Release package identity \u2014\n# build ID, compatibility ID, package hash\
        \ and SBOM hash \u2014 from\n# the Release job's package-evidence.txt.\npackage_evidence=$(find hosted-evidence/inputs\
        \ \\\n  -name package-evidence.txt -print -quit)\nif test -n \"${package_evidence}\"; then\n  cat \"${package_evidence}\"\
        \ >> hosted-evidence/run.txt\nfi\n(\n  cd hosted-evidence\n  find inputs -type f -print0 |\n    sort -z |\n    xargs\
        \ -0 -r sha256sum > sha256sums.txt\n  sha256sum sha256sums.txt |\n    awk '{print $1}' > evidence-tree.sha256\n)\n"
    - name: Save hosted evidence index
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: hosted-evidence-index
        if-no-files-found: error
        path: 'hosted-evidence/run.txt

          hosted-evidence/sha256sums.txt

          hosted-evidence/evidence-tree.sha256

          '
    - name: Require every hosted job to pass
      env:
        RELEASE_RESULT: ${{ needs.release-wpt-and-delegated-sandbox.result }}
        SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        FUZZ_RESULT: ${{ needs.fuzz.result }}
        MACOS_RESULT: ${{ needs.posix-host-library.result }}
        WINDOWS_RESULT: ${{ needs.windows-host-library.result }}
      run: 'test "${RELEASE_RESULT}" = success

        test "${SANITIZER_RESULT}" = success

        test "${FUZZ_RESULT}" = success

        test "${MACOS_RESULT}" = success

        test "${WINDOWS_RESULT}" = success

        '
'on':
  workflow_dispatch: null

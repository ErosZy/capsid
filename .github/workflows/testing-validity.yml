name: Session reservation native and original fuzz followup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-anchor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 991adfc40c0bc1d3fe9a58ec2877d8b5d26b0192
          submodules: recursive
          # The txiki vendor audit derives the pinned tag via git describe;
          # submodule checkouts must carry the tag refs.
          fetch-tags: true

      - name: Install Clang and Ninja
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://mirrors.edge.kernel.org/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update --error-on=any
          sudo apt-get "${apt_network[@]}" install -y clang libclang-rt-dev ninja-build libboost-dev libssl-dev

      - name: Configure fuzz harnesses
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCAPSID_BUILD_WORKER=OFF \
            -DCAPSID_BUILD_FUZZERS=ON \
            -DCAPSID_USE_MIMALLOC=OFF

      - name: Build fuzz harnesses
        run: cmake --build build-fuzz --parallel 2

      - name: Preserve full commands and registration
        run: |
          ninja -C build-fuzz -t commands > build-fuzz/full-build-commands.txt
          ctest --test-dir build-fuzz --show-only=json-v1 > build-fuzz/full-registration.json

      - name: Run bounded corpus gates
        run: |
          ctest --test-dir build-fuzz \
            --no-tests=error \
            --output-on-failure \
            --output-junit fuzz-junit.xml \
            -L fuzz

      - name: Save fuzz evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-hosted-evidence
          if-no-files-found: error
          path: |
            build-fuzz/fuzz-junit.xml
            build-fuzz/Testing/Temporary/LastTest.log
            build-fuzz/CMakeCache.txt
            build-fuzz/full-build-commands.txt
            build-fuzz/full-registration.json

  session-anchor-native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 991adfc40c0bc1d3fe9a58ec2877d8b5d26b0192
      - name: Install ordinary native component dependencies
        run: brew install boost openssl@3
      - name: Compile actual session component and verify retained callbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess,time
          out=Path('build-session-anchor');out.mkdir()
          expected={'tests/test_host_websocket_session.cc': '8d6533b882f53c3dcb1108dc78ef8d87914f7ebfdbeffe6e33fe210ee92db0ba', 'src/host/channel_ledger.cc': '390c5d06b89acadb227d45e3722edefb0e6250447144d41da82ff56c3fb77aec', 'src/host/ws_codec.cc': 'f62711e93014d8fa2f1f7be8d9c44a3c6636076ae6d04d84b1bfea6cc5549aed', 'src/host/ws_stream.cc': '9071360839e1ba19bb0a4a608fcd826ccc7cc898e5b954ac19c6a32d482ed6e5', 'src/protocol.cc': '32cc27507293590db0de4e925fa1678f61fb80bc2911df947144c07b8f2e1bc4', 'src/host/websocket_session.cc': '7e77f61035f43aed8563b909b8e9a53ae83f2337c4b017bc6331d57602c89b6b'}
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert all(sha(Path(p))==h for p,h in expected.items())
          compiler=shutil.which('clang++');assert compiler
          boost=subprocess.check_output(['brew','--prefix','boost'],text=True).strip()
          openssl=subprocess.check_output(['brew','--prefix','openssl@3'],text=True).strip()
          env=dict(os.environ,ASAN_OPTIONS='halt_on_error=1',UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1')
          flags=[compiler,'-std=c++20','-O1','-g','-fsanitize=address,undefined','-fno-sanitize-recover=all',
           '-fno-omit-frame-pointer','-Wall','-Wextra','-Wpedantic','-Werror','-Isrc','-Iinclude',
           '-isystem',boost+'/include','-isystem',openssl+'/include']
          record=dict(complete=False,platform='darwin',sourceSHA256=expected,steps=[],originalUnitBudgetSeconds=15,
           fullRuntimeInstrumentationClaimed=False,fullMacosMatrixAccepted=False)
          def save(): (out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          def run(label,args,timeout):
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            result=subprocess.run(list(map(str,args)),env=env,stdout=so,stderr=se,timeout=timeout)
           record['steps'].append(dict(label=label,exitCode=result.returncode,seconds=time.monotonic()-start));save()
           return result.returncode
          save()
          current=Path('src/host/websocket_session.cc').read_text()
          guard='    if (role_ == ws::kClient) anchor_.reset();\n'
          assert current.count(guard)==1
          variants=dict(current=current,old=current.replace(guard,''),all_roles=current.replace(guard,'    anchor_.reset();\n'))
          variants['early']=current.replace('    input_=std::move(leftovers); upgraded_=true; touch_idle(); pump_input();',
           '    anchor_.reset();\n    input_=std::move(leftovers); upgraded_=true; touch_idle(); pump_input();')
          objects=[]
          for i,p in enumerate(['tests/test_host_websocket_session.cc', 'src/host/channel_ledger.cc', 'src/host/ws_codec.cc', 'src/host/ws_stream.cc', 'src/protocol.cc']):
           obj=out/(str(i)+'.o');objects.append(obj)
           assert run('compile-'+str(i),[*flags,'-c',p,'-o',obj],180)==0
          for mode,source in variants.items():
           path=out/(mode+'.cc');path.write_text(source);obj=out/(mode+'.o');binary=out/mode
           assert run('compile-'+mode,[*flags,'-c',path,'-o',obj],180)==0
           assert run('link-'+mode,[*flags,*objects,obj,'-L'+openssl+'/lib','-lcrypto','-pthread','-o',binary],180)==0
           code=run('run-'+mode,[binary],15)
           errors=dict(old='closed client capacity does not follow the retained I/O callback lifetime',
            all_roles='accepted stream anchor survives transport close until session destruction',
            early='a retained live client still owns its channel before teardown')
           if mode=='current': assert code==0
           else: assert code==1 and errors[mode] in (out/('run-'+mode+'.stderr.log')).read_text()
          assert all(sha(Path(p))==h for p,h in expected.items())
          record.update(complete=True,status='native-darwin-current-component-passed-three-ownership-faults-rejected',
           currentSourcePassed=True,ownershipFaultsRejected=3,instrumentedComponentTranslationUnits=6,
           originalCloseAndAckAssertionsRetained=True,appleCompiler=compiler,boostPrefix=boost,opensslPrefix=openssl)
          save()
          print(json.dumps(dict(complete=True,platform='darwin',ownershipFaultsRejected=3)))
          PY
      - name: Preserve component commands, observations and original failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-session-anchor-native
          if-no-files-found: error
          path: build-session-anchor/

        ctest --test-dir build-fuzz --show-only=json-v1 -L fuzz > build-fuzz/full-registration.json

        '
    - name: Retain original fuzz binaries and immutable starting corpus
      if: always()
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,tarfile\nbuild=Path('build-fuzz');registration=json.loads((build/'full-registration.json').read_text())\n\
        files=[Path('tests/fuzz/fuzz_websocket_frames.cc'),build/'fuzz/corpus']\nfiles += sorted({Path(test['command'][0])\
        \ for test in registration['tests'] if Path(test['command'][0]).is_file() and Path(test['command'][0]).resolve().is_relative_to(Path.cwd())})\n\
        target=build/'fuzz-replay-before.tar.gz'\nwith tarfile.open(target,'w:gz',dereference=False) as tar:\n    for path\
        \ in files:\n        if path.exists():tar.add(path,arcname=str(path.resolve().relative_to(Path.cwd())),recursive=True)\n\
        target.with_name(target.name+'.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\\\
        n')\nPY\n"

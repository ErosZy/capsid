name: Original archive gate runtime and CPU profile diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4cecdfc79797f13e31902c4fe6c16ed7d9649ab3
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.3'
      - name: Record original full archive shard and independent diagnostic profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,re,shutil,signal,subprocess,time
          root=Path.cwd();out=root/'build-gate-archive-profile';out.mkdir();profiles=out/'profiles';profiles.mkdir()
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          sources=['tests/test_workerd_reference_gate.mjs','tests/fixtures/workerd-gate-control-inventory.json','tools/run-workerd-ws-gate.mjs',
           'tools/workerd-http-codec-contract.mjs','tools/workerd-ordinary-fetch-contract.mjs']
          expected={p:sha(root/p) for p in sources}
          inventory=json.loads((root/'tests/fixtures/workerd-gate-control-inventory.json').read_text())
          assert len(inventory['cases'])==296
          node=shutil.which('node');assert node
          assert subprocess.check_output([node,'--version'],text=True).strip()=='v24.14.0'
          record=dict(complete=False,status='measuring-original-archive-shard-before-optimization',createdUTC=datetime.now(timezone.utc).isoformat(),
           platform=os.environ['RUNNER_OS'],checkoutCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           sourceSnapshot='fa40606cbd74270246df3736dd834836510431f4',diagnosticOnly=True,sourceSHA256=expected,
           originalControlInventory=296,selectedArchiveControls=117,originalAcceptanceBudgetSeconds=120,profileDiagnosticBudgetSeconds=300,
           profilingBudgetDoesNotQualifyOriginalAcceptance=True,fullV030GoalComplete=False,steps=[])
          assert record['checkoutCommit']=='4cecdfc79797f13e31902c4fe6c16ed7d9649ab3'
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          env=dict(os.environ,CAPSID_WS_GATE_CONTROL_SHARD='archives');save()
          def run(label,args,budget):
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            kwargs=dict(start_new_session=True) if os.name!='nt' else dict(creationflags=subprocess.CREATE_NEW_PROCESS_GROUP)
            child=subprocess.Popen(list(map(str,args)),cwd=root,env=env,stdout=so,stderr=se,**kwargs)
            try:code=child.wait(timeout=budget)
            except subprocess.TimeoutExpired:
             if os.name=='nt':subprocess.run(['taskkill','/PID',str(child.pid),'/T','/F'],capture_output=True,timeout=15)
             else:os.killpg(child.pid,signal.SIGKILL)
             child.wait(10);code=124
           record['steps'].append(dict(label=label,exitCode=code,seconds=time.monotonic()-start,budgetSeconds=budget));save()
           return code
          baseline=run('original-unprofiled-120-second-budget',[node,'--test','--test-reporter=tap','tests/test_workerd_reference_gate.mjs'],120)
          baseline_log=(out/'original-unprofiled-120-second-budget.stdout.log').read_text('utf-8')
          if baseline==0:
           assert re.search(r'^# tests 117$',baseline_log,re.M) and re.search(r'^# pass 117$',baseline_log,re.M)
           assert re.search(r'^# fail 0$',baseline_log,re.M) and re.search(r'^# skipped 0$',baseline_log,re.M)
          record.update(actualOriginalBudgetPassed=baseline==0,actualOriginalBaselineExitCode=baseline);save()
          profile=run('diagnostic-cpu-profile-not-original-acceptance',[node,'--cpu-prof','--cpu-prof-dir='+str(profiles),
           '--test','--test-reporter=tap','tests/test_workerd_reference_gate.mjs'],300)
          summaries=[]
          for file in profiles.glob('*.cpuprofile'):
           data=json.loads(file.read_text('utf-8'));nodes={n['id']:n for n in data['nodes']};totals={}
           for index,ident in enumerate(data.get('samples',[])):
            frame=nodes[ident]['callFrame'];key=(frame.get('url',''),frame.get('functionName',''),frame.get('lineNumber',-1))
            totals[key]=totals.get(key,0)+data['timeDeltas'][index]
           top=[dict(url=k[0],function=k[1],line=k[2]+1,selfMilliseconds=v/1000) for k,v in sorted(totals.items(),key=lambda item:-item[1])[:60]]
           summaries.append(dict(file=file.name,bytes=file.stat().st_size,sha256=sha(file),samples=len(data.get('samples',[])),top=top))
          (out/'cpu-summary.json').write_text(json.dumps(summaries,indent=2)+'\n')
          assert all(sha(root/p)==h for p,h in expected.items())
          record.update(complete=True,status='original-archive-runtime-and-independent-cpu-profile-recorded',
           actualOriginalBudgetPassed=baseline==0,actualOriginalBaselineExitCode=baseline,diagnosticProfileExitCode=profile,
           profileArtifacts=len(summaries),originalAcceptanceBudgetUnchanged=True,
           originalBaselineFailedNotConvertedToPassed=baseline!=0,profileOutputDoesNotEstablishAcceptance=True,
           profileFiles=[dict(file=s['file'],sha256=s['sha256'],samples=s['samples']) for s in summaries]);save()
          assert profile==0 and summaries,'diagnostic profile incomplete; preserve actual original results'
          print(json.dumps(record,indent=2))
          PY
      - name: Preserve original budgets, complete controls and profiles
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: archive-profile-${{ runner.os }}
          if-no-files-found: error
          path: build-gate-archive-profile/

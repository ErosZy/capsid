name: Verify child-owned standard reader reference listeners
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standard-reader-listener-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference-listener:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 55cec60950175d510d90b0892fed1a5a373d48a5
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install and verify original locked workerd
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"
          /usr/bin/openssl version > evidence/openssl-version.txt
      - name: Reject unrelated listeners and invalid child control events
        run: |
          set -euo pipefail
          node --test tests/test_native_retired_ownership_contract.mjs > evidence/listener-controls.tap 2>&1
      - name: Repeat all original reference shards in parallel with original deadlines
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          source=Path.cwd()
          for repeat in range(1,4):
              directory=source/'evidence'/('parallel-'+str(repeat));directory.mkdir()
              commands=[]
              for shard in ['shapes','ownership','transfers']:
                  args=['node',str(source/'tests/test_websocket_standard_readers.mjs'),'--reference-from-env','1','--shard',shard,'--openssl','/usr/bin/openssl','--report',str(directory/(shard+'.json'))]
                  commands.append('add_test('+json.dumps(shard)+' '+' '.join(map(json.dumps,args))+')')
                  commands.append('set_tests_properties('+json.dumps(shard)+' PROPERTIES TIMEOUT 120)')
              (directory/'CTestTestfile.cmake').write_text('\n'.join(commands)+'\n')
              subprocess.run(['ctest','--test-dir',str(directory),'--parallel','2','--output-on-failure','--output-junit',str(directory/'junit.xml')],check=True)
          PY
      - name: Capture fresh unmodified complete reference sample
        run: |
          set -euo pipefail
          mkdir -p evidence/original-sample
          cp tests/fixtures/workerd-standard-reader-report.json* evidence/original-sample/
          timeout 120s node tests/test_websocket_standard_readers.mjs --reference-from-env 1 --openssl /usr/bin/openssl --report "${PWD}/evidence/full-reference.json" > evidence/full-reference.stdout 2> evidence/full-reference.stderr
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib,json
          raw=Path('evidence/full-reference.json').read_bytes();r=json.loads(raw)
          assert r['complete'] and r['mode']=='reference' and len(r['cases'])==230
          packed=gzip.compress(raw,mtime=0)
          Path('tests/fixtures/workerd-standard-reader-report.json.gz').write_bytes(packed)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          metadata=dict(schema='capsid-standard-reader-capture-v1',platform='linux',source='full-reference.json',
              sourceReportSHA256=sha(raw),rawBytes=len(raw),gzipSHA256=sha(packed),sourceCommit=r['referenceLock']['source_commit'],
              referenceBinarySHA256=r['referenceLock']['binary_sha256'],scope='Actual pinned workerd230 standard allocation, shared-backing and transfer cases; child-owned listener; full original ordered cases; no synthetic product results')
          Path('tests/fixtures/workerd-standard-reader-report.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
          node --test tests/test_workerd_standard_reader_contract.mjs > evidence/standard-reader-controls.tap 2>&1
      - name: Save original reports, transcripts and exact sample bytes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: standard-reader-child-listener
          if-no-files-found: error
          path: |
            evidence/
            tests/fixtures/workerd-standard-reader-report.json
            tests/fixtures/workerd-standard-reader-report.json.gz

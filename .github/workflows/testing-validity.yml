name: Validate integrated density producer and independent evidence checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  density-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact byte-preserving candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fab182f17cbce7bdc85e66e6f31ddfb2897362a3
      - name: Set up locked reference installer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install pinned workerd reference
        run: |
          reference="${RUNNER_TEMP}/capsid-workerd/workerd"
          node tools/workerd-reference.mjs install "${reference}"
          printf 'CAPSID_WORKERD_REF=%s\n' "${reference}" >> "${GITHUB_ENV}"
      - name: Fetch exact already-qualified production package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: release-wpt-hosted-evidence
          run-id: 43383568252
          repository: ErosZy/capsid
          github-token: ${{ github.token }}
          path: diagnostic-release
      - name: Qualify original controls and actual cold hot coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import base64,hashlib,json,os,shutil,subprocess,sys,tarfile,tempfile,time,traceback
          root=Path.cwd();out=root/'density-connected-wave-observations';out.mkdir()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='fab182f17cbce7bdc85e66e6f31ddfb2897362a3'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='c6b13ee33695f9cc4970e198f11c921447a8ed80'
          assert sha(root/'bench/density_probe.py')=='0d3eb1574ba0423bcea83e7b63b0f8c401172daaada6d5644f10cd3dee0210d2'
          packages=list((root/'diagnostic-release').rglob('capsid-0.3.0-linux-gnu.tar.gz'));assert len(packages)==1
          package=packages[0];assert sha(package)=='fd36d0b80bb0a0d3b3b8ab33da84c95da3b4d4a80fa7f9bbaa25d062a84f3828'
          destination=out/'package';destination.mkdir()
          with tarfile.open(package,'r:gz') as tar:
              for member in tar.getmembers():
                  assert (destination/member.name).resolve().is_relative_to(destination.resolve())
              tar.extractall(destination,filter='data')
          installed=destination/'capsid-0.3.0-linux-gnu';binary=installed/'bin'
          identity=(installed/'share/capsid/build-info.txt').read_text()
          assert 'commit=fab182f17cbce7bdc85e66e6f31ddfb2897362a3\n' in identity and 'treeClean=true\n' in identity
          reference=Path(os.environ['CAPSID_WORKERD_REF'])
          assert sha(reference)=='50f31156a9a4c7d549f1b4753dd61eb527e1b6b0cd416e5ba3d02d64dfdee5dd'
          private=out/'proposal';private.mkdir()
          payload=base64.b64decode('')
          assert hashlib.sha256(payload).hexdigest()=='8bc0635af4dedd6da3dc6bd88e8e03dfada02812672c949d03dc0662fc412a51'
          with tarfile.open(fileobj=__import__('io').BytesIO(payload),mode='r:gz') as archive:
              for member in archive.getmembers():
                  assert member.isfile() and (private/member.name).resolve().is_relative_to(private.resolve())
              archive.extractall(private,filter='data')
          inputs={str(p):sha(p) for p in [binary/'capsid-host',binary/'capsid-worker',reference,*private.rglob('*.py'),private/'bench/density-lane.sh',private/'tests/fixtures/density65-incomplete-counter-observation.json']}
          record=dict(complete=False,status='integrated-controls-running',createdUTC=datetime.now(timezone.utc).isoformat(),sourceCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),sourceTree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),packageSHA256=sha(package),inputs=inputs,benchmarkRunnerIntegratedWorkingTreeProposal=True,productionRuntimeChanged=False,originalHttpParserRetained=True,original22DensityControlsRetained=True,formalPerformancePoints=0,formalProtocolAcceptanceNotClaimed=True,fullV030GoalComplete=False,controls=[],directCases=[])
          def save():(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          environment={**os.environ,'PYTHONDONTWRITEBYTECODE':'1','PYTHONPATH':str(private/'bench')}
          controls=[
              ('original-density-controls',[sys.executable,'-B',str(private/'tests/test_benchmark_density_control.py'),'--module',str(private/'bench/density_control.py'),'--node',shutil.which('node')]),
              ('conditioning-fault-controls',[sys.executable,'-B',str(private/'tests/test_benchmark_density_conditioning.py'),'--module',str(private/'bench/density_conditioning.py')]),
              ('density-producer-controls',[sys.executable,'-B',str(private/'tests/test_benchmark_density_lane.py'),'--lane',str(private/'bench/density-lane.py')]),
              ('independent-evidence-controls',[sys.executable,'-B',str(private/'tests/test_perf_evidence.py'),'--collector',str(private/'bench/collect-perf-point.py')]),
          ]
          for label,command in controls:
              result=subprocess.run(command,capture_output=True,env=environment,timeout=90)
              (out/(label+'.stdout.log')).write_bytes(result.stdout);(out/(label+'.stderr.log')).write_bytes(result.stderr)
              record['controls'].append(dict(label=label,exitCode=result.returncode));save()
              assert result.returncode==0,(label,result.stderr[-2500:])
          sys.path.insert(0,str(private/'bench'))
          from density_conditioning import ConditionedDensityProbe
          from density_evidence import validate_density_conditioning,unique_pairs
          from measurement_runtime import PortAllocator
          from perf_evidence import PROTOCOL
          cpuset=','.join(map(str,sorted(os.sched_getaffinity(0))[:4]));record['sutCpuSet']=cpuset
          apps=out/'apps';subprocess.run([sys.executable,'-B',str(private/'bench/gen-cold-start-apps.py'),str(apps)],check=True,capture_output=True,timeout=30)
          scratch=Path('/tmp/c78densityintegration1');scratch.mkdir(mode=0o700);tempfile.tempdir=str(scratch)
          class Reader:
              def __init__(self,folder):
                  self.root=folder.resolve();self.expected={}
                  for line in (folder/'sha256sums.txt').read_text().splitlines():
                      digest,name=line.split('  ',1)
                      assert name not in self.expected
                      self.expected[name]=digest
                  assert self.expected and all(sha(self.root/n)==h for n,h in self.expected.items())
              def sealed(self,name):
                  path=(self.root/name).resolve()
                  assert path.is_relative_to(self.root) and name in self.expected and sha(path)==self.expected[name]
                  return path
              def json(self,name):return json.loads(self.sealed(name).read_text(),object_pairs_hook=unique_pairs)
              def jsonl(self,name):return [json.loads(line,object_pairs_hook=unique_pairs) for line in self.sealed(name).read_text().splitlines()]
          command=[sys.executable,'-B',str(private/'bench/density-lane.py'),'--observation','--host',str(binary/'capsid-host'),'--worker',str(binary/'capsid-worker'),'--workerd',str(reference),'--apps',str(apps),'--out',str(out/'producer-observation'),'--cpuset',cpuset,'--max-workers','8','--max-cells','8']
          record.update(status='actual-complete-three-size-cli-observation-running',actualCliCommand=command);save()
          started=time.monotonic()
          result=subprocess.run(command,capture_output=True,env={**environment,'TMPDIR':str(scratch)},timeout=900)
          (out/'actual-producer.stdout.log').write_bytes(result.stdout);(out/'actual-producer.stderr.log').write_bytes(result.stderr)
          record['actualProducerExitCode']=result.returncode;record['actualProducerSeconds']=time.monotonic()-started;save()
          assert result.returncode==0,result.stderr[-2500:]
          observation=out/'producer-observation';reader=Reader(observation)
          observed=reader.json('observation.json');assert observed['profile']=='observation'
          assert not (observation/'lane.json').exists()
          finals=sorted(p.relative_to(observation).as_posix() for p in observation.rglob('final.jsonl'))
          assert len(finals)==12
          producer_cases=[]
          for name in finals:
              rows=reader.jsonl(name);assert len(rows)==1;row=rows[0]
              key=tuple(row[k] for k in ('stack','size','phase'))
              assert row['count']==8 and row['finalVerification'] is True and row['limit']=='cap'
              validate_density_conditioning(reader,key,row,row['correctness'],PROTOCOL['density'])
              producer_cases.append(dict(stack=key[0],size=key[1],phase=key[2],count=8,conditioningMethod=row['correctness']['conditioningMethod'],responses=row['correctness']['responses_checked'],pss=row['pss_readings_kb'],ownedPidsRemaining=row['cleanup']['ownedPidsRemaining']))
          assert len({tuple(c[k] for k in ('stack','size','phase')) for c in producer_cases})==12
          record.update(actualProducerCases=producer_cases,actualProducerIndependentEvidenceValidated=True);save()
          direct=out/'direct-observations';direct.mkdir();allocator=PortAllocator()
          from perf_run import seal_archive
          for index,count in enumerate((65,512,768),1):
              for phase in ('cold','warm'):
                  ordinal=len(record['directCases'])+1
                  record.update(status=f'actual-integrated-capsid-{phase}-{count}');save()
                  probe=ConditionedDensityProbe(host=binary/'capsid-host',worker=binary/'capsid-worker',workerd=reference,apps=apps,out=direct,cpuset=cpuset)
                  with allocator.allocate(1) as lease:
                      ports=list(lease.ports)
                      row=probe(stack='capsid',size='10k',phase=phase,count=count,ports=ports,release_ports=lease.release,probe_index=ordinal,final=False)
                  row['ports']=ports
                  seal_archive(direct);proof=Reader(direct)
                  validate_density_conditioning(proof,('capsid','10k',phase),row,row['correctness'],PROTOCOL['density'])
                  record['directCases'].append(dict(count=count,phase=phase,responses=row['correctness']['responses_checked'],pss=row['pss_readings_kb'],under2048MiB=row['pss_readings_kb'][0]<=2048*1024,ownedPidsRemaining=row['cleanup']['ownedPidsRemaining'],probeDirectory=row['probeDirectory']));save()
          assert all(sha(Path(p))==h for p,h in inputs.items())
          record.update(complete=True,status='integrated-controls-producer-and-boundary-evidence-qualified',allInputHashesUnchanged=True,actualObservationNotPublicationInput=True,formalPerformancePoints=0);save()
          print(json.dumps(dict(complete=True,actualProducerCells=12,directBoundaryCases=6,formalPerformancePoints=0)))
          PY
      - name: Retain every actual request counter process and PSS observation
        if: always()
        run: |
          tar -czf density-connected-wave-observations.tar.gz density-connected-wave-observations
          sha256sum density-connected-wave-observations.tar.gz > density-connected-wave-observations.tar.gz.sha256
      - name: Upload original private observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: density-connected-wave-observations
          path: |
            density-connected-wave-observations.tar.gz
            density-connected-wave-observations.tar.gz.sha256

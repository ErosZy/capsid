name: Native Darwin abort and known-length source completion probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-body-component:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 991adfc40c0bc1d3fe9a58ec2877d8b5d26b0192
          submodules: recursive
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install original native worker dependencies
        run: brew install ninja pkg-config openssl@3.5 boost
      - name: Install the pinned bootstrap tools
        run: |
          for directory in vendor/txiki.js examples/hono-reference examples/itty-router-reference examples/h3-v2-reference examples/elysia-reference; do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          git -C vendor/txiki.js fetch --depth=1 origin refs/tags/v26.6.0:refs/tags/v26.6.0
      - name: Restore independently qualified observation proposal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,os,tarfile
          raw=base64.b64decode('');assert hashlib.sha256(raw).hexdigest()=='eecce7334bb33da83ec3f6bb75317363271f78915ea9b8fa3f096095c0757121'
          folder=Path(os.environ['RUNNER_TEMP'])/'capsid-abort-source-fixture';folder.mkdir()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              members=archive.getmembers()
              assert all(m.isfile() and not Path(m.name).is_absolute() and '..' not in Path(m.name).parts for m in members)
              archive.extractall(folder,filter='data')
          PY
      - name: Configure and build the untouched current worker and helpers
        run: |
          cmake -S . -B build-native-body -G Ninja             -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON             -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3.5);$(brew --prefix boost)"             -DCAPSID_BUILD_HOST=ON -DCAPSID_BUILD_WORKER=ON -DCAPSID_USE_MIMALLOC=OFF             -DCAPSID_ENABLE_LTO=ON -DCAPSID_STRICT_WARNINGS=ON             -DCAPSID_HOST_TEST_NODE="$(node -p 'process.execPath')"             -DCAPSID_NODE_EXECUTABLE="$(node -p 'process.execPath')"             -DCAPSID_TEST_OPENSSL_EXECUTABLE="$(brew --prefix openssl@3.5)/bin/openssl"
          cmake --build build-native-body --parallel 2 --target capsid-worker test-native-fetch-response-limits test-direct-fetch-tls test-spawn-failure-recovery
      - name: Observe actual C ABI source completion and independent close proposal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shlex,shutil,signal,subprocess,time,traceback
          root=Path.cwd();build=root/'build-native-body';out=root/'native-body-observations';out.mkdir()
          source=Path(os.environ['RUNNER_TEMP'])/'capsid-abort-source-fixture'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          expected={'tests/test_native_fetch_abort_prefix.mjs': '0e663c2ce45c09bfdd064b2530987a1cb3cadddd2b4d647534c21c285c6878a0', 'tests/test_native_fetch_abort_prefix_contract.mjs': '11d775f9a086fd77e9716cb01a82b6fe16fda661a1860e2885673c6401974c5b', 'tests/test_native_fetch_response_limits.cc': '874fdca350ab023eb938e9dd050f11bc95a960e151a18274503e08a70b9552e1', 'tools/native-fetch-abort-prefix-contract.mjs': 'dd164d8d5551a50dfdd0a26f51daaa96242ab30dc3a44707c829d240a9e4e73d', 'tools/native-fetch-abort-prefix-input.mjs': '79756afa2dba3005c548c7f3f06973b7d3466b673476ba1e5634c9a3bf2dad08', 'tests/fixtures/native-fetch-abort-prefix.mjs': '7965a5e591a100d26785940d77179ba5c3c24fbbd110f6dc7a952794148176fc', 'tests/fixtures/workerd-native-fetch-abort-prefix-darwin-report.json': '368eba0779c7d665711f0806ce62005253cd30093be1ff0ff8eeda5d97a84f76', 'tests/fixtures/workerd-native-fetch-abort-prefix-report.json': '9dd036af257366d5dc325b6f98a4d2f190252bf07b6b2aa84d6082c433b3623b', 'tests/test_spawn_failure_recovery.cc': 'f5936d43f5687026cd4d1adc914db86a3836c8045712e8a963181f026c211284'}
          assert all(sha(source/p)==h for p,h in expected.items())
          node=shutil.which('node');assert node
          worker=build/'capsid-worker';helper=build/'test-native-fetch-response-limits'
          record=dict(complete=False,proposalOnly=True,fullCandidateAcceptanceClaimed=False,productHooksAdded=False,
           sourceCheckout=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           baselineWorkerSHA256=sha(worker),helperSHA256=sha(helper),proposalFixtureSHA256=expected,steps=[])
          def save():(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          def run(label,args,budget,allowed=(0,)):
           start=time.monotonic();reports=out/(label+'-reports');reports.mkdir()
           env=dict(os.environ,CAPSID_WS_REPORT_DIR=str(reports),CAPSID_WS_RUN_ID=label)
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen(list(map(str,args)),cwd=build,env=env,stdout=so,stderr=se,start_new_session=True)
            try:code=child.wait(budget)
            except subprocess.TimeoutExpired:
             os.killpg(child.pid,signal.SIGTERM);child.wait(5);code=124
           record['steps'].append(dict(label=label,exitCode=code,seconds=time.monotonic()-start,budgetSeconds=budget));save()
           assert code in allowed,(label,code)
           return code
          save()
          try:
           rows=json.loads((build/'compile_commands.json').read_text())
           commands=subprocess.check_output(['ninja','-C',str(build),'-t','commands','capsid-worker'],text=True)
           (out/'original-worker-full-build-commands.txt').write_text(commands)
           inventory=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1']))
           (out/'original-registration.json').write_text(json.dumps(inventory,indent=2)+'\n')
           original_tests={t['name']:t for t in inventory['tests']}
           run('proposal-contract',[node,'--test',source/'tests/test_native_fetch_abort_prefix_contract.mjs'],30)
           run('baseline-abort',[node,source/'tests/test_native_fetch_abort_prefix.mjs','--helper',helper,'--worker',worker],60)
           old=run('baseline-large',[node,root/'tests/test_native_fetch_large_gzip.mjs','--helper',helper,'--worker',worker],60,(0,1))
           old_report=json.loads((out/'baseline-large-reports/native-fetch-large-gzip.json').read_text())
           record['actualBaselineSourceEofMissingPlans']=[r['plan']['id'] for r in old_report['cases'] if r.get('sourceEndedBeforeFinish') is False]
           record['actualBaselineCompletedBodySourceEofFailureObserved']=old==1 and bool(record['actualBaselineSourceEofMissingPlans'])
           modelcheck="import assert from 'node:assert/strict';import fs from 'node:fs';import {expectedNativeFetchLargeGzipState} from "+json.dumps((root/'tools/native-fetch-large-gzip-input.mjs').as_uri())+";const report=JSON.parse(fs.readFileSync(process.argv[1]));for(const row of report.cases)assert.deepEqual(row.state,expectedNativeFetchLargeGzipState(row.plan));"
           run('baseline-all-state-models',[node,'--input-type=module','-e',modelcheck,out/'baseline-large-reports/native-fetch-large-gzip.json'],30)
           tls_names=['worker_direct_fetch_https_ca','worker_direct_fetch_https_tls12_rsa_pss']
           for name in tls_names:
            test=original_tests[name];props={p['name']:p['value'] for p in test['properties']}
            run('baseline-'+name,test['command'],props['TIMEOUT'])
           # Private component experiment: replace one actual library object. The clean
           # checkout and baseline build remain intact and this is never labeled a release.
           row,=[r for r in rows if r['file'].replace('\\','/').endswith('/lib/roles/http/client/client-http.c')]
           library_source=Path(row['file']);old_source=library_source.read_text()
           needle='\n\twsi->http.rx_content_length = 0;\n\n\t/*\n\t * For h1, wsi may pass some assets'
           assert old_source.count(needle)==1
           guard='\n\t/* A complete, known-length H1 response that rejects keepalive has\n\t * no later transaction to service. Retire its transport now instead\n\t * of waiting for another readability callback after the owner left.\n\t * Header-only completion and H2 keep their existing lifetime paths. */\n\tif (!wsi->client_h2_alpn && !wsi->client_mux_substream &&\n\t    wsi->http.conn_type == HTTP_CONNECTION_CLOSE &&\n\t    wsi->http.rx_content_length)\n\t\treturn -1;\n'
           candidate=old_source.replace(needle,guard+needle)
           proposed=out/'proposal';proposed.mkdir();patched=proposed/'client-http.c';patched.write_text(candidate)
           args=shlex.split(row['command']);args[args.index('-c')+1]=str(patched)
           obj=proposed/'client-http.c.o';args[args.index('-o')+1]=str(obj)
           for option,suffix in [('-MF','.d'),('-MT','')]:
            if option in args:args[args.index(option)+1]=str(obj)+suffix
           record['originalLibrarySourceSHA256']=sha(library_source);record['proposedLibrarySourceSHA256']=sha(patched);save()
           run('compile-proposed-library-unit',args,180)
           line,=[l for l in commands.splitlines() if ' -o capsid-worker ' in l]
           link=shlex.split(line.removeprefix(': && ').removesuffix(' && :'))
           lib_args=[a for a in link if a.endswith('libwebsockets.a')];assert len(lib_args)==1
           original_library=build/lib_args[0] if not Path(lib_args[0]).is_absolute() else Path(lib_args[0])
           members=subprocess.check_output(['ar','-t',str(original_library)],text=True).splitlines();assert members.count('client-http.c.o')==1
           archive=proposed/'libwebsockets.a';shutil.copy2(original_library,archive)
           run('replace-proposed-library-unit',['ar','-r',archive,obj],30)
           run('index-proposed-library',['ranlib',archive],30)
           candidate_worker=proposed/'capsid-worker';link[link.index('-o')+1]=str(candidate_worker)
           link[link.index(lib_args[0])]=str(archive)
           run('link-proposed-worker',link,180)
           record['proposedWorkerSHA256']=sha(candidate_worker);record['originalLibrarySHA256']=sha(original_library);record['proposedLibrarySHA256']=sha(archive);save()
           run('proposed-large',[node,root/'tests/test_native_fetch_large_gzip.mjs','--helper',helper,'--worker',candidate_worker],60)
           run('proposed-abort',[node,source/'tests/test_native_fetch_abort_prefix.mjs','--helper',helper,'--worker',candidate_worker],60)
           for name in tls_names:
            test=original_tests[name];props={p['name']:p['value'] for p in test['properties']}
            args=[str(candidate_worker) if a==str(worker) else a for a in test['command']]
            assert str(candidate_worker) in args
            run('proposed-'+name,args,props['TIMEOUT'])

           # Validate the exact proposed observer in the actual original C ABI fixture,
           # linked against the unchanged runtime and actual current worker. Constant
           # counters must fail the existing real-descriptor/live/zombie positive controls.
           spawn_row,=[r for r in rows if r['file'].endswith('/tests/test_spawn_failure_recovery.cc')]
           spawn_commands=subprocess.check_output(['ninja','-C',str(build),'-t','commands','test-spawn-failure-recovery'],text=True)
           (out/'original-spawn-full-build-commands.txt').write_text(spawn_commands)
           spawn_link_line,=[l for l in spawn_commands.splitlines() if ' -o test-spawn-failure-recovery ' in l]
           spawn_link=shlex.split(spawn_link_line.removeprefix(': && ').removesuffix(' && :'))
           spawn_compile=shlex.split(spawn_row['command']);original_spawn_obj=spawn_compile[spawn_compile.index('-o')+1]
           assert original_spawn_obj in spawn_link
           original_spawn_source=(source/'tests/test_spawn_failure_recovery.cc').read_text()
           spawn_test=original_tests['spawn_failure_recovery'];spawn_props={p['name']:p['value'] for p in spawn_test['properties']}
           for mode,function,replacement,verdict in [('actual',None,None,0),('constant-fd','fd_count','7',1),('constant-children','own_children','0',1)]:
            text=original_spawn_source
            if function:
             start=text.index('size_t '+function+'() {')
             marker=chr(10)+'// Live or zombie' if function=='fd_count' else chr(10)+'std::string shell_quote'
             end=text.index(marker,start)
             text=text[:start]+'size_t '+function+'() {return '+replacement+';}'+chr(10)+text[end:]
            folder=out/('spawn-'+mode);folder.mkdir();cpp=folder/'test_spawn_failure_recovery.cc';cpp.write_text(text)
            obj=folder/'test_spawn_failure_recovery.cc.o';binary=folder/'test-spawn-failure-recovery'
            args=list(spawn_compile);args[args.index('-c')+1]=str(cpp);args[args.index('-o')+1]=str(obj)
            for option,suffix in [('-MF','.d'),('-MT','')]:
             if option in args:args[args.index(option)+1]=str(obj)+suffix
            run('compile-spawn-'+mode,args,180)
            args=list(spawn_link);args[args.index(original_spawn_obj)]=str(obj);args[args.index('-o')+1]=str(binary)
            run('link-spawn-'+mode,args,180)
            run('actual-cabi-spawn-'+mode,[binary,worker],spawn_props['TIMEOUT'],(verdict,))
           record['actualCabiSpawnProposedObserverPassed']=True
           record['actualCabiSpawnConstantObserverFaultsRejected']=2
           record['actualCabiSpawnOriginalBudgetSeconds']=spawn_props['TIMEOUT'];save()
           for label in ['baseline-abort','proposed-abort']:
            r=json.loads((out/(label+'-reports/native-fetch-abort-prefix.json')).read_text());assert r['complete'] and len(r['cases'])==8
            assert all(c['sourceBeforeFinish']['peerClosed'] and c['sourceTerminalBeforeFinish'] for c in r['cases'])
           assert sha(worker)==record['baselineWorkerSHA256'] and sha(helper)==record['helperSHA256'] and sha(library_source)==record['originalLibrarySourceSHA256']
           assert all(sha(source/p)==h for p,h in expected.items())
           record.update(complete=True,status='native-darwin-abort-model-and-private-known-length-close-component-qualified',
            actualDarwinAbortProducerCases=16,actualProposedLargeGzipCases=2,actualTlsCases=4,
            originalCaseBudgetsAndInputModelsRetained=True,baselineAndRootSourceUnmodified=True,
            proposedProductFixIntegrated=False,fullV030GoalComplete=False)
           save()
          except BaseException:
           record.update(status='error',error=traceback.format_exc());save();raise
          PY
      - name: Preserve raw original failures and component evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: darwin-native-body-component
          if-no-files-found: error
          path: |
            native-body-observations/
            build-native-body/CMakeCache.txt
            build-native-body/compile_commands.json

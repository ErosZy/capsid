name: Qualify default instrumentation cold PSS with original per-test budgets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [gcc-asan, clang-asan-ubsan, release]
    env:
      COLD_REVIEW_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 27edca96069d88386950b4dd54c22db0bd0df52e
          submodules: recursive
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install original GCC native component prerequisites
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update --error-on=any
          sudo apt-get install -y ninja-build libssl-dev libc-ares-dev libboost-system-dev
          for directory in vendor/txiki.js examples/hono-reference examples/itty-router-reference examples/h3-v2-reference examples/elysia-reference; do
            npm ci --ignore-scripts --prefix "${directory}"
          done
          git -C vendor/txiki.js fetch --depth=1 origin refs/tags/v26.6.0:refs/tags/v26.6.0
      - name: Preserve real process ancestry and original cancellation assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import base64,hashlib,json,os,shutil,signal,subprocess,tarfile,time,xml.etree.ElementTree as ET,zlib
          overlays=json.loads(zlib.decompress(base64.b64decode('')))
          root=Path.cwd();build=root/'build-cold-settle';out=build/'evidence';out.mkdir(parents=True)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          profile=os.environ['COLD_REVIEW_PROFILE'];release=profile=='release';clang=profile=='clang-asan-ubsan'
          record=dict(complete=False,status='qualifying-instrumented-cold-settle',createdUTC=datetime.now(timezone.utc).isoformat(),
           baseSnapshot='63a3cc1a1ed222c6639be01c8fb41e48c29c6479',profile=profile,privateProposal=True,
           productionDefaultSettleUnchanged=True,asanFakeStackDefaultUnchanged=True,originalPssPredicateAndAttemptsUnchanged=True,
           originalHundredSecondBudgetUnchanged=True,allDescendantBudgetsThirtySeconds=True,steps=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          env=dict(os.environ,ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1',UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1',LSAN_OPTIONS='')
          def run(label,args,budget,expected=(0,)):
           start=time.monotonic()
           with (out/(label+'.stdout.log')).open('wb') as so,(out/(label+'.stderr.log')).open('wb') as se:
            child=subprocess.Popen(list(map(str,args)),cwd=root,env=env,stdout=so,stderr=se,start_new_session=True)
            try:code=child.wait(budget)
            except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL);child.wait(10);code=124
           record['steps'].append(dict(label=label,exitCode=code,budgetSeconds=budget,seconds=time.monotonic()-start));save()
           assert code in expected,(label,code)
           return code
          configure=['cmake','-S',root,'-B',build,'-G','Ninja','-DCMAKE_BUILD_TYPE='+('Release' if release else 'Debug'),
           '-DCMAKE_C_COMPILER='+('clang' if clang or release else 'gcc'),'-DCMAKE_CXX_COMPILER='+('clang++' if clang or release else 'g++'),
           '-DBUILD_TESTING=ON','-DCAPSID_BUILD_HOST=ON','-DCAPSID_BUILD_WORKER=ON','-DCAPSID_BUILD_BENCHMARKS=ON',
           '-DCAPSID_USE_MIMALLOC=OFF','-DCAPSID_SANDBOX_PROFILE='+('production' if release else 'sanitizer')]
          if not release:configure+=['-DCAPSID_ENABLE_ASAN=ON']
          if clang:configure+=['-DCAPSID_ENABLE_UBSAN=ON']
          save();run('configure-original',configure,300)
          run('build-original-components',['cmake','--build',build,'--parallel','2','--target','benchmark-cold-start','capsid-worker','--verbose'],1200)
          old=out/'old-cold-start';shutil.copy2(build/'cold-start',old);record['oldToolSHA256']=sha(old);save()
          for name,blob in overlays.items():(root/name).write_bytes(base64.b64decode(blob))
          record['proposalSHA256']={name:sha(root/name) for name in overlays};save()
          run('freeze-proposal',['git','add','--',*overlays],30)
          run('commit-proposal',['git','-c','user.name=Capsid validation','-c','user.email=validation@invalid','commit','-qm','Qualify cold instrumentation settle with fixed per-test budgets'],30)
          run('configure-proposal',configure,300)
          run('build-proposal-components',['cmake','--build',build,'--parallel','2','--target','benchmark-cold-start','capsid-worker','test-cold-worker-descendant','--verbose'],1200)
          inventory=json.loads(subprocess.check_output(['ctest','--test-dir',str(build),'--show-only=json-v1'],text=True))
          (out/'registration.json').write_text(json.dumps(inventory,indent=2)+'\n')
          selected=['benchmark_cold_tool','benchmark_cold_descendants','benchmark_cold_descendant_sample_fork','benchmark_cold_descendant_sample_clone']
          registration={r['name']:r for r in inventory['tests']}
          for name in selected:
           props={p['name']:p['value'] for p in registration[name]['properties']};assert props['TIMEOUT']==(100 if name=='benchmark_cold_tool' else 30)
           command=registration[name]['command']
           if clang:assert command[command.index('--settle-ms')+1]=='20000'
           else:assert '--settle-ms' not in command
          record['selectedActualRegistration']={name:registration[name] for name in selected};save()
          tests=['python3','-B',root/'tests/test_benchmark_cold_descendants.py','--worker',build/'capsid-worker','--tool',old,
           '--descendant-helper',build/'test-cold-worker-descendant']+(['--settle-ms','20000'] if clang else [])
          shards=[('cancel-error-timeout',['DescendantTests.test_cancel_reaps_both_kinds_of_real_descendant','DescendantTests.test_wrong_response_reaps_descendant_without_sample','DescendantTests.test_timeout_reaps_descendant_without_sample'],8),
           ('sample-fork',['--descendant-mode','fork','DescendantTests.test_normal_sample_includes_descendant_and_reaps_it_before_output'],1),
           ('sample-clone',['--descendant-mode','clone','DescendantTests.test_normal_sample_includes_descendant_and_reaps_it_before_output'],1)]
          for label,args,n in shards:
           run('old-negative-'+label,tests+args,30,(1,))
           text=(out/('old-negative-'+label+'.stderr.log')).read_text()
           assert 'C-ABI worker was not reaped by the tool' in text and 'FAILED (failures='+str(n)+')' in text and 'SyntaxError' not in text
          run('actual-original-and-descendant-ctest',['ctest','--test-dir',build,'-R','^('+'|'.join(selected)+')$','--parallel','1','--no-tests=error','--output-on-failure','--output-junit',out/'junit.xml'],200)
          shutil.copy2(build/'Testing/Temporary/LastTest.log',out/'LastTest.log')
          cases=list(ET.parse(out/'junit.xml').iter('testcase'));assert {c.attrib['name'] for c in cases}==set(selected)
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          text=(out/'LastTest.log').read_text();assert 'Ran 7 tests' in text
          rows=[json.loads(line) for line in text.splitlines() if line.startswith('{"mode":')]
          assert len(rows)==10 and all(r['beforeOuterCleanupAssertionPassed'] for r in rows)
          for name in ['compile_commands.json','CMakeCache.txt']:shutil.copy2(build/name,out/name)
          (out/'full-build-commands.txt').write_text(subprocess.check_output(['ninja','-C',str(build),'-t','commands','benchmark-cold-start','capsid-worker','test-cold-worker-descendant'],text=True))
          record.update(complete=True,status='all-four-cold-gates-qualified-with-original-budgets',oldActualDescendantFailures=10,
           actualOriginalSevenPassed=True,actualDescendantScenarios=rows,actualSelectedCtestPassed=4,actualSelectedCtestSkipped=0,
           workerSHA256=sha(build/'capsid-worker'),toolSHA256=sha(build/'cold-start'),wholeProviderInstrumentationNotClaimed=True,
           productionColdMeasurementDefaultAndTimingUnchanged=True,formalPerformancePoints=0)
          save();print(json.dumps(record,indent=2))
          PY
      - name: Preserve original binaries and observed process identities
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cold-settle-${{ matrix.profile }}
          if-no-files-found: error
          path: build-cold-settle/evidence/

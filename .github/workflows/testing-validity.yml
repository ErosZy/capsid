name: Observe same Clang worker idle PSS without changing qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-binary-idle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 27edca96069d88386950b4dd54c22db0bd0df52e
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: cold-clang-baseline-comparison
          run-id: 43225517455
          github-token: ${{ github.token }}
          path: build-idle-pss/input
      - name: Observe actual unchanged binary mappings and retain all results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,importlib.util,json,os,re,shutil,subprocess,sys,tarfile,time
          root=Path.cwd();build=root/'build-idle-pss';out=build/'evidence';out.mkdir(parents=True)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          raw=build/'input';prior=json.loads((raw/'run.json').read_text());assert prior['complete'] and prior['diagnosticOnly']
          binary=build/'actual-binaries';binary.mkdir()
          with tarfile.open(raw/'actual-executables.tar.gz','r:gz') as archive:
           for name in ['cold-start','capsid-worker']:
            file=binary/name;file.write_bytes(archive.extractfile(name).read());file.chmod(0o755)
          assert sha(binary/'capsid-worker')=='0d2d1ae5116235fc3632c7d820bd69012125f07737becfe85f0a2f8e9f56762b'
          assert sha(binary/'cold-start')==prior['currentToolSHA256']
          wrapper=build/'worker-wrapper.cc';wrapper.write_text('#include <unistd.h>\n#include <cstdlib>\n#include <fstream>\n#include <string>\nint main(int argc,char**argv){\n if(argc<2)return 90;\n std::ifstream config{std::string(argv[0])+".config"};\n std::string worker,options;\n if(!std::getline(config,worker)||!std::getline(config,options))return 91;\n if(setenv("ASAN_OPTIONS",options.c_str(),1)!=0)return 92;\n argv[0]=worker.data();execv(worker.c_str(),argv);return 93;\n}\n')
          subprocess.run(['g++','-std=c++20','-Wall','-Wextra','-Wpedantic','-Werror',str(wrapper),'-o',str(build/'worker-wrapper')],check=True,timeout=30)
          spec=importlib.util.spec_from_file_location('actual_idle_owner',root/'bench/measurement_runtime.py');owner=importlib.util.module_from_spec(spec);sys.modules[spec.name]=owner;spec.loader.exec_module(owner)
          record=dict(complete=False,status='observing-same-clang-worker-idle-mappings',createdUTC=datetime.now(timezone.utc).isoformat(),
           diagnosticOnly=True,qualificationNotClaimed=True,workerSHA256=sha(binary/'capsid-worker'),toolSHA256=sha(binary/'cold-start'),
           actualWorkerBinaryUnmodified=True,productionSourceNotModified=True,defaultPssAttemptsAndIntervalUnchanged=True,
           diagnosticDisabledUseAfterReturnNeverCountedAsAcceptance=True,steps=[],fullV030GoalComplete=False)
          save=lambda:(out/'run.json').write_text(json.dumps(record,indent=2)+'\n')
          def mappings(pid):
           rows=[];current=None
           for line in Path('/proc',str(pid),'smaps').read_text().splitlines():
            if re.match(r'^[0-9a-f]+-[0-9a-f]+ ',line):
             current=dict(header=line);rows.append(current)
            elif current is not None and line.split(':',1)[0] in ['Size','Rss','Pss','Anonymous','Private_Dirty','Private_Clean']:
             key,value=line.split(':',1);current[key]=int(value.split()[0])
           return rows
          save()
          for label,settle,stack in [('default-one-second',1000,None),('diagnostic-without-fake-stack',1000,'0'),('default-twenty-second',20000,None)]:
           folder=out/label;folder.mkdir();launch=folder/'worker-launch';shutil.copy2(build/'worker-wrapper',launch)
           options='detect_leaks=1:abort_on_error=1:strict_string_checks=1:verbosity=1:log_path='+str(folder/'asan')
           if stack is not None:options+=':detect_stack_use_after_return='+stack
           Path(str(launch)+'.config').write_text(str(binary/'capsid-worker')+'\n'+options+'\n')
           app=folder/'app.mjs';app.write_text('export default {fetch(){return new Response(\'{"status":"ok","total":2039,"count":16}\');}};')
           command=[str(binary/'cold-start'),'--worker',str(launch),'--mode','source','--input',str(app),'--source-name',app.as_uri(),'--strict','--warm','2','--settle-ms',str(settle)]
           start=time.monotonic();seen={};samples=0
           with (folder/'stdout.jsonl').open('wb') as so,(folder/'stderr.log').open('wb') as se,(folder/'maps.jsonl').open('w') as mo:
            with owner.OwnedProcess(command,stdout=so,stderr=se) as owned:
             while owned.alive() and time.monotonic()-start<55:
              tree=owned.discover()
              for identity in tree.values():
               if identity.pid==owned.root.pid or identity.state in ('Z','X'):continue
               try:
                if Path(os.readlink('/proc/'+str(identity.pid)+'/exe'))!=binary/'capsid-worker':continue
                data=mappings(identity.pid)
                mo.write(json.dumps(dict(seconds=time.monotonic()-start,pid=identity.pid,processStart=identity.start,mappings=data))+'\n');mo.flush();samples+=1
                seen[identity.pid]=identity.start
               except (FileNotFoundError,ProcessLookupError):pass
              time.sleep(.2)
             assert not owned.alive(),'bounded original tool did not exit'
             remaining=[p for p in owned.discover().values() if p.pid!=owned.root.pid]
             assert not remaining,'candidate tool cleanup must finish before outer owner'
             cleanup=owned.close();assert cleanup['ownedPidsRemaining']==0
             code=owned.process.returncode
           rows=[json.loads(line) for line in (folder/'stdout.jsonl').read_text().splitlines()]
           stderr=(folder/'stderr.log').read_text();pss=[json.loads(line.removeprefix('pss-attempt ')) for line in stderr.splitlines() if line.startswith('pss-attempt ')]
           assert samples>0 and seen
           if code==0:assert len(rows)==1 and rows[0]['ok'] and rows[0]['correctness']['responses_checked']==3
           else:assert not rows and 'pss-unstable:' in stderr
           record['steps'].append(dict(label=label,seconds=time.monotonic()-start,exitCode=code,settleMs=settle,
            defaultFakeStack=stack is None,diagnosticOnly=True,mapSamples=samples,workerIdentities=seen,
            pssReadings=[p['pss_kb'] for p in pss],actualSampleEmitted=len(rows)==1,cleanupBeforeOuterOwnerPassed=True))
           save();print(json.dumps(record['steps'][-1]),flush=True)
          record.update(complete=True,status='same-clang-worker-idle-mapping-comparison-collected');save()
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: unchanged-clang-worker-idle-pss-observations
          path: build-idle-pss/evidence/
          if-no-files-found: error

name: Release

# Tag pushes (v*) package the pinned checkout and attach the CPack TGZ +
# SHA256 to a GitHub Release. Two platform packages ship:
#   - linux-x86_64: fully static (musl) built in an Alpine container —
#     one portable binary, no libc version matrix to manage;
#   - darwin-arm64: native macOS build (Apple ships no static libSystem).
# testing-validity does not run on tags (scoped to main/PR), so the tag
# must point at a commit whose main-branch checks already passed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
            deps: brew install ninja boost
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out recursively pinned sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tag name resolves to refs/tags/<name>; no fetch-tags, so
          # checkout only fetches the triggering ref itself (fetch-tags on
          # a tag-push event made the first release run fail in checkout).
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Ninja invokes `cl` via PATH, unlike the MSBuild generator that
      # resolves the toolchain itself; without the VS developer
      # environment CMake cannot find the MSVC compiler.
      - name: Set up the MSVC developer environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@460a772e4cf7358f9f2f23773240813e40e7a894 # v1 (one README-only commit past the v1 tag)

      - name: Install platform build dependencies
        if: matrix.deps
        run: ${{ matrix.deps }}

      - name: Install pinned node modules
        shell: bash
        run: |
          set -euo pipefail
          # --ignore-scripts: pure JS, no native bindings, so the musl
          # container reuses these trees verbatim. All four trees are
          # required: the configure gate checks the example dependencies.
          for directory in \
            vendor/txiki.js \
            examples/hono-reference \
            examples/itty-router-reference \
            examples/h3-v2-reference
          do
            npm ci --ignore-scripts --prefix "${directory}"
          done

      - name: Build and package in Alpine (musl, fully static)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          if ! docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            alpine:3.24 sh -eux -c '
              echo "== apk add"
              apk add --no-cache build-base cmake ninja linux-headers \
                nodejs npm git perl boost-dev boost1.84-static
              # The mounted workspace is owned by the runner user; as root,
              # git refuses it and the overlay-key / identity gates then
              # cannot resolve vendor HEADs. Covers every nested submodule
              # gitdir in the ephemeral container.
              git config --global --add safe.directory "*"
              echo "== openssl fetch"
              cd /tmp
              echo "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8  openssl-3.5.7.tar.gz" > openssl.sha256
              wget -q https://www.openssl.org/source/openssl-3.5.7.tar.gz
              sha256sum -c openssl.sha256
              tar xzf openssl-3.5.7.tar.gz
              cd openssl-3.5.7
              echo "== openssl config"
              ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests
              echo "== openssl make"
              make -j2
              make install_sw
              echo "== reuse node_modules"
              cd /src
              test -d vendor/txiki.js/node_modules
              echo "== cmake configure"
              if ! cmake -S . -B build-musl -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCAPSID_BUILD_HOST=ON \
                  -DCMAKE_EXE_LINKER_FLAGS="-static" \
                  -DCMAKE_PREFIX_PATH=/opt/openssl35 \
                  > /tmp/configure.log 2>&1; then
                echo "== CONFIGURE FAILED"
                tail -8 /tmp/configure.log
                exit 1
              fi
              echo "== cmake build"
              cmake --build build-musl --parallel 2
              echo "== package"
              cmake --build build-musl --target package
            ' 2>&1 | tee /tmp/musl-build.log; then
            tail -8 /tmp/musl-build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          if ! pkg=$(ls build-musl/capsid-*.tar.gz 2>/dev/null); then
            echo "::error::no TGZ in build-musl; dir listing:"
            ls -la build-musl/ | tail -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Build OpenSSL 3.5.7 for macOS Release
        if: matrix.os == 'macos-15'
        run: |
          set -euo pipefail
          # Same pinned provider source as the sanitizer Host build in
          # testing-validity; built outside the workspace so the checkout
          # stays clean for the Release identity gate.
          cd "${RUNNER_TEMP}"
          echo "${OPENSSL_SHA256}  openssl-3.5.7.tar.gz" > openssl.sha256
          if ! {
            curl -sSL -o openssl-3.5.7.tar.gz https://www.openssl.org/source/openssl-3.5.7.tar.gz
            sha256sum -c openssl.sha256
            tar xzf openssl-3.5.7.tar.gz
            cd openssl-3.5.7
            ./config --prefix=/opt/openssl35 --openssldir=/opt/openssl35 no-shared no-tests
            make -j2
            sudo make install_sw
          } 2>&1 | tee /tmp/openssl.log; then
            tail -8 /tmp/openssl.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Configure and build macOS Release/LTO
        if: matrix.os == 'macos-15'
        run: |
          set -euo pipefail
          if ! cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCAPSID_BUILD_HOST=ON \
              -DCMAKE_PREFIX_PATH=/opt/openssl35 2>&1 | tee /tmp/configure.log; then
            tail -8 /tmp/configure.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          if ! cmake --build build --parallel 2 2>&1 | tee /tmp/build.log; then
            tail -8 /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          if ! cmake --build build --target package 2>&1 | tee /tmp/package.log; then
            tail -8 /tmp/package.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          ls -la build/capsid-*

      - name: Configure and build Windows Release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            openssl boost-system boost-asio boost-beast --triplet x64-windows-static
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DCAPSID_BUILD_HOST=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build/capsid-*

      - name: Publish package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # --verify-tag does NOT make create idempotent: once the release
          # exists it fails with HTTP 422 (tag_name already exists), which
          # is exactly what happens for every concurrent job that arrives
          # after the first one. Tolerate that specific race; upload is the
          # real gate and fails loudly on anything else.
          gh release create "${tag}" \
            --title "capsid ${tag}" \
            --notes "capsid ${tag} — static worker runtime, first-party host, trusted-bytecode compiler, C ABI headers and SBOM. Linux package is fully static (musl, runs on any Linux kernel without a libc version matrix); macOS package is native arm64; Windows package is native x86_64 (static CRT, ZIP). Package contents: bin/capsid-host, bin/capsid-worker, bin/capsid-bytecode-compile, lib/libcapsid_runtime.a, include/capsid/*, LICENSE, file manifest and SPDX SBOM." \
            --verify-tag || true
          shopt -s nullglob
          for dir in build build-musl; do
            for archive in "${dir}"/capsid-*.tar.gz "${dir}"/capsid-*.zip; do
              gh release upload --clobber "${tag}" \
                "${archive}" \
                "${archive}.sha256"
            done
          done

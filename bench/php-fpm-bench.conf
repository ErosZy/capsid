; bench: optimal php-fpm pool for slim+nginx (dual-process fairness).
; pm=static with max_children=2 mirrors the other stacks' two-process model
; (capsid static-pool --workers 2 / gunicorn --workers 2 / falcon --count 2).
[www]
user = www-data
group = www-data
listen = 9000
pm = static
pm.max_children = 2
pm.max_requests = 0
request_terminate_timeout = 65s
catch_workers_output = no

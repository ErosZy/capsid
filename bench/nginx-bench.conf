# bench: optimal nginx front for php-fpm+slim (dual-process fairness).
# worker_processes auto (4 cores), keepalive to upstream php-fpm,
# access log off, fastcgi_keep_conn for persistent upstream connections.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream php_bench {
        server php-fpm:9000;
        keepalive 0;
    }

    server {
        listen 80 default_server;
        server_name _;

        location / {
            fastcgi_pass php_bench;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_keep_conn off;
            fastcgi_read_timeout 65;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 16k;
        }
    }
}

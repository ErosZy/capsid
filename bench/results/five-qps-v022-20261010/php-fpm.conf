[global]
error_log = /tmp/opencode/qps-rr/php-run/fpm-error.log
pid = /tmp/opencode/qps-rr/php-run/fpm.pid
daemonize = no
[www]
listen = 127.0.0.1:9102
pm = static
pm.max_children = 1
user = eroszhao
group = eroszhao
access.log = /tmp/opencode/qps-rr/php-run/access.log
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.enable_cli] = 1
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.jit] = tracing
php_admin_value[opcache.jit_buffer_size] = 32M
php_admin_value[error_log] = /tmp/opencode/qps-rr/php-run/php-error.log

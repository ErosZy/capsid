worker_processes 1;
error_log /tmp/opencode/qps-rr/php-run/nginx-error.log;
pid /tmp/opencode/qps-rr/php-run/nginx.pid;
events { worker_connections 4096; }
http {
    access_log off;
    client_body_temp_path /tmp/opencode/qps-rr/php-run/body;
    proxy_temp_path /tmp/opencode/qps-rr/php-run/proxy;
    fastcgi_temp_path /tmp/opencode/qps-rr/php-run/fastcgi;
    uwsgi_temp_path /tmp/opencode/qps-rr/php-run/uwsgi;
    scgi_temp_path /tmp/opencode/qps-rr/php-run/scgi;
    server {
        listen 127.0.0.1:18996;
        root /tmp/opencode/qps-rr/php-app/public;
        location / {
            fastcgi_keep_conn on;
            fastcgi_pass 127.0.0.1:9102;
            fastcgi_param SCRIPT_FILENAME /tmp/opencode/qps-rr/php-app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            include /etc/nginx/fastcgi_params;
        }
    }
}
